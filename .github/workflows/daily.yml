            temporary.replace(STATE)
        
        
        def track(event, history, today):
            # Observations must be AFTER discovery, not merely after an old NAV date.
            observed = {}
            for point in history:
                try:
                    d = date.fromisoformat(point['date'])
                    p = float(point['price'])
                    if event['detected_on'] < d.isoformat() <= today.isoformat() and math.isfinite(p) and p > 0:
                        observed[d] = p
                except (KeyError, ValueError, TypeError):
                    continue
            prices = [p for _, p in sorted(observed.items())]
            for n in (5, 20):
                if len(prices) >= n:
                    event[f'after_{n}_publications_pct'] = round((prices[n-1] / event['price'] - 1) * 100, 2)
            if prices:
                event['worst_since_detection_pct'] = round((min(prices) / event['price'] - 1) * 100, 2)
            if len(prices) >= 20:
                event['tracking'] = 'completed'
            elif (today - date.fromisoformat(event['detected_on'])).days > 120:
                event['tracking'] = 'expired'
        
        
        def event_caption(event, compact=False, shared_period=False):
            fid = event['fund_id']
