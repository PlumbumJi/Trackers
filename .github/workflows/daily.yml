        def chart_caption(row):
            """Explain the plotted fund prices, then the existing model's conclusion."""
            marker, _, _ = _radar_verdict(row)
            entry = row.get("entry_analysis") or {}
            stats = (row.get("il_fund_data") or {}).get("price_stats") or {}
            window = chart_window(stats.get("chart_history") or [])
