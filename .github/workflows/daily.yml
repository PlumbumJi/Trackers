            name = profile['label'] if profile else shorten_title(event['name'], 32)
            source = (f'https://maya.tase.co.il/he/funds/mutual-funds/{fid}' if event.get('source') == 'MAYA'
                      else f'https://www.bizportal.co.il/mutualfunds/quote/generalview/{fid}')
            marker = '🟩▲' if event['monthly'] > 0 else '🟥▼'
            start = date.fromisoformat(event['start_date']).strftime('%d.%m')
            end = date.fromisoformat(event['date']).strftime('%d.%m')
            risk = ' · ' + event['risk'] if event.get('risk') else ''
            period = '' if shared_period else f' · {start}→{end}'
            sessions = '5с' if compact else '5 сессий'
            lines = [f'{marker} <a href="{source}">{escape(name)}</a> · {fid}',
                     f'{event["monthly"]:+.1f}%{period} · {sessions} {event["change_5"]:+.1f}%{escape(risk)}']
            if profile:
                lines.append('Факторы: ' + escape(profile['factors']) + '.')
            context = event.get('context')
            if context and not compact:
                lines.append(f'📰 <a href="{escape(context["url"], quote=True)}">{escape(shorten_title(context["title"], 45))}</a> · {context.get("date", "")}')
            conclusion = short_conclusion(event) if compact else event['conclusion']
            lines.append('Вывод: ' + escape(conclusion))
            return '\n'.join(lines)
        
        
        class DiscoveryUnavailable(RuntimeError):
            def __init__(self, code, detail):
                super().__init__(detail)
                self.code = code
        
        
        async def fetch_listing(session, previous_count):
            """Retry transient failures only; retain coverage and access checks."""
            required = max(MIN_LIST_ROWS, previous_count * 0.7)
            error = None
            for attempt in range(1, 4):
                try:
                    timeout = aiohttp.ClientTimeout(total=45, sock_connect=10, sock_read=30)
                    async with session.get(LIST_URL, timeout=timeout) as response:
                        status = response.status
                        if status in {401, 403, 429}:
                            code = 'list_rate_limit' if status == 429 else 'list_access'
                            raise DiscoveryUnavailable(code, f'Funder list HTTP {status}')
                        if status != 200:
                            raise DiscoveryUnavailable('list_http', f'Funder list HTTP {status}')
                        body = await response.text(errors='ignore')
                    if is_access_challenge(body):
                        raise DiscoveryUnavailable('list_access', 'Funder access challenge')
                    listing = parse_listing(body)
                    print(f'Fund list: HTTP 200; attempt={attempt}/3; bytes={len(body)}; '
                          f'rows={len(listing)}; required={required:g}')
                    if len(listing) < required:
                        raise DiscoveryUnavailable('list_incomplete',
                            f'Funder list incomplete: rows={len(listing)}, required={required:g}, previous={previous_count}')
                    return listing
                except asyncio.TimeoutError:
                    error = DiscoveryUnavailable('list_timeout', 'Funder list request timed out')
                except aiohttp.ClientError as exc:
                    error = DiscoveryUnavailable('list_network', f'Funder list {type(exc).__name__}: {exc}')
                except DiscoveryUnavailable as exc:
                    error = exc
                    if exc.code in {'list_access', 'list_rate_limit'}:
                        raise
                    # A missing page or other client error needs a configuration fix, not retries.
                    if exc.code == 'list_http' and 400 <= status < 500:
                        raise
                print(f'::warning::Discovery {error.code}; attempt={attempt}/3; {error}')
                if attempt < 3:
                    await asyncio.sleep(attempt * 2)
            raise error
        
        
        async def screen_monthly(session, listing, today, blocked=None):
            limiter, denied = asyncio.Semaphore(3), asyncio.Event()
            async def fetch(rows):
                for attempt in range(2):
                    if denied.is_set():
                        return {}
                    try:
                        async with limiter:
                            if denied.is_set():
                                return {}
                            params = {'ids': ','.join(r['fund_id'] for r in rows),
                                      'period': '3m', 'callback': 'fundMonth'}
                            async with session.get(GRAPH_URL, params=params,
                                    timeout=aiohttp.ClientTimeout(total=35)) as response:
                                status = response.status
                                body = await response.text()
                        if status in {401, 403, 429} or is_access_challenge(body):
                            denied.set()
                            if blocked is not None:
                                blocked.add('Funder')
                            print(f'::warning::Monthly graph access restricted: HTTP {status}')
                            return {}
                        if status == 200:
                            parsed = parse_graph_batch(body, rows, today)
                            print(f'Monthly graphs: {len(parsed)}/{len(rows)} complete periods')
                            return parsed
                        if status < 500:
                            return {}
                    except (aiohttp.ClientError, asyncio.TimeoutError) as error:
                        print(f'::warning::Monthly graph batch: {type(error).__name__}')
                    if attempt == 0:
                        await asyncio.sleep(2)
                return {}
            batches = await asyncio.gather(*(fetch(listing[i:i + GRAPH_BATCH])
                                            for i in range(0, len(listing), GRAPH_BATCH)))
            return {fid: row for batch in batches for fid, row in batch.items()}
        
        
        async def prepare_movers():
            state = copy.deepcopy(load_state())
            now = datetime.now(TZ)
            timeout = aiohttp.ClientTimeout(total=25)
            async with aiohttp.ClientSession(timeout=timeout, headers=HEADERS, trust_env=True) as session:
                previous_count = state.get('last_scan', {}).get('readable_funds', 0)
                sources = PublicFundSources(session, state, now.date())
                fallback, funder_blocked = False, set()
                try:
                    # Counts from different catalogs are not interchangeable coverage checks.
                    if state.get('last_scan', {}).get('catalog_source', 'Funder') != 'Funder':
                        previous_count = 0
                    listing = await fetch_listing(session, previous_count)
                except DiscoveryUnavailable as error:
                    fallback = True
                    if error.code in {'list_access', 'list_rate_limit'}:
                        funder_blocked.add('Funder')
                    print(f'::warning::Funder unavailable ({error.code}); switching public sources')
                    listing = await sources.listing()
                if not listing:
                    # Keep due observations alive even if all universe lists fail.
                    listing = [{'fund_id': fid, 'name': row['name'], 'daily': None, 'source': 'cache'}
                               for fid, row in state.get('news_watch', {}).items() if row.get('name')]
                    sources.catalog = {r['fund_id']: r for r in listing}
                review_jobs = watch_jobs(state, now)
                if fallback:
                    screened = await sources.screen(listing, month_window, verified_publication)
                else:
                    screened = await screen_monthly(session, listing, now.date(), funder_blocked)
                    if len(screened) < len(listing) * .7:
                        fallback = True
                        alternative = await sources.listing()
                        if alternative:
                            listing = alternative
                            screened.update(await sources.screen(listing, month_window, verified_publication))
                            # Do not mix an old Funder daily snapshot with newer fallback quotes.
                            screened = {fid: row for fid, row in screened.items() if fid in sources.catalog}
                mentions = await fetch_mentions(session, listing, now, skip_funder='Funder' in funder_blocked)
                candidates = sorted((r for r in screened.values()
                                     if r['screen_low'] <= -THRESHOLD or r['screen_high'] >= THRESHOLD),
                                    key=lambda r: abs(r['monthly']), reverse=True)
                # Re-arm only after a verified fresh chart clearly leaves the threshold zone.
                resets = state.setdefault('monthly_resets', {})
                for fid, row in screened.items():
                    if -9 < row['screen_low'] <= row['screen_high'] < 9:
                        resets[fid] = row['date']
                active = sorted((e for e in state['events'].values() if e.get('tracking') == 'open'),
                                key=lambda e: e.get('checked_at', ''))
                # Check the closest non-candidates against independent dated prices as well.
                candidate_ids = {r['fund_id'] for r in candidates}
                probes = sorted((r for r in screened.values() if r['fund_id'] not in candidate_ids),
                                key=lambda r: abs(r['monthly']), reverse=True)[:3]
                ids = list(dict.fromkeys([r['fund_id'] for r in candidates[:MAX_CHECKS]] +
                                        [r['fund_id'] for r in active[:MAX_TRACKED]] +
                                        [r['fund_id'] for r in probes] +
                                        [r['fund_id'] for r in mentions['items'][:3]] +
                                        [r['fund_id'] for r in review_jobs]))
                limiter, denied = asyncio.Semaphore(3), asyncio.Event()
                async def fetch(fid):
                    async with limiter:
                        # Limit whole-fund jobs, not just individual requests.
                        try:
                            if fallback:
                                return await sources.series(fid)
                            return await fetch_portfolio_fund(session, fid, asyncio.Semaphore(1), denied,
                                                              history_pages=5)
                        except Exception as error:
                            print(f'::warning::Fund {fid} unavailable: {type(error).__name__}')
                            return [], {}
                results = await asyncio.gather(*(fetch(fid) for fid in ids))
                data = dict(zip(ids, results))
                state['news_focus'] = await prepare_focus(session, mentions, data, screened, now,
                                                          validated_event, verified_publication)
                state['news_reviews'] = build_reviews(state, review_jobs, data, now, verified_publication)
                for event in active:
                    if event['fund_id'] in data:
                        track(event, data[event['fund_id']][0], now.date())
                        event['checked_at'] = now.isoformat()
                healthy_probes = 0
                for row in probes:
                    history, quote = data[row['fund_id']]
                    healthy_probes += int(bool(validated_event(row, history, quote, now.date())))
                selected, verified, validated = [], 0, 0
                for row in candidates[:MAX_CHECKS]:
                    history, quote = data[row['fund_id']]
                    event = validated_event(row, history, quote, now.date())
                    if not event:
                        print(f'::warning::Monthly candidate {row["fund_id"]}: prices/dates not verified')
                        continue
                    verified += 1
                    if round(abs(event['monthly']), 6) < THRESHOLD:
                        continue
                    validated += 1
                    key = f'month30:{event["fund_id"]}:{event["date"]}'
                    if not fresh_event(event, state) or len(selected) >= 3:
                        continue
                    event['context'] = await fund_context(session, event, now)
                    selected.append((key, event, None))
                state['last_scan'] = {
                    'at': now.isoformat(), 'readable_funds': len(listing),
                    'monthly_coverage': len(screened), 'period_days': WINDOW_DAYS,
                    'candidates': len(candidates), 'checked': min(len(candidates), MAX_CHECKS),
                    'validated': validated, 'verified': verified,
                    'freshness_checks': healthy_probes,
                    'status': 'partial' if (len(screened) < len(listing)
                                            or len(candidates) > MAX_CHECKS or verified < len(candidates)
                                            or healthy_probes < len(probes)
                                            or (fallback and not sources.source_names)) else 'ok',
                    'catalog_source': ' + '.join(sources.source_names) if fallback else 'Funder',
                    'scope': 'Readable open mutual funds; full-market coverage not asserted',
                }
                print('Fund discovery: ' + json.dumps(state['last_scan'], ensure_ascii=False))
                if state['last_scan']['status'] == 'partial':
                    print('::warning::Some fund moves could not be verified; see scan counters')
                return state, selected
        
        
        async def prepare_safely():
            try:
                async with asyncio.timeout(480):
                    return await prepare_movers()
            except DiscoveryUnavailable as error:
                code, detail = error.code, str(error)
            except asyncio.TimeoutError:
                code, detail = 'scan_timeout', 'Monthly fund verification exceeded 480 seconds'
            except Exception as error:
                code, detail = 'scan_error', f'{type(error).__name__}: {error}'
                traceback.print_exc(limit=5)
            print(f'::warning::Fund discovery unavailable [{code}]: {detail}')
            # An unsuccessful scan has no events and must never replace the saved journal.
            return ({'last_scan': {'status': 'unavailable', 'error_code': code,
                                  'at': datetime.now(TZ).isoformat()}}, [])
        
        
        def unavailable_summary(scan):
            return {
                'list_timeout': 'Funder не ответил вовремя после 3 попыток.',
                'list_network': 'Не удалось соединиться с Funder после 3 попыток.',
                'list_access': 'Funder ограничил доступ к списку фондов.',
                'list_rate_limit': 'Funder временно ограничил частоту запросов.',
                'list_http': 'Funder не смог отдать список фондов.',
                'list_incomplete': 'Funder вернул неполный список фондов; обзор не рассчитан.',
                'monthly_history': 'История за месяц не получена; расчёт недоступен.',
                'scan_timeout': 'Проверка котировок не завершилась за отведённое время.',
                'scan_error': 'Ошибка обработки данных. Причина записана в журнале GitHub Actions.',
            }.get(scan.get('error_code'), 'Результат проверки данных не получен.')
        
        
        def monthly_caption(prepared, default_caption, compact=False):
            """Always report scan outcome; mark only event cards actually delivered."""
            prefix = default_caption.removesuffix(BOT_NAME).strip()
            heading = '⚡ <b>ДВИЖЕНИЯ ЗА МЕСЯЦ</b>'
        
            def assemble(supplement):
                return '\n\n'.join(part for part in (prefix, supplement, BOT_NAME) if part)
        
            if prepared is None:
                supplement = heading + '\nОбзор недоступен: данные не удалось проверить.'
                return assemble(supplement), supplement, []
            state, selected = prepared
            scan = state.get('last_scan') or {}
            if not selected:
                if scan.get('status') == 'partial':
                    summary = (f'Проверка неполная: история {scan.get("monthly_coverage", 0)}/'
                               f'{scan.get("readable_funds", 0)}. Новых проверенных событий нет.')
                elif scan.get('status') != 'ok':
                    summary = 'Обзор недоступен: ' + unavailable_summary(scan)
                elif scan.get('validated', 0):
                    summary = 'Новых событий нет: найденные движения уже показаны.'
                else:
                    summary = f'Среди {scan["readable_funds"]} фондов движений от ±10% за 30д не найдено.'
                supplement = heading + '\n' + summary
                return assemble(supplement), supplement, []
            periods = {(event['start_date'], event['date']) for _, event, _ in selected}
            shared_period = len(periods) == 1
            period = '30д'
            if shared_period:
                start, end = next(iter(periods))
                period = f'{date.fromisoformat(start):%d.%m}→{date.fromisoformat(end):%d.%m}'
            header = heading + f'\n{period} · история {scan.get("monthly_coverage", 0)}/{scan["readable_funds"]}'
            if scan['status'] == 'partial':
                header += ' · частично'
            if scan.get('catalog_source') and scan['catalog_source'] != 'Funder':
                header += '\n' + escape(scan['catalog_source'].replace('MAYA','МАЙЯ'))
            if not compact:
                full = header + '\n\n' + '\n\n'.join(event_caption(e, shared_period=shared_period)
                                                        for _, e, _ in selected)
                compact = message_length('💼 МОЙ ПОРТФЕЛЬ\n\n' + assemble(full)) > 1024
            cards, included = [], []
            for item in selected:
                event = item[1]
                card = event_caption(event, compact=compact, shared_period=shared_period)
                candidate = cards + [card]
                remaining = len(selected) - len(candidate)
                tail = f'\nЕщё проверенных событий: {remaining}.' if remaining else ''
                supplement = header + '\n\n' + '\n\n'.join(candidate) + tail
                if message_length('💼 МОЙ ПОРТФЕЛЬ\n\n' + assemble(supplement)) > 1024:
                    break
                cards, included = candidate, included + [item]
            if not cards:
                supplement = heading + f'\nПодтверждённых событий: {len(selected)}; карточки не поместились в подпись.'
                return assemble(supplement), supplement, []
            remaining = len(selected) - len(included)
            tail = f'\nЕщё проверенных событий: {remaining}.' if remaining else ''
            supplement = header + '\n\n' + '\n\n'.join(cards) + tail
            return assemble(supplement), supplement, included
        
        
        def combined_caption(prepared, default_caption):
            focus = (prepared[0].get('news_focus') or {}) if prepared else {}
            reviews = prepared[0].get('news_reviews',[]) if prepared else []
            if not focus and not reviews:
                return monthly_caption(prepared, default_caption)
            prefix = default_caption.removesuffix(BOT_NAME).strip()
            heading = '📰 <b>ФОНДЫ В НОВОСТЯХ · 24ч</b>'
            monthly_ids = {event['fund_id'] for _,event,_ in prepared[1]}
            shown = [dict(item,show_monthly=item['fund_id'] in monthly_ids) for item in focus.get('items', [])[:3]]
            shown_reviews = list(reviews[:3])
        
            def focus_text():
                if shown:
                    return heading + '\n\n' + '\n\n'.join(focus_card(item) for item in shown)
                if focus.get('items'):
                    return heading + f'\nСвежих упоминаний: {len(focus["items"])}; приоритет — итоги наблюдения.'
                line = ('Прямых упоминаний в свежих публикациях не найдено.' if focus.get('status') == 'ok'
                        else 'Ленты проверены частично; прямых упоминаний не найдено.' if focus.get('status') == 'partial'
                        else 'Новостная лента временно недоступна.')
                return heading + '\n' + line
        
            def reviews_text():
                return ('📒 <b>ИТОГИ НАБЛЮДЕНИЯ</b>\n' + '\n'.join(review_card(item) for item in shown_reviews)
                        if shown_reviews else '')
        
            def blocks():
                return '\n\n'.join(s for s in (reviews_text(),focus_text()) if s)
        
            # Reserve room for the monthly summary and Telegram's UTF-16 caption limit.
            budget = 1024 - message_length('💼 МОЙ ПОРТФЕЛЬ\n\n' + BOT_NAME) - 180
            if message_length(prefix + blocks()) > budget:
                prefix = '\n'.join(line for line in prefix.splitlines() if not line.startswith('Курсы:'))
            while message_length(prefix + blocks()) > budget and (shown or shown_reviews):
                if shown:
                    shown.pop()
                else:
                    shown_reviews.pop()
            news_block = blocks()
            focus_ids = {item['fund_id'] for item in shown if item.get('analysis')}
            state, selected = prepared
            state['_delivered_focus'] = shown
            state['_delivered_reviews'] = shown_reviews
            merged = [item for item in selected if item[1]['fund_id'] in focus_ids]
            remaining = [item for item in selected if item[1]['fund_id'] not in focus_ids]
            composed = prefix + '\n\n' + news_block + '\n\n' + BOT_NAME
            caption, monthly, included = monthly_caption((state, remaining), composed, compact=True)
            if not remaining and merged:
                # Monthly metrics and conclusion already appear in the news cards.
                caption = composed
                monthly = ''
            return caption, '\n\n'.join(s for s in (news_block, monthly) if s), included + merged
        
        
        def commit_movers(prepared, included):
            if prepared is None or os.getenv('DRY_RUN', '').lower() == 'true':
                return
            state, _ = prepared
            if (state.get('last_scan') or {}).get('status') == 'unavailable':
                return
            for key, event, _ in included:
                state['events'][key] = {k: v for k, v in event.items() if k != 'history'}
                state['events'][key].update(sent_at=datetime.now(TZ).isoformat(),
                                           detected_on=datetime.now(TZ).date().isoformat(), tracking='open')
            closed = sorted((k for k, e in state['events'].items() if e.get('tracking') != 'open'),
                            key=lambda k: state['events'][k]['detected_on'])
            for key in closed[:-200]:
                del state['events'][key]
            register_delivered(state, datetime.now(TZ))
            saved = dict(state)
            for key in ('news_focus','news_reviews','_delivered_focus','_delivered_reviews'):
                saved.pop(key,None)
            save_state(saved)
        
        
        async def run_morning_reports():
            from modules.portfolio import run_portfolio
            from modules.mover_charts import build_mover_charts
            task = asyncio.create_task(prepare_safely())
            prepared, included = None, []
            extra_images = []
        
            async def caption_builder(default):
                nonlocal prepared, included
                prepared = await task
                caption, supplement, included = combined_caption(prepared, default)
                try:
                    async with asyncio.timeout(70):
                        chart = await build_mover_charts(included, datetime.now(TZ).date())
                    if chart:
                        extra_images.append((chart, ''))
                except Exception as error:
                    print(f'::warning::Monthly chart unavailable: {type(error).__name__}; keeping report')
                return caption, supplement
        
            def delivered():
                try:
                    commit_movers(prepared, included)
                except Exception as error:
                    print(f'::warning::Discovery journal save failed: {type(error).__name__}')
        
            try:
                await run_portfolio(caption_builder=caption_builder, on_delivered=delivered,
                                    extra_images=extra_images)
            finally:
                if not task.done():
                    task.cancel()
                await asyncio.gather(task, return_exceptions=True)
