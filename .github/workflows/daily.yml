                if {fid: r.get('quantity') for fid, r in rows.items()} != quantities:
                    break  # A changed position starts a new comparable tracking segment.
                comparable.append((day, total(rows)))
            peak = max([value] + [v for _, v in comparable])
            drawdown = (value / peak - 1) * 100
            fid = max(current, key=lambda f: total({f: current[f]}))
            weight = total({fid: current[fid]}) / value * 100
            line = f'🛡 {fid}: {weight:.1f}% портфеля'
