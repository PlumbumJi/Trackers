name: Automated Market Analytics
'on':
  schedule:
  - cron: 15 9 * * 1-5
    timezone: America/New_York
  - cron: 15 23 * * *
    timezone: Asia/Jerusalem
  workflow_dispatch:
    inputs:
      report_type:
        description: Report to send
        required: true
        default: market
        type: choice
        options:
        - market
        - premarket
permissions:
  contents: read
concurrency:
  group: market-analytics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Select Report Type
      id: report
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_SCHEDULE: ${{ github.event.schedule }}
        MANUAL_REPORT_TYPE: ${{ inputs.report_type }}
      run: |-
        if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
          mode="${MANUAL_REPORT_TYPE:-market}"
        elif [[ "$EVENT_SCHEDULE" == "15 9 * * 1-5" ]]; then
          mode="premarket"
        else
          mode="market"
        fi
        echo "mode=$mode" >> "$GITHUB_OUTPUT"
        echo "Selected report: $mode"
    - name: Restore Latest Market Snapshot
      if: steps.report.outputs.mode == 'premarket'
      uses: actions/cache/restore@v5
      with:
        path: latest_market_snapshot.json
        key: market-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: market-snapshot-
    - name: Deploy Architecture Files
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p modules tests
        touch modules/__init__.py
        cat << 'EOF' > requirements.txt
        aiohttp==3.11.11
        playwright==1.49.1
        EOF

        cat << 'EOF' > modules/config.py
