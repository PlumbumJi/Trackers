              values = [fund_data.get("daily"), fund_data.get("mtd"), fund_data.get("ytd"), us_change]
              available = [float(value) for value in values if value is not None]
              if len(available) < 3:
                  return "⚪", "No data"
              positive = sum(value > 0 for value in available)
              negative = sum(value < 0 for value in available)
              if positive >= 3 and negative <= 1:
                  return "🟢", "Positive"
              if negative >= 3:
                  return "🔴", "Caution"
              return "🟡", "Neutral"


