                    analysis = analyze_year_history(await task, ticker)
                    if analysis:
                        results[sector] = analysis
                    else:
                        print(f"⚠️ Hybrid analytics unavailable: {sector} ({ticker})")
            print(f"📊 Hybrid proxy analytics: {len(results)}/{len(sectors_config)}")
            return results
