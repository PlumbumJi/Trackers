        \        cache = {'schema':1,'events':{},'news_watch':{row['fund_id']:baseline}}\n        class Clock(datetime):\n            @classmethod\n            def now(cls,tz=None): return now\n        api = sources.PublicFundSources(MagicMock(),cache,today)\n        api.source_names = ['MAYA']\n        api.catalog = {row['fund_id']:row}\n        window = movers.month_window(movers.ordered_prices(history,today),today)\n        screened = {row['fund_id']:{**row,**window,'screen_low':12,'screen_high':12}}\n        with patch.object(movers,'datetime',Clock),patch.object(movers,'load_state',return_value=cache), \\\n             patch.object(movers,'fetch_listing',new=AsyncMock(side_effect=movers.DiscoveryUnavailable('list_access','403'))), \\\n             patch.object(movers,'PublicFundSources',return_value=api), \\\n             patch.object(api,'listing',new=AsyncMock(return_value=[row])), \\\n             patch.object(api,'screen',new=AsyncMock(return_value=screened)), \\\n             patch.object(api,'series',new=AsyncMock(return_value=(history,row))),\
        \ \\\n             patch.object(movers,'fetch_mentions',new=AsyncMock(return_value={'status':'partial','items':[]})) as news, \\\n             patch.object(movers,'fund_context',new=AsyncMock(return_value=None)):\n            prepared = await movers.prepare_movers()\n        self.assertTrue(news.call_args.kwargs['skip_funder'])\n        self.assertEqual(prepared[0]['last_scan']['catalog_source'],'MAYA')\n        self.assertEqual(len(prepared[1]),1)\n        self.assertEqual(prepared[1][0][1]['monthly'],12)\n        self.assertIn('+12.0%',prepared[0]['news_reviews'][0]['line'])\n        self.assertEqual(prepared[0]['news_watch'][row['fund_id']]['sent_stages'],[])\n\n    def test_biz_news_reads_only_dated_article_body(self):\n        body = ('<meta property=\"og:title\" content=\"Fund report\">'\n                '<meta property=\"article:published_time\" content=\"2026-10-27T06:00:00Z\">'\n                '<div id=\"div_article_body\">קרן בדיקה מנוהלת בהצלחה</div>'\n              \
        \  '<aside>קרן לא קשורה</aside>')\n        item = fund_news.article_item(body,'https://www.bizportal.co.il/mutualfunds/news/article/123')\n        self.assertNotIn('לא קשורה',item.findtext('description'))\n        root = fund_news.ET.fromstring('<rss><channel/></rss>')\n        root.find('channel').append(item)\n        rows = fund_news.parse_mentions(fund_news.ET.tostring(root,encoding='unicode'),\n                [{'name':'קרן בדיקה','fund_id':'5101183'}],datetime(2026,10,27,12,tzinfo=movers.TZ))\n        self.assertEqual(rows[0]['fund_id'],'5101183')\n\n\nif __name__ == '__main__':\n    unittest.main()\nEOF\n"
    - name: Install Python Dependencies
      run: 'set -euo pipefail

        pip install -r requirements.txt'
    - name: Install Chromium Fallback
      if: steps.report.outputs.mode == 'market' || steps.report.outputs.mode == 'ticker'
      run: playwright install --with-deps chromium
    - name: Validate Generated Python
      run: python -m compileall -q modules main.py
    - name: Run Regression Tests
      run: python -m unittest discover -s tests -v
    - name: Run Analytics Engine
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        PORTFOLIO_CHAT_ID: ${{ secrets.PORTFOLIO_CHAT_ID }}
        RUN_MODE: ${{ steps.report.outputs.mode }}
        TICKER_SYMBOL: ${{ inputs.ticker_symbol }}
        PYTHONUNBUFFERED: '1'
      run: python main.py
    - name: Upload Audit Artifacts
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: market-radar-ai-audit-${{ github.run_id }}-${{ github.run_attempt }}
        if-no-files-found: ignore
        retention-days: 14
        path: 'portfolio_snapshots.json

          portfolio_signal_journal.json

          portfolio_candidates.json

          fund_movers_state.json

          charts/*.png

          '
    - name: Save Portfolio History
      if: always() && steps.report.outputs.mode == 'portfolio' && hashFiles('portfolio_snapshots.json') != ''
      uses: actions/cache/save@v5
      with:
        path: 'portfolio_snapshots.json

          portfolio_signal_journal.json

          '
        key: portfolio-v3-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Save Sector Analysis
      if: success() && (steps.report.outputs.mode == 'market' || steps.report.outputs.mode == 'alert') && hashFiles('portfolio_candidates.json') != ''
      uses: actions/cache/save@v5
      with:
        path: portfolio_candidates.json
        key: sector-analysis-v3-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Save Fund Discovery Journal
      if: always() && (steps.report.outputs.mode == 'portfolio' || steps.report.outputs.mode == 'salary') && hashFiles('fund_movers_state.json') != ''
      uses: actions/cache/save@v5
      with:
        path: fund_movers_state.json
        key: fund-discovery-v1-${{ github.run_id }}-${{ github.run_attempt }}
