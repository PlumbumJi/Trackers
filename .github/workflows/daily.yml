                  "<code>"
              ]
              for s in sectors_data:
                  icon=s["icon"]
                  name=s["short_eng"][:6]
                  us_ch=s["avg_change"]
                  il_ch=s["il_fund_data"]["daily"]
                  us_str=f"+{us_ch:.1f}%" if us_ch>0 else f"{us_ch:.1f}%"
                  il_str=f"+{il_ch:.1f}%" if il_ch>0 else f"{il_ch:.1f}%"
                  score_emoji="🟢" if s["score"]>=65 else ("🟡" if s["score"]>=40 else "🔴")
                  lines.append(f"{icon}{name:<6} {us_str:>6} {il_str:>6}  {score_emoji}{s['score']:>3}/100")
              lines.append("</code>\n")
              lines.append("<blockquote expandable>")
              lines.append("🔍 <b>ДРАЙВЕРЫ ДВИЖЕНИЯ И ПОКАЗАТЕЛИ СЕКТОРОВ</b>\n")
              for s in sectors_data:
                  ch_sign=f"+{s['avg_change']:.2f}%" if s["avg_change"]>0 else f"{s['avg_change']:.2f}%"
                  lines.append(f"<b>{s['icon']} {escape_html(s['name'])}</b> ({ch_sign})")
                  if s.get("top_3_tickers"):
                      details=", ".join(f"{ticker}: {change:+.2f}%" for ticker,change in s["top_3_tickers"])
                      lines.append(f"  📊 <i>Топ-3 драйвера: [{escape_html(details)}]</i>")
                  for news in s["news"]:
                      lines.append(f"  {escape_html(news)}")
                  lines.append("")
              lines.append("</blockquote>\n")
              sorted_funds=sorted(sectors_data,key=lambda item:item["il_fund_data"]["daily"],reverse=True)
              lines.append("<blockquote expandable>")
              lines.append("🇮🇱 <b>ДОХОДНОСТЬ ИЗРАИЛЬСКИХ ФОНДОВ (תשואות)</b>\n")
              for s in sorted_funds:
                  data=s["il_fund_data"]
                  daily=data["daily"]
                  mtd=data["mtd"]
                  ytd=data["ytd"]
                  emoji="🟢" if daily>0 else ("🔴" if daily<0 else "⚪")
                  daily_str=f"+{daily:.2f}%" if daily>0 else f"{daily:.2f}%"
                  mtd_str=f"+{mtd:.2f}%" if mtd>0 else f"{mtd:.2f}%"
                  ytd_str=f"+{ytd:.2f}%" if ytd>0 else f"{ytd:.2f}%"
                  lines.append(
                      f"{emoji} <b>{escape_html(s['il_name_eng'])}</b> ({s['icon']})\n"
                      f"└ <code>{s['fund_id']}</code> · <b>День: {daily_str}</b> | <b>Месяц: {mtd_str}</b> | <b>Год: {ytd_str}</b>"
                  )
              lines.append("</blockquote>")
              lines.append(f"\n{BOT_NAME}")
              return "\n".join(lines)
          def build_ipo_message(ipo_cards:list)->str:
              tz_il=timezone(timedelta(hours=3))
              now_str=datetime.now(tz_il).strftime("%d.%m.%Y")
              lines=[
                  "🔔 <b>ЕЖЕНЕДЕЛЬНЫЙ IPO ДАЙДЖЕСТ</b>",
                  f"📅 {now_str} | Субботний обзор 🇮🇱\n",
                  "<blockquote expandable>"
