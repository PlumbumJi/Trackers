                      "HOLD": "🟡 Hold (Удерживать)",
                      "UNDERPERFORM": "🟠 Underperform",
                      "SELL": "🔴 Sell (Продавать)",
                      "N/A": "⚪️ Ожидает оценки"
                  }
                  rec_formatted = rec_map.get(rec, rec)

                  return (
                      f"📌 <b>{name}</b> (<code>{symbol}</code>)\n"
                      f"🗓 <b>Дата IPO:</b> {ipo_date}\n"
                      f"💵 <b>Курс / Диапазон:</b> {price_str}\n"
                      f"🎯 <b>Цель Wall St:</b> {target_str}\n"
                      f"🧠 <b>Консенсус:</b> {rec_formatted}\n"
                  )
              except Exception:
