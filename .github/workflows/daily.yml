        """Brief explanations of a fund's declared focus, not attributed causes of a move."""
        import re
        
        
        # Recognise explicit subjects in the published name; never infer current holdings
        # or currency exposure from a return, manager, ticker of another fund, or headline.
        PROFILES = (
            (r'\bwti\b', 'нефть WTI', 'спрос на нефть, добыча и запасы'),
            (r'\bsemicon\w*|מוליכים למחצה|שבבים', 'полупроводники',
             'спрос на чипы, результаты производителей'),
            (r'\bindxx\s+blockchain\s+ecosystem\b', 'компании блокчейна',
             'акции отрасли, активность крипторынка'),
            (r'\bbitcoin\b|ביטקוין', 'биткоин', 'цена биткоина и условия стратегии'),
            (r'\b(?:clean|renewable|green)\s+energy\b|אנרגיה (?:ירוקה|מתחדשת)',
             'зелёная энергетика', 'спрос на энергию, ставки и субсидии'),
            (r'\bcyber\w*|סייבר', 'кибербезопасность', 'расходы на защиту, результаты компаний'),
            (r'\bbiotech\w*|ביוטכנולוגיה', 'биотехнологии', 'испытания лекарств, решения регуляторов'),
            (r'\bartificial intelligence\b|\bAI\b|בינה מלאכותית', 'ИИ',
             'расходы на ИИ, результаты компаний'),
            (r'\bbanks?\b|בנקים', 'банки', 'ставки, кредитование и просрочки'),
            (r'\binsurance\b|ביטוח', 'страхование', 'убытки по страхованию, доходность инвестиций'),
            (r'\bS\s*&\s*P\s*500\b', 'акции S&P 500', 'прибыль компаний США и процентные ставки'),
            (r'\bNasdaq[\s-]*100\b', 'акции Nasdaq-100', 'результаты компаний индекса и ставки'),
        )
        MANAGERS = (
            ('ברק', 'Barak'), ('תכלית', 'Tachlit'), ('מיטב', 'Meitav'),
            ('איילון', 'Ayalon'), ('אילים', 'Eylim'), ('מגדל', 'Migdal'),
            ('מור', 'More'), ('קסם', 'KSM'), ('הראל', 'Harel'), ('אלטשולר', 'Altshuler'),
            ('MTF', 'MTF'), ('IBI', 'IBI'),
        )
        
        
        def describe_fund(name):
            name = re.sub(r'\s+', ' ', str(name or '')).strip()
            matches = [(label, factors) for pattern, label, factors in PROFILES
                       if re.search(pattern, name, re.I)]
            # Mixed mandates cannot be presented as a pure exposure to either subject.
            if len(matches) != 1:
                return None
            label, factors = matches[0]
            manager = next((english for hebrew, english in MANAGERS
                            if re.match(r'(?:' + re.escape(hebrew) + '|' + re.escape(english)
                                        + r')(?!\w)', name, re.I)), '')
            return {'label': f'{manager} · {label}' if manager else label, 'factors': factors}
        
        
        def short_conclusion(event):
            return {
                'up_up': 'Рост сохраняется; не догонять цену.',
                'up_down': 'Идёт откат; ждать стабилизации.',
                'up_flat': 'После роста пауза; нового импульса нет.',
                'down_up': 'Есть отскок; разворот ещё не подтверждён.',
                'down_down': 'Снижение продолжается; усреднение рискованно.',
                'down_flat': 'Падение замедлилось; разворот не подтверждён.',
            }.get(event.get('regime'), event.get('conclusion', ''))
