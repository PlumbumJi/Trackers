        \ is None:\n                self.assertNotIn('не найдено', caption)\n        with tempfile.TemporaryDirectory() as d, patch.object(movers, 'STATE', Path(d)/'state.json'), \\\n             patch.dict(movers.os.environ, {'DRY_RUN':'false'}):\n            prepared = (copy.deepcopy(initial), [(key,event,None)])\n            caption, supplement, included = movers.combined_caption(prepared, 'portfolio')\n            self.assertFalse(movers.STATE.exists())\n            self.assertEqual(prepared[0]['events'], {})\n            movers.commit_movers(prepared, included)\n            self.assertIn(key, json.loads(movers.STATE.read_text())['events'])\n\n    async def test_three_html_captions_fit_and_send_privately(self):\n        row, points, quote, today = fixture()\n        event = movers.validated_event(row, points, quote, today)\n        event['name'] = 'Фонд & название с длинным описанием ' * 5\n        event['context'] = {'title':'Новость о фонде ' * 4, 'url':'https://example.com/?a=1&b=2'}\n\
