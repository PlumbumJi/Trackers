          import asyncio
          import os

          import aiohttp

          from modules.config import SECTORS_CONFIG
          from modules.formatter import (
              build_entry_alert_message,
              build_ipo_radar_message,
              build_telegram_message,
          )
          from modules.ipo import fetch_weekly_ipo_radar
          from modules.market import (
              analyze_entry_zone,
              fetch_all_israeli_funds,
              fetch_all_year_analytics,
              fetch_all_yahoo_data,
          )
          from modules.news import fetch_historical_trigger, fetch_sector_news
          from modules.telegram_sender import send_to_telegram


          def calculate_sector_score(day_change):
              if day_change is None:
                  return None
              return max(0, min(100, int(50 + float(day_change) * 15.0)))


          async def run_market_analytics(entry_only: bool = False) -> None:
              all_tickers = sorted({
                  ticker
                  for config in SECTORS_CONFIG.values()
                  for ticker in config["tickers"] + [config.get("proxy_ticker", "")]
                  if ticker
              })
              print("📦 Collecting Yahoo market data...")
              market_data = await fetch_all_yahoo_data(all_tickers)
              print("🌐 Collecting Israeli fund returns...")
              il_results = await fetch_all_israeli_funds(SECTORS_CONFIG)
              print("📈 Analyzing 1Y US proxy history...")
              year_results = await fetch_all_year_analytics(SECTORS_CONFIG)

              async with aiohttp.ClientSession() as session:
                  history_tasks = {}
                  if not entry_only:
                      for sector, config in SECTORS_CONFIG.items():
                          year = year_results.get(sector, {})
                          if year.get("event_date") and config.get("history_news_ticker"):
                              history_tasks[sector] = asyncio.create_task(fetch_historical_trigger(
                                  session,
                                  config["history_news_ticker"],
                                  year["event_date"],
                                  config["short_eng"],
                              ))
                  for sector, task in history_tasks.items():
                      try:
                          trigger = await task
                          if trigger:
                              year_results[sector]["trigger"] = trigger
                      except Exception as error:
                          print(f"⚠️ Historical context {sector}: {error}")

                  sector_tasks = []
                  sector_rows = []
                  for sector, config in SECTORS_CONFIG.items():
                      ticker_details = [
                          (ticker, market_data[ticker]["change"])
                          for ticker in config["tickers"]
                          if ticker in market_data and market_data[ticker].get("change") is not None
                      ]
                      top_movements = sorted(ticker_details, key=lambda item: abs(item[1]), reverse=True)[:3]
                      proxy_ticker = config.get("proxy_ticker")
                      benchmark_change = (
                          market_data.get(proxy_ticker, {}).get("change")
                          if proxy_ticker else None
                      )
                      sector_rows.append((sector, config, top_movements, benchmark_change))
                      sector_tasks.append(
                          asyncio.create_task(fetch_sector_news(
                              session, config["news_ticker"], top_movements, config["short_eng"]
                          )) if not entry_only else None
                      )

                  results = []
                  for row, news_task in zip(sector_rows, sector_tasks):
                      sector, config, top_movements, benchmark_change = row
                      fund_data = il_results.get(sector, {
                          "daily": None,
                          "mtd": None,
                          "ytd": None,
                          "weekly": None,
                          "days30": None,
                      })
                      year_data = year_results.get(sector, {})
                      strength_change = (
                          fund_data.get("daily")
                          if config.get("entry_mode") == "local"
                          else benchmark_change
                      )
                      results.append({
                          "short_eng": config["short_eng"],
                          "name": config["name"],
                          "icon": config["icon"],
                          "fund_id": config["fund_id"],
                          "il_name_eng": config["il_name_eng"],
                          "benchmark_name": config.get("benchmark_name", ""),
                          "entry_mode": config.get("entry_mode", "global"),
                          "avg_change": round(benchmark_change, 2) if benchmark_change is not None else None,
                          "top_3_tickers": top_movements,
                          "score": calculate_sector_score(strength_change),
                          "news": await news_task if news_task else [],
                          "il_fund_data": fund_data,
                          "year_analysis": year_data,
                          "entry_analysis": analyze_entry_zone(fund_data, year_data, config),
                      })

              results.sort(
                  key=lambda item: (
                      item["avg_change"] is not None,
                      item["avg_change"] if item["avg_change"] is not None else float("-inf"),
                  ),
                  reverse=True,
              )
              if entry_only:
                  alert = build_entry_alert_message(results)
                  if alert:
                      await send_to_telegram(alert)
                  else:
                      print("ℹ️ No optimal entry zone; morning alert was not sent")
              else:
                  await send_to_telegram(build_telegram_message(results))


          async def run_ipo_digest() -> None:
              print("📊 Building Weekly IPO Radar...")
              await send_to_telegram(build_ipo_radar_message(await fetch_weekly_ipo_radar()))


          async def main() -> None:
              mode = os.getenv("RUN_MODE", "market").strip().lower()
              if mode == "ipo":
                  await run_ipo_digest()
              elif mode == "entry":
                  await run_market_analytics(entry_only=True)
              elif mode == "market":
                  await run_market_analytics()
              else:
                  raise ValueError(f"Unsupported RUN_MODE: {mode}")


          if __name__ == "__main__":
              asyncio.run(main())
          EOF

      - name: Install Dependencies and Chromium
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Validate Generated Python
        run: python -m compileall -q modules main.py

