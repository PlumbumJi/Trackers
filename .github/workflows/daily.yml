        \ BOT_NAME\n\n\ndef message_length(text: str) -> int:\n    class VisibleText(HTMLParser):\n        def __init__(self):\n            super().__init__(convert_charrefs=True)\n            self.parts = []\n\n        def handle_data(self, data):\n            self.parts.append(data)\n\n    parser = VisibleText()\n    parser.feed(text)\n    parser.close()\n    return len(''.join(parser.parts).encode('utf-16-le')) // 2\n\n\ndef split_plain_text(text: str, max_length: int) -> list[str]:\n    chunks, current = [], \"\"\n    for line in text.splitlines(keepends=True):\n        if message_length(current + line) > max_length and current.strip():\n            chunks.append(current.strip())\n            current = line\n        else:\n            current += line\n    if current.strip():\n        chunks.append(current.strip())\n    return chunks\n\n\ndef split_blockquote(block: str, max_length: int) -> list[str]:\n    match = re.search(r\"<blockquote(?:\\s+expandable)?>\", block)\n    close_tag =\
        \ \"</blockquote>\"\n    if not match or close_tag not in block:\n        return split_plain_text(block, max_length)\n    open_tag = match.group(0)\n    prefix = block[:match.start()]\n    body_end = block.rfind(close_tag)\n    body = block[match.end():body_end]\n    suffix = block[body_end + len(close_tag):]\n    chunks, current, current_prefix = [], \"\", prefix\n    # Keep each fund/sector paragraph together, including its news link.\n    paragraphs = re.split(r'\\n\\s*\\n', body.strip())\n    for paragraph in paragraphs:\n        line = paragraph + \"\\n\\n\"\n        candidate = f\"{current_prefix}{open_tag}{current}{line}{close_tag}{suffix}\"\n        if message_length(candidate) > max_length and current.strip():\n            chunks.append(f\"{current_prefix}{open_tag}{current}{close_tag}\".strip())\n            current_prefix, current = \"\", line\n        else:\n            current += line\n    final = f\"{current_prefix}{open_tag}{current}{close_tag}{suffix}\".strip()\n\
        \    if final:\n        chunks.append(final)\n    return chunks\n\n\ndef split_message(text: str, max_length: int = 3900) -> list[str]:\n    # A footer is part of the final text message, never its own chunk.\n    has_footer = any(line.strip() == BOT_NAME for line in text.splitlines())\n    text = '\\n'.join(line for line in text.splitlines() if line.strip() != BOT_NAME)\n    text = re.sub(r'\\n[ \\t]*\\n(?:[ \\t]*\\n)+', '\\n\\n', text).strip()\n    footer = f\"\\n\\n{BOT_NAME}\" if has_footer else \"\"\n    budget = max_length - message_length(footer)\n    il_marker = (\n        \"<blockquote expandable>\\n\"\n        \"\U0001F1EE\U0001F1F1 <b>АНАЛИТИКА ИЗРАИЛЬСКИХ ФОНДОВ</b>\"\n    )\n    il_position = text.find(il_marker)\n    if il_position > 0:\n        logical_parts = [text[:il_position].strip(), text[il_position:].strip()]\n    else:\n        logical_parts = [text]\n    chunks = []\n    for part in logical_parts:\n        if not part:\n            continue\n        if message_length(part)\
        \ <= budget:\n            chunks.append(part)\n            continue\n        for raw in part.split(\"</blockquote>\"):\n            if not raw.strip():\n                continue\n            block = raw + \"</blockquote>\" if \"<blockquote\" in raw else raw\n            chunks.extend(split_blockquote(block, budget) if message_length(block) > budget else [block.strip()])\n    chunks = [chunk for chunk in chunks if chunk]\n    if chunks:\n        chunks[-1] += footer\n    if any(message_length(chunk) > max_length for chunk in chunks):\n        raise ValueError(\"A single message paragraph exceeds Telegram limit\")\n    return chunks\n\n\nasync def send_to_telegram(text: str, chat_id=None) -> None:\n    destination = chat_id or CHAT_ID\n    if not BOT_TOKEN or not destination:\n        raise RuntimeError(\"BOT_TOKEN or CHAT_ID is missing\")\n    url = f\"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage\"\n    chunks = split_message(text)\n    print(f\"ℹ️ Message length: {len(text)};\
        \ chunks: {len(chunks)}\")\n    timeout = aiohttp.ClientTimeout(total=HTTP_TIMEOUT)\n    async with aiohttp.ClientSession(timeout=timeout) as session:\n        for index, chunk in enumerate(chunks, start=1):\n            payload = {\n                \"chat_id\": destination,\n                \"text\": chunk,\n                \"parse_mode\": \"HTML\",\n                \"disable_web_page_preview\": True,\n            }\n            async with session.post(url, json=payload) as response:\n                response_text = await response.text()\n                if response.status != 200:\n                    raise RuntimeError(\n                        f\"Telegram HTTP {response.status} on chunk {index}/{len(chunks)}: {response_text[:500]}\"\n                    )\n                print(f\"\U0001F680 Sent chunk {index}/{len(chunks)}\")\n\n\nasync def send_chart_photos(charts, may_send=lambda: True, *, chat_id=None,\n                            title=\"\U0001F4CA Что видно на графиках\"\
        , parse_mode=None) -> None:\n    if not charts or not may_send():\n        return\n    destination = chat_id or CHAT_ID\n    if not BOT_TOKEN or not destination:\n        raise RuntimeError(\"BOT_TOKEN or CHAT_ID is missing\")\n    charts = charts[:3]\n    captions = [caption for _, caption in charts if caption.strip()]\n    parts = ([title] if title else []) + captions\n    album_caption = \"\\n\\n\".join(parts)\n    from html import unescape\n    visible = unescape(re.sub(r'<[^>]*>', '', album_caption)) if parse_mode == 'HTML' else album_caption\n    if len(visible.encode(\"utf-16-le\")) // 2 > 1024:\n        raise ValueError(\"Album caption exceeds Telegram limit\")\n    payload = aiohttp.FormData()\n    payload.add_field(\"chat_id\", destination)\n    payload.add_field(\"disable_notification\", \"true\")\n    media = []\n    for index, (png, _) in enumerate(charts):\n        attachment = f\"chart{index}\"\n        payload.add_field(attachment if len(charts) > 1 else \"photo\"\
