          from datetime import datetime
          from typing import Optional
          from zoneinfo import ZoneInfo

          from modules.config import BOT_NAME

          ISRAEL_TZ = ZoneInfo("Asia/Jerusalem")


          def escape_html(value: object) -> str:
              return str(value).replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")


          def format_percent(value: Optional[float], digits: int = 2) -> str:
              if value is None:
                  return "N/A"
              number = float(value)
              return f"+{number:.{digits}f}%" if number > 0 else f"{number:.{digits}f}%"


          def relation_text(us_change: Optional[float], il_change: Optional[float]) -> str:
              if us_change is None or il_change is None:
                  return "недостаточно данных"
              us, il = float(us_change), float(il_change)
              if abs(us) < 0.15 and abs(il) < 0.15:
                  return "спокойное движение"
              if us > 0 and il > 0:
                  if abs(il) >= abs(us) * 1.4:
                      return "сильнее US-сектора"
                  if abs(il) <= abs(us) * 0.5:
                      return "отстаёт от US-сектора"
                  return "следует за US-сектором"
              if us < 0 and il < 0:
                  if abs(il) >= abs(us) * 1.4:
