name: Automated Market Analytics
'on':
  schedule:
  - cron: 20 8 * * *
    timezone: Asia/Jerusalem
  - cron: 15 23 * * *
    timezone: Asia/Jerusalem
  workflow_dispatch:
    inputs:
      report_type:
        description: Report to send
        type: choice
        default: market
        options: [market, portfolio]
permissions:
  contents: read
concurrency:
  group: market-analytics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Select Report Type
      id: report
      env:
        SCHEDULE: ${{ github.event.schedule }}
        MANUAL_MODE: ${{ inputs.report_type }}
      run: |
        mode="${MANUAL_MODE:-market}"
        if [[ "$SCHEDULE" == '20 8 * * *' ]]; then mode=portfolio; fi
        echo "mode=$mode" >> "$GITHUB_OUTPUT"
    - name: Restore Portfolio History
      if: steps.report.outputs.mode == 'portfolio'
      uses: actions/cache/restore@v5
      with:
        path: |
          portfolio_snapshots.json
          portfolio_signal_journal.json
        key: portfolio-v3-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: portfolio-v3-
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Restore Sector Analysis
      if: steps.report.outputs.mode == 'portfolio'
      uses: actions/cache/restore@v5
      with:
        path: portfolio_candidates.json
        key: sector-analysis-v3-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: sector-analysis-v3-
    - name: Deploy Architecture Files
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p modules tests
        touch modules/__init__.py
        cat << 'EOF' > requirements.txt
        aiohttp==3.11.11
        playwright==1.49.1
        matplotlib==3.10.6
        EOF

        cat << 'EOF' > modules/config.py
