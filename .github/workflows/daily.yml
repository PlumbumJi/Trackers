        """Deterministic portfolio rules, not a forecast of six-month returns."""
        import asyncio
        import json
        import math
        import statistics
        from datetime import date, datetime, timedelta
        from pathlib import Path
        
        from modules.market import _FundHTML, _clean_text, fetch_ticker_history, analyze_year_history
        
