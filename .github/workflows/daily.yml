                self.assertEqual(signal['status_key'], 'watch')


        class MessageTests(unittest.TestCase):
            def rows(self, missing=False):
                rows=[]
                for config in SECTORS_CONFIG.values():
                    fund = dict(market.EMPTY_RETURNS) if missing else {'daily':1.0,'mtd':2.0,'ytd':3.0}
                    if not missing:
                        fund.update(RadarTests.fund())
                    year = RadarTests.technical()
                    year.update(proxy_ticker=config['proxy_ticker'], market_date='2026-09-05')
                    if not missing:
                        fund['price_stats']['price_date'] = '2026-09-05'
                    rows.append(dict(config, avg_change=1.0, base_date='2026-09-05', market_status='closed',
                                     top_3_tickers=[('TEST',1.0)],
                                     news=['• 📰 ' + 'Тестовая новость. ' * 7], il_fund_data=fund, year_analysis=year,
                                     entry_analysis=market.analyze_entry_zone(fund,year)))
                return rows

            def test_eleven_funds_format_and_chunk_size(self):
                chunks=telegram_sender.split_message(formatter.build_telegram_message(self.rows()))
                self.assertEqual(len(chunks), 2)
                self.assertTrue(all(len(chunk)<=3900 for chunk in chunks))
                for chunk in chunks:
                    self.assertEqual(chunk.count('<blockquote expandable>'),chunk.count('</blockquote>'))
                self.assertIn('Migdal Banks Equity', self.rows()[8]['il_name_eng'])
                self.assertIn('🏦Bank', '\n'.join(chunks))

            def test_total_outage_short_report(self):
                text=formatter.build_telegram_message(self.rows(missing=True))
                self.assertIn('Израильские данные не получены',text)
                self.assertNotIn('РАДАР ТОЧЕК ВХОДА',text)
                self.assertNotIn('0/4',text)

            def test_version_marker_not_published(self):
                text = formatter.build_telegram_message(self.rows())
                self.assertNotIn('hybrid-v2-20260914', text)

            def test_only_five_news_sectors_are_rendered(self):
                text = telegram_sender.split_message(formatter.build_telegram_message(self.rows()))[0]
                self.assertEqual(text.count('Тестовая новость.'), 35)

            def test_gap_requires_matching_dates(self):
                rows = self.rows()
                rows[0]['base_date'] = '2026-09-04'
                rows[0]['il_fund_data']['daily'] = 10.0
                text = formatter.build_telegram_message(rows)
                self.assertNotIn(f"<b>{rows[0]['short_eng']}</b> · база", text)

            def test_small_backtest_sample_is_not_presented_as_success_rate(self):
                rows = self.rows()
                for row in rows:
                    row['entry_analysis']['backtest_total'] = 3
                    row['entry_analysis']['backtest_wins'] = 2
                    row.update(preopen_ticker='TEST', premarket={'available':True, 'change':1.0, 'time_ny':'09:15'},
                               breadth_positive=1, breadth_total=1)
                text = formatter.build_combined_radar_message(rows)
                self.assertNotIn('История базы:', text)
                self.assertNotIn('2/3 возвратов', text)

            def test_premarket_message_is_explicitly_non_predictive(self):
                rows = [{
                    'icon':'🛢️', 'short_eng':'Oil', 'local_market':False,
                    'preopen_ticker':'USO',
                    'premarket':{'available':True, 'change':1.2, 'time_ny':'09:15'},
                    'breadth_positive':3, 'breadth_total':4,
                }]
                rows[0].update(
                    il_name_eng='Barak Ultra WTI',
                    entry_analysis=market.analyze_entry_zone(RadarTests.fund(), RadarTests.technical()),
                )
                text = formatter.build_combined_radar_message(rows, '08.09.2026 23:15')
                self.assertIn('TEST', text)
                self.assertIn('не прогноз цены открытия', text)
                self.assertIn('✅▲', text)
                self.assertNotIn('покупать', text.lower())

            def test_radar_renders_at_most_five_candidates(self):
                rows = self.rows()
                for row in rows:
                    row.update(
                        premarket={'available': True, 'change': 1.0, 'time_ny': '09:15'},
                        breadth_positive=2, breadth_total=3,
                    )
                text = formatter.build_combined_radar_message(rows)
                self.assertEqual(text.count('План базы:'), 5)
                self.assertIn('Ещё кандидатов: <b>6</b>', text)

            def test_unavailable_premarket_is_short(self):
                session = {'time_ny': '14.09.2026 10:00'}
                text = formatter.build_premarket_unavailable_message(session, 'regular')
                self.assertLess(len(text), 500)
                self.assertIn('РАДАР НЕ СФОРМИРОВАН', text)


