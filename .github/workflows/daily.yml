        from datetime import date, datetime
        import textwrap
        from typing import Optional
        from zoneinfo import ZoneInfo

        from modules.config import BOT_NAME

        ISRAEL_TZ = ZoneInfo("Asia/Jerusalem")


        def escape_html(value: object) -> str:
            return str(value).replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")


        def format_percent(value: Optional[float], digits: int = 2, missing: str = "—") -> str:
            if value is None:
                return missing
            number = float(value)
            return f"+{number:.{digits}f}%" if number > 0 else f"{number:.{digits}f}%"


        def _display_date(value: str) -> str:
            try:
                parsed = date.fromisoformat(str(value))
            except ValueError:
                return str(value or "—")
            return parsed.strftime("%d.%m")


        def _fund_date(row: dict) -> str:
            return str((row.get("il_fund_data", {}).get("price_stats") or {}).get("price_date") or "")


        def _ranked_funds(rows: list[dict]) -> list[dict]:
            available = [row for row in rows if row.get("il_fund_data", {}).get("daily") is not None]
            return sorted(
                available,
                key=lambda row: float(row["il_fund_data"]["daily"]),
                reverse=True,
            )


        def _directional_gaps(rows: list[dict], threshold: float = 1.5) -> list[tuple[float, dict]]:
            gaps = []
            for row in rows:
                fund_change = row.get("il_fund_data", {}).get("daily")
                base_change = row.get("avg_change")
                base_date = row.get("base_date")
                fund_date = _fund_date(row)
                if (
                    fund_change is None or base_change is None
                    or not base_date or not fund_date or base_date != fund_date
                ):
                    continue
                gap = float(fund_change) - float(base_change)
                if abs(gap) >= threshold:
                    gaps.append((gap, row))
            return sorted(gaps, key=lambda item: abs(item[0]), reverse=True)


        def _day_strength(change: Optional[float]) -> str:
            if change is None:
                return "⚪"
            if float(change) > 0.0:
                return "🟢"
            if float(change) < 0.0:
                return "🔴"
            return "🟡"


        def _fund_marker(fund_data: dict) -> str:
            daily = fund_data.get("daily")
            if daily is None:
                return "⬜•"
            return "🟩▲" if daily > 0 else "🟥▼" if daily < 0 else "🟨→"


