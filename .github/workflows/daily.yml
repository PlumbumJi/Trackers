                self.assertTrue(all(telegram_sender.message_length(chunk) <= 3900 for chunk in chunks))
                long_news = '<blockquote expandable>\n' + '\n\n'.join(
                    f'<b>Сектор {i}</b>\nНовость {i}: ' + 'Текст новости. ' * 12 for i in range(30)
                ) + '</blockquote>\n\n' + BOT_NAME
