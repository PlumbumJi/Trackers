            ])
            return "\n".join(lines)


        def _radar_verdict(row: dict) -> tuple[str, str, str]:
            entry = row.get("entry_analysis") or {}
            status = entry.get("status_key", "unavailable")
            if status == "unavailable":
                return "▫️—", "НЕТ ДАННЫХ", "истории фонда недостаточно"
            if not entry.get("candidate"):
                return "⚠️→", "НАБЛЮДАТЬ", "у фонда нет сочетания снижения и низкой цены"
            if status == "blocked":
                return "🔻▼", "НЕ ПОДТВЕРЖДЕНО", "ждать повышения цены самого фонда"
            if status != "ready":
                return "⚠️→", "НАБЛЮДАТЬ", "пока только первое повышение цены фонда"
            base1, base5 = entry.get("base1"), entry.get("base5")
            if base1 is None or base5 is None:
                return "⚠️→", "НАБЛЮДАТЬ", "условия фонда выполнены; подтверждения базового рынка недостаточно"
            total = int(row.get("breadth_total") or 0)
            positive = int(row.get("breadth_positive") or 0)
            if base1 < 0 or base5 <= 0:
                return "🔻▼", "НЕ ПОДТВЕРЖДЕНО", "фонд восстанавливается, но базовый рынок пока не поддерживает"
            if base1 > 0 and total >= 2 and positive * 2 >= total:
                return "✅▲", "ПОДТВЕРЖДЕНО", "условия фонда выполнены, базовый рынок поддерживает"
            return "⚠️→", "НАБЛЮДАТЬ", "условия фонда выполнены; внешний импульс ещё слабый"


        def rank_radar_rows(rows: list[dict]) -> list[dict]:
            usable = [
                row for row in rows
                if (row.get("entry_analysis") or {}).get("status_key") in {"ready", "forming", "blocked", "watch"}
            ]
            if not usable:
                return []
            priority = {"ready": 0, "forming": 1, "blocked": 2, "watch": 3}
            return sorted(usable, key=lambda row: (
                priority[row["entry_analysis"]["status_key"]],
                row["entry_analysis"]["range_position_60"],
            ))


        def ordered_radar_rows(rows: list[dict]) -> list[dict]:
            ranked = rank_radar_rows(rows)
            candidates = [row for row in ranked if row['entry_analysis'].get('candidate')]
            candidates.sort(key=lambda row: _radar_verdict(row)[0] != "✅▲")
            observation = [row for row in ranked if not row['entry_analysis'].get('candidate')]
            return candidates + observation


        def radar_chart_target(rows: list[dict]) -> int:
            usable = rank_radar_rows(rows)
            return min(len(usable), 3)


        def build_combined_radar_message(rows: list[dict], chart_count=None) -> str:
            usable = rank_radar_rows(rows)
            if not usable:
                return ""
            verdicts = [_radar_verdict(row)[0] for row in usable if row['entry_analysis'].get('candidate')]
            confirmed = verdicts.count("✅▲")
            if not confirmed:
                return ""
            observing = verdicts.count("⚠️→")
            rejected = verdicts.count("🔻▼")
            lines = [
                "🎯 <b>РАДАР ИЗРАИЛЬСКИХ ФОНДОВ</b>",
                f"📅 {datetime.now(ISRAEL_TZ).strftime('%d.%m | %H:%M')} · Израиль",
                "",
            ]
            lines.append(f"✅▲ <b>Вход по модели подтверждён: {confirmed}.</b>")
            if observing:
                lines.append(f"Первые признаки восстановления: {observing}. Ждём подтверждения.")
            if rejected:
                lines.append(f"Цена низкая, но восстановление не подтверждено: {rejected}.")
            if chart_count:
                lines.extend(["", f"Ниже — графики для наблюдения: {chart_count}.",
                              "Сначала фонды в зоне низких цен, затем ближайшие к ней."])
            elif chart_count == 0:
                lines.append("Графики недоступны: не удалось получить достаточную историю цен.")
            if len(usable) < len(rows):
                lines.append(f"Без оценки: {len(rows) - len(usable)} — недостаточно сопоставимых данных.")
            lines.extend(["", "<i>На графиках — цена самого фонда за 3 месяца. Минимум периода не гарантирует дно.</i>"])
            lines.extend(["", BOT_NAME])
            return "\n".join(lines)
