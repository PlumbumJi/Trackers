          cat << 'EOF' > modules/market.py
          import asyncio,json,re
          from datetime import datetime,timezone
          from pathlib import Path
          from typing import Any
          import aiohttp
          from bs4 import BeautifulSoup
          from modules.config import HEADERS,HTTP_TIMEOUT
          CACHE_FILE=Path(".cache/israeli_funds.json")
          EMPTY={"daily":None,"mtd":None,"ytd":None,"source":None,"stale":False}
          ALIASES={
              "daily":[
                  "dailychangepercent","dailychange","daychange","dailyreturn",
                  "dailyyield","daily","prcchg","DailyChangePercent"
              ],
              "mtd":[
                  "mtd","monthlyreturn","monthlychange","monthchange",
                  "frommonthstart","monthyield"
              ],
              "ytd":[
                  "ytd","yearlyreturn","yearchange","fromyearstart",
                  "yearreturn","annualreturn"
              ]
          }
          API_URLS=[
              "https://www.funder.co.il/api/fund/{id}",
              "https://www.funder.co.il/api/funds/{id}",
              "https://www.funder.co.il/api/Fund/GetFundData/{id}",
              "https://www.bizportal.co.il/api/mutualfunds/getgeneralview/{id}",
              "https://www.bizportal.co.il/mutualfunds/quote/generalview/{id}",
              "https://www.bizportal.co.il/mutualfunds/quote/generalview/{id}?format=json"
          ]
          def text(value:Any)->str:
              return re.sub(r"\s+"," ",str(value or "")).strip()
          def key(value:Any)->str:
              return re.sub(r"[^a-z0-9\u0590-\u05ff]","",text(value).lower())
          def number(value:Any,limit:float)->float|None:
              if value is None or isinstance(value,bool):
                  return None
              if isinstance(value,(int,float)):
                  result=float(value)
              else:
                  match=re.search(r"[-+]?\d+(?:[.,]\d+)?",text(value).replace("%",""))
                  if not match:
                      return None
                  try:
                      result=float(match.group(0).replace(",","."))
                  except ValueError:
                      return None
              if abs(result)>limit:
                  return None
              return round(result,2)
          def valid(data:dict)->bool:
              return any(data.get(field) is not None for field in ("daily","mtd","ytd"))
          def complete(data:dict)->bool:
              return all(data.get(field) is not None for field in ("daily","mtd","ytd"))
          def merge(target:dict,candidate:dict)->dict:
              for field in ("daily","mtd","ytd"):
                  if target.get(field) is None and candidate.get(field) is not None:
                      target[field]=candidate[field]
              if not target.get("source") and candidate.get("source"):
                  target["source"]=candidate["source"]
              return target
          def load_cache()->dict:
              try:
                  if CACHE_FILE.exists():
                      payload=json.loads(CACHE_FILE.read_text(encoding="utf-8"))
                      return payload.get("funds",{})
              except Exception:
                  pass
              return {}
          def save_cache(data:dict)->None:
              CACHE_FILE.parent.mkdir(parents=True,exist_ok=True)
              CACHE_FILE.write_text(
                  json.dumps(
                      {
                          "updated_at":datetime.now(timezone.utc).isoformat(),
                          "funds":data
                      },
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )
          def find_name(node:Any)->str:
              if isinstance(node,dict):
                  for raw_key,value in node.items():
                      normalized=key(raw_key)
                      if normalized in {
                          "fundname","name","fullname","fundfullname",
                          "securityname","instrumentname","שםקרן"
                      } and isinstance(value,str):
                          return text(value)
                  for value in node.values():
                      found=find_name(value)
                      if found:
                          return found
              elif isinstance(node,list):
                  for item in node:
                      found=find_name(item)
                      if found:
                          return found
              return ""
          def matches_name(name:str,expected:list[str])->bool:
              normalized=key(name)
              if not normalized:
                  return True
              hits=sum(1 for token in expected if key(token) in normalized)
              return hits>=max(1,min(2,len(expected)))
          def walk(node:Any,result:dict|None=None)->dict:
              if result is None:
                  result=dict(EMPTY)
              if isinstance(node,dict):
                  normalized={key(k):v for k,v in node.items()}
                  for field,aliases in ALIASES.items():
                      if result[field] is not None:
                          continue
                      limit=50.0 if field=="daily" else 500.0
                      for alias in aliases:
                          alias_key=key(alias)
                          for raw_key,value in normalized.items():
                              if raw_key==alias_key or raw_key.endswith(alias_key):
                                  parsed=number(value,limit)
                                  if parsed is not None:
                                      result[field]=parsed
                                      break
                          if result[field] is not None:
                              break
                  for value in node.values():
                      walk(value,result)
                      if complete(result):
                          return result
              elif isinstance(node,list):
                  for item in node:
                      walk(item,result)
                      if complete(result):
                          return result
              return result
          def parse_html(body:str)->dict:
              result=dict(EMPTY)
              soup=BeautifulSoup(body,"html.parser")
              for script in soup.find_all("script"):
                  raw=script.string or script.get_text(" ",strip=True)
                  if not raw:
                      continue
                  for candidate in re.findall(r"\{.*?\}",raw,re.DOTALL):
                      try:
                          merge(result,walk(json.loads(candidate)))
                      except Exception:
                          pass
              plain=text(soup.get_text(" ",strip=True))
              patterns={
                  "daily":[
                      r"תשואה\s*יומית.{0,80}?([-+]?\d+(?:[.,]\d+)?)\s*%",
                      r"יומית.{0,80}?([-+]?\d+(?:[.,]\d+)?)\s*%"
                  ],
                  "mtd":[
                      r"מתחילת\s*החודש.{0,80}?([-+]?\d+(?:[.,]\d+)?)\s*%"
                  ],
                  "ytd":[
                      r"מתחילת\s*השנה.{0,80}?([-+]?\d+(?:[.,]\d+)?)\s*%"
                  ]
              }
              for field,items in patterns.items():
                  if result[field] is not None:
                      continue
                  for pattern in items:
                      match=re.search(pattern,plain,re.DOTALL)
                      if match:
                          result[field]=number(
                              match.group(1),
                              50.0 if field=="daily" else 500.0
                          )
                          break
              return result
          async def fetch_url(
              session:aiohttp.ClientSession,
              url:str,
              expected_name:list[str]
          )->dict:
              result=dict(EMPTY)
              try:
                  async with session.get(
                      url,
                      headers=HEADERS,
                      timeout=HTTP_TIMEOUT,
                      allow_redirects=True
                  ) as response:
                      if response.status!=200:
                          return result
                      body=await response.text(errors="ignore")
                      content_type=response.headers.get("content-type","").lower()
                      if "json" in content_type or body.lstrip().startswith(("{","[")):
                          try:
                              payload=json.loads(body)
                          except Exception:
                              return result
                          found_name=find_name(payload)
                          if found_name and not matches_name(found_name,expected_name):
                              return result
                          result=walk(payload)
                      else:
                          soup=BeautifulSoup(body,"html.parser")
                          title=text(soup.title.get_text(" ",strip=True) if soup.title else "")
                          heading=soup.find("h1")
                          page_name=text(heading.get_text(" ",strip=True) if heading else title)
                          if page_name and not matches_name(page_name,expected_name):
                              return result
                          result=parse_html(body)
                      if valid(result):
                          result["source"]=url
                      return result
              except Exception:
                  return result
          async def fetch_fund(
              session:aiohttp.ClientSession,
              fund_id:str,
              expected_name:list[str]
          )->dict:
              result=dict(EMPTY)
              tasks=[
                  fetch_url(session,url.format(id=fund_id),expected_name)
                  for url in API_URLS
              ]
              responses=await asyncio.gather(*tasks,return_exceptions=True)
              for response in responses:
                  if isinstance(response,dict):
                      merge(result,response)
                      if complete(result):
                          break
              return result
          async def fetch_all_israeli_funds(config:dict)->dict:
              cache=load_cache()
              timeout=aiohttp.ClientTimeout(total=40)
              connector=aiohttp.TCPConnector(limit=20,ttl_dns_cache=300)
              async with aiohttp.ClientSession(
                  timeout=timeout,
                  connector=connector
              ) as session:
                  keys=list(config)
                  tasks=[
                      fetch_fund(
                          session,
                          config[item]["fund_id"],
                          config[item]["expected_name"]
                      )
                      for item in keys
                  ]
                  fetched=await asyncio.gather(*tasks)
              results={}
              for sector,current in zip(keys,fetched):
                  cached=cache.get(sector,{})
                  if valid(current):
                      results[sector]={
                          "daily":current.get("daily"),
                          "mtd":current.get("mtd"),
                          "ytd":current.get("ytd"),
                          "source":current.get("source"),
                          "stale":False
                      }
                  elif valid(cached):
                      results[sector]={
                          "daily":cached.get("daily"),
                          "mtd":cached.get("mtd"),
                          "ytd":cached.get("ytd"),
                          "source":cached.get("source","cache"),
                          "stale":True
                      }
                  else:
                      results[sector]=dict(EMPTY)
              save_cache(results)
              return results
          async def fetch_single_ticker(
              session:aiohttp.ClientSession,
              ticker:str
          )->tuple:
              api_ticker=f"^{ticker}" if ticker=="OVX" else ticker
              url=f"https://query1.finance.yahoo.com/v8/finance/chart/{api_ticker}?range=1d&interval=5m"
              try:
                  async with session.get(
                      url,
                      headers=HEADERS,
                      timeout=HTTP_TIMEOUT
                  ) as response:
                      if response.status==200:
                          payload=await response.json(content_type=None)
                          rows=payload.get("chart",{}).get("result",[])
                          if rows:
                              meta=rows[0].get("meta",{})
                              price=meta.get("regularMarketPrice")
                              previous=meta.get("chartPreviousClose")
                              if price is not None and previous:
                                  change=(price-previous)/previous*100
                                  return ticker,{
                                      "price":round(price,2),
                                      "change":round(change,2)
                                  }
              except Exception:
                  pass
              return ticker,{"price":0.0,"change":0.0}
          async def fetch_all_yahoo_data(tickers:list[str])->dict:
              async with aiohttp.ClientSession() as session:
                  rows=await asyncio.gather(
                      *[
                          fetch_single_ticker(session,ticker)
                          for ticker in tickers
                      ]
                  )
              return dict(rows)
          EOF
                    cat << 'EOF' > modules/news.py
          import html,urllib.parse
          import aiohttp
          import yfinance as yf
          from modules.config import HEADERS,HTTP_TIMEOUT
          async def translate_to_russian(
              session:aiohttp.ClientSession,
              value:str
          )->str:
              if not value:
                  return value
              try:
                  url=(
                      "https://translate.googleapis.com/translate_a/single"
                      f"?client=gtx&sl=auto&tl=ru&dt=t&q={urllib.parse.quote(value)}"
                  )
                  async with session.get(url,timeout=6) as response:
                      if response.status==200:
                          payload=await response.json(content_type=None)
                          translated="".join(
                              part[0]
                              for part in payload[0]
                              if part and part[0]
                          )
                          return html.unescape(translated)
              except Exception:
                  pass
              return value
          async def fetch_sector_news(
              session:aiohttp.ClientSession,
              ticker:str
          )->list[str]:
              url=f"https://query1.finance.yahoo.com/v1/finance/search?q={ticker}"
              try:
                  async with session.get(
                      url,
                      headers=HEADERS,
                      timeout=HTTP_TIMEOUT
                  ) as response:
                      if response.status==200:
                          payload=await response.json(content_type=None)
                          for item in payload.get("news",[]):
                              title=item.get("title","")
                              if len(title)>15:
                                  return [
                                      f"• {await translate_to_russian(session,title)}"
                                  ]
              except Exception:
                  pass
              return ["• Значимых новостей не найдено."]
          def get_ipo_card(
              symbol:str,
              name:str,
              ipo_date:str,
              fallback_price:str
          )->str:
              try:
                  info=yf.Ticker(symbol).info
                  price=(
                      info.get("currentPrice")
                      or info.get("regularMarketPrice")
                      or info.get("open")
                  )
                  target=info.get("targetMeanPrice")
                  recommendation=str(
                      info.get("recommendationKey","N/A")
                  ).replace("_"," ").upper()
                  recommendation_map={
                      "STRONG BUY":"🔥 Strong Buy",
                      "BUY":"🟢 Buy",
                      "HOLD":"🟡 Hold",
                      "UNDERPERFORM":"🟠 Underperform",
                      "SELL":"🔴 Sell",
                      "N/A":"⚪ Нет оценки"
                  }
                  return (
                      f"📌 <b>{name}</b> (<code>{symbol}</code>)\n"
                      f"🗓 <b>Дата IPO:</b> {ipo_date}\n"
                      f"💵 <b>Цена:</b> "
                      f"{f'${price:.2f}' if price else fallback_price}\n"
                      f"🎯 <b>Цель аналитиков:</b> "
                      f"{f'${target:.2f}' if target else 'Н/Д'}\n"
                      f"🧠 <b>Консенсус:</b> "
                      f"{recommendation_map.get(recommendation,recommendation)}\n"
                  )
              except Exception:
                  return (
                      f"📌 <b>{name}</b> (<code>{symbol}</code>)\n"
                      f"🗓 <b>Дата IPO:</b> {ipo_date}\n"
                      f"💵 <b>Цена:</b> {fallback_price}\n"
                      f"🧠 <b>Консенсус:</b> ⚪ Нет данных\n"
                  )
          def fetch_ipo_full_analytics()->list[str]:
              targets=[
                  ("ARM","Arm Holdings","14.09.2023","$51.00"),
                  ("RDDT","Reddit Inc.","21.03.2024","$34.00"),
                  ("KVUE","Kenvue Inc.","04.05.2023","$22.00"),
                  ("IPO","Renaissance IPO ETF","ETF","Рыночная")
              ]
              return [
                  get_ipo_card(symbol,name,date,price)
                  for symbol,name,date,price in targets
              ]
          EOF
          cat << 'EOF' > modules/formatter.py
          from datetime import datetime,timedelta,timezone
          from modules.config import BOT_NAME
          def escape_html(value:str)->str:
              return (
                  str(value)
                  .replace("&","&amp;")
                  .replace("<","&lt;")
                  .replace(">","&gt;")
              )
          def format_percent(value,stale:bool=False)->str:
              if value is None:
                  return "Н/Д"
              result=f"{value:+.2f}%" if value>0 else f"{value:.2f}%"
              return f"{result}*" if stale else result
          def build_telegram_message(sectors:list[dict])->str:
              now=datetime.now(
                  timezone(timedelta(hours=3))
              ).strftime("%d.%m.%Y | %H:%M")
              lines=[
                  "📈 <b>Рыночный дайджест</b>",
                  f"📅 {now} (IDT) 🇮🇱\n",
                  "<b>📊 СЕКТОРЫ США И ФОНДЫ ИЗРАИЛЯ</b>",
                  "<code>Сектор       US      IL   Рейтинг</code>",
                  "<code>"
              ]
              for sector in sectors:
                  us=sector["avg_change"]
                  fund=sector["il_fund_data"]
                  daily=fund.get("daily")
                  us_value=f"{us:+.1f}%" if us>0 else f"{us:.1f}%"
                  il_value="Н/Д" if daily is None else (
                      f"{daily:+.1f}%" if daily>0 else f"{daily:.1f}%"
                  )
                  score=sector["score"]
                  score_icon="🟢" if score>=65 else (
                      "🟡" if score>=40 else "🔴"
                  )
                  lines.append(
                      f"{sector['icon']}{sector['short_eng'][:6]:<6} "
                      f"{us_value:>6} {il_value:>6} "
                      f"{score_icon}{score:>3}/100"
                  )
              lines.append("</code>\n")
              lines.append("<blockquote expandable>")
              lines.append(
                  "🔍 <b>ДРАЙВЕРЫ ДВИЖЕНИЯ И НОВОСТИ</b>\n"
              )
              for sector in sectors:
                  change=sector["avg_change"]
                  change_value=(
                      f"+{change:.2f}%"
                      if change>0
                      else f"{change:.2f}%"
                  )
                  lines.append(
                      f"<b>{sector['icon']} "
                      f"{escape_html(sector['name'])}</b> "
                      f"({change_value})"
                  )
                  drivers=sector.get("top_3_tickers",[])
                  if drivers:
                      text=", ".join(
                          f"{ticker}: {value:+.2f}%"
                          for ticker,value in drivers
                      )
                      lines.append(
                          f"📊 <i>{escape_html(text)}</i>"
                      )
                  for news in sector.get("news",[]):
                      lines.append(escape_html(news))
                  lines.append("")
              lines.append("</blockquote>\n")
              lines.append("<blockquote expandable>")
              lines.append(
                  "🇮🇱 <b>ДОХОДНОСТЬ ИЗРАИЛЬСКИХ ФОНДОВ "
                  "(תשואות)</b>\n"
              )
              sorted_funds=sorted(
                  sectors,
                  key=lambda item:(
                      item["il_fund_data"].get("daily")
                      is not None,
                      item["il_fund_data"].get("daily")
                      if item["il_fund_data"].get("daily") is not None
                      else -9999
                  ),
                  reverse=True
              )
              stale_exists=False
              for sector in sorted_funds:
                  fund=sector["il_fund_data"]
                  daily=fund.get("daily")
                  stale=bool(fund.get("stale"))
                  stale_exists=stale_exists or stale
                  icon=(
                      "⚪"
                      if daily is None
                      else "🟢"
                      if daily>0
                      else "🔴"
                      if daily<0
                      else "⚪"
                  )
                  lines.append(
                      f"{icon} <b>{escape_html(sector['il_name_eng'])}</b> "
                      f"({sector['icon']})"
                  )
                  lines.append(
                      f"└ <code>{sector['fund_id']}</code> · "
                      f"День: <b>{format_percent(daily,stale)}</b> | "
                      f"Месяц: <b>{format_percent(fund.get('mtd'),stale)}</b> | "
                      f"Год: <b>{format_percent(fund.get('ytd'),stale)}</b>"
                  )
              if stale_exists:
                  lines.append(
                      "\n<i>* Использовано последнее успешное "
                      "значение из кэша.</i>"
                  )
              lines.append("</blockquote>")
              lines.append(f"\n{BOT_NAME}")
              return "\n".join(lines)
          def build_ipo_message(cards:list[str])->str:
              date=datetime.now(
                  timezone(timedelta(hours=3))
              ).strftime("%d.%m.%Y")
              lines=[
                  "🔔 <b>ЕЖЕНЕДЕЛЬНЫЙ IPO-ДАЙДЖЕСТ</b>",
                  f"📅 {date} 🇮🇱\n",
                  "<blockquote expandable>"
              ]
              lines.extend(cards)
              lines.append("</blockquote>")
              lines.append(f"\n{BOT_NAME}")
              return "\n".join(lines)
          EOF
          cat << 'EOF' > modules/telegram_sender.py
          import aiohttp
          from modules.config import BOT_TOKEN,CHAT_ID,HTTP_TIMEOUT
          def split_message(
              text:str,
              limit:int=3900
          )->list[str]:
              if len(text)<=limit:
                  return [text]
              chunks=[]
              current=[]
              length=0
              for line in text.splitlines():
                  line_length=len(line)+1
                  if current and length+line_length>limit:
                      chunks.append("\n".join(current))
                      current=[]
                      length=0
                  current.append(line)
                  length+=line_length
              if current:
                  chunks.append("\n".join(current))
              return chunks
          async def send_to_telegram(text:str)->None:
              if not BOT_TOKEN or not CHAT_ID:
                  raise RuntimeError(
                      "BOT_TOKEN или CHAT_ID не настроены"
                  )
              url=(
                  f"https://api.telegram.org/bot"
                  f"{BOT_TOKEN}/sendMessage"
              )
              async with aiohttp.ClientSession() as session:
                  for index,chunk in enumerate(
                      split_message(text),
                      start=1
                  ):
                      payload={
                          "chat_id":CHAT_ID,
                          "text":chunk,
                          "parse_mode":"HTML",
                          "disable_web_page_preview":True
                      }
                      async with session.post(
                          url,
                          json=payload,
                          timeout=HTTP_TIMEOUT
                      ) as response:
                          body=await response.text()
                          if response.status!=200:
                              raise RuntimeError(
                                  f"Telegram {response.status}: {body}"
                              )
                          print(f"Отправлено: {index}")
          EOF
          cat << 'EOF' > main.py
          import asyncio
          from datetime import datetime,timedelta,timezone
          import aiohttp
          from modules.config import SECTORS_CONFIG
          from modules.formatter import (
              build_ipo_message,
              build_telegram_message
          )
          from modules.market import (
              fetch_all_israeli_funds,
              fetch_all_yahoo_data
          )
          from modules.news import (
              fetch_ipo_full_analytics,
              fetch_sector_news
          )
          from modules.telegram_sender import send_to_telegram
          def calculate_sector_score(change:float)->int:
              return max(
                  0,
                  min(100,int(round(50+change*15)))
              )
          async def run_market_analytics()->None:
              tickers=sorted({
                  ticker
                  for config in SECTORS_CONFIG.values()
                  for ticker in config["tickers"]
              })
              market_task=asyncio.create_task(
                  fetch_all_yahoo_data(tickers)
              )
              funds_task=asyncio.create_task(
                  fetch_all_israeli_funds(SECTORS_CONFIG)
              )
              market_data,fund_data=await asyncio.gather(
                  market_task,
                  funds_task
              )
              results=[]
              async with aiohttp.ClientSession() as session:
                  news_tasks={
                      key:asyncio.create_task(
                          fetch_sector_news(
                              session,
                              config["news_ticker"]
                          )
                      )
                      for key,config in SECTORS_CONFIG.items()
                  }
                  for key,config in SECTORS_CONFIG.items():
                      ticker_rows=[
                          (
                              ticker,
                              market_data.get(
                                  ticker,
                                  {}
                              ).get("change",0.0)
                          )
                          for ticker in config["tickers"]
                          if market_data.get(
                              ticker,
                              {}
                          ).get("price",0)>0
                      ]
                      changes=[
                          change
                          for _,change in ticker_rows
                      ]
                      average=(
                          sum(changes)/len(changes)
                          if changes
                          else 0.0
                      )
                      top_3=sorted(
                          ticker_rows,
                          key=lambda item:abs(item[1]),
                          reverse=True
                      )[:3]
                      results.append({
                          "short_eng":config["short_eng"],
                          "name":config["name"],
                          "icon":config["icon"],
                          "fund_id":config["fund_id"],
                          "il_name_eng":config["il_name_eng"],
                          "avg_change":round(average,2),
                          "top_3_tickers":top_3,
                          "score":calculate_sector_score(
                              average
                          ),
                          "news":await news_tasks[key],
                          "il_fund_data":fund_data.get(
                              key,
                              {
                                  "daily":None,
                                  "mtd":None,
                                  "ytd":None,
                                  "source":None,
                                  "stale":False
                              }
                          )
                      })
              results.sort(
                  key=lambda item:item["avg_change"],
                  reverse=True
              )
              await send_to_telegram(
                  build_telegram_message(results)
              )
          async def run_ipo_digest()->None:
              cards=await asyncio.to_thread(
                  fetch_ipo_full_analytics
              )
              await send_to_telegram(
                  build_ipo_message(cards)
              )
          async def main()->None:
              now=datetime.now(
                  timezone(timedelta(hours=3))
              )
              if now.weekday()==5 and now.hour==22:
                  await run_ipo_digest()
              else:
                  await run_market_analytics()
          if __name__=="__main__":
              asyncio.run(main())
          EOF
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate
        run: |
          python -m py_compile \
            main.py \
            modules/config.py \
            modules/market.py \
            modules/news.py \
            modules/formatter.py \
            modules/telegram_sender.py
      - name: Run
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
