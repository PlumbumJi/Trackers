        \        cache = {'schema':1,'events':{}}\n        with patch.object(movers, 'datetime', Clock), \\\n             patch.object(movers.aiohttp, 'ClientSession',return_value=manager), \\\n             patch.object(movers,'fetch_portfolio_fund',new=fetch), \\\n             patch.object(movers,'screen_monthly',new=AsyncMock(return_value=screened)), \\\n             patch.object(movers,'load_state',return_value=cache), \\\n             patch.object(movers,'fund_context',new=AsyncMock(return_value=None)):\n            state, selected = await movers.prepare_movers()\n            self.assertEqual(len(selected),1)\n            self.assertEqual(state['last_scan']['status'],'ok')\n            key, event, _ = selected[0]\n            cache['events'][key] = dict(event,sent_at='done',detected_on=today.isoformat())\n            state, selected = await movers.prepare_movers()\n            self.assertEqual(selected,[])\n\n    async def test_no_empty_message_and_no_mark_sent_before_delivery(self):\n\
