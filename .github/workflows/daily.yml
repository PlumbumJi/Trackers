            """Optional one-line confirmation embedded in the chart album."""
            if chart_count == 0:
                return ""
            confirmed = sum(_radar_verdict(row)[0] == "✅▲" for row in rank_radar_rows(rows))
            return f"✅▲ Вход по модели подтверждён: {confirmed}." if confirmed else ""
