        def article_item(body, url):
            """Read only the article body, not sidebar fund links or recommendations."""
            root = _FundHTML(body).root
            meta = {n.attrs.get('property'):n.attrs.get('content','') for n in root.walk('meta')}
            content_id = 'div_article_body' if urlparse(url).hostname == 'www.bizportal.co.il' else 'articleDesc'
            content = next((n for n in root.walk() if n.attrs.get('id') == content_id), None)
            try:
                published = datetime.fromisoformat(meta.get('article:published_time','').replace('Z','+00:00'))
            except ValueError:
                return None
            if not meta.get('og:title') or content is None or published.tzinfo is None:
                return None
            item = ET.Element('item')
            for key, value in {'title':meta['og:title'], 'description':content.text(),
                               'pubDate':format_datetime(published),'link':url}.items():
                ET.SubElement(item,key).text = value
            return item
        
        
        async def prepare_focus(session, mentions, data, screened, now, validate, verify=None):
            items = []
            for row in mentions['items'][:3]:
                history, quote = data.get(row['fund_id'], ([], {}))
                screen = screened.get(row['fund_id'])
                analysis = validate(screen, history, quote, now.date()) if screen else None
                baseline = None
                if verify:
                    try:
                        points = verify(history,quote,float(quote['daily']),now.date())
                        if points:
                            baseline = {'price':points[-1][1],'date':points[-1][0].isoformat()}
                    except (ValueError,TypeError,KeyError):
                        pass
                news = dict(row['news'])
                reason = news['title'] if news['headline_match'] else news['evidence']
                source_text = canonical(reason)
                manager_change = ('מנהל' in source_text and re.search(r'יחליף|תחליף|מחליף|מחליפה',source_text))
                if source_text.startswith('קרן נאמנות במוקד'):
                    translated = 'Обзор инвестиционной стратегии фонда.'
                elif manager_change:
                    translated = 'Смена управляющего инвестициями фонда.'
                else:
                    translated = await translate_to_russian(session, reason)
                # Never replace source content with a translation failure placeholder.
                news['display_title'] = translated if translated else reason
                operational = any(word in source_text for word in ('מפרקת', 'פירוק', 'מיזוג', 'משבש', 'פדיון', 'תשיק'))
                watch = ('Следить за изменениями стратегии.' if manager_change else
                         'Проверить условия и сроки у управляющего.' if operational else
                         analysis['conclusion'] if analysis else 'Ждать сверки свежих цен фонда.')
                items.append({'fund_id': row['fund_id'], 'name': row['name'], 'news': news,
                              'analysis': analysis, 'baseline':baseline, 'watch': watch})
            return {'status': mentions['status'], 'items': items}
        
        
