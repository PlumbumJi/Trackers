        \ is_access_challenge, parse_optional_float\nfrom modules.portfolio import fetch_portfolio_fund\n\nBIZ_LIST = 'https://www.bizportal.co.il/mutualfunds'\nMAYA = 'https://maya.tase.co.il/api/v1/funds'\nHISTORY_LIMIT = 120\n\n\ndef fund_id(value):\n    value = str(value or '').lstrip('0')\n    return value if re.fullmatch(r'5\\d{6}', value) else None\n\n\ndef source_date(value):\n    for fmt in ('%Y-%m-%d', '%d.%m.%Y', '%d/%m/%Y'):\n        try:\n            return datetime.strptime(str(value)[:10], fmt).date().isoformat()\n        except ValueError:\n            pass\n    return None\n\n\ndef parse_biz_catalog(body):\n    rows = json.loads(body)\n    if not isinstance(rows, list):\n        return []\n    result = {}\n    for row in rows:\n        if not isinstance(row, dict):\n            continue\n        fid = fund_id(row.get('a'))\n        # ETF exchange quotes and redemption NAV are different instruments.\n        if not fid or row.get('n') != '@^~' + fid:\n            continue\n\
        \        price = parse_optional_float(row.get('d'))\n        daily = parse_optional_float(row.get('f'))\n        if not row.get('b') or price is None or price <= 0:\n            continue\n        item = {'fund_id': fid, 'name': _clean_text(row['b']), 'daily': daily,\n                'price': price, 'date': None, 'mtd': parse_optional_float(row.get('g')),\n                'source': 'Bizportal'}\n        if fid in result and result[fid] != item:\n            raise ValueError('conflicting Bizportal identities')\n        result[fid] = item\n    return list(result.values())\n\n\ndef parse_maya_catalog(body, today):\n    reader = csv.DictReader(io.StringIO(body.lstrip('\\ufeff')))\n    required = {\"מס' קרן\", 'שם הקרן', 'מחיר פדיון', 'תאריך נכונות', 'שינוי יומי %'}\n    if not required <= set(reader.fieldnames or []):\n        return []\n    result = {}\n    for row in reader:\n        fid, day = fund_id(row.get(\"מס' קרן\")), source_date(row.get('תאריך נכונות'))\n        price = parse_optional_float(row.get('מחיר\
        \ פדיון'))\n        if not fid or not row['שם הקרן'] or not day or day > today.isoformat() or price is None or price <= 0:\n            continue\n        item = {'fund_id': fid, 'name': _clean_text(row['שם הקרן']), 'price': price,\n                'date': day, 'daily': parse_optional_float(row.get('שינוי יומי %')),\n                'mtd': parse_optional_float(row.get('תשואות מתחילת החודש')), 'source': 'MAYA'}\n        if fid in result and result[fid] != item:\n            raise ValueError('conflicting MAYA identities')\n        result[fid] = item\n    return list(result.values())\n\n\ndef parse_maya_history(body, fid, today):\n    reader = csv.DictReader(io.StringIO(body.lstrip('\\ufeff')))\n    if not {\"מס' קרן\", 'תאריך', 'מחיר פדיון'} <= set(reader.fieldnames or []):\n        return []\n    points = {}\n    for row in reader:\n        if fund_id(row.get(\"מס' קרן\")) != fid:\n            return []\n        day, price = source_date(row.get('תאריך')), parse_optional_float(row.get('מחיר\
        \ פדיון'))\n        if not day or day > today.isoformat() or price is None or price <= 0:\n            continue\n        if day in points and points[day] != price:\n            return []\n        points[day] = price\n    return [{'date': d, 'price': p} for d, p in sorted(points.items())]\n\n\nclass PublicFundSources:\n    def __init__(self, session, state, today):\n        self.session, self.state, self.today = session, state, today\n        self.blocked, self.catalog, self.data = set(), {}, {}\n        self.limiters = {s: asyncio.Semaphore(2) for s in ('Bizportal', 'MAYA')}\n        self.biz_denied = asyncio.Event()\n        self.source_names = []\n\n    async def text(self, source, url, payload=None):\n        async with self.limiters[source]:\n            if source in self.blocked:\n                return ''\n            try:\n                options = {'timeout': aiohttp.ClientTimeout(total=20)}\n                if source == 'MAYA':\n                    options['headers'] = {'Accept-Language':\
        \ 'he-IL'}\n                request = (self.session.post(url, json=payload, **options) if payload is not None\n                           else self.session.get(url, **options))\n                async with request as response:\n                    body = await response.text(errors='ignore')\n                    if response.status in {401, 403, 429} or is_access_challenge(body):\n                        self.blocked.add(source)\n                        if source == 'Bizportal':\n                            self.biz_denied.set()\n                        print(f'::warning::{source}: access restricted; no further requests this run')\n                        return ''\n                    if response.status != 200:\n                        return ''\n                return body\n            except (aiohttp.ClientError, asyncio.TimeoutError):\n                return ''\n\n    async def biz_catalog(self):\n        body = await self.text('Bizportal', BIZ_LIST)\n        # Discover the live\
        \ JSON filename from the page; it changes over time.\n        match = re.search(r'https://www\\.bizportal\\.co\\.il/json/mutualfunds/[\\w-]+\\.json', body)\n        if not match:\n            return []\n        data = await self.text('Bizportal', match[0])\n        try:\n            return parse_biz_catalog(data)\n        except (ValueError, TypeError):\n            return []\n\n    async def maya_catalog(self):\n        body = await self.text('MAYA', MAYA + '/mutual/file', {})\n        try:\n            return parse_maya_catalog(body, self.today)\n        except (ValueError, TypeError, csv.Error):\n            return []\n\n    async def listing(self):\n        biz, maya = await asyncio.gather(self.biz_catalog(), self.maya_catalog())\n        found = {}\n        for source, rows in (('Bizportal', biz), ('MAYA', maya)):\n            if len(rows) < 100:\n                continue\n            self.source_names.append(source)\n            for row in rows:\n                previous =\
        \ found.get(row['fund_id'])\n                # Prefer the official dated NAV. Disagreement is kept and checked later.\n                if previous:\n                    row = dict(row, other_quote=previous)\n                found[row['fund_id']] = row\n        self.catalog = found\n        if found:\n            self.state['source_catalog'] = {'at': self.today.isoformat(),\n                'rows': [{'fund_id': r['fund_id'], 'name': r['name']} for r in found.values()]}\n            return list(found.values())\n        cached = self.state.get('source_catalog') or {}\n        try:\n            age = (self.today - date.fromisoformat(cached['at'])).days\n            if 0 <= age <= 7:\n                self.catalog = {r['fund_id']: dict(r, daily=None, source='cache') for r in cached['rows']\n                                if fund_id(r.get('fund_id')) and r.get('name')}\n        except (KeyError, ValueError, TypeError):\n            pass\n        return list(self.catalog.values())\n\n \
        \   def cached(self, row):\n        cached = self.state.get('source_history') or {}\n        record = cached.get(row['fund_id']) or {}\n        history = record.get('points', []) if record.get('source') == row.get('source') else []\n        cutoff = (self.today - timedelta(days=90)).isoformat()\n        history = [p for p in history if isinstance(p, dict) and cutoff <= str(p.get('date', '')) <= self.today.isoformat()]\n        if row.get('date') and row.get('price') and row.get('daily') is not None:\n            price = parse_optional_float(row['price'])\n            # A revised publication invalidates the old series until it is refetched.\n            if any(p['date'] == row['date'] and parse_optional_float(p.get('price')) != price for p in history):\n                history = []\n            history = [p for p in history if p['date'] != row['date']]\n            if price is not None and price > 0:\n                history.append({'date': row['date'], 'price': price})\n        return\
        \ sorted(history, key=lambda p: p['date'])\n\n    def remember(self, fid, history, source):\n        if history:\n            cutoff = (self.today - timedelta(days=90)).isoformat()\n            self.state.setdefault('source_history', {})[fid] = {'source': source,\n                'points': [p for p in history if p['date'] >= cutoff][-100:]}\n\n    async def series(self, fid):\n        if fid in self.data:\n            return self.data[fid]\n        row = self.catalog.get(fid, {})\n        body = await self.text('MAYA', f'{MAYA}/mutual/{fid}/history/file', {\n            'period': 4, 'fromDate': (self.today - timedelta(days=70)).isoformat(),\n            'toDate': self.today.isoformat(), 'pageSize': 30, 'pageNumber': 1})\n        try:\n            history = parse_maya_history(body, fid, self.today) if body else []\n        except (csv.Error, ValueError, TypeError):\n            history = []\n        quote = row if row.get('source') == 'MAYA' else {}\n        if history and not quote:\n\
        \            # Detail endpoint supplies an independent dated quote; daily return is\n            # still required from the fresh listing or a second source.\n            raw = await self.text('MAYA', f'{MAYA}/mutual/{fid}')\n            try:\n                detail = json.loads(raw)\n                if fund_id(detail['fundId']) == fid and row.get('daily') is not None:\n                    quote = {'price': detail['redemptionPrice'], 'date': source_date(detail['ratesAsOf']),\n                             'daily': row['daily'], 'source': 'MAYA'}\n            except (KeyError, TypeError, ValueError):\n                pass\n        if not history or not quote:\n            async with self.limiters['Bizportal']:\n                history, quote = await fetch_portfolio_fund(self.session, fid, asyncio.Semaphore(1),\n                                                            self.biz_denied, history_pages=5)\n            quote = dict(quote, source='Bizportal') if quote else {}\n        if\
        \ history and quote:\n            self.remember(fid, history, quote.get('source'))\n        self.data[fid] = history, quote\n        return history, quote\n\n    async def screen(self, listing, window_fn, verify_fn):\n        screened, pending = {}, []\n\n        def evaluate(row, history, quote):\n            daily = row.get('daily')\n            if daily is None:\n                daily = quote.get('daily')\n            if daily is None:\n                return\n            points = verify_fn(history, quote, float(daily), self.today)\n            window = window_fn(points or [], self.today)\n            if window:\n                screened[row['fund_id']] = {**row, **window, 'daily': daily,\n                    'screen_low': window['monthly'], 'screen_high': window['monthly'],\n                    'source': quote.get('source', row.get('source'))}\n                self.data[row['fund_id']] = history, quote\n\n        for row in listing:\n            history = self.cached(row)\n \
        \           self.remember(row['fund_id'], history, row.get('source'))\n            evaluate(row, history, row)\n            if (row['fund_id'] not in screened and\n                    (not row.get('date') or (self.today - date.fromisoformat(row['date'])).days <= 7)):\n                pending.append(row)\n        # MTD only orders backfill work. It never substitutes for a rolling 30d return.\n        leaders = sorted(pending, key=lambda r: abs(r.get('mtd') or 0), reverse=True)[:HISTORY_LIMIT // 2]\n        leaders_ids = {r['fund_id'] for r in leaders}\n        remaining = sorted((r for r in pending if r['fund_id'] not in leaders_ids), key=lambda r: r['fund_id'])\n        cursor = int(self.state.get('history_cursor') or 0) % max(1, len(remaining))\n        rotated = remaining[cursor:] + remaining[:cursor]\n        jobs = leaders + rotated[:HISTORY_LIMIT - len(leaders)]\n        self.state['history_cursor'] = (cursor + HISTORY_LIMIT - len(leaders)) % max(1, len(remaining))\n       \
        \ queue = asyncio.Queue()\n        for row in jobs:\n            queue.put_nowait(row)\n        async def worker():\n            while not queue.empty():\n                row = queue.get_nowait()\n                try:\n                    history, quote = await self.series(row['fund_id'])\n                    evaluate(row, history, quote)\n                except (ValueError, TypeError, KeyError, aiohttp.ClientError, asyncio.TimeoutError) as error:\n                    print(f'::warning::History {row[\"fund_id\"]}: {type(error).__name__}; skipped')\n        try:\n            async with asyncio.timeout(220):\n                await asyncio.gather(worker(), worker())\n        except asyncio.TimeoutError:\n            print('::warning::History backfill budget reached; keeping verified partial results')\n        # Drop histories for funds removed from the current readable universe.\n        cache = self.state.get('source_history', {})\n        self.state['source_history'] = {fid: record\
        \ for fid, record in cache.items() if fid in self.catalog}\n        print(f'Fallback monthly history: {len(screened)}/{len(listing)}; sources={self.source_names}')\n        return screened\nEOF\n\ncat << 'EOF' > tests/test_fund_sources.py\nimport csv\nimport io\nimport json\nimport unittest\nfrom datetime import date, datetime\nfrom unittest.mock import AsyncMock, MagicMock, patch\n\nfrom modules import fund_sources as sources, fund_news, movers\nfrom test_movers import fixture\n\n\ndef csv_text(headers, rows):\n    stream = io.StringIO()\n    writer = csv.writer(stream)\n    writer.writerow(headers)\n    writer.writerows(rows)\n    return '\\ufeff' + stream.getvalue()\n\n\nclass SourceTests(unittest.IsolatedAsyncioTestCase):\n    def test_catalog_semantics_and_official_history_identity(self):\n        biz = sources.parse_biz_catalog(json.dumps([\n            {'a':'5101183','b':'Fund','n':'@^~5101183','d':112,'e':115,'f':1.82,'g':99},\n            {'a':'1146620','b':'ETF','n':'$^~1146620','d':112,'f':1,'g':10},\n\
