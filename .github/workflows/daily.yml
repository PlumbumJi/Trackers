        EOF
    - name: Install Python Dependencies
      run: |-
        set -euo pipefail
        pip install -r requirements.txt
    - name: Install Chromium Fallback
      if: steps.report.outputs.mode == 'market'
      run: playwright install --with-deps chromium
    - name: Validate Generated Python
      run: python -m compileall -q modules main.py
    - name: Run Regression Tests
      run: python -m unittest discover -s tests -v
    - name: Run Analytics Engine
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        RUN_MODE: ${{ steps.report.outputs.mode }}
        PYTHONUNBUFFERED: '1'
        MARKET_SNAPSHOT_FILE: latest_market_snapshot.json
      run: python main.py
    - name: Save Latest Market Snapshot
      if: success() && steps.report.outputs.mode == 'market' && hashFiles('latest_market_snapshot.json') != ''
      uses: actions/cache/save@v5
      with:
        path: latest_market_snapshot.json
        key: market-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
