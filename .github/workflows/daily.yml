        def relevant_event(title, keyword):
            lower = title.lower()
            if any(p in lower for p in (*LOW_VALUE_PHRASES, 'cramer', 'crypto', 'bitcoin',
                                       'token', 'recommends', 'versus', 'should you', 'buy now')):
                return False
            entity = re.search(r'(?<!\w)' + re.escape(keyword) + r'(?!\w)', title, re.I)
            event = re.search(r'\b(earnings|revenue|guidance|forecast|contract|acquisition|'
                              r'acquires|merger|dividend|buyback|launches|lawsuit|regulator|'
                              r'approval|approved|downgrade|upgrade)\b|דוחות|רווח|הכנסות|דיבידנד|רכישה', lower)
            return bool(entity and event)
        
        
        def holdings_from_page(html):
            root = _FundHTML(html).root
            result = []
            for table in root.walk('table'):
                if 'שם נייר' not in _clean_text(table.text()):
                    continue
                for row in table.walk('tr'):
                    cells = list(row.walk('td'))
                    if len(cells) < 2:
                        continue
                    name = _clean_text(cells[0].text())
                    try:
                        weight = float(_clean_text(cells[1].text()).replace('%', '').replace(',', ''))
                    except ValueError:
                        continue
                    if math.isfinite(weight) and weight > 0 and name in ISSUERS:
                        result.append((weight, ISSUERS[name], name))
            return [{'ticker': t, 'name': n, 'weight': w} for w, t, n in sorted(set(result), reverse=True)[:4]]
        
        
        def assess(history, now, current_price=None, current_date=None, external=None):
            missing = {'status': 'missing', 'line': '⬜• Ждать данных · истории недостаточно'}
            points = {}
            for row in history:
                try:
                    day, price = date.fromisoformat(row['date']), float(row['price'])
                    if day <= now.date() and price > 0 and math.isfinite(price):
                        points[day] = price
                except (ValueError, TypeError, KeyError):
                    continue
            points = sorted(points.items())
            if len(points) < 15:
                return missing
            last_day, price = points[-1]
            if current_date is None or (current_price is not None and abs(price - float(current_price)) > .001):
                return dict(missing, line='⬜• Ждать данных · цена и история не согласованы')
            window = [(d, p) for d, p in points if d >= last_day - timedelta(days=89)]
            closes = [p for _, p in window]
            avg30 = statistics.mean(p for d, p in window if d >= last_day - timedelta(days=29))
            span = (window[-1][0] - window[0][0]).days + 1
            missing['stats'] = (f'От макс. {span}д {(price / max(closes) - 1) * 100:+.1f}% · '
                                f'к средней 30д {(price / avg30 - 1) * 100:+.1f}%')
            if str(last_day) != current_date or (now.date() - last_day).days > MAX_SIGNAL_AGE_DAYS:
                return dict(missing, line=f'⬜• Ждать обновления · история от {last_day:%d.%m}')
            if len(points) < 50 or (points[-1][0] - points[0][0]).days < 59:
                return missing
            ema = points[0][1]
            emas = []
            for _, p in points:
                ema += (p - ema) * 2 / 51
                emas.append(ema)
            drawdown = (price / max(closes) - 1) * 100
            discount = (price / avg30 - 1) * 100
            returns = [closes[i] / closes[i - 1] - 1 for i in range(1, len(closes))]
            volatility = statistics.stdev(returns)
            change20 = (price / points[-21][1] - 1) * 100
            uptrend = price > ema and emas[-1] > emas[-6]
            downtrend = price < ema and emas[-1] < emas[-6] and change20 <= -5
            two_rises = price > points[-2][1] > points[-3][1]
            ema50 = emas[-1]
            cancel_price = min(p for _, p in points[-20:]) * .99
            risk_pct = max(0.0, (price - cancel_price) / price * 100)
            support = external or {}
            base_ok = support.get('confirmed', False)
            if downtrend and drawdown <= -10:
                status, line = 'reduce', '🔻▼ Рассмотреть сокращение · устойчивое снижение'
            elif not uptrend and price <= points[-2][1]:
                status, line = 'wait', '⚠️→ Не докупать · ждать разворота и роста активов'
            elif (uptrend and discount <= -3 and drawdown <= -3 and two_rises and base_ok
                  and 2 <= risk_pct <= 12):
                status, line = 'add', '✅▲ Рассмотреть докупку · откат и восстановление подтверждены'
            elif uptrend:
                status, line = 'hold', '🟩▲ Держать · восходящий тренд, докупка не подтверждена'
            else:
                status, line = 'watch', '⚠️→ Наблюдать · ждать устойчивого роста фонда'
            days = (window[-1][0] - window[0][0]).days + 1
            return {'status': status, 'line': line, 'drawdown': drawdown, 'discount': discount,
                    'volatility': volatility, 'date': str(last_day), 'price': price,
                    'ema50': ema50, 'cancel_price': cancel_price, 'risk_pct': risk_pct,
                    'stats': f'От макс. {days}д {drawdown:+.1f}% · к средней 30д {discount:+.1f}%'}


        def trade_plan(fund_id, analysis, portfolio_value, position_value, risk):
            if analysis.get('status') == 'add':
                if risk.get('breached'):
                    return {'allowed': False, 'line': '⚠️ Покупка заблокирована · просадка портфеля достигла 10%'}
                if risk.get('concentrated') and risk.get('largest') == fund_id:
                    return {'allowed': False, 'line': '⚠️ Покупка заблокирована · позиция уже чрезмерно велика'}
                if risk.get('active_signal_risk', 0) >= MAX_TOTAL_ACTIVE_RISK:
                    return {'allowed': False, 'line': '⚠️ Покупка заблокирована · общий бюджет риска исчерпан'}
                risk_pct = float(analysis.get('risk_pct') or 0)
                if not 2 <= risk_pct <= 12:
                    return {'allowed': False, 'line': '⚠️ Покупка заблокирована · риск входа вне модели'}
                risk_budget = portfolio_value * RISK_PER_IDEA
                by_risk = risk_budget / (risk_pct / 100)
                room = max(0.0, portfolio_value * MAX_NEW_POSITION_WEIGHT - position_value)
                amount = min(by_risk, room)
                if amount < 100:
                    return {'allowed': False, 'line': '⚠️ Покупка заблокирована · лимит позиции исчерпан'}
                return {'allowed': True, 'amount': amount,
                        'line': f'План: до {amount:.0f} ₪ · отмена ниже {analysis["cancel_price"]:.2f}',
                        'cancel_price': analysis['cancel_price']}
            if analysis.get('status') == 'reduce':
                return {'allowed': True, 'line': f'План: не докупать · пересмотреть позицию на ближайшем доступном NAV'}
            return {'allowed': False, 'line': ''}


        def load_journal():
            try:
                journal = json.loads(JOURNAL_FILE.read_text(encoding='utf-8'))
                if not isinstance(journal, dict) or not isinstance(journal.get('signals'), list):
                    raise ValueError('invalid journal')
                return journal
            except (OSError, ValueError, TypeError, json.JSONDecodeError):
                return {'signals': []}


        def update_journal(journal, analyses, plans, current, now):
            signals = journal.setdefault('signals', [])
            today = now.date().isoformat()
            by_fund = {signal.get('fund_id'): signal for signal in signals
                       if signal.get('kind') == 'entry' and signal.get('state') == 'open'}
            for fund_id, signal in list(by_fund.items()):
                row = current.get(fund_id)
                if not row:
                    continue
                price = float(row['price'])
                entry = float(signal['entry_price'])
                change = (price / entry - 1) * 100
                signal['last_date'], signal['last_price'] = row.get('date') or today, price
                signal['best_pct'] = max(float(signal.get('best_pct', change)), change)
                signal['worst_pct'] = min(float(signal.get('worst_pct', change)), change)
                horizon = date.fromisoformat(signal['horizon_date'])
                reason = None
                if price <= float(signal['cancel_price']):
                    reason = 'отмена сценария'
                elif analyses.get(fund_id, {}).get('status') == 'reduce':
                    reason = 'тренд ухудшился'
                elif now.date() >= horizon:
                    reason = '6 месяцев'
                if reason:
                    signal.update(state='closed', close_date=today, close_price=price,
                                  return_pct=round(change, 2), close_reason=reason)
            for fund_id, analysis in analyses.items():
                plan = plans.get(fund_id, {})
                if analysis.get('status') == 'add' and plan.get('allowed') and fund_id not in by_fund:
                    signals.append({
                        'id': f'{today}:{fund_id}:entry', 'kind': 'entry', 'state': 'open',
                        'fund_id': fund_id, 'entry_date': today, 'entry_price': analysis['price'],
                        'suggested_amount': round(plan['amount'], 2),
                        'risk_budget_pct': RISK_PER_IDEA * 100,
                        'cancel_price': round(plan['cancel_price'], 2),
                        'horizon_date': (now.date() + timedelta(days=183)).isoformat(),
                        'best_pct': 0.0, 'worst_pct': 0.0,
                    })
                if analysis.get('status') == 'reduce':
                    signal_id = f'{today}:{fund_id}:reduce'
                    if not any(s.get('id') == signal_id for s in signals):
                        signals.append({'id': signal_id, 'kind': 'reduce', 'state': 'recorded',
                                        'fund_id': fund_id, 'date': today,
                                        'price': analysis.get('price')})
            journal['signals'] = signals[-500:]
            return journal


        def journal_summary(journal):
            entries = [s for s in journal.get('signals', []) if s.get('kind') == 'entry']
            active = sum(s.get('state') == 'open' for s in entries)
            closed = [s for s in entries if s.get('state') == 'closed' and s.get('return_pct') is not None]
            if not closed:
                return f'📒 Журнал: проверяются {active} · завершённых сигналов нет'
            wins = sum(float(s['return_pct']) > 0 for s in closed)
            average = statistics.mean(float(s['return_pct']) for s in closed)
            worst = min(float(s.get('worst_pct', 0)) for s in closed)
            return (f'📒 Журнал: {wins}/{len(closed)} прибыльных · сред. {average:+.1f}% · '
                    f'худшая просадка {worst:.1f}% · активных {active}')
        
        
        async def collect_context(session, quotes, now):
            drivers = {x['ticker']: x for q in quotes.values() for x in q.get('drivers', [])}
            limiter = asyncio.Semaphore(4)
            async def load(ticker):
                async with limiter:
                    return analyze_year_history(await fetch_ticker_history(session, ticker), ticker)
            histories = dict(zip(drivers, await asyncio.gather(*(load(t) for t in drivers))))
            contexts = {}
            for fid, quote in quotes.items():
                basket = [(d, histories.get(d['ticker'], {})) for d in quote.get('drivers', [])]
                basket = [(d, h) for d, h in basket if h.get('market_date') and
                          0 <= (now.date() - date.fromisoformat(h['market_date'])).days <= MAX_SIGNAL_AGE_DAYS]
                if not basket:
                    contexts[fid] = {}
                    continue
                day = max(h['market_date'] for _, h in basket)
                basket = [(d, h) for d, h in basket if h['market_date'] == day]
                positive = sum(h['change_1d'] > 0 and h['change_5d'] > 0 for _, h in basket)
                contexts[fid] = {'confirmed': len(basket) >= 2 and positive * 2 >= len(basket),
                                 'line': f'Активы: рост дня и 5 сессий {positive}/{len(basket)} · {day[8:10]}.{day[5:7]}'}
            # Direct company headlines only. News is context, never proof of causation.
            news = []
            async def headline(ticker):
                async with limiter:
                    return ticker, await fetch_yahoo_news(session, ticker)
            batches = await asyncio.gather(*(headline(t) for t in list(drivers)[:8]))
            for ticker, items in batches:
                name = drivers[ticker]['name']
                keyword = name.split()[0] if not ticker.endswith('.TA') else name
                for item in items:
                    title = normalize_title(item.get('title'))
                    try:
                        timestamp = int(item.get('providerPublishTime') or 0)
                    except (TypeError, ValueError):
                        continue
                    age = now.timestamp() - timestamp
                    if not 0 <= age <= 48 * 3600 or not item.get('link', '').startswith('https://'):
                        continue
                    if not relevant_event(title, keyword):
                        continue
                    news.append((timestamp, title, item['link']))
            unique = list(dict.fromkeys(sorted(news, reverse=True)))[:2]
            lines = []
            for timestamp, title, url in unique:
                translated = await translate_to_russian(session, title)
                text = shorten_title(translated or title, 120)
                lines.append(f'📰 <a href="{escape(url, quote=True)}">{escape(text)}</a> · '
                             f'{datetime.fromtimestamp(timestamp, now.tzinfo):%d.%m}')
            return contexts, lines
        
        
        def risk_summary(current, snapshots, now):
            if len(current) != 6:
                return {'line': '🛡 Риск: оценка неполная · порог 10%', 'breached': True}
            quantities = {fid: r['quantity'] for fid, r in current.items()}
            def total(rows):
                return sum(float(r['quantity']) * float(r['price']) / 100 for r in rows.values())
            value = total(current)
            comparable = []
            for day in sorted(snapshots, reverse=True):
                if day >= str(now.date()):
                    continue
                if date.fromisoformat(day) < now.date() - timedelta(days=183):
                    break
                rows = snapshots[day]
                if set(rows) != set(quantities):
                    continue  # A data outage must not reset the portfolio risk baseline.
                if {fid: r.get('quantity') for fid, r in rows.items()} != quantities:
                    break  # A changed position starts a new comparable tracking segment.
                comparable.append((day, total(rows)))
            peak = max([value] + [v for _, v in comparable])
            drawdown = (value / peak - 1) * 100
            fid = max(current, key=lambda f: total({f: current[f]}))
            weight = total({fid: current[fid]}) / value * 100
            line = f'🛡 {fid}: {weight:.1f}% портфеля'
            if comparable:
                line += f' · от пика снимков {drawdown:.1f}% / порог −10%'
            else:
                line += ' · контроль просадки начат (порог 10%)'
            breached = drawdown <= -MAX_DRAWDOWN
            if breached:
                line += '\n🔻 Порог риска достигнут: пересмотреть позиции; докупки отложить.'
            return {'line': line, 'breached': breached, 'largest': fid,
                    'largest_value': total({fid: current[fid]}),
                    'concentrated': weight > CONCENTRATION_LIMIT}
        
        
