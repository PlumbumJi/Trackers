          cat << 'EOF' > modules/market.py
          import asyncio
          import math
          import re
          from datetime import datetime, timedelta, timezone
          from typing import Any, Optional

          import aiohttp
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright

          from modules.config import HEADERS, HTTP_TIMEOUT

          RETURN_KEYS = ("daily", "mtd", "ytd", "weekly", "days30")
          FUND_META_KEYS = ("price", "high52", "low52", "volatility", "update_date", "source_name")
          EMPTY_RETURNS = {key: None for key in RETURN_KEYS + FUND_META_KEYS}


          def parse_optional_float(value: Any) -> Optional[float]:
              if value is None or isinstance(value, bool):
                  return None
              if isinstance(value, (int, float)):
                  number = float(value)
                  return round(number, 2) if math.isfinite(number) else None
              text = str(value).strip()
              if not text or text.lower() in {"none", "null", "nan", "-", "—", "n/a"}:
                  return None
              text = text.replace("\u00a0", " ").replace(",", ".").replace("%", "").replace("+", "")
              match = re.search(r"-?\d+(?:\.\d+)?", text)
              if not match:
                  return None
              try:
                  number = float(match.group(0))
              except ValueError:
                  return None
              return round(number, 2) if math.isfinite(number) else None


          def normalize_returns(data: dict) -> dict:
              result = {key: parse_optional_float(data.get(key)) for key in RETURN_KEYS}
              for key in ("price", "high52", "low52", "volatility"):
                  result[key] = parse_optional_float(data.get(key))
              for key in ("update_date", "source_name"):
                  result[key] = str(data.get(key) or "").strip() or None
              return result


          def valid_returns(data: Any) -> bool:
              if not isinstance(data, dict):
                  return False
              values = [parse_optional_float(data.get(key)) for key in RETURN_KEYS]
              return any(value is not None for value in values) and all(
                  value is None or -150.0 <= value <= 250.0 for value in values
              )


          async def fetch_single_ticker(session: aiohttp.ClientSession, ticker: str) -> tuple[str, dict]:
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{ticker}?range=1d&interval=1m"
              try:
                  async with session.get(url, headers=HEADERS) as response:
                      if response.status == 200:
                          result = (await response.json()).get("chart", {}).get("result") or []
                          if result:
                              meta = result[0].get("meta", {})
                              price = parse_optional_float(meta.get("regularMarketPrice"))
                              previous_close = parse_optional_float(meta.get("chartPreviousClose"))
                              if price is not None and previous_close not in (None, 0.0):
                                  change = ((price - previous_close) / previous_close) * 100.0
                                  return ticker, {"price": price, "change": round(change, 2)}
                      print(f"⚠️ Yahoo ticker {ticker}: HTTP {response.status}")
              except Exception as error:
                  print(f"⚠️ Yahoo ticker {ticker}: {error}")
              return ticker, {"price": None, "change": None}


          async def fetch_all_yahoo_data(tickers: list[str]) -> dict:
              timeout = aiohttp.ClientTimeout(total=HTTP_TIMEOUT)
              connector = aiohttp.TCPConnector(limit=12, limit_per_host=8, ttl_dns_cache=300)
              async with aiohttp.ClientSession(timeout=timeout, connector=connector) as session:
                  return dict(await asyncio.gather(*[
                      fetch_single_ticker(session, ticker) for ticker in tickers
                  ]))


          def parse_bizportal_page(html: str, fund_id: str) -> Optional[dict]:
              soup = BeautifulSoup(html, "html.parser")
              for tag in soup(["script", "style", "noscript"]):
                  tag.decompose()
              page_text = re.sub(r"\s+", " ", soup.get_text(" ", strip=True))
              month_match = re.search(r"(?:%\s*)?החודש\s*[:：]?\s*([+\-]?\d+(?:[.,]\d+)?)\s*%", page_text)
              year_match = re.search(r"(?:%\s*)?השנה\s*[:：]?\s*([+\-]?\d+(?:[.,]\d+)?)\s*%", page_text)
              price_match = re.search(r"מחיר פדיון\s*([+\-]?\d+(?:[.,]\d+)?)", page_text)
              volatility_match = re.search(
                  r"סטיית תקן\s*\(שנה\)\s*[:：]?\s*([+\-]?\d+(?:[.,]\d+)?)",
                  page_text,
              )
              range_match = re.search(
                  r"טווח 52 שבועות\s*([+\-]?\d+(?:[.,]\d+)?)\s*([+\-]?\d+(?:[.,]\d+)?)",
                  page_text,
              )
              date_match = re.search(
                  r"(?:מועד עדכון אחרון|תאריך עדכון)\s*[:\-]?\s*(\d{1,2}[./]\d{1,2}[./]\d{2,4})",
                  page_text,
              )
              title = soup.find("h1")

              high52 = low52 = None
              if range_match:
                  first = parse_optional_float(range_match.group(1))
                  second = parse_optional_float(range_match.group(2))
                  if first is not None and second is not None:
                      high52, low52 = max(first, second), min(first, second)

              daily = None
              month_position = month_match.start() if month_match else len(page_text)
              percentages = re.findall(r"([+\-]?\d+(?:[.,]\d+)?)\s*%", page_text[:month_position])
              if percentages:
                  daily = parse_optional_float(percentages[-1])

              if daily is None:
                  for pattern in (
                      r'"DailyChangePercent"\s*:\s*"?([+\-]?\d+(?:[.,]\d+)?)',
                      r'"dailyChangePercent"\s*:\s*"?([+\-]?\d+(?:[.,]\d+)?)',
                      r'"ChangePercent"\s*:\s*"?([+\-]?\d+(?:[.,]\d+)?)',
                      r'"PrcChg"\s*:\s*"?([+\-]?\d+(?:[.,]\d+)?)',
                  ):
                      match = re.search(pattern, html, flags=re.IGNORECASE)
                      if match:
                          daily = parse_optional_float(match.group(1))
                          if daily is not None:
                              break

              data = {
                  "daily": daily,
                  "mtd": parse_optional_float(month_match.group(1) if month_match else None),
                  "ytd": parse_optional_float(year_match.group(1) if year_match else None),
                  "price": parse_optional_float(price_match.group(1) if price_match else None),
                  "high52": high52,
                  "low52": low52,
                  "volatility": parse_optional_float(
                      volatility_match.group(1) if volatility_match else None
                  ),
                  "update_date": date_match.group(1) if date_match else None,
                  "source_name": title.get_text(" ", strip=True) if title else None,
              }
              print(
                  f"🔍 Bizportal {fund_id}: daily={data['daily']}, "
                  f"mtd={data['mtd']}, ytd={data['ytd']}, html={len(html)}"
              )
              return normalize_returns(data) if valid_returns(data) else None


          def parse_bizportal_performance_page(html: str, fund_id: str) -> dict:
              soup = BeautifulSoup(html, "html.parser")
              for tag in soup(["script", "style", "noscript"]):
                  tag.decompose()
              page_text = re.sub(r"\s+", " ", soup.get_text(" ", strip=True))

              def find_return(pattern: str) -> Optional[float]:
                  match = re.search(
                      rf"{pattern}\s*(?:\||:|：)?\s*([+\-]?\d+(?:[.,]\d+)?)\s*%",
                      page_text,
                  )
                  return parse_optional_float(match.group(1)) if match else None

              data = {
                  "weekly": find_return(r"שבועי"),
                  "days30": find_return(r"30\s*יום"),
              }
              print(
                  f"🔍 Bizportal performance {fund_id}: weekly={data['weekly']}, "
                  f"days30={data['days30']}, html={len(html)}"
              )
              return data


          def parse_fund_update_date(html: str) -> Optional[str]:
              soup = BeautifulSoup(html, "html.parser")
              page_text = re.sub(r"\s+", " ", soup.get_text(" ", strip=True))
              match = re.search(
                  r"(?:מועד עדכון אחרון|נכון ל)\s*[:\-]?\s*(\d{1,2}[./]\d{1,2}[./]\d{2,4})",
                  page_text,
              )
              return match.group(1) if match else None


          async def fetch_bizportal_page(session: aiohttp.ClientSession, fund_id: str) -> tuple[str, Optional[dict]]:
              general_url = f"https://www.bizportal.co.il/mutualfunds/quote/generalview/{fund_id}"
              performance_url = f"https://www.bizportal.co.il/mutualfunds/quote/performance/{fund_id}"
              update_url = f"https://finance.themarker.com/mtf/{fund_id}"
              headers = dict(HEADERS, Referer="https://www.bizportal.co.il/mutualfunds")

              async def load(url: str) -> Optional[str]:
                  async with session.get(url, headers=headers, allow_redirects=True) as response:
                      html = await response.text(errors="ignore")
                      if response.status == 200:
                          return html
                      print(f"⚠️ Bizportal {fund_id}: HTTP {response.status} at {url}")
                      return None

              try:
                  general_html, performance_html, update_html = await asyncio.gather(
                      load(general_url), load(performance_url), load(update_url)
                  )
                  general = parse_bizportal_page(general_html, fund_id) if general_html else None
                  if not general:
                      return fund_id, None
                  if performance_html:
                      general.update(parse_bizportal_performance_page(performance_html, fund_id))
                  if update_html:
                      general["update_date"] = parse_fund_update_date(update_html) or general.get("update_date")
                  return fund_id, normalize_returns(general)
              except Exception as error:
                  print(f"⚠️ Bizportal {fund_id}: {error}")
              return fund_id, None


          async def fetch_bizportal_playwright(fund_ids: set[str]) -> dict:
              results = {}
              async with async_playwright() as playwright:
                  browser = await playwright.chromium.launch(
                      headless=True,
                      args=["--no-sandbox", "--disable-setuid-sandbox", "--disable-dev-shm-usage"],
                  )
                  context = await browser.new_context(
                      user_agent=HEADERS["User-Agent"], locale="he-IL", viewport={"width": 1440, "height": 1000}
                  )

                  async def block_heavy_resources(route):
                      if route.request.resource_type in {"image", "media", "font"}:
                          await route.abort()
                      else:
                          await route.continue_()

                  await context.route("**/*", block_heavy_resources)
                  page = await context.new_page()
                  for fund_id in sorted(fund_ids):
                      try:
                          general_url = f"https://www.bizportal.co.il/mutualfunds/quote/generalview/{fund_id}"
                          performance_url = f"https://www.bizportal.co.il/mutualfunds/quote/performance/{fund_id}"
                          response = await page.goto(general_url, wait_until="domcontentloaded", timeout=30000)
                          await page.wait_for_timeout(1500)
                          data = parse_bizportal_page(await page.content(), fund_id)
                          status = response.status if response else "NO_RESPONSE"
                          print(f"🎭 Bizportal Playwright {fund_id}: HTTP {status}")
                          if data:
                              await page.goto(performance_url, wait_until="domcontentloaded", timeout=30000)
                              await page.wait_for_timeout(1000)
                              data.update(parse_bizportal_performance_page(await page.content(), fund_id))
                              results[fund_id] = normalize_returns(data)
                      except Exception as error:
                          print(f"⚠️ Bizportal Playwright {fund_id}: {error}")
                  await browser.close()
              return results


          async def fetch_all_israeli_funds(sectors_config: dict) -> dict:
              fund_to_sector = {
                  str(config["fund_id"]): sector
                  for sector, config in sectors_config.items()
                  if config.get("fund_id")
              }
              fund_ids = set(fund_to_sector)
              by_fund_id = {}
              timeout = aiohttp.ClientTimeout(total=35)
              connector = aiohttp.TCPConnector(limit=6, limit_per_host=3, ttl_dns_cache=300)
              async with aiohttp.ClientSession(timeout=timeout, connector=connector) as session:
                  responses = await asyncio.gather(*[
                      fetch_bizportal_page(session, fund_id) for fund_id in sorted(fund_ids)
                  ])
              for fund_id, data in responses:
                  if data:
                      by_fund_id[fund_id] = data

              fallback_ids = {
                  fund_id for fund_id in fund_ids
                  if fund_id not in by_fund_id
                  or by_fund_id[fund_id].get("weekly") is None
                  or by_fund_id[fund_id].get("days30") is None
              }
              if fallback_ids:
                  print(f"ℹ️ Playwright fallback: {len(fallback_ids)} funds")
                  fallback_data = await fetch_bizportal_playwright(fallback_ids)
                  for fund_id, fallback in fallback_data.items():
                      current = by_fund_id.get(fund_id, dict(EMPTY_RETURNS))
                      by_fund_id[fund_id] = {
                          key: current.get(key) if current.get(key) is not None else fallback.get(key)
                          for key in RETURN_KEYS + FUND_META_KEYS
                      }

              results = {}
              for fund_id, sector in fund_to_sector.items():
                  data = by_fund_id.get(fund_id)
                  results[sector] = normalize_returns(data) if data and valid_returns(data) else dict(EMPTY_RETURNS)
                  if not data:
                      print(f"⚠️ No IL data: {sector} ({fund_id})")
              print(f"📊 Israeli funds: {len(by_fund_id)}/{len(fund_ids)}")
              return results


          async def fetch_ticker_year_history(session: aiohttp.ClientSession, ticker: str) -> list[dict]:
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{ticker}?range=1y&interval=1d"
              try:
                  async with session.get(url, headers=HEADERS) as response:
                      if response.status != 200:
                          print(f"⚠️ Yahoo 1Y {ticker}: HTTP {response.status}")
                          return []
                      results = (await response.json()).get("chart", {}).get("result") or []
                      if not results:
                          return []
                      result = results[0]
                      timestamps = result.get("timestamp") or []
                      quotes = result.get("indicators", {}).get("quote") or []
                      closes = quotes[0].get("close") or [] if quotes else []
                      history = []
                      for timestamp, close in zip(timestamps, closes):
                          value = parse_optional_float(close)
                          if timestamp is not None and value is not None and value > 0:
                              history.append({"timestamp": int(timestamp), "close": value})
                      return sorted(history, key=lambda item: item["timestamp"])
              except Exception as error:
                  print(f"⚠️ Yahoo 1Y {ticker}: {error}")
                  return []


          def timestamp_to_date(timestamp: int) -> str:
              return datetime.fromtimestamp(timestamp, tz=timezone.utc).date().isoformat()


          def analyze_year_history(history: list[dict], ticker: str) -> dict:
              if len(history) < 20:
                  return {}
              first_close = history[0]["close"]
              current_close = history[-1]["close"]
              if first_close <= 0:
                  return {}

              peak_close = trough_close = history[0]["close"]
              peak_time = trough_time = history[0]["timestamp"]
              max_drawdown = max_rally = 0.0
              drawdown_start = rally_start = history[0]["timestamp"]

              for point in history:
                  close, timestamp = point["close"], point["timestamp"]
                  if close > peak_close:
                      peak_close, peak_time = close, timestamp
                  else:
                      change = ((close - peak_close) / peak_close) * 100.0
                      if change < max_drawdown:
                          max_drawdown, drawdown_start = change, peak_time
                  if close < trough_close:
                      trough_close, trough_time = close, timestamp
                  else:
                      change = ((close - trough_close) / trough_close) * 100.0
                      if change > max_rally:
                          max_rally, rally_start = change, trough_time

              if abs(max_drawdown) >= abs(max_rally):
                  event_direction, event_change, event_start = "down", max_drawdown, drawdown_start
              else:
                  event_direction, event_change, event_start = "up", max_rally, rally_start

              closes = [point["close"] for point in history]
              year_high, year_low = max(closes), min(closes)
              close_60d = history[max(0, len(history) - 61)]["close"]
              change_60d = ((current_close - close_60d) / close_60d) * 100.0 if close_60d > 0 else 0.0

              def trailing_change(sessions: int) -> Optional[float]:
                  if len(history) <= sessions:
                      return None
                  base = history[-(sessions + 1)]["close"]
                  if base <= 0:
                      return None
                  return round(((current_close - base) / base) * 100.0, 2)

              if current_close >= year_high * 0.95:
                  trend = "около годовых максимумов"
              elif current_close <= year_low * 1.05:
                  trend = "около годовых минимумов"
              elif change_60d >= 10.0:
                  trend = "восходящий тренд"
              elif change_60d <= -10.0:
                  trend = "нисходящий тренд"
              elif max_drawdown <= -10.0 and change_60d > 5.0:
                  trend = "восстановление после коррекции"
              else:
                  trend = "боковая динамика"

              return {
                  "proxy_ticker": ticker,
                  "market_date": timestamp_to_date(history[-1]["timestamp"]),
                  "year_change": round(((current_close - first_close) / first_close) * 100.0, 2),
                  "event_direction": event_direction,
                  "event_change": round(event_change, 2),
                  "event_date": timestamp_to_date(event_start),
                  "trend": trend,
                  "change_5d": trailing_change(5),
                  "change_20d": trailing_change(20),
              }


          def analyze_entry_zone(fund_data: dict, year_data: dict, config: dict) -> dict:
              daily = parse_optional_float(fund_data.get("daily"))
              weekly = parse_optional_float(fund_data.get("weekly"))
              days30 = parse_optional_float(fund_data.get("days30"))
              volatility = parse_optional_float(fund_data.get("volatility"))
              us5 = parse_optional_float(year_data.get("change_5d"))
              us20 = parse_optional_float(year_data.get("change_20d"))
              entry_mode = config.get("entry_mode", "global")

              def parse_source_date(value: Any):
                  text = str(value or "").strip()
                  for fmt in ("%Y-%m-%d", "%d/%m/%Y", "%d.%m.%Y", "%d/%m/%y", "%d.%m.%y"):
                      try:
                          return datetime.strptime(text, fmt).date()
                      except ValueError:
                          continue
                  return None

              today = datetime.now(timezone.utc).date()
              fund_date = parse_source_date(fund_data.get("update_date"))
              market_date = parse_source_date(year_data.get("market_date"))

              def trading_sessions_since(source_date, local_market: bool) -> int:
                  if not source_date or source_date >= today:
                      return 0
                  sessions = 0
                  cursor = source_date
                  session_days = {6, 0, 1, 2, 3} if local_market else {0, 1, 2, 3, 4}
                  while cursor < today:
                      cursor += timedelta(days=1)
                      sessions += int(cursor.weekday() in session_days)
                  return sessions

              stale_reasons = []
              if fund_date and trading_sessions_since(fund_date, local_market=True) > 4:
                  stale_reasons.append(f"данные фонда не обновлялись с {fund_date.isoformat()}")
              if (
                  entry_mode != "local"
                  and market_date
                  and trading_sessions_since(market_date, local_market=False) > 4
              ):
                  stale_reasons.append(f"данные базового рынка не обновлялись с {market_date.isoformat()}")

              fallback_threshold = float(config.get("fallback_correction", 4.0))
              if volatility is not None and volatility > 0:
                  correction_threshold = max(
                      2.0,
                      min(12.0, (volatility / math.sqrt(12.0)) * 0.50),
                  )
              else:
                  correction_threshold = fallback_threshold

              price = parse_optional_float(fund_data.get("price"))
              high52 = parse_optional_float(fund_data.get("high52"))
              from_high52 = (
                  round(((price - high52) / high52) * 100.0, 2)
                  if price is not None and high52 not in (None, 0.0)
                  else None
              )

              required = [daily, weekly, days30]
              if entry_mode != "local":
                  required.extend([us5, us20])
              if any(value is None for value in required):
                  return {
                      "status_key": "unavailable",
                      "icon": "⚪",
                      "label": "Недостаточно данных",
                      "score": 0,
                      "conditions": "0/0",
                      "condition_details": [],
                      "daily": daily,
                      "weekly": weekly,
                      "days30": days30,
                      "us5": us5,
                      "us20": us20,
                      "from_high52": from_high52,
                      "correction_threshold": round(correction_threshold, 1),
                      "fund_date": fund_date.isoformat() if fund_date else None,
                      "market_date": market_date.isoformat() if market_date else None,
                      "next_step": "дождаться обновления всех обязательных данных",
                      "invalidation": "",
                      "reasons": ["не получены все данные для честной оценки"],
                  }

              correction = days30 <= -correction_threshold
              fund_turn = weekly > 0.0
              daily_confirm = daily > 0.0
              us_turn = us5 > 0.0 if us5 is not None else False
              us_trend = us20 > 0.0 if us20 is not None else False
              early_recovery = fund_turn and weekly < max(1.0, abs(days30) * 0.60)

              if entry_mode == "local":
                  details = [
                      ("коррекция", correction),
                      ("неделя фонда", fund_turn),
                      ("сегодня фонд", daily_confirm),
                  ]
              else:
                  details = [
                      ("коррекция", correction),
                      ("неделя фонда", fund_turn),
                      ("рынок 5д", us_turn),
                      ("рынок 20д", us_trend),
                  ]
                  if entry_mode == "leveraged":
                      details.append(("сегодня фонд", daily_confirm))

              conditions_met = sum(passed for _, passed in details)
              all_confirmed = all(passed for _, passed in details)
              score = round((conditions_met / len(details)) * 100) if details else 0

              if weekly < 0.0 and (entry_mode == "local" or not us_turn):
                  status_key, icon, label = "falling", "🔴", "Падение продолжается"
                  reasons = ["фонд снижается за неделю"]
                  if entry_mode != "local":
                      reasons.append("базовый рынок ещё не развернулся за 5 дней")
                  next_step = "ждать положительной недели фонда"
              elif all_confirmed and early_recovery:
                  status_key, icon, label = "optimal", "🟢", "Оптимальная зона"
                  reasons = [
                      f"30-дневное снижение глубже порога {correction_threshold:.1f}%",
                      "фонд уже показывает положительную неделю",
                  ]
                  if entry_mode == "local":
                      reasons.append("дневное движение подтверждает локальный разворот")
                  else:
                      reasons.append("базовый рынок растёт за 5 и 20 торговых дней")
                  next_step = "проверить актуальность данных перед подачей заявки"
              elif correction and (
                  (entry_mode == "local" and daily_confirm)
                  or (entry_mode != "local" and us_turn)
              ):
                  status_key, icon, label = "forming", "🟡", "Зона формируется"
                  reasons = ["коррекция достигла рабочего порога"]
                  if not fund_turn:
                      reasons.append("сам фонд ещё не подтвердил недельный разворот")
                      next_step = "ждать положительной недели фонда"
                  elif entry_mode != "local" and not us_trend:
                      reasons.append("20-дневный импульс базового рынка ещё отрицательный")
                      next_step = "ждать положительного импульса рынка за 20 дней"
                  else:
                      next_step = "ждать полного подтверждения условий модели"
              elif fund_turn and (
                  (entry_mode == "local" and daily_confirm)
                  or (entry_mode != "local" and us_turn)
              ) and (days30 >= 0.0 or not early_recovery):
                  status_key, icon, label = "late", "🟠", "Вход запоздал"
                  reasons = ["рост уже отыграл коррекцию или коррекции не было"]
                  next_step = "ждать нового снижения к рабочему порогу"
              else:
                  status_key, icon = "wait", "⚪"
                  if weekly < 0.0 and entry_mode != "local" and us_turn:
                      label = "Ждать разворота фонда"
                      reasons = ["базовый рынок растёт, но фонд ещё снижается"]
                      next_step = "ждать положительной недели фонда"
                  else:
                      label = "Ждать отката"
                      reasons = ["нет достаточной коррекции с подтверждённым разворотом"]
                      next_step = f"ждать 30-дневного снижения не менее {correction_threshold:.1f}%"

              invalidation = (
                  "сигнал отменяется при отрицательной неделе фонда"
                  if entry_mode == "local"
                  else "сигнал отменяется, если неделя фонда или рынок за 5 дней снова уйдут в минус"
              )

              # Старые значения остаются видны для контекста, но не могут создать сигнал входа.
              if stale_reasons:
                  status_key, icon, label = "unavailable", "⚪", "Проверить свежесть"
                  reasons = stale_reasons
                  next_step = "дождаться обновления источника"
                  invalidation = ""

              return {
                  "status_key": status_key,
                  "icon": icon,
                  "label": label,
                  "score": score,
                  "conditions": f"{conditions_met}/{len(details)}",
                  "condition_details": details,
                  "daily": daily,
                  "weekly": weekly,
                  "days30": days30,
                  "us5": us5,
                  "us20": us20,
                  "from_high52": from_high52,
                  "correction_threshold": round(correction_threshold, 1),
                  "fund_date": fund_date.isoformat() if fund_date else None,
                  "market_date": market_date.isoformat() if market_date else None,
                  "next_step": next_step,
                  "invalidation": invalidation,
                  "reasons": reasons,
              }


