        import calendar
        import math
        from datetime import date, timedelta
        from io import BytesIO
        from pathlib import Path

        import matplotlib
        matplotlib.use("Agg")
        import matplotlib.dates as mdates
        import matplotlib.pyplot as plt

        from modules.formatter import (
            _radar_verdict, _display_date, format_percent,
            ordered_radar_rows, radar_chart_target,
        )


        def chart_window(history):
            """Three calendar months ending at the last published observation; no invented prices."""
            points = {}
            for item in history:
                try:
                    day = date.fromisoformat(item["date"])
                    price = float(item["price"])
                    if day <= date.today() and math.isfinite(price) and price > 0:
                        points[day] = price
                except (KeyError, TypeError, ValueError):
                    continue
            points = sorted(points.items())
            if len(points) < 15:
                return None
            end = points[-1][0]
            month_index = end.year * 12 + end.month - 1 - 3
            year, month = divmod(month_index, 12)
            month += 1
            start = date(year, month, min(end.day, calendar.monthrange(year, month)[1]))
            window = [(d, p) for d, p in points if d >= start]
            if len(window) < 15:
                return None
            # Coverage is only a span/density check, not proof that every NAV is present.
            gaps = [(b[0] - a[0]).days for a, b in zip(window, window[1:])]
            partial = window[0][0] > start + timedelta(days=7) or len(window) < 40 or max(gaps, default=0) > 10
            return window, partial


        def render_fund_chart(row):
            stats = row.get("il_fund_data", {}).get("price_stats") or {}
            prepared = chart_window(stats.get("chart_history") or [])
            if prepared is None:
                return None
            points, partial = prepared
            dates, prices = zip(*points)
            current, low, high = prices[-1], min(prices), max(prices)
            average = sum(prices) / len(prices)
            color = "#138568" if current >= prices[0] else "#c84a52"
            with plt.rc_context({"font.family": "DejaVu Sans", "font.size": 12}):
                fig, ax = plt.subplots(figsize=(10, 6.7), dpi=150)
                try:
                    fig.patch.set_facecolor("#f6f8fb")
                    ax.set_facecolor("#f6f8fb")
                    fig.subplots_adjust(left=.1, right=.95, bottom=.24, top=.74)
                    fig.text(.1, .94, row["il_name_eng"], fontsize=17, weight="bold", color="#17283b")
                    fig.text(.1, .89, f'{row["fund_id"]}  ·  3 месяца  ·  {dates[0]:%d.%m.%Y} — {dates[-1]:%d.%m.%Y}', color="#526579")
                    fig.text(.1, .81, f"Мин. {low:.2f}    Средняя {average:.2f}    Макс. {high:.2f}", fontsize=13)
                    # Gaps over ten calendar days stay visibly disconnected.
                    xs, ys = [], []
                    for i, (day, price) in enumerate(points):
                        if i and (day - dates[i-1]).days > 10:
                            xs.append(day); ys.append(float("nan"))
                        xs.append(day); ys.append(price)
                    ax.plot(xs, ys, color=color, linewidth=2.3)
                    ax.axhline(average, color="#6c7d91", linestyle="--", linewidth=1.3)
                    for price, marker_color in ((low, "#c84a52"), (high, "#138568")):
                        i = prices.index(price)
                        ax.scatter(dates[i], price, s=48, color=marker_color, zorder=4)
                    ax.scatter(dates[-1], current, s=65, color="#244f99", zorder=5)
                    ax.set_ylabel("Цена в единицах источника")
                    ax.xaxis.set_major_locator(mdates.AutoDateLocator(minticks=4, maxticks=6))
                    ax.xaxis.set_major_formatter(mdates.DateFormatter("%d.%m"))
                    ax.grid(axis="y", color="#dce3eb", linewidth=.7)
                    for spine in ax.spines.values():
                        spine.set_visible(False)
                    ax.tick_params(length=0, pad=8)
                    fig.text(.1, .15, f"Последняя {current:.2f}   ·   От максимума {(current/high-1)*100:+.1f}%   ·   До средней {(average/current-1)*100:+.1f}%", fontsize=12)
                    quality = "Неполная история: показатели по доступным наблюдениям" if partial else f"{len(points)} наблюдений · средняя по опубликованным ценам"
                    fig.text(.1, .095, quality, fontsize=10, color="#526579")
                    fig.text(.1, .05, "Источник: Bizportal · график построен ботом · минимум периода не гарантирует дно", fontsize=9, color="#526579")
                    output = BytesIO()
                    fig.savefig(output, format="png", facecolor=fig.get_facecolor())
                    return output.getvalue()
                finally:
                    plt.close(fig)


        def chart_caption(row):
            marker, _, _ = _radar_verdict(row)
            entry = row["entry_analysis"]
            if marker == "✅▲":
                label = "вход подтверждён по модели"
            elif entry.get("status_key") == "blocked":
                label = "снижение продолжается"
            elif marker == "🔻▼":
                label = "база не подтверждает рост"
            elif not entry.get("candidate"):
                label = "вне зоны входа"
            elif entry.get("status_key") == "forming":
                label = "первое повышение цены"
            else:
                label = "ждём подтверждения"
            lines = [f'{row.get("icon", "")} {row.get("short_eng", "")} · {row["fund_id"]}',
                     f'{marker} Фонд {format_percent(entry.get("daily"), 1)} · {label}']
            market_label = "Израиль" if row.get("local_market") else "США"
            lines.append(f'{market_label} {entry.get("proxy_ticker") or "—"}: день {format_percent(entry.get("base1"), 1)} · 5 сессий {format_percent(entry.get("base5"), 1)}')
            lines.append(f'Даты: фонды {_display_date(entry.get("price_date") or "")} · {market_label} {_display_date(entry.get("base_date") or "")}.')
            return "\n".join(lines)


        def build_radar_charts(rows, output_directory=None):
            charts = []
            target = radar_chart_target(rows)
            for row in ordered_radar_rows(rows):
                if len(charts) >= target:
                    break
                try:
                    png = render_fund_chart(row)
                    if png:
                        caption = chart_caption(row)
                        charts.append((png, caption))
                        if output_directory:
                            directory = Path(output_directory)
                            directory.mkdir(parents=True, exist_ok=True)
                            (directory / f'{row["fund_id"]}.png').write_bytes(png)
                except (ValueError, KeyError, TypeError) as error:
                    print(f'Chart skipped for {row.get("fund_id")}: {type(error).__name__}')
            return charts
