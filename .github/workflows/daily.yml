name: Automated Market Analytics & IPO Digest

on:
  schedule:
    # Ежедневный дайджест рынка в 23:15 по Израилю (20:15 UTC)
    - cron: '11 20 * * *'
    # Еженедельный IPO дайджест в Субботу в 22:00 по Израилю (19:00 UTC)
    - cron: '0 19 * * 6'
  workflow_dispatch:

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Deploy Architecture Files
