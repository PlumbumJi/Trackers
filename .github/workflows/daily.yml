        \  self.assertAlmostEqual(plan['amount'], 1200)\n        self.assertIn('отмена ниже 95.00', plan['line'])\n        risk['breached'] = True\n        self.assertFalse(trade_plan('fund', analysis, 12_000, 500, risk)['allowed'])\n        risk.update(breached=False, active_signal_risk=.02)\n        self.assertIn('общий бюджет риска', trade_plan('fund', analysis, 12_000, 500, risk)['line'])\n\n    def test_signal_journal_is_forward_only_and_not_duplicated(self):\n        from modules.portfolio_insights import update_journal, journal_summary\n        from datetime import datetime\n        analysis = {'status': 'add', 'price': 100}\n        plan = {'allowed': True, 'amount': 1000, 'cancel_price': 95}\n        current = {'fund': {'price': '100', 'date': '2026-09-29'}}\n        journal = update_journal({'signals': []}, {'fund': analysis}, {'fund': plan}, current,\n                                 datetime(2026, 9, 29))\n        journal = update_journal(journal, {'fund': analysis}, {'fund':\
        \ plan}, current,\n                                 datetime(2026, 9, 29))\n        self.assertEqual(len(journal['signals']), 1)\n        current['fund']['price'] = '94'\n        journal = update_journal(journal, {'fund': {'status': 'wait'}}, {'fund': {}}, current,\n                                 datetime(2026, 10, 1))\n        self.assertEqual(journal['signals'][0]['state'], 'closed')\n        self.assertEqual(journal['signals'][0]['close_reason'], 'отмена сценария')\n        self.assertIn('0/1 прибыльных', journal_summary(journal))\n\n\nclass PortfolioRegressionTests(unittest.IsolatedAsyncioTestCase):\n    def test_redemption_price_identity_and_missing_date(self):\n        from modules.portfolio import parse_portfolio_quote\n        html = page('5103692').replace(\n            '<div id=\"paper_change\">',\n            '<div id=\"paper_change\"><div class=\"top-area-cube\">'\n            '<div class=\"label\">מחיר פדיון</div><div class=\"num\">1,017.6</div></div>'\n          \
        \  '<div class=\"top-area-cube\"><div class=\"label\">מחיר קנייה</div>'\n            '<div class=\"num\">9999</div></div>')\n        quote = parse_portfolio_quote(html, '5103692')\n        self.assertEqual(quote['price'], '1017.6')\n        self.assertIsNone(quote['date'])\n        self.assertEqual(parse_portfolio_quote(html, '5132014'), {})\n\n    def test_missing_history_uses_quote_but_never_snapshot_as_daily_return(self):\n        from modules.portfolio import build_report, HOLDINGS, TZ\n        from datetime import datetime\n        now = datetime(2026, 9, 28, 8, 20, tzinfo=TZ)\n        quotes = {h[0]: {'price': p, 'date': None} for h, p in zip(\n            HOLDINGS, ['1017.6', '120.86', '383.27', '171.75', '207.5', '192.45', '175.10'])}\n        text, saved, _ = build_report({}, {}, now, quotes)\n        self.assertIn('14 735.72', text)\n        self.assertIn('дата не указана', text)\n        quotes['5103692']['price'] = '1018.6'\n        text, _, _ = build_report({}, {'2026-09-27':\
        \ saved}, now, quotes)\n        self.assertNotIn('День: \U0001F7E9▲ +6.74 ₪', text)\n        self.assertIn('дневное изменение не подтверждено', text)\n        self.assertNotIn('Новой даты цены нет', text)\n        text, saved, _ = build_report({}, {}, now)\n        self.assertEqual(saved, {})\n        self.assertNotIn('0.00', text)\n        self.assertNotIn('5103692', text)\nEOF\ncat << 'EOF' > tests/test_portfolio_returns.py\nimport unittest\nfrom datetime import datetime\nfrom decimal import Decimal\nfrom unittest.mock import patch\n\nfrom modules import portfolio, portfolio_insights\nfrom modules.telegram_sender import message_length, split_message\n\n\nclass PortfolioReturnsTests(unittest.TestCase):\n    def setUp(self):\n        # Keep the historical 05.10 fixture at the quantities shown that day.\n        old_holdings = list(portfolio.HOLDINGS)\n        old_holdings[0] = (old_holdings[0][0], old_holdings[0][1], '674')\n        self.enterContext(patch.object(portfolio, 'HOLDINGS',\
