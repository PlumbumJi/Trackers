          cat << 'EOF' > modules/market.py
          import asyncio
          import math
          import re
          from typing import Any, Optional

          import aiohttp
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright

          from modules.config import HTTP_TIMEOUT, HEADERS


          EMPTY_RETURNS = {"daily": 0.0, "mtd": 0.0, "ytd": 0.0}


          def parse_optional_float(value: Any) -> Optional[float]:
              if value is None or isinstance(value, bool):
                  return None

              if isinstance(value, (int, float)):
                  number = float(value)
                  return round(number, 2) if math.isfinite(number) else None

              text = str(value).strip()
              if not text or text.lower() in {"none", "null", "nan", "-", "—", "n/a"}:
                  return None

              text = (
                  text.replace("\u00a0", " ")
                  .replace(",", ".")
                  .replace("%", "")
                  .replace("+", "")
              )
              match = re.search(r"-?\d+(?:\.\d+)?", text)
              if not match:
                  return None

              try:
                  number = float(match.group(0))
                  return round(number, 2) if math.isfinite(number) else None
              except ValueError:
                  return None


          def parse_float(value: Any) -> float:
              parsed = parse_optional_float(value)
              return parsed if parsed is not None else 0.0


          def normalize_returns(data: dict) -> dict:
              return {
                  "daily": parse_float(data.get("daily")),
                  "mtd": parse_float(data.get("mtd")),
                  "ytd": parse_float(data.get("ytd")),
              }


          def valid_returns(data: Any) -> bool:
              if not isinstance(data, dict):
                  return False

              values = [
                  parse_optional_float(data.get("daily")),
                  parse_optional_float(data.get("mtd")),
                  parse_optional_float(data.get("ytd")),
              ]

              if all(value is None for value in values):
                  return False

              return all(value is None or -150.0 <= value <= 250.0 for value in values)


          async def fetch_single_ticker(session: aiohttp.ClientSession, ticker: str) -> tuple:
              api_ticker = f"^{ticker}" if ticker == "OVX" else ticker
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{api_ticker}?range=1d&interval=1m"

              try:
                  async with session.get(url, headers=HEADERS, timeout=HTTP_TIMEOUT) as response:
                      if response.status == 200:
                          data = await response.json()
                          result = data.get("chart", {}).get("result", [])
                          if result:
                              meta = result[0].get("meta", {})
                              price = meta.get("regularMarketPrice")
                              previous_close = meta.get("chartPreviousClose")
                              if price is not None and previous_close:
                                  change = ((price - previous_close) / previous_close) * 100
                                  return ticker, {
                                      "price": round(price, 2),
                                      "change": round(change, 2),
                                  }
              except Exception:
                  pass

              return ticker, {"price": 0.0, "change": 0.0}


          async def fetch_all_yahoo_data(tickers: list) -> dict:
              timeout = aiohttp.ClientTimeout(total=HTTP_TIMEOUT)
              async with aiohttp.ClientSession(timeout=timeout) as session:
                  tasks = [fetch_single_ticker(session, ticker) for ticker in tickers]
                  results = await asyncio.gather(*tasks)
                  return dict(results)


          def find_column(headers: list[str], labels: list[str]) -> Optional[int]:
              normalized_headers = [re.sub(r"\s+", "", header).lower() for header in headers]

              for index, header in enumerate(normalized_headers):
                  for label in labels:
                      normalized_label = re.sub(r"\s+", "", label).lower()
                      if normalized_label in header:
                          return index

              return None




          def parse_all_in_one_html(html: str, fund_ids: set[str]) -> dict:
              results = {}

              print(
                  f"🔎 allInOne HTML: {len(html)} символов, "
                  f"таблиц={html.lower().count('<table')}, "
                  f"строк={html.lower().count('<tr')}"
              )

              for fund_id in fund_ids:
                  # Ищем ссылку фонда прямо в исходном HTML.
                  link_match = re.search(
                      rf"""href\s*=\s*["'][^"']*/fund/{re.escape(fund_id)}
                      (?:[/?#][^"']*)?["']""",
                      html,
                      flags=re.IGNORECASE | re.VERBOSE,
                  )

                  if not link_match:
                      print(f"⚠️ allInOne: ID {fund_id} отсутствует в HTML")
                      continue

                  link_position = link_match.start()

                  # Берём полную строку <tr>, в которой находится фонд.
                  row_start = html.lower().rfind("<tr", 0, link_position)
                  row_end = html.lower().find("</tr>", link_position)

                  if row_start == -1 or row_end == -1:
                      print(f"⚠️ allInOne: строка <tr> для {fund_id} не найдена")
                      continue

                  row_html = html[row_start:row_end + 5]
                  row_text = BeautifulSoup(
                      row_html,
                      "html.parser",
                  ).get_text(" ", strip=True)

                  # В строке allInOne первые три процента после названия фонда:
                  # дневная, с начала месяца, с начала года.
                  percentages = re.findall(
                      r"([+\-]?\d+(?:[.,]\d+)?)\s*%",
                      row_text,
                  )

                  if len(percentages) < 3:
                      print(
                          f"⚠️ allInOne {fund_id}: найдено процентов "
                          f"{len(percentages)}; строка={row_text[:350]!r}"
                      )
                      continue

                  data = {
                      "daily": parse_optional_float(percentages[0]),
                      "mtd": parse_optional_float(percentages[1]),
                      "ytd": parse_optional_float(percentages[2]),
                  }

                  if valid_returns(data):
                      results[fund_id] = normalize_returns(data)
                      print(
                          f"✅ allInOne {fund_id}: "
                          f"day={results[fund_id]['daily']}%, "
                          f"mtd={results[fund_id]['mtd']}%, "
                          f"ytd={results[fund_id]['ytd']}%"
                      )
                  else:
                      print(
                          f"⚠️ allInOne {fund_id}: "
                          f"невалидные значения {percentages[:3]}"
                      )

              return results


          async def fetch_all_in_one_http(session: aiohttp.ClientSession, fund_ids: set[str]) -> dict:
              url = "https://www.funder.co.il/allInOne"

              try:
                  async with session.get(url, headers=HEADERS) as response:
                      if response.status != 200:
                          print(f"⚠️ Funder allInOne HTTP {response.status}")
                          return {}

                      html = await response.text(errors="ignore")
                      results = parse_all_in_one_html(html, fund_ids)
                      print(f"📋 Funder allInOne HTTP: {len(results)}/{len(fund_ids)}")
                      return results

              except Exception as error:
                  print(f"⚠️ Ошибка HTTP Funder allInOne: {error}")
                  return {}


          async def fetch_all_in_one_playwright(fund_ids: set[str]) -> dict:
              results = {}
              blocked_domains = (
                  "doubleclick.net",
                  "googlesyndication.com",
                  "google-analytics.com",
                  "taboola.com",
                  "outbrain.com",
              )

              async with async_playwright() as playwright:
                  browser = await playwright.chromium.launch(
                      headless=True,
                      args=["--no-sandbox", "--disable-setuid-sandbox"],
                  )

                  context = await browser.new_context(
                      user_agent=HEADERS["User-Agent"],
                      viewport={"width": 1440, "height": 1000},
                      locale="he-IL",
                  )

                  async def route_handler(route):
                      request = route.request
                      request_url = request.url.lower()

                      if (
                          request.resource_type in {"image", "media", "font"}
                          or any(domain in request_url for domain in blocked_domains)
                      ):
                          await route.abort()
                      else:
                          await route.continue_()

                  await context.route("**/*", route_handler)
                  page = await context.new_page()

                  try:
                      await page.goto(
                          "https://www.funder.co.il/allInOne",
                          wait_until="domcontentloaded",
                          timeout=30000,
                      )
                      await page.wait_for_selector("table", timeout=15000)
                      await page.wait_for_timeout(4000)

                      html = await page.content()
                      results = parse_all_in_one_html(html, fund_ids)
                      print(f"🎭 Funder allInOne Playwright: {len(results)}/{len(fund_ids)}")

                  except Exception as error:
                      print(f"⚠️ Playwright allInOne: {error}")

                  await browser.close()

              return results


          def recursive_find_values(payload: Any) -> dict:
              result = {"daily": None, "mtd": None, "ytd": None}

              daily_keys = {
                  "dailychangepercent",
                  "changepercent",
                  "prcchg",
                  "dailychange",
                  "daychange",
              }
              mtd_keys = {
                  "monthchangepercent",
                  "monthlychangepercent",
                  "mtd",
                  "monthchange",
              }
              ytd_keys = {
                  "yearchangepercent",
                  "yearlychangepercent",
                  "ytd",
                  "yearchange",
              }

              def walk(node: Any):
                  if isinstance(node, dict):
                      for key, value in node.items():
                          normalized_key = re.sub(r"[^a-z0-9]", "", str(key).lower())

                          if not isinstance(value, (dict, list)):
                              parsed = parse_optional_float(value)

                              if parsed is not None:
                                  if normalized_key in daily_keys and result["daily"] is None:
                                      result["daily"] = parsed
                                  elif normalized_key in mtd_keys and result["mtd"] is None:
                                      result["mtd"] = parsed
                                  elif normalized_key in ytd_keys and result["ytd"] is None:
                                      result["ytd"] = parsed

                          walk(value)

                  elif isinstance(node, list):
                      for item in node:
                          walk(item)

              walk(payload)
              return result


          def parse_bizportal_page(html: str, fund_id: str) -> Optional[dict]:
              soup = BeautifulSoup(html, "html.parser")

              for tag in soup(["script", "style", "noscript"]):
                  tag.decompose()

              page_text = soup.get_text(" ", strip=True)
              page_text = re.sub(r"\s+", " ", page_text)

              month_match = re.search(
                  r"%\s*החודש\s*:\s*([+\-]?\d+(?:[.,]\d+)?)\s*%",
                  page_text,
              )
              year_match = re.search(
                  r"%\s*השנה\s*:\s*([+\-]?\d+(?:[.,]\d+)?)\s*%",
                  page_text,
              )

              if not month_match:
                  month_match = re.search(
                      r"החודש\s*[:：]?\s*([+\-]?\d+(?:[.,]\d+)?)\s*%",
                      page_text,
                  )

              if not year_match:
                  year_match = re.search(
                      r"השנה\s*[:：]?\s*([+\-]?\d+(?:[.,]\d+)?)\s*%",
                      page_text,
                  )

              daily = None

              # Основное дневное изменение находится перед блоком "% החודש".
              month_position = month_match.start() if month_match else len(page_text)
              prefix = page_text[:month_position]

              prefix_percentages = re.findall(
                  r"([+\-]?\d+(?:[.,]\d+)?)\s*%",
                  prefix,
              )

              if prefix_percentages:
                  daily = parse_optional_float(prefix_percentages[-1])

              # Дополнительный поиск в JSON/атрибутах страницы.
              if daily is None:
                  daily_patterns = [
                      r'"DailyChangePercent"\s*:\s*"?([+\-]?\d+(?:[.,]\d+)?)',
                      r'"dailyChangePercent"\s*:\s*"?([+\-]?\d+(?:[.,]\d+)?)',
                      r'"ChangePercent"\s*:\s*"?([+\-]?\d+(?:[.,]\d+)?)',
                      r'"PrcChg"\s*:\s*"?([+\-]?\d+(?:[.,]\d+)?)',
                  ]

                  for pattern in daily_patterns:
                      match = re.search(pattern, html, flags=re.IGNORECASE)
                      if match:
                          daily = parse_optional_float(match.group(1))
                          if daily is not None:
                              break

              data = {
                  "daily": daily,
                  "mtd": parse_optional_float(
                      month_match.group(1) if month_match else None
                  ),
                  "ytd": parse_optional_float(
                      year_match.group(1) if year_match else None
                  ),
              }

              print(
                  f"🔍 Bizportal parse {fund_id}: "
                  f"daily={data['daily']}, "
                  f"mtd={data['mtd']}, "
                  f"ytd={data['ytd']}, "
                  f"html={len(html)}"
              )

              if valid_returns(data):
                  return normalize_returns(data)

              return None


          async def fetch_bizportal_page(
              session: aiohttp.ClientSession,
              fund_id: str,
          ) -> tuple[str, Optional[dict]]:
              url = (
                  "https://www.bizportal.co.il/mutualfunds/"
                  f"quote/generalview/{fund_id}"
              )

              headers = {
                  "User-Agent": (
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 (KHTML, like Gecko) "
                      "Chrome/126.0.0.0 Safari/537.36"
                  ),
                  "Accept": (
                      "text/html,application/xhtml+xml,application/xml;"
                      "q=0.9,image/avif,image/webp,*/*;q=0.8"
                  ),
                  "Accept-Language": "he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7",
                  "Cache-Control": "no-cache",
                  "Pragma": "no-cache",
                  "Referer": "https://www.bizportal.co.il/mutualfunds",
              }

              try:
                  async with session.get(
                      url,
                      headers=headers,
                      allow_redirects=True,
                  ) as response:
                      html = await response.text(errors="ignore")

                      print(
                          f"🌐 Bizportal {fund_id}: "
                          f"HTTP {response.status}, "
                          f"url={response.url}, "
                          f"bytes={len(html)}"
                      )

                      if response.status != 200:
                          return fund_id, None

                      return fund_id, parse_bizportal_page(html, fund_id)

              except Exception as error:
                  print(f"❌ Bizportal HTTP {fund_id}: {error}")
                  return fund_id, None


          async def fetch_bizportal_playwright(
              fund_ids: set[str],
          ) -> dict:
              results = {}

              async with async_playwright() as playwright:
                  browser = await playwright.chromium.launch(
                      headless=True,
                      args=[
                          "--no-sandbox",
                          "--disable-setuid-sandbox",
                          "--disable-dev-shm-usage",
                      ],
                  )

                  context = await browser.new_context(
                      user_agent=(
                          "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                          "AppleWebKit/537.36 (KHTML, like Gecko) "
                          "Chrome/126.0.0.0 Safari/537.36"
                      ),
                      locale="he-IL",
                      viewport={"width": 1440, "height": 1000},
                  )

                  page = await context.new_page()

                  for fund_id in fund_ids:
                      url = (
                          "https://www.bizportal.co.il/mutualfunds/"
                          f"quote/generalview/{fund_id}"
                      )

                      try:
                          response = await page.goto(
                              url,
                              wait_until="domcontentloaded",
                              timeout=30000,
                          )

                          await page.wait_for_timeout(2500)
                          html = await page.content()

                          status = response.status if response else "NO_RESPONSE"
                          print(
                              f"🎭 Bizportal Playwright {fund_id}: "
                              f"HTTP {status}, bytes={len(html)}"
                          )

                          data = parse_bizportal_page(html, fund_id)
                          if data:
                              results[fund_id] = data

                      except Exception as error:
                          print(
                              f"❌ Bizportal Playwright {fund_id}: {error}"
                          )

                  await browser.close()

              return results


          async def fetch_all_israeli_funds(sectors_config: dict) -> dict:
              fund_to_sector = {
                  str(config["fund_id"]): sector
                  for sector, config in sectors_config.items()
                  if config.get("fund_id")
              }

              fund_ids = set(fund_to_sector)
              by_fund_id = {}

              timeout = aiohttp.ClientTimeout(total=35)
              connector = aiohttp.TCPConnector(
                  limit=6,
                  limit_per_host=3,
                  ttl_dns_cache=300,
              )

              async with aiohttp.ClientSession(
                  timeout=timeout,
                  connector=connector,
              ) as session:
                  tasks = [
                      fetch_bizportal_page(session, fund_id)
                      for fund_id in sorted(fund_ids)
                  ]

                  responses = await asyncio.gather(*tasks)

                  for fund_id, data in responses:
                      if data:
                          by_fund_id[fund_id] = data
                          print(
                              f"✅ Bizportal HTML {fund_id}: "
                              f"{data}"
                          )

              missing_ids = fund_ids - set(by_fund_id)

              if missing_ids:
                  print(
                      f"ℹ️ Playwright fallback для "
                      f"{len(missing_ids)} фондов"
                  )
                  playwright_results = await fetch_bizportal_playwright(
                      missing_ids
                  )
                  by_fund_id.update(playwright_results)

              results = {}

              for fund_id, sector in fund_to_sector.items():
                  data = by_fund_id.get(fund_id)

                  if data and valid_returns(data):
                      results[sector] = normalize_returns(data)
                  else:
                      print(
                          f"❌ Нет данных: {sector} ({fund_id})"
                      )
                      results[sector] = dict(EMPTY_RETURNS)

              print(
                  f"📊 Израильские фонды Bizportal: "
                  f"{len(by_fund_id)}/{len(fund_ids)}"
              )

              return results
          EOF

          cat << 'EOF' > modules/news.py
          import aiohttp, urllib.parse, html
          import yfinance as yf
          from modules.config import HTTP_TIMEOUT, HEADERS

          async def translate_to_russian(session: aiohttp.ClientSession, text: str) -> str:
              if not text:
                  return text
              try:
                  url = f"https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ru&dt=t&q={urllib.parse.quote(text)}"
                  async with session.get(url, timeout=6) as resp:
                      if resp.status == 200:
                          data = await resp.json()
                          translated = "".join([segment[0] for segment in data[0] if segment[0]])
                          return html.unescape(translated)
              except Exception:
                  pass
              return text

          async def fetch_sector_news(session: aiohttp.ClientSession, query_ticker: str) -> list:
              url = f"https://query1.finance.yahoo.com/v1/finance/search?q={query_ticker}"
              try:
                  async with session.get(url, headers=HEADERS, timeout=HTTP_TIMEOUT) as response:
                      if response.status == 200:
                          items = (await response.json()).get("news", [])
                          for item in items:
                              title = item.get("title", "")
                              if title and len(title) > 15:
                                  translated_title = await translate_to_russian(session, title)
                                  return [f"• {translated_title}"]
              except Exception:
                  pass
              return ["• Торгуется в рамках текущей рыночной динамики."]

          def get_single_ipo_card(symbol: str, name: str, ipo_date: str, fallback_price: str) -> str:
              try:
                  t = yf.Ticker(symbol)
                  info = t.info

                  current_price = info.get("currentPrice") or info.get("regularMarketPrice") or info.get("open")
                  price_str = f"${current_price:.2f}" if current_price else fallback_price

                  rec = str(info.get("recommendationKey", "N/A")).replace("_", " ").upper()
                  target = info.get("targetMeanPrice")
                  target_str = f"${target:.2f}" if target else "Н/Д"

                  rec_map = {
                      "STRONG BUY": "🔥 Strong Buy",
                      "BUY": "🟢 Buy (Покупать)",
                      "HOLD": "🟡 Hold (Удерживать)",
                      "UNDERPERFORM": "🟠 Underperform",
                      "SELL": "🔴 Sell (Продавать)",
                      "N/A": "⚪️ Ожидает оценки"
                  }
                  rec_formatted = rec_map.get(rec, rec)

                  return (
                      f"📌 <b>{name}</b> (<code>{symbol}</code>)\n"
                      f"🗓 <b>Дата IPO:</b> {ipo_date}\n"
                      f"💵 <b>Курс / Диапазон:</b> {price_str}\n"
                      f"🎯 <b>Цель Wall St:</b> {target_str}\n"
                      f"🧠 <b>Консенсус:</b> {rec_formatted}\n"
                  )
              except Exception:
                  return (
                      f"📌 <b>{name}</b> (<code>{symbol}</code>)\n"
                      f"🗓 <b>Дата IPO:</b> {ipo_date}\n"
                      f"💵 <b>Курс:</b> {fallback_price}\n"
                      f"🧠 <b>Консенсус:</b> ⚪️ В процессе оценки\n"
                  )

          def fetch_ipo_full_analytics() -> list:
              ipo_targets = [
                  {"symbol": "ARM", "name": "Arm Holdings", "date": "14.09.2023", "price": "$51.00"},
                  {"symbol": "RDDT", "name": "Reddit Inc.", "date": "21.03.2024", "price": "$34.00"},
                  {"symbol": "KVUE", "name": "Kenvue Inc.", "date": "04.05.2023", "price": "$22.00"},
                  {"symbol": "IPO", "name": "Renaissance IPO ETF", "date": "ETF Фонд", "price": "Рыночная"}
              ]
              cards = []
              for target in ipo_targets:
                  card = get_single_ipo_card(target["symbol"], target["name"], target["date"], target["price"])
                  cards.append(card)
              return cards
          EOF

          cat << 'EOF' > modules/formatter.py
          from datetime import datetime, timezone, timedelta
          from modules.config import BOT_NAME

          def escape_html(text: str) -> str:
              return text.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")

          def build_telegram_message(sectors_data: list) -> str:
              tz_il = timezone(timedelta(hours=3))
              now_str = datetime.now(tz_il).strftime("%d.%m.%Y | %H:%M")

              lines = [
