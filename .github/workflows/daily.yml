          cat << 'EOF' > modules/telegram_sender.py
          import aiohttp
          from modules.config import BOT_TOKEN,CHAT_ID,HTTP_TIMEOUT
          def split_message(text:str,max_length:int=4000)->list[str]:
              if len(text)<=max_length:
                  return [text]
              chunks=[]
              blocks=text.split("</blockquote>")
              current=""
              for raw in blocks:
                  if not raw:
                      continue
                  block=raw+"</blockquote>" if "blockquote" in raw else raw
                  if len(current)+len(block)>max_length:
                      if current:
                          chunks.append(current.strip())
                          current=""
                      if len(block)>max_length:
                          for line in block.split("\n"):
                              if len(current)+len(line)+1>max_length:
                                  chunks.append(current.strip())
                                  current=line+"\n"
                              else:
                                  current+=line+"\n"
                      else:
                          current=block
                  else:
                      current+=block
              if current.strip():
                  chunks.append(current.strip())
              return chunks
          async def send_to_telegram(text:str):
              if not BOT_TOKEN or not CHAT_ID:
                  print("❌ BOT_TOKEN или CHAT_ID не найдены")
                  return
              url=f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"
              chunks=split_message(text,3900)
              async with aiohttp.ClientSession() as session:
                  for idx,chunk in enumerate(chunks,1):
                      payload={
                          "chat_id":CHAT_ID,
                          "text":chunk,
                          "parse_mode":"HTML",
                          "disable_web_page_preview":True
                      }
                      try:
                          async with session.post(url,json=payload,timeout=HTTP_TIMEOUT) as resp:
                              if resp.status==200:
                                  print(f"🚀 [{idx}/{len(chunks)}] отправлено")
                              else:
                                  print(f"❌ Telegram {resp.status}: {await resp.text()}")
                      except Exception as exc:
                          print(f"💥 {exc}")
          EOF
