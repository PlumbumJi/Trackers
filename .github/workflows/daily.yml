        cat << 'EOF' > modules/market.py
        import asyncio
        import json
        import math
        import re
        from datetime import datetime, timedelta, timezone
        from html.parser import HTMLParser
        from typing import Any, Optional
        from zoneinfo import ZoneInfo

        import aiohttp
        from playwright.async_api import async_playwright

        from modules.config import HEADERS, HTTP_TIMEOUT

        RETURN_KEYS = ("daily", "mtd", "ytd")
        EMPTY_RETURNS = {key: None for key in RETURN_KEYS}
        IL_CONCURRENCY = 3
        IL_REQUEST_TIMEOUT = 25


        class _Node:
            def __init__(self, tag="root", attrs=()):
                self.tag, self.attrs, self.children = tag, dict(attrs), []

            def walk(self, tag=None):
                if tag is None or self.tag == tag:
                    yield self
                for child in self.children:
                    if isinstance(child, _Node):
                        yield from child.walk(tag)

            def text(self):
                if self.tag in {"script", "style", "noscript"}:
                    return ""
                return " ".join(c.text() if isinstance(c, _Node) else c for c in self.children)


        class _FundHTML(HTMLParser):
            """Small stdlib DOM reader for the fund header and the returns table."""
            VOID = {"area", "base", "br", "col", "embed", "hr", "img", "input", "link", "meta", "param", "source", "track", "wbr"}

            def __init__(self, html):
                super().__init__(convert_charrefs=True)
                self.root = _Node()
                self.stack = [self.root]
                self.feed(html)
                self.close()

            def handle_starttag(self, tag, attrs):
                # Bizportal contains unclosed spans inside cells. Boundaries stay explicit.
                if tag in {"tr", "td", "th", "li"}:
                    self.handle_endtag(tag)
                node = _Node(tag, attrs)
                self.stack[-1].children.append(node)
                if tag not in self.VOID:
                    self.stack.append(node)

            def handle_startendtag(self, tag, attrs):
                self.handle_starttag(tag, attrs)
                self.handle_endtag(tag)

            def handle_endtag(self, tag):
                for index in range(len(self.stack) - 1, 0, -1):
                    if self.stack[index].tag == tag:
                        del self.stack[index:]
                        break

            def handle_data(self, data):
                self.stack[-1].children.append(data)


        def _clean_text(value):
            return re.sub(r"\s+", " ", str(value).translate(dict.fromkeys(map(ord, "\u200e\u200f\u202a\u202b\u202c\u2066\u2067\u2068\u2069"), None))).strip()


        def parse_optional_float(value: Any) -> Optional[float]:
            if value is None or isinstance(value, bool):
                return None
            if isinstance(value, (int, float)):
                number = float(value)
                return round(number, 2) if math.isfinite(number) else None
            text = _clean_text(value).replace("−", "-").replace("–", "-")
            if not text or text.lower() in {"none", "null", "nan", "-", "—", "n/a"}:
                return None
            text = text.replace("%", "").replace(" ", "")
            if "," in text and "." in text:
                text = text.replace(",", "")
            elif "," in text:
                text = text.replace(",", ".")
            if text.endswith("-"):
                text = "-" + text[:-1]
            match = re.fullmatch(r"[+-]?\d+(?:\.\d+)?", text)
            if not match:
                return None
            try:
                number = float(match.group(0))
            except ValueError:
                return None
            return round(number, 2) if math.isfinite(number) else None


        def normalize_returns(data: dict) -> dict:
            result = {}
            for key in RETURN_KEYS:
                value = parse_optional_float(data.get(key))
                result[key] = value if value is None or value >= -100.0 else None
            for key in (
                "source_url", "fetched_at", "update_date", "errors", "access_denied",
                "source_missing", "price_stats",
            ):
                if key in data:
                    result[key] = data[key]
            return result


        def valid_returns(data: Any) -> bool:
            if not isinstance(data, dict):
                return False
            values = [parse_optional_float(data.get(key)) for key in RETURN_KEYS]
            return any(value is not None and value >= -100.0 for value in values)


        async def fetch_single_ticker(session: aiohttp.ClientSession, ticker: str) -> tuple[str, dict]:
            api_ticker = f"^{ticker}" if ticker == "OVX" else ticker
            url = f"https://query1.finance.yahoo.com/v8/finance/chart/{api_ticker}?range=10d&interval=1d"
            try:
                async with session.get(url, headers=HEADERS) as response:
                    if response.status == 200:
                        result = (await response.json()).get("chart", {}).get("result") or []
                        if result:
                            chart = result[0]
                            timestamps = chart.get("timestamp") or []
                            quotes = chart.get("indicators", {}).get("quote") or []
                            closes = quotes[0].get("close") or [] if quotes else []
                            points = [
                                (int(timestamp), float(close))
                                for timestamp, close in zip(timestamps, closes)
                                if timestamp is not None and close is not None and float(close) > 0
                            ]
                            regular = chart.get("meta", {}).get("currentTradingPeriod", {}).get("regular", {})
                            now_timestamp = int(datetime.now(timezone.utc).timestamp())
                            session_start = int(regular.get("start") or 0)
                            session_end = int(regular.get("end") or 0)
                            # Yahoo's last daily candle is provisional while that market is open.
                            if (
                                len(points) >= 3
                                and session_start <= now_timestamp < session_end
                                and points[-1][0] >= session_start
                            ):
                                points.pop()
                            if len(points) >= 2:
                                timestamp, price = points[-1]
                                previous_close = points[-2][1]
                                change = ((price - previous_close) / previous_close) * 100.0
                                timezone_name = chart.get("meta", {}).get("exchangeTimezoneName") or "UTC"
                                try:
                                    market_date = datetime.fromtimestamp(timestamp, ZoneInfo(timezone_name)).date().isoformat()
                                except Exception:
                                    market_date = datetime.fromtimestamp(timestamp, timezone.utc).date().isoformat()
                                return ticker, {
                                    "price": round(price, 2),
                                    "change": round(change, 2),
                                    "market_date": market_date,
                                }
                    print(f"⚠️ Yahoo ticker {ticker}: HTTP {response.status}")
            except Exception as error:
                print(f"⚠️ Yahoo ticker {ticker}: {error}")
            return ticker, {
                "price": None, "change": None, "market_date": None,
            }


        async def fetch_all_yahoo_data(tickers: list[str]) -> dict:
            timeout = aiohttp.ClientTimeout(total=HTTP_TIMEOUT)
            connector = aiohttp.TCPConnector(limit=12, limit_per_host=8, ttl_dns_cache=300)
            async with aiohttp.ClientSession(timeout=timeout, connector=connector) as session:
                return dict(await asyncio.gather(*[
                    fetch_single_ticker(session, ticker) for ticker in tickers
                ]))








        def parse_bizportal_page(html: str, fund_id: str) -> Optional[dict]:
            root = _FundHTML(html).root
            page_text = _clean_text(root.text())
            stock_match = re.search(r"\bvar\s+stockID\s*=\s*['\"]?(\d+)", html)
            visible_match = re.search(r"מספר נייר\s+(\d{6,8})\b", page_text)
            identities = [m.group(1) for m in (stock_match, visible_match) if m]
            if not identities or any(value != str(fund_id) for value in identities):
                print(f"⚠️ Bizportal {fund_id}: fund identity missing or mismatched")
                return None

            data = dict(EMPTY_RETURNS)
            data["source_missing"] = []

            def read_value(key, text):
                value = parse_optional_float(text)
                if value is None and _clean_text(text) in {"--", "--%", "—", "—%", "N/A"}:
                    data["source_missing"].append(key)
                return value
            for block in root.walk():
                if block.attrs.get("id") == "paper_change":
                    for node in block.walk("span"):
                        if "percent" in node.attrs.get("class", "").split():
                            data["daily"] = read_value("daily", node.text())
                            break
                if "paper_statistics_row" in block.attrs.get("class", "").split():
                    for item in block.walk("li"):
                        labels = [n for n in item.walk("span") if "label" in n.attrs.get("class", "").split()]
                        nums = [n for n in item.walk("span") if "num" in n.attrs.get("class", "").split()]
                        if labels and nums:
                            label = _clean_text(labels[0].text()).strip("% :：")
                            key = {"החודש": "mtd", "השנה": "ytd"}.get(label)
                            if key:
                                data[key] = read_value(key, nums[0].text())

            date_match = re.search(r"(?:תאריך עדכון|מועד עדכון אחרון)\s*[:\-]?\s*(\d{1,2}[./]\d{1,2}[./]\d{4})", page_text)
            if date_match:
                data["update_date"] = date_match.group(1)
            data = normalize_returns(data)
            data["source_missing"] = sorted({key for key in data["source_missing"] if data.get(key) is None})
            print(f"🔍 Bizportal {fund_id}: " + ", ".join(f"{key}={data[key]}" for key in RETURN_KEYS))
            return data if valid_returns(data) else None


        def merge_returns(current: dict, extra: dict) -> dict:
            merged = dict(current)
            for key, value in extra.items():
                if key in {"errors", "source_missing"}:
                    merged[key] = list(dict.fromkeys(merged.get(key, []) + value))
                elif key == "access_denied":
                    merged[key] = bool(value or merged.get(key))
                elif merged.get(key) is None and value is not None:
                    merged[key] = value
            result = normalize_returns(merged)
            result["source_missing"] = [key for key in result.get("source_missing", []) if result.get(key) is None]
            return result


        def is_access_challenge(html: str) -> bool:
            title = re.search(r"<title[^>]*>(.*?)</title>", html, re.S | re.I)
            title = title.group(1).lower() if title else ""
            return any(word in title for word in ("access denied", "just a moment", "captcha", "verify you are human"))


        async def fetch_bizportal_page(session: aiohttp.ClientSession, fund_id: str, limiter=None, denied=None) -> tuple[str, dict]:
            general_url = f"https://www.bizportal.co.il/mutualfunds/quote/generalview/{fund_id}"
            performance_url = f"https://www.bizportal.co.il/mutualfunds/quote/performance/{fund_id}"
            headers = dict(HEADERS, Referer="https://www.bizportal.co.il/mutualfunds")

            limiter = limiter or asyncio.Semaphore(IL_CONCURRENCY)
            denied = denied or asyncio.Event()
            errors = []

            async def load(url: str) -> Optional[dict]:
                page_name = "general" if "generalview" in url else "performance"
                for attempt in (1, 2):
                    try:
                        # Waiting for our own slot happens BEFORE the HTTP timeout starts.
                        async with limiter:
                            if denied.is_set():
                                errors.append(f"{page_name}: access restricted")
                                return None
                            timeout = aiohttp.ClientTimeout(total=IL_REQUEST_TIMEOUT, sock_connect=10, sock_read=20)
                            async with session.get(url, headers=headers, timeout=timeout, allow_redirects=True) as response:
                                status = response.status
                                html = await response.text(errors="ignore")
                            print(f"🌐 Bizportal {fund_id} {page_name}: HTTP {status}, bytes={len(html)}, attempt={attempt}")
                            if status in {401, 403, 429} or is_access_challenge(html):
                                denied.set()
                                errors.append(f"{page_name}: access restricted (HTTP {status})")
                                return None
                            if status == 200:
                                result = parse_bizportal_page(html, fund_id)
                                if result:
                                    result["source_url"] = url
                                    result["fetched_at"] = datetime.now(timezone.utc).isoformat()
                                else:
                                    errors.append(f"{page_name}: expected fund fields not found")
                                return result
                            if status < 500:
                                errors.append(f"{page_name}: HTTP {status}")
                                return None
                            errors.append(f"{page_name}: HTTP {status}")
                    except (asyncio.TimeoutError, aiohttp.ClientError) as error:
                        errors.append(f"{page_name}: {type(error).__name__}")
                        print(f"⚠️ Bizportal {fund_id} {page_name}: {type(error).__name__}, attempt={attempt}")
                    except Exception as error:
                        errors.append(f"{page_name}: parser {type(error).__name__}")
                        return None
                    if attempt == 1:
                        await asyncio.sleep(1)
                return None

            general = await load(general_url)
            needs_backup = not general or any(
                general.get(key) is None and key not in general.get("source_missing", [])
                for key in RETURN_KEYS
            )
            performance = await load(performance_url) if needs_backup and not denied.is_set() else None
            result = merge_returns(general or dict(EMPTY_RETURNS), performance or {})
            result["errors"] = list(dict.fromkeys(errors))
            result["access_denied"] = denied.is_set()
            return fund_id, result


        async def fetch_bizportal_playwright(fund_ids: set[str], existing=None) -> dict:
            results = {}
            existing = existing or {}
            try:
                async with async_playwright() as playwright:
                    browser = await playwright.chromium.launch(headless=True, args=["--disable-dev-shm-usage"])
                    try:
                        async with asyncio.timeout(150):
                            context = await browser.new_context(locale="he-IL")
                            page = await context.new_page()
                            for fund_id in sorted(fund_ids):
                                current = dict(existing.get(fund_id) or EMPTY_RETURNS)
                                results[fund_id] = current
                                for page_name in ("generalview", "performance"):
                                    keys = RETURN_KEYS
                                    if all(current.get(key) is not None or key in current.get("source_missing", []) for key in keys):
                                        continue
                                    url = f"https://www.bizportal.co.il/mutualfunds/quote/{page_name}/{fund_id}"
                                    try:
                                        response = await page.goto(url, wait_until="domcontentloaded", timeout=18000)
                                        status = response.status if response else 0
                                        html = await page.content()
                                        if status in {401, 403, 429} or is_access_challenge(html):
                                            current["access_denied"] = True
                                            current.setdefault("errors", []).append(f"browser: access restricted (HTTP {status})")
                                            return results
                                        if status != 200:
                                            current.setdefault("errors", []).append(f"browser {page_name}: HTTP {status}")
                                            continue
                                        try:
                                            await page.wait_for_selector("#paper_change .percent", timeout=4000)
                                        except Exception:
                                            pass
                                        data = parse_bizportal_page(await page.content(), fund_id)
                                        if data:
                                            data.update(source_url=url, fetched_at=datetime.now(timezone.utc).isoformat())
                                            current = merge_returns(current, data)
                                            current["access_denied"] = False
                                            results[fund_id] = current  # Save BEFORE another navigation can fail.
                                    except Exception as error:
                                        current.setdefault("errors", []).append(f"browser {page_name}: {type(error).__name__}")
                                        print(f"⚠️ Browser {fund_id} {page_name}: {type(error).__name__}")
                    finally:
                        await browser.close()
            except Exception as error:
                print(f"⚠️ Browser fallback stopped: {type(error).__name__}; keeping partial results")
            return results


        def parse_bizportal_history_response(payload: str) -> tuple[list[dict], int]:
            """Parse Bizportal's ~pages^[JSON] graph response without guessing values."""
            text = str(payload or "").strip()
            match = re.match(r"~(\d+)\^(.*)$", text, re.S)
            if not match:
                return [], 0
            try:
                rows = json.loads(match.group(2))
            except (json.JSONDecodeError, TypeError):
                return [], 0
            if not isinstance(rows, list):
                return [], 0
            result = []
            for row in rows:
                if not isinstance(row, dict):
                    continue
                date_text = str(row.get("DateObj") or "")
                price = parse_optional_float(row.get("Rate"))
                if not re.fullmatch(r"\d{8}", date_text) or price is None or price <= 0:
                    continue
                try:
                    day = datetime.strptime(date_text, "%Y%m%d").date()
                except ValueError:
                    continue
                result.append({"date": day.isoformat(), "price": price})
            return result, max(1, int(match.group(1)))


        def calculate_price_stats(history: list[dict]) -> dict:
            points = []
            for row in history:
                try:
                    day = datetime.strptime(str(row["date"]), "%Y-%m-%d").date()
                    price = float(row["price"])
                except (KeyError, TypeError, ValueError):
                    continue
                if math.isfinite(price) and price > 0:
                    points.append((day, price))
            points = sorted(dict(points).items())
            if len(points) < 15:
                return {}
            last_day, current = points[-1]
            window30 = [(day, price) for day, price in points if day >= last_day - timedelta(days=29)]
            window60 = [(day, price) for day, price in points if day >= last_day - timedelta(days=59)]
            if len(window30) < 8 or len(window60) < 15:
                return {}
            average30 = sum(price for _, price in window30) / len(window30)
            minimum60 = min(price for _, price in window60)
            maximum60 = max(price for _, price in window60)
            prior_low = min(price for _, price in points[-6:-1])
            history_daily = (current / points[-2][1] - 1.0) * 100.0
            previous_daily = (points[-2][1] / points[-3][1] - 1.0) * 100.0
            covered60 = points[0][0] <= last_day - timedelta(days=59)
            period_start = max(points[0][0], last_day - timedelta(days=364))
            period = [(day, price) for day, price in points if day >= period_start]
            period_average = sum(price for _, price in period) / len(period)
            period_minimum = min(price for _, price in period)
            period_maximum = max(price for _, price in period)

            def range_position(price: float, minimum: float, maximum: float) -> Optional[float]:
                spread = maximum - minimum
                if spread <= 0:
                    return None
                return round((price - minimum) / spread * 100.0, 2)

            return {
                "chart_history": [{"date": day.isoformat(), "price": price} for day, price in points[-400:]],
                "current_price": round(current, 2),
                "price_date": last_day.isoformat(),
                "below_average_30": round((current / average30 - 1.0) * 100.0, 2),
                "from_high_60": round((current / maximum60 - 1.0) * 100.0, 2),
                "range_position_60": range_position(current, minimum60, maximum60),
                "coverage_60": covered60,
                "history_daily": round(history_daily, 4),
                "previous_daily": round(previous_daily, 4),
                "new_low_5": current <= prior_low,
                "period_days": (last_day - period[0][0]).days + 1,
                "period_average": round(period_average, 2),
                "period_minimum": round(period_minimum, 2),
                "period_maximum": round(period_maximum, 2),
                "from_period_low": round((current / period_minimum - 1.0) * 100.0, 2),
                "from_period_high": round((current / period_maximum - 1.0) * 100.0, 2),
                "to_period_average": round((period_average / current - 1.0) * 100.0, 2),
            }


        async def fetch_bizportal_price_history(
            session: aiohttp.ClientSession,
            fund_id: str,
            limiter: asyncio.Semaphore,
            denied: asyncio.Event,
        ) -> list[dict]:
            if denied.is_set():
                return []
            url = "https://www.bizportal.co.il/ajax/biz_papers_helper.ashx"
            headers = dict(
                HEADERS,
                Referer=f"https://www.bizportal.co.il/mutualfunds/quote/graphs/{fund_id}",
                Accept="application/json,text/plain,*/*",
            )
            all_rows = []
            pages = 1
            for page_number in range(1, 13):
                if page_number > pages:
                    break
                params = {
                    "action": "get_paper_yearly_graph", "request_type": "2",
                    # period=1 returns only the latest few observations. period=3 is
                    # required for the 60-day and longer fund-price calculations.
                    "paper_id": fund_id, "period": "3", "page_number": str(page_number),
                }
                try:
                    async with limiter:
                        timeout = aiohttp.ClientTimeout(total=IL_REQUEST_TIMEOUT, sock_connect=10, sock_read=20)
                        async with session.get(url, params=params, headers=headers, timeout=timeout) as response:
                            body = await response.text(errors="ignore")
                    if response.status in {401, 403, 429} or is_access_challenge(body):
                        print(f"⚠️ Bizportal history {fund_id}: access restricted (HTTP {response.status})")
                        return []
                    if response.status != 200 or not body.strip():
                        print(f"⚠️ Bizportal history {fund_id}: HTTP {response.status}, empty={not bool(body.strip())}")
                        break
                    rows, pages = parse_bizportal_history_response(body)
                    if pages == 0:
                        print(f"⚠️ Bizportal history {fund_id}: unexpected response format, bytes={len(body)}")
                    print(f"📉 Bizportal history {fund_id}: page={page_number}/{pages}, rows={len(rows)}")
                    if not rows:
                        break
                    all_rows.extend(rows)
                except (asyncio.TimeoutError, aiohttp.ClientError) as error:
                    print(f"⚠️ Bizportal history {fund_id}: {type(error).__name__}")
                    break
            return sorted({row["date"]: row for row in all_rows}.values(), key=lambda row: row["date"])


        async def fetch_all_israeli_funds(sectors_config: dict) -> dict:
            fund_to_sector = {
                str(config["fund_id"]): sector
                for sector, config in sectors_config.items()
                if config.get("fund_id")
            }
            fund_ids = set(fund_to_sector)
            by_fund_id = {}
            timeout = aiohttp.ClientTimeout(total=IL_REQUEST_TIMEOUT)
            connector = aiohttp.TCPConnector(limit=IL_CONCURRENCY, limit_per_host=IL_CONCURRENCY, ttl_dns_cache=300)
            limiter, denied = asyncio.Semaphore(IL_CONCURRENCY), asyncio.Event()
            async with aiohttp.ClientSession(timeout=timeout, connector=connector) as session:
                responses = await asyncio.gather(*[
                    fetch_bizportal_page(session, fund_id, limiter, denied) for fund_id in sorted(fund_ids)
                ])
                for fund_id, data in responses:
                    by_fund_id[fund_id] = data
                # The AJAX history endpoint is independent from the HTML pages. A 403
                # on the page must not suppress this second source.
                history_denied = asyncio.Event()
                histories = await asyncio.gather(*[
                    fetch_bizportal_price_history(session, fund_id, limiter, history_denied)
                    for fund_id in sorted(fund_ids)
                ])
                for fund_id, history in zip(sorted(fund_ids), histories):
                    if history:
                        by_fund_id[fund_id]["price_stats"] = calculate_price_stats(history)

            fallback_ids = {
                fund_id for fund_id in fund_ids
                if any(
                    by_fund_id.get(fund_id, {}).get(key) is None
                    and key not in by_fund_id.get(fund_id, {}).get("source_missing", [])
                    for key in RETURN_KEYS
                )
            }
            if fallback_ids:
                print(f"ℹ️ Playwright fallback: {len(fallback_ids)} funds")
                fallback_data = await fetch_bizportal_playwright(fallback_ids, by_fund_id)
                for fund_id, fallback in fallback_data.items():
                    current = by_fund_id.get(fund_id, dict(EMPTY_RETURNS))
                    by_fund_id[fund_id] = merge_returns(current, fallback)

            results = {}
            for fund_id, sector in fund_to_sector.items():
                data = by_fund_id.get(fund_id)
                results[sector] = normalize_returns(data or EMPTY_RETURNS)
                missing = [key for key in RETURN_KEYS if results[sector].get(key) is None]
                if missing:
                    print(f"⚠️ IL {sector} ({fund_id}): missing={missing}; errors={results[sector].get('errors', [])}")
            daily_count = sum(row.get("daily") is not None for row in results.values())
            complete = sum(all(row.get(key) is not None for key in RETURN_KEYS) for row in results.values())
            print(f"📊 Israeli funds: daily={daily_count}/{len(fund_ids)}, complete={complete}/{len(fund_ids)}")
            return results


        async def fetch_ticker_history(session: aiohttp.ClientSession, ticker: str) -> list[dict]:
            """Fetch completed daily closes used for one- and five-session confirmation."""
            api_ticker = f"^{ticker}" if ticker == "OVX" else ticker
            url = f"https://query1.finance.yahoo.com/v8/finance/chart/{api_ticker}?range=3mo&interval=1d"
            try:
                async with session.get(url, headers=HEADERS) as response:
                    if response.status != 200:
                        print(f"⚠️ Yahoo history {ticker}: HTTP {response.status}")
                        return []
                    results = (await response.json()).get("chart", {}).get("result") or []
                    if not results:
                        return []
                chart = results[0]
                timestamps = chart.get("timestamp") or []
                quotes = chart.get("indicators", {}).get("quote") or []
                if not quotes:
                    return []
                closes = quotes[0].get("close") or []
                history = []
                for timestamp, raw_close in zip(timestamps, closes):
                    close = parse_optional_float(raw_close)
                    if timestamp is None or close is None or close <= 0:
                        continue
                    history.append({"timestamp": int(timestamp), "close": close})
                    regular = (chart.get("meta") or {}).get("currentTradingPeriod", {}).get("regular", {})
                    start, end = int(regular.get("start") or 0), int(regular.get("end") or 0)
                    now = int(datetime.now(timezone.utc).timestamp())
                    if start <= now < end:
                        history = [point for point in history if point["timestamp"] < start]
                    return sorted(history, key=lambda item: item["timestamp"])
            except Exception as error:
                print(f"⚠️ Yahoo history {ticker}: {error}")
                return []


        def analyze_year_history(history: list[dict], ticker: str) -> dict:
            if len(history) < 6:
                return {}
            latest, base = history[-1], history[-6]
            if base["close"] <= 0:
                return {}
            return {
                "proxy_ticker": ticker,
                "market_date": datetime.fromtimestamp(latest["timestamp"], timezone.utc).date().isoformat(),
                "change_5d": round((latest["close"] / base["close"] - 1) * 100, 2),
                "change_1d": round((latest["close"] / history[-2]["close"] - 1) * 100, 2),
            }


        def analyze_entry_zone(fund_data: dict, market_data: dict) -> dict:
            # The setup belongs to the fund; US data never creates or upgrades it here.
            stats = fund_data.get("price_stats") or {}
            keys = (
                "below_average_30", "from_high_60", "range_position_60",
                "history_daily", "previous_daily",
            )
            values = {key: parse_optional_float(stats.get(key)) for key in keys}
            if not stats.get("coverage_60") or any(v is None for v in values.values()):
                return {"status_key": "unavailable", "candidate": False}
            daily = values["history_daily"]
            discounted = values["below_average_30"] <= -3
            low_zone = values["range_position_60"] <= 30
            pullback = values["from_high_60"] <= -3
            candidate = discounted and low_zone and pullback
            if not candidate:
                status = "watch"
            elif daily <= 0 or stats.get("new_low_5"):
                status = "blocked"
            elif values["previous_daily"] > 0:
                status = "ready"
            else:
                status = "forming"
            return {
                "status_key": status, "candidate": candidate,
                "range_position_60": values["range_position_60"],
                "daily": daily, "price_date": stats.get("price_date", ""),
                "base5": parse_optional_float(market_data.get("change_5d")),
                "base1": parse_optional_float(market_data.get("change_1d")),
                "base_date": market_data.get("market_date", ""),
                "proxy_ticker": market_data.get("proxy_ticker", ""),
            }


        async def fetch_all_year_analytics(sectors_config: dict) -> dict:
            timeout = aiohttp.ClientTimeout(total=HTTP_TIMEOUT + 20)
            connector = aiohttp.TCPConnector(limit=8, limit_per_host=6, ttl_dns_cache=300)
            async with aiohttp.ClientSession(timeout=timeout, connector=connector) as session:
                tasks = {
                    sector: asyncio.create_task(fetch_ticker_history(session, config["proxy_ticker"]))
                    for sector, config in sectors_config.items()
                    if config.get("proxy_ticker")
                }
                results = {}
                for sector, task in tasks.items():
                    ticker = sectors_config[sector]["proxy_ticker"]
                    analysis = analyze_year_history(await task, ticker)
                    if analysis:
                        results[sector] = analysis
                    else:
                        print(f"⚠️ Base history unavailable: {sector} ({ticker})")
            print(f"📊 Base confirmation data: {len(results)}/{len(sectors_config)}")
            return results
