                # Free, keyless fallback documented by MyMemory. It is used only when
                # the primary endpoint did not return a Russian translation.
                try:
                    url = "https://api.mymemory.translated.net/get"
                    language = "he" if re.search(r"[\u0590-\u05ff]", source) else "en"
                    params = {"q": source, "langpair": f"{language}|ru", "mt": "1"}
