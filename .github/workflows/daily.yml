          import asyncio
          import json
          import os
          import re
          from datetime import date, datetime, timedelta, timezone
          from typing import Any, Optional

          import aiohttp
          from bs4 import BeautifulSoup

          from modules.config import (
              FINNHUB_API_KEY, HEADERS, HTTP_TIMEOUT, IPO_LOOKAHEAD_DAYS,
              IPO_LOOKBACK_DAYS, IPO_STATE_FILE,
          )

          FINNHUB_URL = "https://finnhub.io/api/v1/calendar/ipo"
          YAHOO_URL = "https://finance.yahoo.com/calendar/ipo"
          FINNHUB_SOURCE = "Finnhub IPO Calendar"
          YAHOO_SOURCE = "Yahoo Finance IPO Calendar"
          TRASH_TEXT = re.compile(
              r"\b(spac|blank[- ]check|acquisition\s+corp(?:oration)?|warrants?|units?|"
              r"rights?|etf|funds?|closed[- ]end|trust|notes?|bonds?|preferred)\b",
              re.IGNORECASE,
          )
          TRASH_SYMBOL = re.compile(r"[.\-/](?:U|W|WS|WT|R|RT)$", re.IGNORECASE)


          def text(value: Any) -> str:
              return re.sub(r"\s+", " ", str(value or "")).strip()


          def parse_date(value: Any) -> Optional[date]:
              value = text(value)
              match = re.search(r"\d{4}-\d{2}-\d{2}", value)
              if match:
                  try:
                      return datetime.strptime(match.group(0), "%Y-%m-%d").date()
                  except ValueError:
                      return None
              for fmt in ("%m/%d/%Y", "%d/%m/%Y", "%b %d, %Y", "%B %d, %Y"):
                  try:
                      return datetime.strptime(value, fmt).date()
                  except ValueError:
                      continue
              return None


          def parse_int(value: Any) -> Optional[int]:
              cleaned = re.sub(r"[^\d]", "", text(value))
              return int(cleaned) if cleaned else None


          def normalize_event(raw: dict, today: date) -> Optional[dict]:
              event_date = parse_date(
                  raw.get("date") or raw.get("ipoDate") or raw.get("pricedDate")
                  or raw.get("expectedDate") or raw.get("expectedToTrade")
              )
              company = text(raw.get("name") or raw.get("companyName") or raw.get("company") or raw.get("Company"))
              ticker = re.sub(r"\s+", "", text(raw.get("symbol") or raw.get("ticker") or raw.get("Symbol"))).upper()
              if not company or not event_date or TRASH_TEXT.search(company) or TRASH_SYMBOL.search(ticker):
                  return None
              status = text(raw.get("status") or raw.get("type") or raw.get("eventType"))
              raw_price = text(raw.get("price") or raw.get("priceRange") or raw.get("offerPrice") or raw.get("Price Range"))
              is_range = bool(re.search(r"\d\s*-\s*\$?\d", raw_price)) or "range" in status.lower()
              is_priced = "priced" in status.lower() or "listed" in status.lower() or event_date <= today
              return {
                  "company_name": company,
                  "ticker": ticker,
                  "exchange": text(raw.get("exchange") or raw.get("exchangeName") or raw.get("market") or raw.get("Market")),
                  "planned_ipo_date": event_date.isoformat(),
                  "first_trading_date": event_date.isoformat(),
                  "price_range": raw_price if is_range else "",
                  "offer_price": raw_price if raw_price and is_priced and not is_range else "",
                  "shares_offered": parse_int(raw.get("numberOfShares") or raw.get("sharesOffered") or raw.get("Shares")),
                  "total_shares_value": parse_int(raw.get("totalSharesValue") or raw.get("dealSize") or raw.get("Deal Size")),
                  "status": status,
                  "source": text(raw.get("_source")) or FINNHUB_SOURCE,
              }


          def event_key(event: dict) -> str:
              if event.get("ticker"):
                  return f"ticker:{event['ticker']}"
              company = re.sub(r"[^a-z0-9]+", "", event.get("company_name", "").lower())
              exchange = re.sub(r"[^a-z0-9]+", "", event.get("exchange", "").lower())
              return f"company:{company}:{exchange}"


          def completeness(event: dict) -> int:
              fields = ("company_name", "ticker", "exchange", "planned_ipo_date", "price_range", "offer_price", "shares_offered", "status")
              return sum(bool(event.get(field)) for field in fields) + 2 * bool(event.get("total_shares_value"))


          def dedupe(events: list[dict]) -> list[dict]:
              result = {}
              for event in events:
                  key = event_key(event)
                  if key and (key not in result or completeness(event) > completeness(result[key])):
                      result[key] = event
              return list(result.values())


          def load_snapshot(path: str) -> dict:
              if not path or not os.path.exists(path):
                  return {"items": {}, "generated_at": None}
              try:
                  with open(path, "r", encoding="utf-8") as file:
                      payload = json.load(file)
                  return payload if isinstance(payload.get("items"), dict) else {"items": {}}
              except Exception as error:
                  print(f"⚠️ IPO snapshot load: {error}")
                  return {"items": {}}


          def save_snapshot(events: list[dict], path: str) -> None:
              payload = {
                  "generated_at": datetime.now(timezone.utc).isoformat(),
                  "source": f"{FINNHUB_SOURCE} + {YAHOO_SOURCE}",
                  "items": {event_key(event): event for event in events if event_key(event)},
              }
              directory = os.path.dirname(path)
              if directory:
                  os.makedirs(directory, exist_ok=True)
              temporary = f"{path}.tmp"
              with open(temporary, "w", encoding="utf-8") as file:
                  json.dump(payload, file, ensure_ascii=False, indent=2, sort_keys=True)
              os.replace(temporary, path)


          async def fetch_finnhub(session: aiohttp.ClientSession, start: date, end: date) -> Optional[list[dict]]:
              if not FINNHUB_API_KEY:
                  return None
              try:
                  async with session.get(
                      FINNHUB_URL,
                      params={"from": start.isoformat(), "to": end.isoformat()},
                      headers={"X-Finnhub-Token": FINNHUB_API_KEY},
                      timeout=HTTP_TIMEOUT,
                  ) as response:
                      if response.status != 200:
                          print(f"⚠️ Finnhub IPO: HTTP {response.status}")
                          return None
                      events = (await response.json()).get("ipoCalendar")
                  if not isinstance(events, list):
                      return None
                  for event in events:
                      if isinstance(event, dict):
                          event["_source"] = FINNHUB_SOURCE
                  return events
              except Exception as error:
                  print(f"⚠️ Finnhub IPO: {error}")
                  return None


          def normalize_header(value: str) -> str:
              return re.sub(r"[^a-z0-9]+", "", value.lower())


          def parse_yahoo_html(html_text: str) -> list[dict]:
              events = []
              soup = BeautifulSoup(html_text, "html.parser")
              for table in soup.find_all("table"):
                  headers = [cell.get_text(" ", strip=True) for cell in table.find_all("th")]
                  normalized = [normalize_header(header) for header in headers]
                  if not ({"symbol", "ticker"} & set(normalized)) and "company" not in normalized:
                      continue
                  for row in table.find_all("tr"):
                      cells = [cell.get_text(" ", strip=True) for cell in row.find_all("td")]
                      if len(cells) < 2:
                          continue
                      item = {"_source": YAHOO_SOURCE, "status": "IPO calendar"}
                      for key, value in zip(normalized, cells):
                          mapping = {
                              "company": "companyName", "companyname": "companyName", "name": "companyName",
                              "symbol": "symbol", "ticker": "symbol", "market": "exchange", "exchange": "exchange",
                              "pricerange": "priceRange", "price": "priceRange", "shares": "numberOfShares",
                              "sharesoffered": "numberOfShares", "numberofshares": "numberOfShares",
                              "date": "date", "ipodate": "date", "priceddate": "date", "expectedtotrade": "date",
                              "dealsize": "dealSize", "estimateddealsize": "dealSize", "status": "status", "type": "status",
                          }
                          if key in mapping:
                              item[mapping[key]] = value
                      if item.get("companyName") or item.get("symbol"):
                          events.append(item)
              return events


          async def fetch_yahoo(session: aiohttp.ClientSession, start: date, end: date) -> Optional[list[dict]]:
              try:
                  async with session.get(
                      YAHOO_URL,
                      params={"from": start.isoformat(), "to": end.isoformat()},
                      headers=HEADERS,
                      timeout=HTTP_TIMEOUT,
                  ) as response:
                      if response.status != 200:
                          print(f"⚠️ Yahoo IPO: HTTP {response.status}")
                          return None
                      return parse_yahoo_html(await response.text(errors="ignore"))
              except Exception as error:
                  print(f"⚠️ Yahoo IPO: {error}")
                  return None


          def build_updates(current: list[dict], previous: dict) -> list[dict]:
              previous_items = previous.get("items", {})
              fields = ("planned_ipo_date", "price_range", "offer_price", "shares_offered", "status", "exchange")
              updates = []
              for event in current:
                  old = previous_items.get(event_key(event))
                  item = dict(event)
                  if old is None:
                      item.update(change_type="New IPO date in calendar", changed_fields=["planned_ipo_date"])
                      updates.append(item)
                      continue
                  changed = [field for field in fields if (old.get(field) or "") != (event.get(field) or "")]
                  if changed:
                      item["changed_fields"] = changed
                      item["change_type"] = "IPO date updated" if "planned_ipo_date" in changed else "IPO terms/status updated"
                      if "planned_ipo_date" in changed:
                          item["previous_ipo_date"] = old.get("planned_ipo_date", "")
                      updates.append(item)
              return updates


          async def fetch_weekly_ipo_radar(today: Optional[date] = None) -> dict:
              today = today or datetime.now(timezone.utc).date()
              window_start = today - timedelta(days=max(1, IPO_LOOKBACK_DAYS) - 1)
              upcoming_start = today + timedelta(days=1)
              upcoming_end = today + timedelta(days=max(14, IPO_LOOKAHEAD_DAYS))
              timeout = aiohttp.ClientTimeout(total=HTTP_TIMEOUT + 10)
              async with aiohttp.ClientSession(timeout=timeout) as session:
                  fr, fu, yr, yu = await asyncio.gather(
                      fetch_finnhub(session, window_start, today),
                      fetch_finnhub(session, upcoming_start, upcoming_end),
                      fetch_yahoo(session, window_start, today),
                      fetch_yahoo(session, upcoming_start, upcoming_end),
                  )
              source_ok = any(payload is not None for payload in (fr, fu, yr, yu))
              recent = dedupe([
                  event for raw in (fr or []) + (yr or [])
                  if (event := normalize_event(raw, today))
              ])
              upcoming = dedupe([
                  event for raw in (fu or []) + (yu or [])
                  if (event := normalize_event(raw, today))
              ])
              previous = load_snapshot(IPO_STATE_FILE)
              previous_found = bool(previous.get("items"))
              updates = build_updates(upcoming, previous) if previous_found else [
                  dict(event, change_type="Current IPO date on calendar", changed_fields=["planned_ipo_date"])
                  for event in upcoming
              ]
              listings = [
                  event for event in recent
                  if window_start <= parse_date(event.get("first_trading_date")) <= today
              ]
              rank = lambda event: int(event.get("total_shares_value") or 0) + int(event.get("shares_offered") or 0)
              updates = sorted(updates, key=lambda event: (event.get("planned_ipo_date", "9999-12-31"), -rank(event)))[:5]
              listings = sorted(listings, key=lambda event: (event.get("first_trading_date", ""), rank(event)), reverse=True)[:5]
              if source_ok:
                  save_snapshot(dedupe(recent + upcoming), IPO_STATE_FILE)
              return {
                  "source_ok": source_ok,
                  "window_start": window_start.isoformat(),
                  "window_end": today.isoformat(),
                  "previous_snapshot_found": previous_found,
                  "date_updates": updates,
                  "new_listings": listings,
              }
