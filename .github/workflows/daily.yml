        \        self.assertIn('+10.0%',reviews[0]['line'])\n        self.assertEqual(record['sent_stages'],[])  # Preview is not delivery.\n        state['_delivered_reviews']=reviews\n        fund_news.register_delivered(state,now)\n        self.assertEqual(record['sent_stages'],[7])\n        self.assertEqual(fund_news.watch_jobs(state,now),[])\n        now=first+timedelta(days=14)\n        reviews=fund_news.build_reviews(state,fund_news.watch_jobs(state,now),data,now,movers.verified_publication)\n        self.assertIn('Нового NAV нет',reviews[0]['line'])\n        self.assertNotIn('0.0%',reviews[0]['line'])\n        now=first+timedelta(days=30)\n        reviews=fund_news.build_reviews(state,fund_news.watch_jobs(state,now),{},now,movers.verified_publication)\n        self.assertEqual(reviews[0]['stage'],30)\n        self.assertIn('Нет свежей',reviews[0]['line'])\n        state['_delivered_reviews']=reviews\n        fund_news.register_delivered(state,now)\n        self.assertEqual(record['sent_stages'],[7,14,21,30])\n\
        \        self.assertEqual(fund_news.watch_jobs(state,now+timedelta(days=1)),[])\n        # A crowded caption cannot prematurely consume a weekly report.\n        state.update(news_focus={'status':'ok','items':[]},news_reviews=reviews,\n                     last_scan={'status':'ok','readable_funds':1000})\n        caption,_,_=movers.combined_caption((state,[]),'Стоимость: 1000 ₪\\n'+movers.BOT_NAME)\n        self.assertNotIn('ИТОГИ НАБЛЮДЕНИЯ',caption)\n        self.assertLessEqual(movers.message_length('\U0001F4BC МОЙ ПОРТФЕЛЬ\\n\\n'+caption),1024)\n\n\nif __name__=='__main__':\n    unittest.main()\nEOF\n\ncat << 'EOF' > tests/test_bot.py\nimport asyncio\nimport unittest\nfrom types import SimpleNamespace\nfrom unittest.mock import AsyncMock, patch\n\nimport main as app\nfrom modules import market, formatter, news, telegram_sender\nfrom modules.config import SECTORS_CONFIG\n\n\ndef page(fund_id=\"5139183\", daily=\"2.2%\", annual=\"26.46%\"):\n    daily_html = f'<span class=\"num\
        \ percent rise\"><span>{daily}</span></span>' if daily is not None else ''\n    body = (\n        f'<script>var stockID = {fund_id};</script><h1>Fund</h1>'\n        f'<div id=\"paper_change\">{daily_html}</div>'\n        '<ul class=\"paper_statistics_row\">'\n        '<li><span class=\"label\">% החודש:</span><span class=\"num\">4.09%</span></li>'\n        f'<li><span class=\"label\">% השנה:</span><span class=\"num\">{annual}</span></li></ul>'\n        '<p>דמי ניהול 0.5%</p>'\n    )\n    return body\n\n\nclass Response:\n    def __init__(self, html, status=200):\n        self.html, self.status = html, status\n\n    async def __aenter__(self):\n        return self\n\n    async def __aexit__(self, *args):\n        return False\n\n    async def text(self, **kwargs):\n        return self.html\n\n\nclass Session:\n    def __init__(self, fail=None, status=200):\n        self.fail, self.status, self.calls = fail, status, []\n\n    def get(self, url, **kwargs):\n        self.calls.append(url)\n\
        \        if self.fail and self.fail in url:\n            raise asyncio.TimeoutError()\n        return Response(page(url.rsplit('/', 1)[-1]), self.status)\n\n\nclass ParserTests(unittest.TestCase):\n    def test_history_response_and_price_stats(self):\n        rows = [\n            {\"DateObj\": 20260701 + index, \"Rate\": 100 + index * 0.1}\n            for index in range(1, 10)\n        ]\n        parsed, pages = market.parse_bizportal_history_response(\"~4^\" + __import__('json').dumps(rows))\n        self.assertEqual(pages, 4)\n        self.assertEqual(len(parsed), 9)\n\n    def test_price_stats_use_calendar_windows(self):\n        from datetime import date, timedelta\n        start = date(2026, 6, 1)\n        history = [\n            {\"date\": (start + timedelta(days=index)).isoformat(), \"price\": 100 - index * 0.2}\n            for index in range(70)\n        ]\n        stats = market.calculate_price_stats(history)\n        self.assertEqual(stats[\"current_price\"], 86.2)\n\
        \        self.assertTrue(stats[\"coverage_60\"])\n        self.assertEqual(stats[\"period_days\"], 70)\n        self.assertLess(stats[\"from_high_60\"], 0)\n        self.assertEqual(stats[\"range_position_60\"], 0.0)\n\n    def test_price_stats_identify_full_twelve_month_coverage(self):\n        from datetime import date, timedelta\n        start = date(2025, 1, 1)\n        history = [\n            {\"date\": (start + timedelta(days=index)).isoformat(), \"price\": 100 + index * 0.1}\n            for index in range(400)\n        ]\n        stats = market.calculate_price_stats(history)\n        self.assertEqual(stats[\"period_days\"], 365)\n        self.assertGreater(stats[\"period_maximum\"], stats[\"period_minimum\"])\n\n    def test_price_stats_reject_too_short_history(self):\n        history = [\n            {\"date\": \"2026-09-14\", \"price\": 100.0},\n            {\"date\": \"2026-09-15\", \"price\": 101.0},\n            {\"date\": \"2026-09-16\", \"price\": 102.0},\n      \
        \  ]\n        self.assertEqual(market.calculate_price_stats(history), {})\n\n    def test_header(self):\n        result = market.parse_bizportal_page(page(), '5139183')\n        self.assertEqual(result['daily'], 2.2)\n        self.assertEqual(result['mtd'], 4.09)\n\n    def test_wrong_identity(self):\n        self.assertIsNone(market.parse_bizportal_page(page(), '5141841'))\n\n    def test_missing_identity(self):\n        self.assertIsNone(market.parse_bizportal_page('<html>123.0% 1.0%</html>', '5139183'))\n\n    def test_fee_not_used_as_daily(self):\n        self.assertIsNone(market.parse_bizportal_page(page(daily=None), '5139183')['daily'])\n\n    def test_high_annual_return_not_discarded(self):\n        result = market.parse_bizportal_page(page(annual='350.0%'), '5139183')\n        self.assertEqual(result['ytd'], 350.0)\n        self.assertEqual(result['daily'], 2.2)\n\n    def test_zero_not_missing(self):\n        self.assertEqual(market.parse_bizportal_page(page(daily='0%'),\
        \ '5139183')['daily'], 0.0)\n\n    def test_source_placeholder_not_zero_and_not_retryable(self):\n        result=market.parse_bizportal_page(page(annual='--%'), '5139183')\n        self.assertIsNone(result['ytd'])\n        self.assertIn('ytd',result['source_missing'])\n\n    def test_numbers(self):\n        self.assertEqual(market.parse_optional_float('\\u200e− 1.25 %'), -1.25)\n        self.assertEqual(market.parse_optional_float('1,25%-'), -1.25)\n        self.assertIsNone(market.parse_optional_float('error 403'))\n\n    def test_merge_missing_only(self):\n        result = market.merge_returns({'daily':0.0, 'mtd':None}, {'daily':1.0, 'mtd':2.0})\n        self.assertEqual(result['daily'], 0.0)\n        self.assertEqual(result['mtd'], 2.0)\n\n\nclass FetchTests(unittest.IsolatedAsyncioTestCase):\n    async def test_fund_history_requests_long_period(self):\n        import json\n        payload = \"~1^\" + json.dumps([\n            {\"DateObj\": f\"202608{day:02d}\", \"Rate\": 100\
        \ + day}\n            for day in range(1, 17)\n        ])\n        class HistorySession:\n            def __init__(self):\n                self.params = []\n            def get(self, url, **kwargs):\n                self.params.append(kwargs.get('params', {}))\n                return Response(payload, 200)\n        session = HistorySession()\n        rows = await market.fetch_bizportal_price_history(\n            session, '5139183', asyncio.Semaphore(1), asyncio.Event()\n        )\n        self.assertEqual(session.params[0]['period'], '3')\n        self.assertEqual(len(rows), 16)\n\n    async def test_complete_general_skips_performance(self):\n        session = Session(fail='performance')\n        with patch.object(market.asyncio, 'sleep', new=AsyncMock()):\n            _, result = await market.fetch_bizportal_page(session, '5139183')\n        self.assertEqual(result['daily'], 2.2)\n        self.assertEqual(result['ytd'], 26.46)\n        self.assertEqual(len(session.calls), 1)\n\
        \        self.assertFalse(any('performance' in call for call in session.calls))\n\n    async def test_general_timeout_performance_recovers_all(self):\n        with patch.object(market.asyncio, 'sleep', new=AsyncMock()):\n            _, result = await market.fetch_bizportal_page(Session(fail='generalview'), '5139183')\n        self.assertEqual(result['daily'], 2.2)\n\n    async def test_both_fail(self):\n        with patch.object(market.asyncio, 'sleep', new=AsyncMock()):\n            _, result = await market.fetch_bizportal_page(Session(fail='quote'), '5139183')\n        self.assertTrue(all(result[k] is None for k in market.RETURN_KEYS))\n\n    async def test_access_denied_no_retry(self):\n        session = Session(status=403)\n        _, result = await market.fetch_bizportal_page(session, '5139183')\n        self.assertTrue(result['access_denied'])\n        self.assertEqual(len(session.calls), 1)\n\n    async def test_browser_skips_performance_when_general_is_complete(self):\n \
        \       calls = []\n        class Page:\n            async def goto(self, url, **kwargs):\n                calls.append(url)\n                if 'performance' in url:\n                    raise asyncio.TimeoutError()\n                return SimpleNamespace(status=200)\n            async def content(self): return page()\n            async def wait_for_selector(self, *args, **kwargs): pass\n        context = SimpleNamespace(new_page=AsyncMock(return_value=Page()))\n        browser = SimpleNamespace(new_context=AsyncMock(return_value=context), close=AsyncMock())\n        engine = SimpleNamespace(chromium=SimpleNamespace(launch=AsyncMock(return_value=browser)))\n        manager = AsyncMock()\n        manager.__aenter__.return_value = engine\n        with patch.object(market, 'async_playwright', return_value=manager):\n            result = await market.fetch_bizportal_playwright({'5139183'})\n        self.assertEqual(result['5139183']['daily'], 2.2)\n        self.assertFalse(any('performance'\
        \ in url for url in calls))\n        browser.close.assert_awaited_once()\n\n    async def test_browser_unavailable_does_not_raise(self):\n        with patch.object(market, 'async_playwright', side_effect=RuntimeError('test missing browser')):\n            result = await market.fetch_bizportal_playwright({'5139183'})\n        self.assertEqual(result, {})\n\n    async def test_browser_retries_http_access_denied_result(self):\n        calls = []\n        class Page:\n            async def goto(self, url, **kwargs):\n                calls.append(url)\n                return SimpleNamespace(status=200)\n            async def content(self): return page()\n            async def wait_for_selector(self, *args, **kwargs): pass\n        context = SimpleNamespace(new_page=AsyncMock(return_value=Page()))\n        browser = SimpleNamespace(new_context=AsyncMock(return_value=context), close=AsyncMock())\n        engine = SimpleNamespace(chromium=SimpleNamespace(launch=AsyncMock(return_value=browser)))\n\
        \        manager = AsyncMock()\n        manager.__aenter__.return_value = engine\n        existing = {'5139183': {**market.EMPTY_RETURNS, 'access_denied': True}}\n        with patch.object(market, 'async_playwright', return_value=manager):\n            result = await market.fetch_bizportal_playwright({'5139183'}, existing)\n        self.assertTrue(calls)\n        self.assertEqual(result['5139183']['daily'], 2.2)\n\n    async def test_translation_error_never_returns_english(self):\n        translated = await news.translate_to_russian(Session(status=503), 'Snowflake jumps')\n        self.assertEqual(translated, '')\n\n    async def test_translation_uses_mymemory_fallback(self):\n        class JsonResponse(Response):\n            def __init__(self, status, payload):\n                super().__init__('', status)\n                self.payload = payload\n            async def json(self):\n                return self.payload\n        class TranslationSession:\n            def get(self,\
        \ url, **kwargs):\n                if 'googleapis' in url:\n                    return JsonResponse(503, {})\n                return JsonResponse(200, {'responseData': {'translatedText': 'Акции выросли'}})\n        translated = await news.translate_to_russian(TranslationSession(), 'Stocks rose')\n        self.assertEqual(translated, 'Акции выросли')\n\n    async def test_open_daily_candle_is_excluded(self):\n        import time\n        now = int(time.time())\n        payload = {\n            'chart': {'result': [{\n                'timestamp': [now - 172800, now - 86400, now],\n                'indicators': {'quote': [{'close': [100.0, 101.0, 150.0]}]},\n                'meta': {\n                    'currentTradingPeriod': {'regular': {'start': now - 3600, 'end': now + 3600}},\n                    'exchangeTimezoneName': 'UTC',\n                },\n            }]}\n        }\n        class JsonResponse(Response):\n            async def json(self): return payload\n        class\
        \ MarketSession:\n            def get(self, url, **kwargs): return JsonResponse('', 200)\n        _, result = await market.fetch_single_ticker(MarketSession(), 'TEST')\n        self.assertEqual(result['price'], 101.0)\n        self.assertEqual(result['change'], 1.0)\n\n\n\n\nclass BaseHistoryTests(unittest.TestCase):\n    def test_change_uses_five_completed_intervals(self):\n        from datetime import datetime, timezone\n        start = int(datetime(2026, 9, 1, tzinfo=timezone.utc).timestamp())\n        history = [{\"timestamp\": start + i * 86400, \"close\": 100 + i} for i in range(6)]\n        self.assertEqual(market.analyze_year_history(history, \"TEST\")[\"change_5d\"], 5.0)\n        self.assertEqual(market.analyze_year_history(history[:5], \"TEST\"), {})\n\nclass RadarTests(unittest.TestCase):\n    @staticmethod\n    def fund(daily=1.0, below=-10.0):\n        current = 90.0 if below < 0 else 104.0\n        minimum60, maximum60 = 88.0, 120.0\n        return {\n            \"\
        daily\": daily,\n            \"price_stats\": {\n                \"current_price\": current,\n                \"below_average_30\": below,\n                \"from_high_60\": (current / maximum60 - 1.0) * 100.0,\n                \"range_position_60\": (current - minimum60) / (maximum60 - minimum60) * 100.0,\n                \"price_date\": \"2026-09-05\",\n                \"coverage_60\": True, \"history_daily\": daily, \"previous_daily\": daily,\n                \"new_low_5\": daily <= 0,\n                \"period_days\": 365, \"period_minimum\": 80.0,\n                \"period_average\": 105.0, \"period_maximum\": 130.0,\n                \"from_period_low\": (current / 80.0 - 1.0) * 100.0,\n                \"from_period_high\": (current / 130.0 - 1.0) * 100.0,\n                \"to_period_average\": (105.0 / current - 1.0) * 100.0,\n            },\n        }\n\n    @staticmethod\n    def technical(change1=1.0, change5=1.0):\n        return {\n            'proxy_ticker': 'TEST',\
        \ 'market_date': '2026-09-05',\n            'change_1d': change1, 'change_5d': change5,\n        }\n\n    def test_missing_data_not_wait_signal(self):\n        signal = market.analyze_entry_zone({}, {})\n        self.assertEqual(signal['status_key'], 'unavailable')\n\n    def test_total_outage_not_no_entry(self):\n        row = {\n            'entry_analysis': market.analyze_entry_zone({}, {}),\n            'il_fund_data': {}, 'icon': '☁️', 'il_name_eng': 'Test',\n            'short_eng': 'Cloud', 'local_market': False,\n        }\n        text = formatter.build_combined_radar_message([row])\n        self.assertEqual(text, \"\")\n\n    def test_eligible_fund_not_displaced_by_missing(self):\n        signal = market.analyze_entry_zone(self.fund(), self.technical())\n        row = {'entry_analysis':signal, 'il_fund_data':{'daily':1}, 'icon':'☁️', 'il_name_eng':'Test', 'short_eng':'Cloud', 'year_analysis':{}}\n        missing = dict(row, entry_analysis=market.analyze_entry_zone({}, {}))\n\
        \        for item in (missing, row):\n            item.update(breadth_positive=3, breadth_total=4, local_market=False)\n        text = formatter.build_combined_radar_message([missing,row])\n        self.assertIn('Вход по модели подтверждён: 1', text)\n        self.assertNotIn('Test', text)\n\n    def test_fund_setup_is_independent_of_us_market(self):\n        for market_changes in ((1.0, 1.0), (-1.0, -1.0)):\n            with self.subTest(market_changes=market_changes):\n                self.assertEqual(market.analyze_entry_zone(\n                    self.fund(daily=-1), self.technical(*market_changes)\n                )[\"status_key\"], \"blocked\")\n                self.assertEqual(market.analyze_entry_zone(\n                    self.fund(), self.technical(*market_changes)\n                )[\"status_key\"], \"ready\")\n        self.assertEqual(market.analyze_entry_zone(self.fund(), {})[\"status_key\"], \"ready\")\n\n    def test_confirmation_requires_fund_and_us(self):\n     \
        \   fund = self.fund()\n        for scenario in (\"ready\", \"first_rise\", \"falling\", \"expensive\", \"short_history\"):\n            with self.subTest(scenario=scenario):\n                data = __import__(\"copy\").deepcopy(fund)\n                stats = data[\"price_stats\"]\n                if scenario == \"first_rise\":\n                    stats[\"previous_daily\"] = -1\n                elif scenario == \"falling\":\n                    stats[\"history_daily\"] = -1\n                elif scenario == \"expensive\":\n                    stats[\"below_average_30\"] = 5\n                elif scenario == \"short_history\":\n                    stats[\"coverage_60\"] = False\n                entry = market.analyze_entry_zone(data, self.technical())\n                row = {\"entry_analysis\": entry, \"breadth_total\": 3, \"breadth_positive\": 2}\n                marker = formatter._radar_verdict(row)[0]\n                self.assertEqual(marker == \"✅▲\", scenario == \"ready\")\n\
        \                row[\"entry_analysis\"][\"base1\"] = -1\n                self.assertNotEqual(formatter._radar_verdict(row)[0], \"✅▲\")\n\n\nclass MessageTests(unittest.TestCase):\n    def test_link_lengths_and_footer_do_not_create_extra_messages(self):\n        from modules.config import BOT_NAME\n        rows = self.rows()\n        headline = 'Акции CrowdStrike, HubSpot, Intuit, Cloudflare и Okta резко упали: что нужно знать'\n        for row in rows:\n            row['news'] = [{'title': headline, 'published': 1789776000,\n                            'url': 'https://example.com/news?tracking=' + 'x' * 900}]\n        text = formatter.build_telegram_message(rows)\n        chunks = telegram_sender.split_message(text)\n        self.assertEqual(len(chunks), 1)\n        self.assertEqual(chunks[0].count(headline), 1)\n        self.assertTrue(chunks[-1].endswith(BOT_NAME))\n        self.assertTrue(all(chunk.strip() != BOT_NAME for chunk in chunks))\n        self.assertTrue(all(telegram_sender.message_length(chunk)\
        \ <= 3900 for chunk in chunks))\n        long_news = '<blockquote expandable>\\n' + '\\n\\n'.join(\n            f'<b>Сектор {i}</b>\\nНовость {i}: ' + 'Текст новости. ' * 12 for i in range(30)\n        ) + '</blockquote>\\n\\n' + BOT_NAME\n        overflow = telegram_sender.split_message(long_news)\n        self.assertGreater(len(overflow), 1)\n        self.assertTrue(overflow[-1].endswith(BOT_NAME))\n        self.assertEqual(sum(chunk.count(BOT_NAME) for chunk in overflow), 1)\n        for i in range(30):\n            self.assertTrue(any(f'<b>Сектор {i}</b>\\nНовость {i}:' in chunk for chunk in overflow))\n        for chunk in overflow:\n            self.assertLessEqual(telegram_sender.message_length(chunk), 3900)\n\n    def rows(self, missing=False):\n        rows=[]\n        for config in SECTORS_CONFIG.values():\n            fund = dict(market.EMPTY_RETURNS) if missing else {'daily':1.0,'mtd':2.0,'ytd':3.0}\n            if not missing:\n                fund.update(RadarTests.fund())\n\
        \            year = RadarTests.technical()\n            year.update(proxy_ticker=config['proxy_ticker'], market_date='2026-09-05')\n            if not missing:\n                fund['price_stats']['price_date'] = '2026-09-05'\n            rows.append(dict(config, avg_change=1.0, base_date='2026-09-05',\n                             top_3_tickers=[('TEST',1.0)],\n                             news=['• \U0001F4F0 ' + 'Тестовая новость. ' * 7], il_fund_data=fund, year_analysis=year,\n                             entry_analysis=market.analyze_entry_zone(fund,year)))\n        return rows\n\n    def test_digest_format_and_delivery_limits(self):\n        rows = self.rows()\n        rows[1]['il_fund_data']['ytd'] = None\n        text = formatter.build_telegram_message(rows)\n        chunks = telegram_sender.split_message(text)\n        self.assertEqual(len(chunks), 1)\n        self.assertTrue(all(telegram_sender.message_length(chunk) <= 3900 for chunk in chunks))\n        self.assertEqual(text.count('<blockquote\
        \ expandable>'), 0)\n        self.assertLessEqual(text.count('Тестовая новость'), 1)\n        self.assertIn('<b>Коротко по рынку</b>', text)\n        self.assertIn('<b>Фонды Израиля</b>', text)\n        self.assertNotIn('<b>Одна новость</b>', text)\n        self.assertLessEqual(text.count('\U0001F4F0'), 2)\n        self.assertNotIn('Г N/A', text)\n        from modules.config import BOT_NAME\n        self.assertTrue(text.rstrip().endswith(BOT_NAME))\n        self.assertNotIn(app.BOT_VERSION, text)\n\n    def test_total_outage_short_report(self):\n        text=formatter.build_telegram_message(self.rows(missing=True))\n        self.assertIn('Израильские данные не получены',text)\n        self.assertNotIn('РАДАР ТОЧЕК ВХОДА',text)\n        self.assertNotIn('0/4',text)\n\n    def test_fund_analysis_uses_own_price_history_not_proxy_description(self):\n        text = formatter.build_telegram_message(self.rows())\n        self.assertIn('Barak WTI', text)\n        self.assertIn('+1.0% · мес\
        \ +2.0%', text)\n        self.assertNotIn('365д: мин', text)\n        self.assertNotIn('от пика', text)\n        self.assertNotIn('Ориентир', text)\n        self.assertNotIn('восходящий тренд', text)\n\n    def test_missing_fund_history_date_does_not_break_report(self):\n        rows = self.rows()\n        rows[0]['il_fund_data']['price_stats'].pop('price_date')\n        text = formatter.build_telegram_message(rows)\n        self.assertIn('Фонды Израиля', text)\n        self.assertIn('Barak WTI', text)\n\n    def test_digest_omits_removed_labels(self):\n        rows = self.rows()\n        rows[0]['il_fund_data']['price_stats']['price_date'] = '2026-09-04'\n        text = formatter.build_telegram_message(rows)\n        for label in ('США:', 'Цены фондов:', 'Стрелка —',\n                      'Фондов с другой датой NAV', 'Показываются последние завершённые'):\n            self.assertNotIn(label, text)\n\n    def test_radar_score_replaces_old_day_strength_column(self):\n        rows\
        \ = self.rows()\n        for row, change in zip(rows[:4], (1.0, 0.0, -1.0, None)):\n            row['avg_change'] = change\n        first_message = telegram_sender.split_message(\n            formatter.build_telegram_message(rows)\n        )[0]\n        self.assertIn('Radar', first_message)\n        self.assertIn('/100', first_message)\n        self.assertNotIn('Radar Score', first_message)\n        self.assertRegex(first_message, r\"[\U0001F7E2\U0001F7E1⚪\U0001F534]\\s*\\d{1,3}/100\")\n\n    def test_gap_requires_matching_dates(self):\n        rows = self.rows()\n        rows[0]['base_date'] = '2026-09-04'\n        rows[0]['il_fund_data']['daily'] = 10.0\n        text = formatter.build_telegram_message(rows)\n        self.assertNotIn(f\"<b>{rows[0]['short_eng']}</b> · база\", text)\n\n    def test_radar_message_is_explicitly_non_predictive(self):\n        rows = [{\n            'icon':'\U0001F6E2️', 'short_eng':'Oil', 'local_market':False,\n            'breadth_positive':3, 'breadth_total':4,\n\
        \        }]\n        rows[0].update(\n            il_name_eng='Barak Ultra WTI',\n            entry_analysis=market.analyze_entry_zone(RadarTests.fund(), RadarTests.technical()),\n        )\n        text = formatter.build_combined_radar_message(rows)\n        self.assertNotIn('TEST', text)\n        self.assertLess(len(text), 90)\n        self.assertIn('Вход по модели подтверждён: 1', text)\n        self.assertNotIn('покупать', text.lower())\n\n    def test_radar_uses_three_to_five_charts(self):\n        rows = self.rows()\n        for row in rows:\n            row.update(\n                breadth_positive=2, breadth_total=3,\n            )\n        text = formatter.build_combined_radar_message(rows)\n        self.assertNotIn('План базы:', text)\n        self.assertNotIn('60д: мин', text)\n        self.assertNotIn('От макс.', text)\n        self.assertEqual(\n            len(formatter.ordered_radar_rows(rows)[:formatter.radar_chart_target(rows)]), 3\n        )\n        for row in\
