        import textwrap
        import urllib.parse
        from datetime import datetime, timezone

        import aiohttp

        from modules.config import HEADERS, HTTP_TIMEOUT
        MAX_NEWS_AGE_HOURS = 48

        SECTOR_KEYWORDS = {
