          import asyncio,aiohttp
          from datetime import datetime,timezone,timedelta
          from modules.config import SECTORS_CONFIG
          from modules.market import fetch_all_yahoo_data,fetch_all_israeli_funds
          from modules.news import fetch_sector_news,fetch_ipo_full_analytics
          from modules.formatter import build_telegram_message,build_ipo_message
          from modules.telegram_sender import send_to_telegram
          def calculate_sector_score(avg_change:float)->int:
              return max(0,min(100,int(50+avg_change*15)))
          async def run_market_analytics():
              tickers=set()
              for cfg in SECTORS_CONFIG.values():
                  tickers.update(cfg["tickers"])
              market_data=await fetch_all_yahoo_data(list(tickers))
              il_results=await fetch_all_israeli_funds(SECTORS_CONFIG)
              async with aiohttp.ClientSession() as session:
                  results=[]
                  for key,cfg in SECTORS_CONFIG.items():
                      ticker_details=[
                          (ticker,market_data[ticker]["change"])
                          for ticker in cfg["tickers"]
                          if ticker in market_data and market_data[ticker]["price"]>0
                      ]
                      sorted_tickers=sorted(ticker_details,key=lambda item:abs(item[1]),reverse=True)
                      top_3=sorted_tickers[:3]
                      changes=[change for _,change in ticker_details]
                      avg=sum(changes)/len(changes) if changes else 0.0
                      results.append({
                          "short_eng":cfg["short_eng"],
                          "name":cfg["name"],
                          "icon":cfg["icon"],
                          "fund_id":cfg.get("fund_id",""),
                          "avg_change":round(avg,2),
                          "top_3_tickers":top_3,
                          "score":calculate_sector_score(avg),
                          "news":await fetch_sector_news(session,cfg["news_ticker"]),
                          "il_name_eng":cfg["il_name_eng"],
                          "il_fund_data":il_results.get(
                              key,
                              {"daily":0.0,"mtd":0.0,"ytd":0.0}
                          )
                      })
                  results.sort(key=lambda item:item["avg_change"],reverse=True)
                  await send_to_telegram(build_telegram_message(results))
          async def run_ipo_digest():
              await send_to_telegram(build_ipo_message(fetch_ipo_full_analytics()))
          async def main():
              now=datetime.now(timezone(timedelta(hours=3)))
              if now.weekday()==5 and now.hour==22:
                  await run_ipo_digest()
              else:
                  await run_market_analytics()
          if __name__=="__main__":
              asyncio.run(main())
          EOF
      - name: Install Dependencies & Playwright Browsers
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Run Analytics Engine
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
