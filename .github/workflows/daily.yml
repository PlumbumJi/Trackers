        def parse_funder_portfolio(body, fund_id, today):
            """Read the dated redemption quote and its own series, never evaluate JS."""
            def payload(name):
                match = re.search(r'\bvar\s+' + name + r'\s*=\s*', body)
                if not match:
                    return {}
                try:
                    return json.JSONDecoder().raw_decode(body[match.end():])[0]
                except (ValueError, TypeError):
                    return {}
            try:
                records = payload('fundData')['x']
                if len(records) != 1 or str(records[0]['fundNum']) != str(fund_id):
                    return [], {}
                record = records[0]
                day = date.fromisoformat(str(record['lastUpdate'])[:10])
                price = Decimal(str(record['sellPrice']))
                if day > today or not price.is_finite() or price <= 0:
                    return [], {}
                points = {}
                for row in payload('fundGraphData').get('x', []):
                    d, p = date.fromisoformat(row['c']), Decimal(str(row['p']))
                    if d > today or not p.is_finite() or p <= 0:
                        continue
                    if d in points and points[d] != p:
                        return [], {}
                    points[d] = p
                ordered = sorted(points.items())
                # Quote and graph must refer to the same last publication.
                if not ordered or ordered[-1] != (day, price):
                    return [], {}
                daily = Decimal(str(record['1day']))
                if not daily.is_finite():
                    return [], {}
                history = [{'date': d.isoformat(), 'price': str(p)} for d, p in ordered]
                return history, {'price': str(price), 'date': day.isoformat(),
                                 'daily': str(daily), 'source': 'Funder'}
            except (KeyError, TypeError, ValueError, ArithmeticError, AttributeError):
                return [], {}
        
        
