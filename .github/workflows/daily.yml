        def load_state():
            try:
                state = json.loads(STATE.read_text())
                if state.get('schema') == 1 and isinstance(state.get('events'), dict):
                    if not isinstance(state.get('last_scan'), dict):
                        state['last_scan'] = {}
                    count = state['last_scan'].get('readable_funds', 0)
                    if not isinstance(count, int) or count < 0:
                        state['last_scan']['readable_funds'] = 0
                    # Corrupt records cannot influence delivery or follow-up arithmetic.
                    for event in state['events'].values():
                        date.fromisoformat(event['date'])
                        date.fromisoformat(event['detected_on'])
                        price = float(event['price'])
                        if not math.isfinite(price) or price <= 0:
                            raise ValueError('invalid discovery price')
                        event['price'] = price
                        if not isinstance(event.get('checked_at'), str):
                            event['checked_at'] = ''
                        if event.get('kind') == 'monthly' and not math.isfinite(float(event['monthly'])):
                            raise ValueError('invalid monthly return')
                    if not isinstance(state.get('monthly_resets'), dict):
                        state['monthly_resets'] = {}
                    state['monthly_resets'] = {k: v for k, v in state['monthly_resets'].items()
                                               if isinstance(v, str) and re.fullmatch(r'\d{4}-\d{2}-\d{2}', v)}
                    return state
            except (OSError, ValueError, TypeError, KeyError, AttributeError):
                pass
            return {'schema': 1, 'events': {}}
        
        
        def save_state(state):
            temporary = STATE.with_suffix('.tmp')
