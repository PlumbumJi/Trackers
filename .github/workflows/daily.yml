name: Market Radar AI
'on':
  schedule:
  - cron: 20 8 * * *
    timezone: Asia/Jerusalem
  - cron: 15 23 * * *
    timezone: Asia/Jerusalem
  - cron: 30 8 1,10 * *
    timezone: Asia/Jerusalem
  workflow_dispatch:
    inputs:
      report_type:
        description: Report to send
        type: choice
        default: market
        options:
        - market
        - portfolio
        - alert
        - salary
        - ticker
      ticker_symbol:
        description: Ticker for ticker report
        type: string
        default: TTWO,NVDA
permissions:
  contents: read
concurrency:
  group: market-radar-ai-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Select Report Type
      id: report
      env:
        SCHEDULE: ${{ github.event.schedule }}
        MANUAL_MODE: ${{ inputs.report_type }}
      run: 'mode="${MANUAL_MODE:-market}"

        if [[ "$SCHEDULE" == ''20 8 * * *'' ]]; then mode=portfolio; fi

        if [[ "$SCHEDULE" == ''30 8 1,10 * *'' ]]; then mode=salary; fi

        echo "mode=$mode" >> "$GITHUB_OUTPUT"

        '
    - name: Restore Portfolio History
      if: steps.report.outputs.mode == 'portfolio'
      uses: actions/cache/restore@v5
      with:
        path: 'portfolio_snapshots.json

          portfolio_signal_journal.json

          '
        key: portfolio-v3-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: portfolio-v3-
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Restore Fund Discovery Journal
      if: steps.report.outputs.mode == 'portfolio' || steps.report.outputs.mode == 'salary'
      uses: actions/cache/restore@v5
      with:
        path: fund_movers_state.json
        key: fund-discovery-v1-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: fund-discovery-v1-
    - name: Restore Sector Analysis
      if: steps.report.outputs.mode == 'portfolio'
      uses: actions/cache/restore@v5
      with:
        path: portfolio_candidates.json
        key: sector-analysis-v3-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: sector-analysis-v3-
    - name: Deploy Architecture Files
      shell: bash
      run: "set -euo pipefail\nmkdir -p modules tests\ntouch modules/__init__.py\ncat << 'EOF' > requirements.txt\naiohttp==3.11.11\nplaywright==1.49.1\nmatplotlib==3.10.6\nEOF\n\ncat << 'EOF' > modules/config.py\nimport os\n\nBOT_TOKEN = os.getenv(\"BOT_TOKEN\")\nCHAT_ID = os.getenv(\"CHAT_ID\")\nBOT_NAME = \"Market Radar AI\"\nBOT_VERSION = \"v3.8\"\nHTTP_TIMEOUT = 15\n\nHEADERS = {\n    \"User-Agent\": (\n        \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) \"\n        \"AppleWebKit/537.36 (KHTML, like Gecko) \"\n        \"Chrome/126.0.0.0 Safari/537.36\"\n    ),\n    \"Accept\": \"text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8\",\n    \"Accept-Language\": \"he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7\",\n    \"Cache-Control\": \"no-cache\",\n    \"Pragma\": \"no-cache\",\n}\n\nSECTORS_CONFIG = {\n    \"Oil\": {\n        \"name\": \"Oil & Energy\", \"icon\": \"\U0001F6E2️\", \"short_eng\": \"Oil\",\n        \"news_ticker\": \"CL=F\", \"proxy_ticker\": \"USO\",\n        \"fund_id\"\
        : \"5141841\", \"il_name_eng\": \"Barak Ultra WTI\",\n        \"tickers\": [\"CL=F\", \"USO\", \"XLE\", \"XOP\"],\n    },\n    \"AI\": {\n        \"name\": \"Artificial Intelligence\", \"icon\": \"\U0001F916\", \"short_eng\": \"AI\",\n        \"news_ticker\": \"NVDA\", \"proxy_ticker\": \"BOTZ\",\n        \"fund_id\": \"5140744\", \"il_name_eng\": \"Migdal AI\",\n        \"tickers\": [\"GOOGL\", \"NVDA\", \"MSFT\", \"META\", \"AMD\", \"AMZN\", \"AVGO\"],\n    },\n    \"Cybersecurity\": {\n        \"name\": \"Cybersecurity\", \"icon\": \"\U0001F6E1️\", \"short_eng\": \"Cyber\",\n        \"news_ticker\": \"CIBR\", \"proxy_ticker\": \"CIBR\",\n        \"fund_id\": \"5131313\", \"il_name_eng\": \"Migdal Cyber Equity\",\n        \"tickers\": [\"FTNT\", \"PANW\", \"CRWD\", \"CSCO\", \"NET\", \"AVGO\", \"OKTA\"],\n    },\n    \"Gaming\": {\n        \"name\": \"Gaming Industry\", \"icon\": \"\U0001F3AE\", \"short_eng\": \"Game\",\n        \"news_ticker\": \"SONY\", \"proxy_ticker\": \"HERO\"\
        ,\n        \"fund_id\": \"5128624\", \"il_name_eng\": \"MTF Bluestar E-Games\",\n        \"tickers\": [\"RBLX\", \"TTWO\", \"EA\", \"SONY\", \"NTDOY\"],\n    },\n    \"Gold\": {\n        \"name\": \"Gold & Metals\", \"icon\": \"\U0001F947\", \"short_eng\": \"Gold\",\n        \"news_ticker\": \"GLD\", \"proxy_ticker\": \"GLD\",\n        \"fund_id\": \"5100961\", \"il_name_eng\": \"Meitav Gold\",\n        \"tickers\": [\"GC=F\", \"GLD\", \"GDX\", \"NEM\", \"SLV\"],\n    },\n    \"Clean Energy\": {\n        \"name\": \"Clean Energy\", \"icon\": \"☀️\", \"short_eng\": \"Clean\",\n        \"news_ticker\": \"FSLR\", \"proxy_ticker\": \"ICLN\",\n        \"fund_id\": \"5105218\", \"il_name_eng\": \"Altshuler Shaham Global Green\",\n        \"tickers\": [\"NRG\", \"CEG\", \"TLN\", \"GEV\", \"FSLR\", \"NXT\"],\n    },\n    \"Aerospace\": {\n        \"name\": \"Aerospace & Space\", \"icon\": \"✈️\", \"short_eng\": \"Aero\",\n        \"news_ticker\": \"XAR\", \"proxy_ticker\": \"XAR\",\n   \
        \     \"fund_id\": \"5136635\", \"il_name_eng\": \"KSM Active US Space & Defense\",\n        \"tickers\": [\"HEI\", \"RTX\", \"PL\", \"RKLB\", \"HWM\", \"BA\", \"NOC\", \"GD\", \"LMT\"],\n    },\n    \"Biotech\": {\n        \"name\": \"Biotech & Healthcare\", \"icon\": \"\U0001F9EC\", \"short_eng\": \"Bio\",\n        \"news_ticker\": \"IBB\", \"proxy_ticker\": \"IBB\",\n        \"fund_id\": \"5101183\", \"il_name_eng\": \"IBI Global Biotechnology\",\n        \"tickers\": [\"ABVX\", \"NKTR\", \"DRTS\", \"CYBN\", \"INSM\", \"CYTK\", \"AXSM\"],\n    },\n    \"Banking\": {\n        \"name\": \"Banking Sector\", \"icon\": \"\U0001F3E6\", \"short_eng\": \"Bank\",\n        \"news_ticker\": \"LUMI.TA\", \"proxy_ticker\": \"LUMI.TA\",\n        \"fund_id\": \"5139183\", \"il_name_eng\": \"Migdal Banks Equity\",\n        \"local_market\": True,\n        \"tickers\": [\"DSCT.TA\", \"MZTF.TA\", \"FIBI.TA\", \"LUMI.TA\", \"POLI.TA\"],\n    },\n    \"Cloud\": {\n        \"name\": \"Cloud Cybersecurity\"\
        , \"icon\": \"☁️\", \"short_eng\": \"Cloud\",\n        \"news_ticker\": \"CIBR\", \"proxy_ticker\": \"CIBR\",\n        \"fund_id\": \"5132220\", \"il_name_eng\": \"More Cloud Cyber\",\n        \"daily_base\": \"basket\",\n        \"tickers\": [\"PANW\", \"FTNT\", \"CRWD\", \"DDOG\", \"NET\", \"OKTA\", \"ZS\"],\n    },\n    \"EV\": {\n        \"name\": \"Electric Vehicles\", \"icon\": \"\U0001F697\", \"short_eng\": \"EV\",\n        \"news_ticker\": \"TSLA\", \"proxy_ticker\": \"DRIV\",\n        \"fund_id\": \"5132709\", \"il_name_eng\": \"IBI Global Electric Vehicles\",\n        \"tickers\": [\"TSLA\", \"RIVN\", \"LI\", \"NIO\", \"XPEV\", \"LCID\", \"BYDDY\"],\n    },\n}\nEOF\n\ncat << 'EOF' > modules/market.py\nimport asyncio\nimport json\nimport math\nimport re\nfrom datetime import datetime, timedelta, timezone\nfrom html.parser import HTMLParser\nfrom typing import Any, Optional\nfrom zoneinfo import ZoneInfo\n\nimport aiohttp\nfrom playwright.async_api import async_playwright\n\
        \nfrom modules.config import HEADERS, HTTP_TIMEOUT\n\nRETURN_KEYS = (\"daily\", \"mtd\", \"ytd\")\nEMPTY_RETURNS = {key: None for key in RETURN_KEYS}\nIL_CONCURRENCY = 3\nIL_REQUEST_TIMEOUT = 25\n\n\nclass _Node:\n    def __init__(self, tag=\"root\", attrs=()):\n        self.tag, self.attrs, self.children = tag, dict(attrs), []\n\n    def walk(self, tag=None):\n        if tag is None or self.tag == tag:\n            yield self\n        for child in self.children:\n            if isinstance(child, _Node):\n                yield from child.walk(tag)\n\n    def text(self):\n        if self.tag in {\"script\", \"style\", \"noscript\"}:\n            return \"\"\n        return \" \".join(c.text() if isinstance(c, _Node) else c for c in self.children)\n\n\nclass _FundHTML(HTMLParser):\n    \"\"\"Small stdlib DOM reader for the fund header and the returns table.\"\"\"\n    VOID = {\"area\", \"base\", \"br\", \"col\", \"embed\", \"hr\", \"img\", \"input\", \"link\", \"meta\", \"param\",\
        \ \"source\", \"track\", \"wbr\"}\n\n    def __init__(self, html):\n        super().__init__(convert_charrefs=True)\n        self.root = _Node()\n        self.stack = [self.root]\n        self.feed(html)\n        self.close()\n\n    def handle_starttag(self, tag, attrs):\n        # Bizportal contains unclosed spans inside cells. Boundaries stay explicit.\n        if tag in {\"tr\", \"td\", \"th\", \"li\"}:\n            self.handle_endtag(tag)\n        node = _Node(tag, attrs)\n        self.stack[-1].children.append(node)\n        if tag not in self.VOID:\n            self.stack.append(node)\n\n    def handle_startendtag(self, tag, attrs):\n        self.handle_starttag(tag, attrs)\n        self.handle_endtag(tag)\n\n    def handle_endtag(self, tag):\n        for index in range(len(self.stack) - 1, 0, -1):\n            if self.stack[index].tag == tag:\n                del self.stack[index:]\n                break\n\n    def handle_data(self, data):\n        self.stack[-1].children.append(data)\n\
        \n\ndef _clean_text(value):\n    return re.sub(r\"\\s+\", \" \", str(value).translate(dict.fromkeys(map(ord, \"\\u200e\\u200f\\u202a\\u202b\\u202c\\u2066\\u2067\\u2068\\u2069\"), None))).strip()\n\n\ndef parse_optional_float(value: Any) -> Optional[float]:\n    if value is None or isinstance(value, bool):\n        return None\n    if isinstance(value, (int, float)):\n        number = float(value)\n        return round(number, 2) if math.isfinite(number) else None\n    text = _clean_text(value).replace(\"−\", \"-\").replace(\"–\", \"-\")\n    if not text or text.lower() in {\"none\", \"null\", \"nan\", \"-\", \"—\", \"n/a\"}:\n        return None\n    text = text.replace(\"%\", \"\").replace(\" \", \"\")\n    if \",\" in text and \".\" in text:\n        text = text.replace(\",\", \"\")\n    elif \",\" in text:\n        text = text.replace(\",\", \".\")\n    if text.endswith(\"-\"):\n        text = \"-\" + text[:-1]\n    match = re.fullmatch(r\"[+-]?\\d+(?:\\.\\d+)?\", text)\n    if\
        \ not match:\n        return None\n    try:\n        number = float(match.group(0))\n    except ValueError:\n        return None\n    return round(number, 2) if math.isfinite(number) else None\n\n\ndef normalize_returns(data: dict) -> dict:\n    result = {}\n    for key in RETURN_KEYS:\n        value = parse_optional_float(data.get(key))\n        result[key] = value if value is None or value >= -100.0 else None\n    for key in (\n        \"source_url\", \"fetched_at\", \"update_date\", \"errors\", \"access_denied\",\n        \"source_missing\", \"price_stats\",\n    ):\n        if key in data:\n            result[key] = data[key]\n    return result\n\n\ndef valid_returns(data: Any) -> bool:\n    if not isinstance(data, dict):\n        return False\n    values = [parse_optional_float(data.get(key)) for key in RETURN_KEYS]\n    return any(value is not None and value >= -100.0 for value in values)\n\n\nasync def fetch_single_ticker(session: aiohttp.ClientSession, ticker: str) -> tuple[str,\
        \ dict]:\n    api_ticker = f\"^{ticker}\" if ticker == \"OVX\" else ticker\n    url = f\"https://query1.finance.yahoo.com/v8/finance/chart/{api_ticker}?range=10d&interval=1d\"\n    try:\n        async with session.get(url, headers=HEADERS) as response:\n            if response.status == 200:\n                result = (await response.json()).get(\"chart\", {}).get(\"result\") or []\n                if result:\n                    chart = result[0]\n                    timestamps = chart.get(\"timestamp\") or []\n                    quotes = chart.get(\"indicators\", {}).get(\"quote\") or []\n                    closes = quotes[0].get(\"close\") or [] if quotes else []\n                    points = [\n                        (int(timestamp), float(close))\n                        for timestamp, close in zip(timestamps, closes)\n                        if timestamp is not None and close is not None and float(close) > 0\n                    ]\n                    regular = chart.get(\"\
        meta\", {}).get(\"currentTradingPeriod\", {}).get(\"regular\", {})\n                    now_timestamp = int(datetime.now(timezone.utc).timestamp())\n                    session_start = int(regular.get(\"start\") or 0)\n                    session_end = int(regular.get(\"end\") or 0)\n                    # Yahoo's last daily candle is provisional while that market is open.\n                    if (\n                        len(points) >= 3\n                        and session_start <= now_timestamp < session_end\n                        and points[-1][0] >= session_start\n                    ):\n                        points.pop()\n                    if len(points) >= 2:\n                        timestamp, price = points[-1]\n                        previous_close = points[-2][1]\n                        change = ((price - previous_close) / previous_close) * 100.0\n                        timezone_name = chart.get(\"meta\", {}).get(\"exchangeTimezoneName\") or \"UTC\"\n        \
        \                try:\n                            market_date = datetime.fromtimestamp(timestamp, ZoneInfo(timezone_name)).date().isoformat()\n                        except Exception:\n                            market_date = datetime.fromtimestamp(timestamp, timezone.utc).date().isoformat()\n                        return ticker, {\n                            \"price\": round(price, 2),\n                            \"change\": round(change, 2),\n                            \"market_date\": market_date,\n                        }\n            print(f\"⚠️ Yahoo ticker {ticker}: HTTP {response.status}\")\n    except Exception as error:\n        print(f\"⚠️ Yahoo ticker {ticker}: {error}\")\n    return ticker, {\n        \"price\": None, \"change\": None, \"market_date\": None,\n    }\n\n\nasync def fetch_all_yahoo_data(tickers: list[str]) -> dict:\n    timeout = aiohttp.ClientTimeout(total=HTTP_TIMEOUT)\n    connector = aiohttp.TCPConnector(limit=12, limit_per_host=8, ttl_dns_cache=300)\n\
        \    async with aiohttp.ClientSession(timeout=timeout, connector=connector) as session:\n        return dict(await asyncio.gather(*[\n            fetch_single_ticker(session, ticker) for ticker in tickers\n        ]))\n\n\n\n\n\n\n\n\ndef parse_bizportal_page(html: str, fund_id: str) -> Optional[dict]:\n    root = _FundHTML(html).root\n    page_text = _clean_text(root.text())\n    stock_match = re.search(r\"\\bvar\\s+stockID\\s*=\\s*['\\\"]?(\\d+)\", html)\n    visible_match = re.search(r\"מספר נייר\\s+(\\d{6,8})\\b\", page_text)\n    identities = [m.group(1) for m in (stock_match, visible_match) if m]\n    if not identities or any(value != str(fund_id) for value in identities):\n        print(f\"⚠️ Bizportal {fund_id}: fund identity missing or mismatched\")\n        return None\n\n    data = dict(EMPTY_RETURNS)\n    data[\"source_missing\"] = []\n\n    def read_value(key, text):\n        value = parse_optional_float(text)\n        if value is None and _clean_text(text) in {\"--\"\
        , \"--%\", \"—\", \"—%\", \"N/A\"}:\n            data[\"source_missing\"].append(key)\n        return value\n    for block in root.walk():\n        if block.attrs.get(\"id\") == \"paper_change\":\n            for node in block.walk(\"span\"):\n                if \"percent\" in node.attrs.get(\"class\", \"\").split():\n                    data[\"daily\"] = read_value(\"daily\", node.text())\n                    break\n        if \"paper_statistics_row\" in block.attrs.get(\"class\", \"\").split():\n            for item in block.walk(\"li\"):\n                labels = [n for n in item.walk(\"span\") if \"label\" in n.attrs.get(\"class\", \"\").split()]\n                nums = [n for n in item.walk(\"span\") if \"num\" in n.attrs.get(\"class\", \"\").split()]\n                if labels and nums:\n                    label = _clean_text(labels[0].text()).strip(\"% :：\")\n                    key = {\"החודש\": \"mtd\", \"השנה\": \"ytd\"}.get(label)\n                    if key:\n      \
        \                  data[key] = read_value(key, nums[0].text())\n\n    date_match = re.search(r\"(?:תאריך עדכון|מועד עדכון אחרון)\\s*[:\\-]?\\s*(\\d{1,2}[./]\\d{1,2}[./]\\d{4})\", page_text)\n    if date_match:\n        data[\"update_date\"] = date_match.group(1)\n    data = normalize_returns(data)\n    data[\"source_missing\"] = sorted({key for key in data[\"source_missing\"] if data.get(key) is None})\n    print(f\"\U0001F50D Bizportal {fund_id}: \" + \", \".join(f\"{key}={data[key]}\" for key in RETURN_KEYS))\n    return data if valid_returns(data) else None\n\n\ndef merge_returns(current: dict, extra: dict) -> dict:\n    merged = dict(current)\n    for key, value in extra.items():\n        if key in {\"errors\", \"source_missing\"}:\n            merged[key] = list(dict.fromkeys(merged.get(key, []) + value))\n        elif key == \"access_denied\":\n            merged[key] = bool(value or merged.get(key))\n        elif merged.get(key) is None and value is not None:\n           \
        \ merged[key] = value\n    result = normalize_returns(merged)\n    result[\"source_missing\"] = [key for key in result.get(\"source_missing\", []) if result.get(key) is None]\n    return result\n\n\ndef is_access_challenge(html: str) -> bool:\n    title = re.search(r\"<title[^>]*>(.*?)</title>\", html, re.S | re.I)\n    title = title.group(1).lower() if title else \"\"\n    return any(word in title for word in (\"access denied\", \"just a moment\", \"captcha\", \"verify you are human\"))\n\n\nasync def fetch_bizportal_page(session: aiohttp.ClientSession, fund_id: str, limiter=None, denied=None) -> tuple[str, dict]:\n    general_url = f\"https://www.bizportal.co.il/mutualfunds/quote/generalview/{fund_id}\"\n    performance_url = f\"https://www.bizportal.co.il/mutualfunds/quote/performance/{fund_id}\"\n    headers = dict(HEADERS, Referer=\"https://www.bizportal.co.il/mutualfunds\")\n\n    limiter = limiter or asyncio.Semaphore(IL_CONCURRENCY)\n    denied = denied or asyncio.Event()\n\
        \    errors = []\n\n    async def load(url: str) -> Optional[dict]:\n        page_name = \"general\" if \"generalview\" in url else \"performance\"\n        for attempt in (1, 2):\n            try:\n                # Waiting for our own slot happens BEFORE the HTTP timeout starts.\n                async with limiter:\n                    if denied.is_set():\n                        errors.append(f\"{page_name}: access restricted\")\n                        return None\n                    timeout = aiohttp.ClientTimeout(total=IL_REQUEST_TIMEOUT, sock_connect=10, sock_read=20)\n                    async with session.get(url, headers=headers, timeout=timeout, allow_redirects=True) as response:\n                        status = response.status\n                        html = await response.text(errors=\"ignore\")\n                    print(f\"\U0001F310 Bizportal {fund_id} {page_name}: HTTP {status}, bytes={len(html)}, attempt={attempt}\")\n                    if status in {401, 403,\
        \ 429} or is_access_challenge(html):\n                        denied.set()\n                        errors.append(f\"{page_name}: access restricted (HTTP {status})\")\n                        return None\n                    if status == 200:\n                        result = parse_bizportal_page(html, fund_id)\n                        if result:\n                            result[\"source_url\"] = url\n                            result[\"fetched_at\"] = datetime.now(timezone.utc).isoformat()\n                        else:\n                            errors.append(f\"{page_name}: expected fund fields not found\")\n                        return result\n                    if status < 500:\n                        errors.append(f\"{page_name}: HTTP {status}\")\n                        return None\n                    errors.append(f\"{page_name}: HTTP {status}\")\n            except (asyncio.TimeoutError, aiohttp.ClientError) as error:\n                errors.append(f\"{page_name}:\
        \ {type(error).__name__}\")\n                print(f\"⚠️ Bizportal {fund_id} {page_name}: {type(error).__name__}, attempt={attempt}\")\n            except Exception as error:\n                errors.append(f\"{page_name}: parser {type(error).__name__}\")\n                return None\n            if attempt == 1:\n                await asyncio.sleep(1)\n        return None\n\n    general = await load(general_url)\n    needs_backup = not general or any(\n        general.get(key) is None and key not in general.get(\"source_missing\", [])\n        for key in RETURN_KEYS\n    )\n    performance = await load(performance_url) if needs_backup and not denied.is_set() else None\n    result = merge_returns(general or dict(EMPTY_RETURNS), performance or {})\n    result[\"errors\"] = list(dict.fromkeys(errors))\n    result[\"access_denied\"] = denied.is_set()\n    return fund_id, result\n\n\nasync def fetch_bizportal_playwright(fund_ids: set[str], existing=None) -> dict:\n    results = {}\n \
        \   existing = existing or {}\n    try:\n        async with async_playwright() as playwright:\n            browser = await playwright.chromium.launch(headless=True, args=[\"--disable-dev-shm-usage\"])\n            try:\n                async with asyncio.timeout(150):\n                    context = await browser.new_context(locale=\"he-IL\")\n                    page = await context.new_page()\n                    for fund_id in sorted(fund_ids):\n                        current = dict(existing.get(fund_id) or EMPTY_RETURNS)\n                        results[fund_id] = current\n                        for page_name in (\"generalview\", \"performance\"):\n                            keys = RETURN_KEYS\n                            if all(current.get(key) is not None or key in current.get(\"source_missing\", []) for key in keys):\n                                continue\n                            url = f\"https://www.bizportal.co.il/mutualfunds/quote/{page_name}/{fund_id}\"\n    \
        \                        try:\n                                response = await page.goto(url, wait_until=\"domcontentloaded\", timeout=18000)\n                                status = response.status if response else 0\n                                html = await page.content()\n                                if status in {401, 403, 429} or is_access_challenge(html):\n                                    current[\"access_denied\"] = True\n                                    current.setdefault(\"errors\", []).append(f\"browser: access restricted (HTTP {status})\")\n                                    return results\n                                if status != 200:\n                                    current.setdefault(\"errors\", []).append(f\"browser {page_name}: HTTP {status}\")\n                                    continue\n                                try:\n                                    await page.wait_for_selector(\"#paper_change .percent\", timeout=4000)\n     \
        \                           except Exception:\n                                    pass\n                                data = parse_bizportal_page(await page.content(), fund_id)\n                                if data:\n                                    data.update(source_url=url, fetched_at=datetime.now(timezone.utc).isoformat())\n                                    current = merge_returns(current, data)\n                                    current[\"access_denied\"] = False\n                                    results[fund_id] = current  # Save BEFORE another navigation can fail.\n                            except Exception as error:\n                                current.setdefault(\"errors\", []).append(f\"browser {page_name}: {type(error).__name__}\")\n                                print(f\"⚠️ Browser {fund_id} {page_name}: {type(error).__name__}\")\n            finally:\n                await browser.close()\n    except Exception as error:\n        print(f\"⚠️ Browser\
        \ fallback stopped: {type(error).__name__}; keeping partial results\")\n    return results\n\n\ndef parse_bizportal_history_response(payload: str) -> tuple[list[dict], int]:\n    \"\"\"Parse Bizportal's ~pages^[JSON] graph response without guessing values.\"\"\"\n    text = str(payload or \"\").strip()\n    match = re.match(r\"~(\\d+)\\^(.*)$\", text, re.S)\n    if not match:\n        return [], 0\n    try:\n        rows = json.loads(match.group(2))\n    except (json.JSONDecodeError, TypeError):\n        return [], 0\n    if not isinstance(rows, list):\n        return [], 0\n    result = []\n    for row in rows:\n        if not isinstance(row, dict):\n            continue\n        date_text = str(row.get(\"DateObj\") or \"\")\n        price = parse_optional_float(row.get(\"Rate\"))\n        if not re.fullmatch(r\"\\d{8}\", date_text) or price is None or price <= 0:\n            continue\n        try:\n            day = datetime.strptime(date_text, \"%Y%m%d\").date()\n        except\
        \ ValueError:\n            continue\n        result.append({\"date\": day.isoformat(), \"price\": price})\n    return result, max(1, int(match.group(1)))\n\n\ndef calculate_price_stats(history: list[dict]) -> dict:\n    points = []\n    for row in history:\n        try:\n            day = datetime.strptime(str(row[\"date\"]), \"%Y-%m-%d\").date()\n            price = float(row[\"price\"])\n        except (KeyError, TypeError, ValueError):\n            continue\n        if math.isfinite(price) and price > 0:\n            points.append((day, price))\n    points = sorted(dict(points).items())\n    if len(points) < 15:\n        return {}\n    last_day, current = points[-1]\n    window30 = [(day, price) for day, price in points if day >= last_day - timedelta(days=29)]\n    window60 = [(day, price) for day, price in points if day >= last_day - timedelta(days=59)]\n    if len(window30) < 8 or len(window60) < 15:\n        return {}\n    average30 = sum(price for _, price in window30) / len(window30)\n\
        \    minimum60 = min(price for _, price in window60)\n    maximum60 = max(price for _, price in window60)\n    prior_low = min(price for _, price in points[-6:-1])\n    history_daily = (current / points[-2][1] - 1.0) * 100.0\n    previous_daily = (points[-2][1] / points[-3][1] - 1.0) * 100.0\n    covered60 = points[0][0] <= last_day - timedelta(days=59)\n    period_start = max(points[0][0], last_day - timedelta(days=364))\n    period = [(day, price) for day, price in points if day >= period_start]\n    period_average = sum(price for _, price in period) / len(period)\n    period_minimum = min(price for _, price in period)\n    period_maximum = max(price for _, price in period)\n\n    def range_position(price: float, minimum: float, maximum: float) -> Optional[float]:\n        spread = maximum - minimum\n        if spread <= 0:\n            return None\n        return round((price - minimum) / spread * 100.0, 2)\n\n    return {\n        \"chart_history\": [{\"date\": day.isoformat(),\
        \ \"price\": price} for day, price in points[-400:]],\n        \"current_price\": round(current, 2),\n        \"price_date\": last_day.isoformat(),\n        \"below_average_30\": round((current / average30 - 1.0) * 100.0, 2),\n        \"from_high_60\": round((current / maximum60 - 1.0) * 100.0, 2),\n        \"range_position_60\": range_position(current, minimum60, maximum60),\n        \"coverage_60\": covered60,\n        \"history_daily\": round(history_daily, 4),\n        \"previous_daily\": round(previous_daily, 4),\n        \"new_low_5\": current <= prior_low,\n        \"period_days\": (last_day - period[0][0]).days + 1,\n        \"period_average\": round(period_average, 2),\n        \"period_minimum\": round(period_minimum, 2),\n        \"period_maximum\": round(period_maximum, 2),\n        \"from_period_low\": round((current / period_minimum - 1.0) * 100.0, 2),\n        \"from_period_high\": round((current / period_maximum - 1.0) * 100.0, 2),\n        \"to_period_average\":\
        \ round((period_average / current - 1.0) * 100.0, 2),\n    }\n\n\nasync def fetch_bizportal_price_history(\n    session: aiohttp.ClientSession,\n    fund_id: str,\n    limiter: asyncio.Semaphore,\n    denied: asyncio.Event,\n    *, max_pages: int = 12,\n) -> list[dict]:\n    if denied.is_set():\n        return []\n    url = \"https://www.bizportal.co.il/ajax/biz_papers_helper.ashx\"\n    headers = dict(\n        HEADERS,\n        Referer=f\"https://www.bizportal.co.il/mutualfunds/quote/graphs/{fund_id}\",\n        Accept=\"application/json,text/plain,*/*\",\n    )\n    all_rows = []\n    pages = 1\n    for page_number in range(1, min(max_pages, 12) + 1):\n        if page_number > pages:\n            break\n        params = {\n            \"action\": \"get_paper_yearly_graph\", \"request_type\": \"2\",\n            # period=1 returns only the latest few observations. period=3 is\n            # required for the 60-day and longer fund-price calculations.\n            \"paper_id\": fund_id,\
        \ \"period\": \"3\", \"page_number\": str(page_number),\n        }\n        try:\n            async with limiter:\n                timeout = aiohttp.ClientTimeout(total=IL_REQUEST_TIMEOUT, sock_connect=10, sock_read=20)\n                async with session.get(url, params=params, headers=headers, timeout=timeout) as response:\n                    body = await response.text(errors=\"ignore\")\n            if response.status in {401, 403, 429} or is_access_challenge(body):\n                denied.set()\n                print(f\"⚠️ Bizportal history {fund_id}: access restricted (HTTP {response.status})\")\n                return []\n            if response.status != 200 or not body.strip():\n                print(f\"⚠️ Bizportal history {fund_id}: HTTP {response.status}, empty={not bool(body.strip())}\")\n                break\n            rows, pages = parse_bizportal_history_response(body)\n            if pages == 0:\n                print(f\"⚠️ Bizportal history {fund_id}: unexpected\
        \ response format, bytes={len(body)}\")\n            print(f\"\U0001F4C9 Bizportal history {fund_id}: page={page_number}/{pages}, rows={len(rows)}\")\n            if not rows:\n                break\n            all_rows.extend(rows)\n        except (asyncio.TimeoutError, aiohttp.ClientError) as error:\n            print(f\"⚠️ Bizportal history {fund_id}: {type(error).__name__}\")\n            break\n    return sorted({row[\"date\"]: row for row in all_rows}.values(), key=lambda row: row[\"date\"])\n\n\nasync def fetch_all_israeli_funds(sectors_config: dict) -> dict:\n    fund_to_sector = {\n        str(config[\"fund_id\"]): sector\n        for sector, config in sectors_config.items()\n        if config.get(\"fund_id\")\n    }\n    fund_ids = set(fund_to_sector)\n    by_fund_id = {}\n    timeout = aiohttp.ClientTimeout(total=IL_REQUEST_TIMEOUT)\n    connector = aiohttp.TCPConnector(limit=IL_CONCURRENCY, limit_per_host=IL_CONCURRENCY, ttl_dns_cache=300)\n    limiter, denied = asyncio.Semaphore(IL_CONCURRENCY),\
        \ asyncio.Event()\n    async with aiohttp.ClientSession(timeout=timeout, connector=connector) as session:\n        responses = await asyncio.gather(*[\n            fetch_bizportal_page(session, fund_id, limiter, denied) for fund_id in sorted(fund_ids)\n        ])\n        for fund_id, data in responses:\n            by_fund_id[fund_id] = data\n        # The AJAX history endpoint is independent from the HTML pages. A 403\n        # on the page must not suppress this second source.\n        history_denied = asyncio.Event()\n        histories = await asyncio.gather(*[\n            fetch_bizportal_price_history(session, fund_id, limiter, history_denied)\n            for fund_id in sorted(fund_ids)\n        ])\n        for fund_id, history in zip(sorted(fund_ids), histories):\n            if history:\n                by_fund_id[fund_id][\"price_stats\"] = calculate_price_stats(history)\n\n    fallback_ids = {\n        fund_id for fund_id in fund_ids\n        if any(\n            by_fund_id.get(fund_id,\
        \ {}).get(key) is None\n            and key not in by_fund_id.get(fund_id, {}).get(\"source_missing\", [])\n            for key in RETURN_KEYS\n        )\n    }\n    if fallback_ids:\n        print(f\"ℹ️ Playwright fallback: {len(fallback_ids)} funds\")\n        fallback_data = await fetch_bizportal_playwright(fallback_ids, by_fund_id)\n        for fund_id, fallback in fallback_data.items():\n            current = by_fund_id.get(fund_id, dict(EMPTY_RETURNS))\n            by_fund_id[fund_id] = merge_returns(current, fallback)\n\n    results = {}\n    for fund_id, sector in fund_to_sector.items():\n        data = by_fund_id.get(fund_id)\n        results[sector] = normalize_returns(data or EMPTY_RETURNS)\n        missing = [key for key in RETURN_KEYS if results[sector].get(key) is None]\n        if missing:\n            print(f\"⚠️ IL {sector} ({fund_id}): missing={missing}; errors={results[sector].get('errors', [])}\")\n    daily_count = sum(row.get(\"daily\") is not None for row in\
        \ results.values())\n    complete = sum(all(row.get(key) is not None for key in RETURN_KEYS) for row in results.values())\n    print(f\"\U0001F4CA Israeli funds: daily={daily_count}/{len(fund_ids)}, complete={complete}/{len(fund_ids)}\")\n    return results\n\n\nasync def fetch_ticker_history(session: aiohttp.ClientSession, ticker: str) -> list[dict]:\n    \"\"\"Fetch completed daily closes used for one- and five-session confirmation.\"\"\"\n    api_ticker = f\"^{ticker}\" if ticker == \"OVX\" else ticker\n    url = f\"https://query1.finance.yahoo.com/v8/finance/chart/{api_ticker}?range=1y&interval=1d\"\n    try:\n        async with session.get(url, headers=HEADERS) as response:\n            if response.status != 200:\n                print(f\"⚠️ Yahoo history {ticker}: HTTP {response.status}\")\n                return []\n            results = (await response.json()).get(\"chart\", {}).get(\"result\") or []\n            if not results:\n                return []\n        chart =\
        \ results[0]\n        timestamps = chart.get(\"timestamp\") or []\n        quotes = chart.get(\"indicators\", {}).get(\"quote\") or []\n        if not quotes:\n            return []\n        closes = quotes[0].get(\"close\") or []\n        history = []\n        for timestamp, raw_close in zip(timestamps, closes):\n            close = parse_optional_float(raw_close)\n            if timestamp is None or close is None or close <= 0:\n                continue\n            history.append({\"timestamp\": int(timestamp), \"close\": close})\n        regular = (chart.get(\"meta\") or {}).get(\"currentTradingPeriod\", {}).get(\"regular\", {})\n        start, end = int(regular.get(\"start\") or 0), int(regular.get(\"end\") or 0)\n        now = int(datetime.now(timezone.utc).timestamp())\n        if start <= now < end:\n            history = [point for point in history if point[\"timestamp\"] < start]\n        return sorted(history, key=lambda item: item[\"timestamp\"])\n    except Exception\
        \ as error:\n        print(f\"⚠️ Yahoo history {ticker}: {error}\")\n        return []\n\n\ndef analyze_year_history(history: list[dict], ticker: str) -> dict:\n    if len(history) < 6:\n        return {}\n    latest, base = history[-1], history[-6]\n    if base[\"close\"] <= 0:\n        return {}\n    return {\n        \"proxy_ticker\": ticker,\n        \"market_date\": datetime.fromtimestamp(latest[\"timestamp\"], timezone.utc).date().isoformat(),\n        \"change_5d\": round((latest[\"close\"] / base[\"close\"] - 1) * 100, 2),\n        \"change_1d\": round((latest[\"close\"] / history[-2][\"close\"] - 1) * 100, 2),\n    }\n\n\ndef analyze_entry_zone(fund_data: dict, market_data: dict) -> dict:\n    # The setup belongs to the fund; US data never creates or upgrades it here.\n    stats = fund_data.get(\"price_stats\") or {}\n    keys = (\n        \"below_average_30\", \"from_high_60\", \"range_position_60\",\n        \"history_daily\", \"previous_daily\",\n    )\n    values = {key:\
        \ parse_optional_float(stats.get(key)) for key in keys}\n    if not stats.get(\"coverage_60\") or any(v is None for v in values.values()):\n        return {\"status_key\": \"unavailable\", \"candidate\": False}\n    daily = values[\"history_daily\"]\n    discounted = values[\"below_average_30\"] <= -3\n    low_zone = values[\"range_position_60\"] <= 30\n    pullback = values[\"from_high_60\"] <= -3\n    candidate = discounted and low_zone and pullback\n    if not candidate:\n        status = \"watch\"\n    elif daily <= 0 or stats.get(\"new_low_5\"):\n        status = \"blocked\"\n    elif values[\"previous_daily\"] > 0:\n        status = \"ready\"\n    else:\n        status = \"forming\"\n    return {\n        \"status_key\": status, \"candidate\": candidate,\n        \"range_position_60\": values[\"range_position_60\"],\n        \"daily\": daily, \"price_date\": stats.get(\"price_date\", \"\"),\n        \"base5\": parse_optional_float(market_data.get(\"change_5d\")),\n        \"\
        base1\": parse_optional_float(market_data.get(\"change_1d\")),\n        \"base_date\": market_data.get(\"market_date\", \"\"),\n        \"proxy_ticker\": market_data.get(\"proxy_ticker\", \"\"),\n    }\n\n\nasync def fetch_all_year_analytics(sectors_config: dict) -> dict:\n    timeout = aiohttp.ClientTimeout(total=HTTP_TIMEOUT + 20)\n    connector = aiohttp.TCPConnector(limit=8, limit_per_host=6, ttl_dns_cache=300)\n    async with aiohttp.ClientSession(timeout=timeout, connector=connector) as session:\n        tasks = {\n            sector: asyncio.create_task(fetch_ticker_history(session, config[\"proxy_ticker\"]))\n            for sector, config in sectors_config.items()\n            if config.get(\"proxy_ticker\")\n        }\n        results = {}\n        for sector, task in tasks.items():\n            ticker = sectors_config[sector][\"proxy_ticker\"]\n            analysis = analyze_year_history(await task, ticker)\n            if analysis:\n                results[sector] = analysis\n\
        \            else:\n                print(f\"⚠️ Base history unavailable: {sector} ({ticker})\")\n    print(f\"\U0001F4CA Base confirmation data: {len(results)}/{len(sectors_config)}\")\n    return results\nEOF\n\ncat << 'EOF' > modules/news.py\nimport asyncio\nimport html\nimport re\nimport textwrap\nimport urllib.parse\nfrom datetime import datetime, timezone\nfrom zoneinfo import ZoneInfo\n\nimport aiohttp\n\nfrom modules.config import HEADERS, HTTP_TIMEOUT\nMAX_NEWS_AGE_HOURS = 48\n\nSECTOR_QUERIES = {\n    \"Oil\": \"crude oil OPEC\", \"AI\": \"artificial intelligence semiconductor\",\n    \"Cyber\": \"cybersecurity CrowdStrike\", \"Game\": \"gaming Nintendo Roblox\",\n    \"Gold\": \"gold silver mining\", \"Clean\": \"solar renewable energy\",\n    \"Aero\": \"aerospace defense\", \"Bio\": \"biotechnology clinical trial\",\n    \"Bank\": \"Bank Leumi Hapoalim\", \"Cloud\": \"cloud security software\",\n    \"EV\": \"electric vehicles Tesla\",\n}\n\nSECTOR_KEYWORDS = {\n   \
        \ \"Oil\": [\"oil\", \"crude\", \"wti\", \"brent\", \"opec\", \"refinery\"],\n    \"AI\": [\"ai\", \"artificial intelligence\", \"chip\", \"gpu\", \"semiconductor\", \"data center\"],\n    \"Cyber\": [\"cyber\", \"security\", \"breach\", \"ransomware\", \"hack\", \"cloud security\"],\n    \"Game\": [\"gaming\", \"video game\", \"console\", \"playstation\", \"xbox\"],\n    \"Gold\": [\"gold\", \"silver\", \"precious metal\", \"bullion\"],\n    \"Clean\": [\n        \"solar\", \"renewable\", \"clean energy\", \"green energy\", \"wind\", \"power grid\",\n        \"ge vernova\", \"constellation energy\", \"talen energy\", \"first solar\",\n        \"nextracker\", \"nrg energy\",\n    ],\n    \"Aero\": [\"aerospace\", \"defense\", \"aircraft\", \"pentagon\", \"missile\", \"satellite\"],\n    \"Bio\": [\"biotech\", \"biotechnology\", \"drug\", \"fda\", \"pharma\", \"clinical\"],\n    \"Bank\": [\"bank leumi\", \"hapoalim\", \"mizrahi\", \"israeli bank\"],\n    \"Cloud\": [\"cloud\", \"\
        software\", \"saas\", \"data center\", \"cybersecurity\"],\n    \"EV\": [\"ev\", \"electric vehicle\", \"battery\", \"tesla\"],\n}\n\nSECTOR_COMPANY_ANCHORS = {\n    \"Oil\": [\"exxon\", \"chevron\", \"valero\", \"shell\", \"conocophillips\"],\n    \"AI\": [\n        \"nvidia\", \"amd\", \"broadcom\", \"microsoft\", \"alphabet\", \"google\",\n        \"amazon\", \"meta platforms\", \"palantir\",\n    ],\n    \"Cyber\": [\n        \"crowdstrike\", \"palo alto\", \"fortinet\", \"cloudflare\", \"okta\", \"cisco\",\n        \"zscaler\",\n    ],\n    \"Game\": [\"roblox\", \"take-two\", \"electronic arts\", \"sony\", \"nintendo\"],\n    \"Gold\": [\"newmont\", \"barrick\", \"gold miners\"],\n    \"Clean\": [\n        \"ge vernova\", \"constellation energy\", \"talen energy\", \"first solar\",\n        \"nextracker\", \"nrg energy\", \"enphase\", \"solaredge\",\n    ],\n    \"Aero\": [\n        \"boeing\", \"lockheed martin\", \"northrop grumman\", \"raytheon\", \"rtx\",\n        \"rocket\
        \ lab\", \"general dynamics\", \"heico\",\n    ],\n    \"Bio\": [\n        \"abivax\", \"nektar\", \"alpha tau\", \"cybin\", \"insmed\", \"cytokinetics\",\n        \"axsome\",\n    ],\n    \"Bank\": [\n        \"bank leumi\", \"leumi\", \"hapoalim\", \"mizrahi\", \"discount bank\",\n        \"first international bank\",\n    ],\n    \"Cloud\": [\n        \"datadog\", \"cloudflare\", \"zscaler\", \"okta\", \"palo alto\", \"crowdstrike\",\n        \"fortinet\",\n    ],\n    \"EV\": [\"tesla\", \"rivian\", \"lucid\", \"nio\", \"xpeng\", \"li auto\", \"byd\"],\n}\n\nLOW_VALUE_PHRASES = (\n    \"stocks to watch\", \"should you buy\", \"could dominate\", \"here's what\",\n    \"biggest risk\", \"street calls\", \"top stocks\", \"best stocks\", \"stock picks\",\n    \"millionaire-maker\", \"no-brainer\", \"motley fool\", \"zacks rank\",\n)\n\nHIGH_VALUE_PHRASES = (\n    \"earnings\", \"revenue\", \"guidance\", \"forecast\", \"margin\", \"backlog\",\n    \"contract\", \"approval\", \"regulatory\"\
        , \"export\", \"capex\", \"data center\",\n    \"ai chip\", \"gpu\", \"bookings\", \"release date\", \"delay\", \"launch\",\n)\n\nCOMPANY_QUALITY_TERMS = {\n    \"NVDA\": [\n        \"nvidia\", \"gpu\", \"blackwell\", \"ai chip\", \"data center\", \"hyperscaler\",\n        \"capex\", \"export\", \"cuda\", \"gross margin\",\n    ],\n    \"TTWO\": [\n        \"take-two\", \"take two\", \"gta\", \"grand theft auto\", \"rockstar\",\n        \"bookings\", \"game release\", \"launch\", \"delay\", \"guidance\",\n    ],\n}\nTRANSLATION_LIMITER = asyncio.Semaphore(3)\n\n\ndef normalize_title(title: str) -> str:\n    value = re.sub(r\"\\s+\", \" \", html.unescape(str(title or \"\"))).strip()\n    value = re.sub(r\"\\)(?=[A-Za-zА-Яа-яЁё])\", \") \", value)\n    return re.sub(r\"\\$\\s+(?=\\d)\", \"$\", value)\n\n\ndef news_age_limit() -> int:\n    # Weekend editions may include Friday morning headlines; dates are shown.\n    return 96 if datetime.now(ZoneInfo(\"America/New_York\")).weekday()\
        \ >= 5 else MAX_NEWS_AGE_HOURS\n\n\ndef headline_matches(term: str, title: str) -> bool:\n    return bool(re.search(rf\"(?<!\\w){re.escape(term)}(?:s|ing)?(?!\\w)\", title, re.I))\n\n\ndef shorten_title(title: str, width: int = 120) -> str:\n    normalized = normalize_title(title)\n    if len(normalized) <= width:\n        return normalized\n    return textwrap.shorten(\n        normalized,\n        width=width,\n        placeholder=\"...\",\n        break_long_words=False,\n        break_on_hyphens=False,\n    )\n\n\ndef unique(values: list[str]) -> list[str]:\n    return list(dict.fromkeys(value for value in values if value))\n\n\nasync def translate_to_russian(session: aiohttp.ClientSession, text: str) -> str:\n    if not text:\n        return text\n    # Keep company names/tickers intact instead of translating Snowflake as a noun.\n    source = re.sub(r\"\\bSnowflake\\b\", \"SNOW\", text)\n    async with TRANSLATION_LIMITER:\n        try:\n            url = \"https://translate.googleapis.com/translate_a/single\"\
        \n            params = {\"client\": \"gtx\", \"sl\": \"auto\", \"tl\": \"ru\", \"dt\": \"t\", \"q\": source}\n            async with session.get(url, params=params, timeout=8) as response:\n                if response.status == 200:\n                    data = await response.json()\n                    translated = \" \".join(\n                        str(segment[0]) for segment in data[0]\n                        if isinstance(segment, list) and segment and segment[0]\n                    ).strip()\n                    if translated and re.search(r\"[А-Яа-яЁё]\", translated):\n                        return html.unescape(translated)\n                else:\n                    print(f\"⚠️ Google Translate: HTTP {response.status}\")\n        except Exception as error:\n            print(f\"⚠️ Google Translate: {type(error).__name__}\")\n\n        # Free, keyless fallback documented by MyMemory. It is used only when\n        # the primary endpoint did not return a Russian translation.\n\
        \        try:\n            url = \"https://api.mymemory.translated.net/get\"\n            language = \"he\" if re.search(r\"[\\u0590-\\u05ff]\", source) else \"en\"\n            params = {\"q\": source, \"langpair\": f\"{language}|ru\", \"mt\": \"1\"}\n            async with session.get(url, params=params, timeout=10) as response:\n                if response.status == 200:\n                    data = await response.json()\n                    translated = str((data.get(\"responseData\") or {}).get(\"translatedText\") or \"\").strip()\n                    if (\n                        translated\n                        and re.search(r\"[А-Яа-яЁё]\", translated)\n                        and \"MYMEMORY WARNING\" not in translated.upper()\n                    ):\n                        return html.unescape(translated)\n                else:\n                    print(f\"⚠️ MyMemory Translate: HTTP {response.status}\")\n        except Exception as error:\n            print(f\"⚠️ MyMemory\
        \ Translate: {type(error).__name__}\")\n\n    return \"\"\n\n\ndef news_score(item: dict, candidate_tickers: list[str], sector_name: str) -> int:\n    title = normalize_title(item.get(\"title\") or item.get(\"headline\"))\n    if len(title) < 20:\n        return -100\n    lower_title = title.lower()\n    if any(phrase in lower_title for phrase in LOW_VALUE_PHRASES):\n        return -60\n\n    published = item.get(\"providerPublishTime\") or item.get(\"datetime\")\n    if published:\n        try:\n            age = datetime.now(timezone.utc) - datetime.fromtimestamp(int(published), tz=timezone.utc)\n            if age.total_seconds() < -300 or age.total_seconds() > news_age_limit() * 3600:\n                return -40\n        except (TypeError, ValueError, OSError):\n            return -40\n\n    related = item.get(\"relatedTickers\") or item.get(\"related\") or []\n    if isinstance(related, str):\n        related = re.split(r\"[,\\s]+\", related.upper())\n    related_set = {str(value).upper()\
        \ for value in related}\n    ticker_set = {ticker.upper() for ticker in candidate_tickers}\n    keyword_hits = sum(\n        headline_matches(keyword, lower_title) for keyword in SECTOR_KEYWORDS.get(sector_name, [])\n    )\n    company_hits = sum(\n        headline_matches(company, lower_title)\n        for company in SECTOR_COMPANY_ANCHORS.get(sector_name, [])\n    )\n    ticker_hits = sum(\n        bool(re.search(rf\"(?<![A-Z0-9]){re.escape(ticker)}(?![A-Z0-9])\", title, re.IGNORECASE))\n        for ticker in ticker_set\n        if len(ticker) >= 2 and ticker.replace(\".\", \"\").isalnum()\n    )\n    quality_hits = sum(\n        headline_matches(term, lower_title)\n        for ticker in ticker_set\n        for term in COMPANY_QUALITY_TERMS.get(ticker, [])\n    )\n    high_value_hits = sum(headline_matches(term, lower_title) for term in HIGH_VALUE_PHRASES)\n\n    # A ticker relation alone can attach a broad market roundup to the wrong\n    # sector. Keep it only when the headline\
        \ names the business driver.\n    if keyword_hits + company_hits + ticker_hits + quality_hits == 0:\n        return -50\n\n    score = 35 if related_set & ticker_set else 0\n    # Directly named companies/industries remain relevant without Yahoo tags.\n    if company_hits or keyword_hits or quality_hits:\n        score = max(score, 35)\n\n    score += 12 * keyword_hits + 10 * company_hits + 8 * ticker_hits\n    score += 14 * quality_hits + 7 * high_value_hits\n\n    if ticker_set & {\"NVDA\", \"TTWO\"} and not (quality_hits or high_value_hits):\n        score -= 12\n    if any(word in lower_title for word in (\"downgrade\", \"delay\", \"probe\", \"ban\", \"restriction\", \"miss\")):\n        score += 6  # Risk headlines can be more useful than generic positive articles.\n    return score\n\n\nasync def fetch_yahoo_news(session: aiohttp.ClientSession, ticker: str) -> list[dict]:\n    url = f\"https://query1.finance.yahoo.com/v1/finance/search?q={urllib.parse.quote(ticker)}&newsCount=20&quotesCount=0\"\
        \n    try:\n        async with session.get(url, headers=HEADERS, timeout=HTTP_TIMEOUT) as response:\n            if response.status == 200:\n                return (await response.json()).get(\"news\") or []\n            print(f\"⚠️ Yahoo News {ticker}: HTTP {response.status}\")\n    except Exception as error:\n        print(f\"⚠️ Yahoo News {ticker}: {error}\")\n    return []\n\n\nasync def fetch_sector_news(\n    session: aiohttp.ClientSession,\n    query_ticker: str,\n    top_tickers: list[tuple[str, float]] | None = None,\n    sector_name: str = \"\",\n) -> list[dict]:\n    movers = [ticker for ticker, _ in (top_tickers or [])]\n    candidates = unique(movers + [query_ticker])[:4]\n    queries = unique(candidates + [SECTOR_QUERIES.get(sector_name, \"\")])\n    batches = await asyncio.gather(*[\n        fetch_yahoo_news(session, ticker) for ticker in queries\n    ])\n    scored = []\n    seen_titles = set()\n    for item in [entry for batch in batches for entry in batch]:\n  \
        \      title = normalize_title(item.get(\"title\"))\n        title_key = title.lower()\n        if not title or title_key in seen_titles:\n            continue\n        seen_titles.add(title_key)\n        try:\n            published = int(item.get(\"providerPublishTime\") or item.get(\"datetime\") or 0)\n        except (ValueError, TypeError):\n            continue\n        if published <= 0:\n            continue\n        score = news_score(item, candidates, sector_name)\n        if score >= 35:\n            scored.append((score, published, title, item.get(\"link\") or \"\"))\n    print(f\"News {sector_name}: received={sum(len(batch) for batch in batches)}, relevant={len(scored)}, window={news_age_limit()}h\")\n    if not scored:\n        return []\n    scored.sort(key=lambda value: (value[0], value[1]), reverse=True)\n    results = []\n    fallback = None\n    for _, published, title, link in scored[:4]:\n        if fallback is None:\n            fallback = (published, title, link)\n\
        \        translated = await translate_to_russian(session, title)\n        if translated:\n            results.append({\"title\": shorten_title(translated, 155), \"published\": published, \"url\": link})\n        if len(results) >= 2:\n            return results\n    if results:\n        return results\n    # Preserve a sourced headline when both translation services fail.\n    published, title, link = fallback or (scored[0][1], scored[0][2], scored[0][3])\n    print(f\"News {sector_name}: translation unavailable; displaying original\")\n    return [{\"title\": shorten_title(title, 155), \"published\": published, \"url\": link, \"original\": True}]\nEOF\n\ncat << 'EOF' > modules/formatter.py\nfrom datetime import date, datetime\nfrom typing import Optional\nfrom zoneinfo import ZoneInfo\n\nfrom modules.config import BOT_NAME\n\nISRAEL_TZ = ZoneInfo(\"Asia/Jerusalem\")\nFUND_LABELS = {\n    '5141841': 'Barak WTI', '5140744': 'Migdal AI', '5131313': 'Migdal Cyber',\n    '5128624': 'MTF\
        \ Games', '5100961': 'Meitav Gold', '5105218': 'Altshuler Green',\n    '5136635': 'KSM Space & Defense', '5101183': 'IBI Biotechnology',\n    '5139183': 'Migdal Banks', '5132220': 'More Cloud Cyber', '5132709': 'IBI EV',\n}\n\n\ndef escape_html(value: object) -> str:\n    return str(value).replace(\"&\", \"&amp;\").replace(\"<\", \"&lt;\").replace(\">\", \"&gt;\")\n\n\ndef format_percent(value: Optional[float], digits: int = 2, missing: str = \"—\") -> str:\n    if value is None:\n        return missing\n    number = float(value)\n    return f\"+{number:.{digits}f}%\" if number > 0 else f\"{number:.{digits}f}%\"\n\n\ndef _display_date(value: str) -> str:\n    try:\n        parsed = date.fromisoformat(str(value))\n    except ValueError:\n        return str(value or \"—\")\n    return parsed.strftime(\"%d.%m\")\n\n\n\ndef _ranked_funds(rows: list[dict]) -> list[dict]:\n    available = [row for row in rows if row.get(\"il_fund_data\", {}).get(\"daily\") is not None]\n    return sorted(\n\
        \        available,\n        key=lambda row: float(row[\"il_fund_data\"][\"daily\"]),\n        reverse=True,\n    )\n\n\n\n\n\ndef _clamp(value: float, low: float, high: float) -> float:\n    return max(low, min(high, value))\n\n\ndef calculate_radar_score(row: dict) -> int:\n    \"\"\"Explainable 0-100 score. It is a ranking aid, not a buy/sell signal.\"\"\"\n    score = 50.0\n    base = row.get(\"avg_change\")\n    fund = row.get(\"il_fund_data\", {}).get(\"daily\")\n    entry = row.get(\"entry_analysis\") or {}\n\n    if base is None:\n        score -= 8\n    else:\n        score += _clamp(float(base) * 6.0, -15, 15)\n\n    if fund is None:\n        score -= 10\n    else:\n        score += _clamp(float(fund) * 7.0, -18, 18)\n\n    status = entry.get(\"status_key\", \"unavailable\")\n    if entry.get(\"candidate\"):\n        score += 10\n    if status == \"ready\":\n        score += 12\n    elif status == \"forming\":\n        score += 4\n    elif status == \"blocked\":\n     \
        \   score -= 8\n    elif status == \"unavailable\":\n        score -= 6\n\n    total = int(row.get(\"breadth_total\") or 0)\n    positive = int(row.get(\"breadth_positive\") or 0)\n    if total:\n        score += _clamp(((positive / total) - 0.5) * 20.0, -10, 10)\n\n    if row.get(\"news\"):\n        score += 4\n\n    return int(round(_clamp(score, 0, 100)))\n\n\n\ndef _radar_score_emoji(score: int) -> str:\n    if score >= 75:\n        return \"\U0001F7E2\"\n    if score >= 60:\n        return \"\U0001F7E1\"\n    if score >= 40:\n        return \"⚪\"\n    return \"\U0001F534\"\n\n\ndef radar_reasons(row: dict) -> list[str]:\n    reasons = []\n    entry = row.get(\"entry_analysis\") or {}\n    fund = row.get(\"il_fund_data\") or {}\n    stats = fund.get(\"price_stats\") or {}\n    base = row.get(\"avg_change\")\n    fund_daily = fund.get(\"daily\")\n\n    if base is not None:\n        reasons.append(f\"базовый рынок: {format_percent(base, 1)}\")\n    else:\n        reasons.append(\"\
        базовый рынок: данных нет\")\n\n    if fund_daily is not None:\n        reasons.append(f\"израильский фонд: {format_percent(fund_daily, 1)}\")\n    else:\n        reasons.append(\"израильский фонд: дневных данных нет\")\n\n    if entry.get(\"candidate\"):\n        position = entry.get(\"range_position_60\")\n        if position is not None:\n            reasons.append(f\"цена фонда в {position:.0f}% 60-дневного диапазона\")\n        else:\n            reasons.append(\"фонд в зоне модели\")\n    elif entry.get(\"status_key\") == \"unavailable\":\n        reasons.append(\"истории фонда недостаточно для модели входа\")\n    else:\n        reasons.append(\"модель входа пока не видит низкую зону цены\")\n\n    below_average = stats.get(\"below_average_30\")\n    if below_average is not None:\n        reasons.append(f\"к 30-дн. средней: {format_percent(below_average, 1)}\")\n\n    total = int(row.get(\"breadth_total\") or 0)\n    positive = int(row.get(\"breadth_positive\") or 0)\n   \
        \ if total:\n        reasons.append(f\"ширина движения: {positive}/{total} тикеров в плюс\")\n\n    return reasons[:4]\n\n\n\nPORTFOLIO_FUND_IDS = {\n    \"5103692\", \"5132014\", \"5132220\", \"5132303\",\n    \"5134135\", \"5137534\", \"5140983\",\n}\nDIRECT_TICKERS = {\"NVDA\", \"TTWO\", \"ANT\"}\n\n\ndef _portfolio_relevance(row: dict) -> int:\n    \"\"\"Small internal weight: rank what matters to the current portfolio first.\"\"\"\n    score = 0\n    if str(row.get(\"fund_id\") or \"\") in PORTFOLIO_FUND_IDS:\n        score += 25\n    tickers = {str(ticker).upper() for ticker, _ in (row.get(\"top_3_tickers\") or [])}\n    config_tickers = {str(ticker).upper() for ticker in row.get(\"tickers\", [])}\n    if tickers & DIRECT_TICKERS or config_tickers & DIRECT_TICKERS:\n        score += 12\n    if row.get(\"news\"):\n        score += 4\n    return score\n\n\ndef _market_priority(row: dict) -> float:\n    return (\n        _portfolio_relevance(row)\n        + calculate_radar_score(row) *\
        \ 0.45\n        + min(abs(float(row.get(\"avg_change\") or 0)) * 4.0, 16.0)\n        + min(abs(float(row.get(\"il_fund_data\", {}).get(\"daily\") or 0)) * 3.0, 12.0)\n    )\n\n\ndef build_telegram_message(sectors_data: list[dict]) -> str:\n    \"\"\"Compact daily digest: market + fund movement + 2 headlines in one message.\"\"\"\n    now_str = datetime.now(ISRAEL_TZ).strftime(\"%d.%m.%Y | %H:%M\")\n    available = [\n        row for row in sectors_data\n        if row.get(\"avg_change\") is not None or row.get(\"il_fund_data\", {}).get(\"daily\") is not None\n    ]\n\n    top_market = sorted(\n        available,\n        key=_market_priority,\n        reverse=True,\n    )[:3]\n    top_funds = _ranked_funds(sectors_data)[:5]\n\n    def small_arrow(value: Optional[float]) -> str:\n        if value is None:\n            return \"→\"\n        return \"\U0001F7E2↑\" if float(value) > 0 else \"\U0001F534↓\" if float(value) < 0 else \"→\"\n\n    def ticker_line(row: dict) -> str:\n    \
        \    tickers = row.get(\"top_3_tickers\") or []\n        if not tickers:\n            return \"\"\n        parts = [\n            f\"{ticker} {format_percent(change, 1)}\"\n            for ticker, change in tickers[:3]\n            if change is not None\n        ]\n        return \"  \" + \" · \".join(parts) if parts else \"\"\n\n    lines = [\n        \"\U0001F4E1 <b>Market Radar AI</b>\",\n        f\"\U0001F4C5 {now_str} · Израиль \U0001F1EE\U0001F1F1\",\n        \"\",\n        \"<b>Коротко по рынку</b>\",\n    ]\n\n    if top_market:\n        for row in top_market:\n            score = calculate_radar_score(row)\n            base = \"локальный рынок\" if row.get(\"local_market\") else f\"рынок {format_percent(row.get('avg_change'), 1)}\"\n            fund = format_percent(row.get(\"il_fund_data\", {}).get(\"daily\"), 1)\n            lines.append(\n                f\"{row['icon']} <b>{escape_html(row['short_eng'])}</b>: \"\n                f\"{base} · фонд {fund} · Radar {_radar_score_emoji(score)}{score}/100\"\
        \n            )\n    else:\n        lines.append(\"Данных по рынку пока нет.\")\n\n    lines.extend([\"\", \"<b>Фонды Израиля</b>\"])\n    if top_funds:\n        for row in top_funds:\n            fund = row[\"il_fund_data\"]\n            fund_url = (\n                \"https://www.bizportal.co.il/mutualfunds/quote/generalview/\"\n                f\"{escape_html(row['fund_id'])}\"\n            )\n            fund_title = escape_html(FUND_LABELS.get(row['fund_id'], row['il_name_eng']))\n            daily = fund.get(\"daily\")\n            lines.append(\n                f\"{small_arrow(daily)} {row['icon']} \"\n                f\"<a href=\\\"{fund_url}\\\"><b>{fund_title}</b></a> \"\n                f\"{format_percent(daily, 1)} · мес {format_percent(fund.get('mtd'), 1)}\"\n            )\n            drivers = ticker_line(row)\n            if drivers:\n                lines.append(escape_html(drivers))\n    else:\n        lines.append(\"Израильские данные не получены.\")\n\n    selected_news\
        \ = []\n    seen_titles = set()\n    for row in available:\n        for item in row.get(\"news\", []):\n            if not isinstance(item, dict) or not item.get(\"title\"):\n                continue\n            key = str(item[\"title\"]).strip().lower()\n            if key in seen_titles:\n                continue\n            seen_titles.add(key)\n            selected_news.append(item)\n            if len(selected_news) >= 2:\n                break\n        if len(selected_news) >= 2:\n            break\n\n    lines.append(\"\")\n    if selected_news:\n        for item in selected_news:\n            title = escape_html(item.get(\"title\", \"\"))\n            link = str(item.get(\"url\") or \"\")\n            if link.startswith((\"https://\", \"http://\")):\n                safe_link = escape_html(link).replace('\"', '&quot;')\n                title = f'<a href=\"{safe_link}\">{title}</a>'\n            lines.append(f\"\U0001F4F0 {title}\")\n    else:\n        lines.append(\"Свежих\
        \ релевантных новостей не найдено.\")\n\n    lines.extend([\"\", BOT_NAME])\n    return \"\\n\".join(lines)\n\ndef _radar_verdict(row: dict) -> tuple[str, str, str]:\n    entry = row.get(\"entry_analysis\") or {}\n    status = entry.get(\"status_key\", \"unavailable\")\n    if status == \"unavailable\":\n        return \"▫️—\", \"НЕТ ДАННЫХ\", \"истории фонда недостаточно\"\n    if not entry.get(\"candidate\"):\n        return \"⚠️→\", \"НАБЛЮДАТЬ\", \"у фонда нет сочетания снижения и низкой цены\"\n    if status == \"blocked\":\n        return \"\U0001F53B▼\", \"НЕ ПОДТВЕРЖДЕНО\", \"ждать повышения цены самого фонда\"\n    if status != \"ready\":\n        return \"⚠️→\", \"НАБЛЮДАТЬ\", \"пока только первое повышение цены фонда\"\n    base1, base5 = entry.get(\"base1\"), entry.get(\"base5\")\n    if base1 is None or base5 is None:\n        return \"⚠️→\", \"НАБЛЮДАТЬ\", \"условия фонда выполнены; подтверждения базового рынка недостаточно\"\n    total = int(row.get(\"breadth_total\"\
        ) or 0)\n    positive = int(row.get(\"breadth_positive\") or 0)\n    if base1 < 0 or base5 <= 0:\n        return \"\U0001F53B▼\", \"НЕ ПОДТВЕРЖДЕНО\", \"фонд восстанавливается, но базовый рынок пока не поддерживает\"\n    if base1 > 0 and total >= 2 and positive * 2 >= total:\n        return \"✅▲\", \"ПОДТВЕРЖДЕНО\", \"условия фонда выполнены, базовый рынок поддерживает\"\n    return \"⚠️→\", \"НАБЛЮДАТЬ\", \"условия фонда выполнены; внешний импульс ещё слабый\"\n\n\ndef rank_radar_rows(rows: list[dict]) -> list[dict]:\n    usable = [\n        row for row in rows\n        if (row.get(\"entry_analysis\") or {}).get(\"status_key\") in {\"ready\", \"forming\", \"blocked\", \"watch\"}\n    ]\n    if not usable:\n        return []\n    priority = {\"ready\": 0, \"forming\": 1, \"blocked\": 2, \"watch\": 3}\n    return sorted(usable, key=lambda row: (\n        priority[row[\"entry_analysis\"][\"status_key\"]],\n        row[\"entry_analysis\"][\"range_position_60\"],\n    ))\n\n\ndef ordered_radar_rows(rows:\
        \ list[dict]) -> list[dict]:\n    ranked = rank_radar_rows(rows)\n    candidates = [row for row in ranked if row['entry_analysis'].get('candidate')]\n    candidates.sort(key=lambda row: _radar_verdict(row)[0] != \"✅▲\")\n    observation = [row for row in ranked if not row['entry_analysis'].get('candidate')]\n    return candidates + observation\n\n\ndef radar_chart_target(rows: list[dict]) -> int:\n    usable = rank_radar_rows(rows)\n    return min(len(usable), 3)\n\n\ndef build_combined_radar_message(rows: list[dict], chart_count=None) -> str:\n    \"\"\"Optional one-line confirmation embedded in the chart album.\"\"\"\n    if chart_count == 0:\n        return \"\"\n    confirmed = sum(_radar_verdict(row)[0] == \"✅▲\" for row in rank_radar_rows(rows))\n    return f\"✅▲ Вход по модели подтверждён: {confirmed}.\" if confirmed else \"\"\n\ndef build_alert_message(rows: list[dict]) -> str:\n    \"\"\"Short push mode: sends only when the model has a strong actionable focus.\"\"\"\n  \
        \  candidates = []\n    for row in rank_radar_rows(rows):\n        score = calculate_radar_score(row)\n        marker, verdict, reason = _radar_verdict(row)\n        if marker == \"✅▲\" or (score >= 78 and (row.get(\"entry_analysis\") or {}).get(\"candidate\")):\n            candidates.append((score, marker, verdict, reason, row))\n    if not candidates:\n        return \"\"\n    candidates.sort(key=lambda item: item[0], reverse=True)\n    now_str = datetime.now(ISRAEL_TZ).strftime(\"%d.%m.%Y | %H:%M\")\n    lines = [\n        \"\U0001F6A8 <b>Market Radar AI Alert</b>\",\n        f\"\U0001F4C5 {now_str} (Израиль)\",\n        \"\",\n    ]\n    for score, marker, verdict, reason, row in candidates[:3]:\n        lines.append(\n            f\"{marker} <b>{row['icon']} {escape_html(row['short_eng'])}</b> · \"\n            f\"Radar Score <b>{score}/100</b> · {escape_html(verdict)}\"\n        )\n        for item in radar_reasons(row)[:3]:\n            lines.append(f\"• {escape_html(item)}\"\
        )\n        lines.append(f\"<i>{escape_html(reason)}</i>\")\n        lines.append(\"\")\n    lines.append(BOT_NAME)\n    return \"\\n\".join(lines)\nEOF\n\ncat << 'EOF' > modules/charts.py\nimport calendar\nimport math\nfrom datetime import date, timedelta\nfrom io import BytesIO\nfrom pathlib import Path\n\nimport matplotlib\nmatplotlib.use(\"Agg\")\nimport matplotlib.dates as mdates\nimport matplotlib.pyplot as plt\n\nfrom modules.formatter import (\n    _radar_verdict, _display_date, format_percent,\n    ordered_radar_rows, radar_chart_target, FUND_LABELS,\n)\n\n\ndef chart_window(history):\n    \"\"\"Three calendar months ending at the last published observation; no invented prices.\"\"\"\n    points = {}\n    for item in history:\n        try:\n            day = date.fromisoformat(item[\"date\"])\n            price = float(item[\"price\"])\n            if day <= date.today() and math.isfinite(price) and price > 0:\n                points[day] = price\n        except (KeyError,\
        \ TypeError, ValueError):\n            continue\n    points = sorted(points.items())\n    if len(points) < 15:\n        return None\n    end = points[-1][0]\n    month_index = end.year * 12 + end.month - 1 - 3\n    year, month = divmod(month_index, 12)\n    month += 1\n    start = date(year, month, min(end.day, calendar.monthrange(year, month)[1]))\n    window = [(d, p) for d, p in points if d >= start]\n    if len(window) < 15:\n        return None\n    # Coverage is only a span/density check, not proof that every NAV is present.\n    gaps = [(b[0] - a[0]).days for a, b in zip(window, window[1:])]\n    partial = window[0][0] > start + timedelta(days=7) or len(window) < 40 or max(gaps, default=0) > 10\n    return window, partial\n\n\ndef render_radar_card(rows):\n    \"\"\"One image, three independently scaled fund charts and existing model conclusions.\"\"\"\n    import textwrap\n    from datetime import datetime\n    from zoneinfo import ZoneInfo\n    from matplotlib.patches import\
