        close\"]\n    if base <= 0:\n        return None\n    return round((latest / base - 1.0) * 100.0, 2)\n\n\ndef _render_ticker_year_chart(symbol: str, history: list[dict]):\n    points = []\n    for item in history:\n        try:\n            timestamp = int(item[\"timestamp\"])\n            close = float(item[\"close\"])\n        except (KeyError, TypeError, ValueError):\n            continue\n        if close > 0:\n            points.append((datetime.fromtimestamp(timestamp, timezone.utc).date(), close))\n    if len(points) < 30:\n        return None\n    points = points[-252:]\n    dates, prices = zip(*points)\n    start, current = prices[0], prices[-1]\n    change = (current / start - 1.0) * 100.0 if start > 0 else 0.0\n    with plt.rc_context({'font.family': 'DejaVu Sans', 'font.size': 12}):\n        fig = plt.figure(figsize=(10.8, 5.6), dpi=130, facecolor='#0B1220')\n        ax = fig.add_axes([0.09, 0.17, 0.86, 0.68], facecolor='#152135')\n        line_color = '#53D9AC' if current\
        \ >= start else '#FF8A98'\n        ax.plot(dates, prices, lw=2.4, color=line_color)\n        ax.scatter(dates[-1], current, s=34, color='#F0F5FC', zorder=4)\n        ax.grid(axis='y', color='#A7B6CC', alpha=.18)\n        ax.xaxis.set_major_locator(mdates.AutoDateLocator(minticks=4, maxticks=7))\n        ax.xaxis.set_major_formatter(mdates.DateFormatter('%b'))\n        ax.tick_params(colors='#A7B6CC', labelsize=10, length=0, pad=7)\n        for spine in ax.spines.values():\n            spine.set_visible(False)\n        fig.text(0.09, 0.91, symbol, fontsize=25, color='#F0F5FC', weight='bold')\n        fig.text(0.95, 0.915, f'1Y {change:+.1f}% · ${current:.2f}',\n                 fontsize=15, color=line_color, weight='bold', ha='right')\n        fig.text(0.09, 0.06, 'Yahoo Finance · daily closes', fontsize=10, color='#A7B6CC')\n        stream = BytesIO()\n        fig.savefig(stream, format='png', facecolor='#0B1220', dpi=130)\n        return stream.getvalue()\n\n\ndef _ticker_momentum(change_5d,\
        \ change_20d) -> str:\n    \"\"\"Compact quality label from the existing 5-session and 1-month data.\"\"\"\n    if change_5d is None and change_20d is None:\n        return \"данных недостаточно\"\n    short = float(change_5d) if change_5d is not None else None\n    month = float(change_20d) if change_20d is not None else None\n\n    if short is not None and month is not None:\n        if short > 0 and month > 12:\n            return \"сильный, перегретый\"\n        if short > 0 and month > 3:\n            return \"сильный\"\n        if short > 0 and month > 0:\n            return \"положительный\"\n        if short < 0 and month < -3:\n            return \"слабый\"\n        if short < 0 and month < 0:\n            return \"отрицательный\"\n        return \"смешанный\"\n\n    value = short if short is not None else month\n    if value > 12:\n        return \"сильный, перегретый\"\n    if value > 3:\n        return \"сильный\"\n    if value > 0:\n        return \"положительный\"\n\
        \    if value < -3:\n        return \"слабый\"\n    if value < 0:\n        return \"отрицательный\"\n    return \"нейтральный\"\n\nTRACKED_TICKERS = [\"TTWO\", \"NVDA\"]\n\n\ndef _requested_tickers() -> list[str]:\n    raw = str(os.getenv(\"TICKER_SYMBOL\") or \"\").strip().upper()\n    if raw:\n        symbols = [item.strip() for item in raw.replace(\";\", \",\").split(\",\")]\n        return list(dict.fromkeys(symbol for symbol in symbols if symbol))\n    return TRACKED_TICKERS[:]\n\n\nasync def _build_single_ticker_report(symbol: str) -> tuple[str, bytes | None]:\n    symbol = str(symbol or \"\").strip().upper()\n    sector, config = _ticker_sector(symbol)\n    print(f\"\U0001F3AF Ticker focus: {symbol}; sector={sector or 'unknown'}\")\n    market_data = await fetch_all_yahoo_data([symbol])\n    async with aiohttp.ClientSession() as session:\n        history_task = asyncio.create_task(fetch_ticker_history(session, symbol))\n        ticker_row = market_data.get(symbol, {}) or {}\n\
        \        top = [(symbol, ticker_row.get(\"change\") or 0.0)]\n        news_task = asyncio.create_task(fetch_sector_news(\n            session,\n            symbol,\n            top,\n            config[\"short_eng\"] if config else \"\",\n        ))\n        ticker_history = await history_task\n        news = await news_task\n\n    change_1d = ticker_row.get(\"change\")\n    change_1m = _history_impulse(ticker_history, 21)\n    change_1y = _history_impulse(ticker_history, 252)\n    change_5d = _history_impulse(ticker_history, 5)\n    price = ticker_row.get(\"price\")\n    price_date = ticker_row.get(\"market_date\")\n    price_text = f\"${float(price):.2f}\" if price is not None else \"—\"\n\n    lines = [\n        f\"\U0001F3AF <b>Market Radar AI • {escape(symbol)}</b>\",\n        f\"1. Цена: <b>{price_text}</b> · день {format_percent(change_1d)} · месяц {format_percent(change_1m)} · год {format_percent(change_1y)}\"\n        + (f\" · {escape(str(price_date))}\" if price_date else\
        \ \"\"),\n        f\"2. Импульс: 5с {format_percent(change_5d)} · 1м {format_percent(change_1m)} · {_ticker_momentum(change_5d, change_1m)}\",\n        \"3. Новости:\",\n    ]\n    if news:\n        for item in news[:2]:\n            title = escape(item.get(\"title\", \"\"))\n            url = str(item.get(\"url\") or \"\")\n            if url.startswith((\"https://\", \"http://\")):\n                title = f'<a href=\"{escape(url, quote=True)}\">{title}</a>'\n            lines.append(f\"   \U0001F4F0 {title}\")\n    else:\n        lines.append(\"   — свежих релевантных новостей не найдено\")\n    return \"\\n\".join(lines), _render_ticker_year_chart(symbol, ticker_history)\n\n\nasync def run_ticker_report() -> None:\n    reports = [await _build_single_ticker_report(symbol) for symbol in _requested_tickers()]\n    if os.getenv(\"DRY_RUN\", \"false\").lower() == \"true\":\n        for text, png in reports:\n            print(text)\n            print(f\"ticker_chart={'yes' if png\
        \ else 'no'}\")\n            print(\"\")\n        return\n\n    fallback_messages = []\n    for text, png in reports:\n        if png:\n            await send_chart_photos([(png, text)], title=\"\", parse_mode=\"HTML\")\n        else:\n            fallback_messages.append(text)\n    if fallback_messages:\n        await send_to_telegram(\"\\n\\n━━━━━━━━━━━━━━━━\\n\\n\".join(fallback_messages))\n\n\nasync def run_market_analytics() -> None:\n    print(f\"Build: {BOT_VERSION}; commit={os.getenv('GITHUB_SHA', 'local')[:12]}\")\n    all_tickers = sorted(\n        {ticker for config in SECTORS_CONFIG.values() for ticker in config[\"tickers\"]}\n        | {config[\"proxy_ticker\"] for config in SECTORS_CONFIG.values() if config.get(\"proxy_ticker\")}\n    )\n    print(\"\U0001F4E6 Collecting Yahoo market data...\")\n    market_data = await fetch_all_yahoo_data(all_tickers)\n    print(\"\U0001F310 Collecting Israeli fund returns...\")\n    il_results = await fetch_all_israeli_funds(SECTORS_CONFIG)\n\
        \    print(\"\U0001F4C8 Collecting completed base-market history...\")\n    year_results = await fetch_all_year_analytics(SECTORS_CONFIG)\n\n    async with aiohttp.ClientSession() as session:\n        sector_tasks = []\n        sector_rows = []\n        for sector, config in SECTORS_CONFIG.items():\n            ticker_rows = [\n                (ticker, market_data[ticker][\"change\"], market_data[ticker].get(\"market_date\"))\n                for ticker in config[\"tickers\"]\n                if ticker in market_data and market_data[ticker].get(\"change\") is not None\n            ]\n            dated = [row for row in ticker_rows if row[2]]\n            basket_date = max(\n                {row[2] for row in dated},\n                key=lambda value: (sum(row[2] == value for row in dated), value),\n            ) if dated else None\n            basket_rows = [row for row in ticker_rows if not basket_date or row[2] == basket_date]\n            driver_changes = [change for _, change,\
        \ _ in basket_rows]\n            driver_average = sum(driver_changes) / len(driver_changes) if driver_changes else None\n            proxy_row = market_data.get(config.get(\"proxy_ticker\"), {}) or {}\n            proxy_change = proxy_row.get(\"change\")\n            basket_base = config.get(\"local_market\") or config.get(\"daily_base\") == \"basket\"\n            base_change = driver_average if basket_base else proxy_change\n            base_date = basket_date if basket_base else proxy_row.get(\"market_date\")\n            if base_change is None:\n                base_change = driver_average\n                base_date = basket_date\n                print(f\"⚠️ Base proxy unavailable for {sector}; using driver basket average\")\n            same_date_rows = [row for row in ticker_rows if not base_date or row[2] == base_date]\n            top_movements = sorted(\n                [(ticker, change) for ticker, change, _ in same_date_rows],\n                key=lambda item: abs(item[1]),\
        \ reverse=True,\n            )[:3]\n            sector_rows.append((sector, config, top_movements, base_change, base_date))\n            sector_tasks.append(asyncio.create_task(fetch_sector_news(\n                session, config[\"news_ticker\"], top_movements, config[\"short_eng\"]\n            )))\n\n        results = []\n        for row, news_task in zip(sector_rows, sector_tasks):\n            sector, config, top_movements, base_change, base_date = row\n            fund_data = il_results.get(sector, {\n                \"daily\": None,\n                \"mtd\": None,\n                \"ytd\": None,\n            })\n            year_data = year_results.get(sector, {})\n            results.append({\n                \"short_eng\": config[\"short_eng\"],\n                \"name\": config[\"name\"],\n                \"icon\": config[\"icon\"],\n                \"fund_id\": config[\"fund_id\"],\n                \"il_name_eng\": config[\"il_name_eng\"],\n                \"local_market\"\
        : bool(config.get(\"local_market\")),\n                \"avg_change\": round(base_change, 2) if base_change is not None else None,\n                \"base_date\": base_date,\n                \"top_3_tickers\": top_movements,\n                \"news\": await news_task,\n                \"il_fund_data\": fund_data,\n                \"year_analysis\": year_data,\n                \"entry_analysis\": analyze_entry_zone(fund_data, year_data),\n                \"breadth_total\": sum(\n                    market_data.get(t, {}).get(\"change\") is not None\n                    and market_data.get(t, {}).get(\"market_date\") == year_data.get(\"market_date\")\n                    for t in config[\"tickers\"]\n                ),\n                \"breadth_positive\": sum(\n                    market_data.get(t, {}).get(\"change\") is not None\n                    and market_data.get(t, {}).get(\"market_date\") == year_data.get(\"market_date\")\n                    and market_data[t][\"change\"\
        ] > 0\n                    for t in config[\"tickers\"]\n                ),\n            })\n\n    fund_dates = [\n        (row.get(\"il_fund_data\", {}).get(\"price_stats\") or {}).get(\"price_date\")\n        for row in results\n    ]\n    dated_funds = [value for value in fund_dates if value]\n    comparison_fund_date = max(\n        set(dated_funds), key=lambda value: (dated_funds.count(value), value)\n    ) if dated_funds else None\n    if comparison_fund_date:\n        for row in results:\n            price_date = (row.get(\"il_fund_data\", {}).get(\"price_stats\") or {}).get(\"price_date\")\n            if price_date and price_date != comparison_fund_date:\n                row[\"entry_analysis\"] = {\n                    \"status_key\": \"unavailable\",\n                    \"candidate\": False,\n                }\n\n    results.sort(\n        key=lambda item: (\n            item[\"avg_change\"] is not None,\n            item[\"avg_change\"] if item[\"avg_change\"] is not\
        \ None else float(\"-inf\"),\n        ),\n        reverse=True,\n    )\n    has_il_data = any(row[\"il_fund_data\"].get(\"daily\") is not None for row in results)\n    dry_run = os.getenv(\"DRY_RUN\", \"false\").lower() == \"true\"\n    run_mode = os.getenv(\"RUN_MODE\", \"market\")\n    if not dry_run:\n                                Path('portfolio_candidates.json').write_text(json.dumps({\n            'generated_at': datetime.now(timezone.utc).isoformat(), 'rows': results,\n        }, ensure_ascii=False), encoding='utf-8')\n    if run_mode == \"alert\":\n        alert_message = build_alert_message(results)\n        if alert_message:\n            if dry_run:\n                print(alert_message)\n            else:\n                await send_to_telegram(alert_message)\n        else:\n            print(\"ℹ️ Alert mode: no confirmed high-focus signals.\")\n        if not has_il_data:\n            raise RuntimeError(\"IL data failure: no daily fund returns\")\n        return\n\n\
        \    message = build_telegram_message(results)\n    if dry_run:\n        print(message)\n    else:\n        await send_to_telegram(message)\n    if not has_il_data:\n        raise RuntimeError(\"IL data failure: no daily fund returns\")\n    charts = build_radar_charts(results, \"charts\" if dry_run else None)\n    radar = build_combined_radar_message(results, chart_count=len(charts))\n    album_title = \"\U0001F4CA Market Radar AI · ФОНДЫ В ФОКУСЕ\" + (\"\\n\" + radar if radar else \"\")\n    if charts:\n        charts[-1] = (charts[-1][0], charts[-1][1] + \"\\n\\n\" + BOT_NAME)\n    if dry_run:\n        print(album_title)\n        print(f\"Fund card prepared: {len(charts)} charts\")\n    else:\n        await send_chart_photos(charts, title=album_title, parse_mode='HTML')\n\n\n\nif __name__ == \"__main__\":\n    mode = os.getenv(\"RUN_MODE\", \"market\")\n    if mode == \"portfolio\":\n        from modules.movers import run_morning_reports\n        asyncio.run(run_morning_reports())\n\
        \    elif mode == \"salary\":\n        from modules.movers import run_salary_report\n        asyncio.run(run_salary_report())\n    elif mode == \"ticker\":\n        asyncio.run(run_ticker_report())\n    else:\n        asyncio.run(run_market_analytics())\nEOF\n\ncat << 'EOF' > modules/portfolio_insights.py\n\"\"\"Deterministic portfolio rules, not a forecast of six-month returns.\"\"\"\nimport asyncio\nimport json\nimport math\nimport statistics\nfrom datetime import date, datetime, timedelta\nfrom pathlib import Path\n\nfrom modules.market import _FundHTML, _clean_text, fetch_ticker_history, analyze_year_history\n\nICONS = {'5103692': '\U0001F4CA', '5132014': '\U0001F331', '5132303': '\U0001F3E6',\n         '5134135': '⛏️', '5137534': '\U0001F916', '5140983': '\U0001F6E1️'}\nMAX_DRAWDOWN = 10\nMAX_SIGNAL_AGE_DAYS = 4  # Conservative calendar-age gate; holidays may suppress signals.\nCONCENTRATION_LIMIT = 35  # Model policy; not the user's loss limit.\nRISK_PER_IDEA = 0.005\nMAX_TOTAL_ACTIVE_RISK\
        \ = 0.02\nMAX_NEW_POSITION_WEIGHT = 0.15\nCANDIDATES_FILE = Path('portfolio_candidates.json')\nJOURNAL_FILE = Path('portfolio_signal_journal.json')\n# Exact issuer names in the source holdings table; never scan arbitrary page text.\nISSUERS = {'NVIDIA CORP': 'NVDA', 'MICROSOFT CORP': 'MSFT',\n           'ALPHABET INC-CL C': 'GOOG', 'META PLATFORMS INC-CLASS A': 'META',\n           'AMAZON.COM INC': 'AMZN', 'BROADCOM INC': 'AVGO',\n           'לאומי': 'LUMI.TA', 'פועלים': 'POLI.TA', 'דיסקונט': 'DSCT.TA',\n           'מזרחי טפחות': 'MZTF.TA', 'בינלאומי': 'FIBI.TA'}\n# Same-sector, same-geography research pairs, not equivalent portfolios.\nRESEARCH_PAIRS = {'5132303': {'5139183'}, '5137534': {'5140744'}}\n\n\ndef holdings_from_page(html):\n    root = _FundHTML(html).root\n    result = []\n    for table in root.walk('table'):\n        if 'שם נייר' not in _clean_text(table.text()):\n            continue\n        for row in table.walk('tr'):\n            cells = list(row.walk('td'))\n\
        \            if len(cells) < 2:\n                continue\n            name = _clean_text(cells[0].text())\n            try:\n                weight = float(_clean_text(cells[1].text()).replace('%', '').replace(',', ''))\n            except ValueError:\n                continue\n            if math.isfinite(weight) and weight > 0 and name in ISSUERS:\n                result.append((weight, ISSUERS[name], name))\n    return [{'ticker': t, 'name': n, 'weight': w} for w, t, n in sorted(set(result), reverse=True)[:4]]\n\n\ndef assess(history, now, current_price=None, current_date=None, external=None):\n    missing = {'status': 'missing', 'line': '⬜• Ждать данных · истории недостаточно'}\n    points = {}\n    for row in history:\n        try:\n            day, price = date.fromisoformat(row['date']), float(row['price'])\n            if day <= now.date() and price > 0 and math.isfinite(price):\n                points[day] = price\n        except (ValueError, TypeError, KeyError):\n   \
        \         continue\n    points = sorted(points.items())\n    if len(points) < 15:\n        return dict(missing, line=f'⬜• Без сигнала · цен {len(points)}/50')\n    last_day, price = points[-1]\n    if current_date is None or (current_price is not None and abs(price - float(current_price)) > .001):\n        return dict(missing, line='⬜• Ждать данных · цена и история не согласованы')\n    window = [(d, p) for d, p in points if d >= last_day - timedelta(days=89)]\n    closes = [p for _, p in window]\n    avg30 = statistics.mean(p for d, p in window if d >= last_day - timedelta(days=29))\n    span = (window[-1][0] - window[0][0]).days + 1\n    missing['stats'] = (f'От макс. {span}д {(price / max(closes) - 1) * 100:+.1f}% · '\n                        f'к средней 30д {(price / avg30 - 1) * 100:+.1f}%')\n    if str(last_day) != current_date or (now.date() - last_day).days > MAX_SIGNAL_AGE_DAYS:\n        return dict(missing, line=f'⬜• Ждать обновления · история от {last_day:%d.%m}')\n  \
        \  if len(points) < 50:\n        return dict(missing, line=f'⬜• Без сигнала · цен {len(points)}/50')\n    if (points[-1][0] - points[0][0]).days < 59:\n        return dict(missing, line='⬜• Без сигнала · история короче 60 дней')\n    ema = points[0][1]\n    emas = []\n    for _, p in points:\n        ema += (p - ema) * 2 / 51\n        emas.append(ema)\n    drawdown = (price / max(closes) - 1) * 100\n    discount = (price / avg30 - 1) * 100\n    returns = [closes[i] / closes[i - 1] - 1 for i in range(1, len(closes))]\n    volatility = statistics.stdev(returns)\n    change20 = (price / points[-21][1] - 1) * 100\n    uptrend = price > ema and emas[-1] > emas[-6]\n    downtrend = price < ema and emas[-1] < emas[-6] and change20 <= -5\n    two_rises = price > points[-2][1] > points[-3][1]\n    ema50 = emas[-1]\n    cancel_price = min(p for _, p in points[-20:]) * .99\n    risk_pct = max(0.0, (price - cancel_price) / price * 100)\n    support = external or {}\n    base_ok = support.get('confirmed',\
        \ False)\n    if downtrend and drawdown <= -10:\n        status, line = 'reduce', '\U0001F53B▼ Рассмотреть сокращение · устойчивое снижение'\n    elif not uptrend and price <= points[-2][1]:\n        status, line = 'wait', '⚠️→ Не докупать · ждать разворота и роста активов'\n    elif (uptrend and discount <= -3 and drawdown <= -3 and two_rises and base_ok\n          and 2 <= risk_pct <= 12):\n        status, line = 'add', '✅▲ Рассмотреть докупку · откат и восстановление подтверждены'\n    elif uptrend:\n        status, line = 'hold', '\U0001F7E9▲ Держать · восходящий тренд, докупка не подтверждена'\n    else:\n        status, line = 'watch', '⚠️→ Наблюдать · ждать устойчивого роста фонда'\n    days = (window[-1][0] - window[0][0]).days + 1\n    return {'status': status, 'line': line, 'drawdown': drawdown, 'discount': discount,\n            'volatility': volatility, 'date': str(last_day), 'price': price,\n            'ema50': ema50, 'cancel_price': cancel_price, 'risk_pct': risk_pct,\n\
        \            'stats': f'От макс. {days}д {drawdown:+.1f}% · к средней 30д {discount:+.1f}%'}\n\n\ndef trade_plan(fund_id, analysis, portfolio_value, position_value, risk):\n    if analysis.get('status') == 'add':\n        if risk.get('breached'):\n            return {'allowed': False, 'line': '⚠️ Покупка заблокирована · просадка портфеля достигла 10%'}\n        if risk.get('concentrated') and risk.get('largest') == fund_id:\n            return {'allowed': False, 'line': '⚠️ Покупка заблокирована · позиция уже чрезмерно велика'}\n        if risk.get('active_signal_risk', 0) >= MAX_TOTAL_ACTIVE_RISK:\n            return {'allowed': False, 'line': '⚠️ Покупка заблокирована · общий бюджет риска исчерпан'}\n        risk_pct = float(analysis.get('risk_pct') or 0)\n        if not 2 <= risk_pct <= 12:\n            return {'allowed': False, 'line': '⚠️ Покупка заблокирована · риск входа вне модели'}\n        risk_budget = portfolio_value * RISK_PER_IDEA\n        by_risk = risk_budget / (risk_pct\
        \ / 100)\n        room = max(0.0, portfolio_value * MAX_NEW_POSITION_WEIGHT - position_value)\n        amount = min(by_risk, room)\n        if amount < 100:\n            return {'allowed': False, 'line': '⚠️ Покупка заблокирована · лимит позиции исчерпан'}\n        return {'allowed': True, 'amount': amount,\n                'line': f'План: до {amount:.0f} ₪ · отмена ниже {analysis[\"cancel_price\"]:.2f}',\n                'cancel_price': analysis['cancel_price']}\n    if analysis.get('status') == 'reduce':\n        return {'allowed': True, 'line': f'План: не докупать · пересмотреть позицию на ближайшем доступном NAV'}\n    return {'allowed': False, 'line': ''}\n\n\ndef load_journal():\n    try:\n        journal = json.loads(JOURNAL_FILE.read_text(encoding='utf-8'))\n        if not isinstance(journal, dict) or not isinstance(journal.get('signals'), list):\n            raise ValueError('invalid journal')\n        return journal\n    except (OSError, ValueError, TypeError, json.JSONDecodeError):\n\
        \        return {'signals': []}\n\n\ndef update_journal(journal, analyses, plans, current, now):\n    signals = journal.setdefault('signals', [])\n    today = now.date().isoformat()\n    by_fund = {signal.get('fund_id'): signal for signal in signals\n               if signal.get('kind') == 'entry' and signal.get('state') == 'open'}\n    for fund_id, signal in list(by_fund.items()):\n        row = current.get(fund_id)\n        if not row:\n            continue\n        price = float(row['price'])\n        entry = float(signal['entry_price'])\n        change = (price / entry - 1) * 100\n        signal['last_date'], signal['last_price'] = row.get('date') or today, price\n        signal['best_pct'] = max(float(signal.get('best_pct', change)), change)\n        signal['worst_pct'] = min(float(signal.get('worst_pct', change)), change)\n        horizon = date.fromisoformat(signal['horizon_date'])\n        reason = None\n        if price <= float(signal['cancel_price']):\n            reason\
        \ = 'отмена сценария'\n        elif analyses.get(fund_id, {}).get('status') == 'reduce':\n            reason = 'тренд ухудшился'\n        elif now.date() >= horizon:\n            reason = '6 месяцев'\n        if reason:\n            signal.update(state='closed', close_date=today, close_price=price,\n                          return_pct=round(change, 2), close_reason=reason)\n    for fund_id, analysis in analyses.items():\n        plan = plans.get(fund_id, {})\n        if analysis.get('status') == 'add' and plan.get('allowed') and fund_id not in by_fund:\n            signals.append({\n                'id': f'{today}:{fund_id}:entry', 'kind': 'entry', 'state': 'open',\n                'fund_id': fund_id, 'entry_date': today, 'entry_price': analysis['price'],\n                'suggested_amount': round(plan['amount'], 2),\n                'risk_budget_pct': RISK_PER_IDEA * 100,\n                'cancel_price': round(plan['cancel_price'], 2),\n                'horizon_date': (now.date()\
        \ + timedelta(days=183)).isoformat(),\n                'best_pct': 0.0, 'worst_pct': 0.0,\n            })\n        if analysis.get('status') == 'reduce':\n            signal_id = f'{today}:{fund_id}:reduce'\n            if not any(s.get('id') == signal_id for s in signals):\n                signals.append({'id': signal_id, 'kind': 'reduce', 'state': 'recorded',\n                                'fund_id': fund_id, 'date': today,\n                                'price': analysis.get('price')})\n    journal['signals'] = signals[-500:]\n    return journal\n\n\ndef journal_summary(journal):\n    entries = [s for s in journal.get('signals', []) if s.get('kind') == 'entry']\n    active = sum(s.get('state') == 'open' for s in entries)\n    closed = [s for s in entries if s.get('state') == 'closed' and s.get('return_pct') is not None]\n    if not closed:\n        return f'\U0001F4D2 Журнал: проверяются {active} · завершённых сигналов нет'\n    wins = sum(float(s['return_pct']) > 0 for s\
        \ in closed)\n    average = statistics.mean(float(s['return_pct']) for s in closed)\n    worst = min(float(s.get('worst_pct', 0)) for s in closed)\n    return (f'\U0001F4D2 Журнал: {wins}/{len(closed)} прибыльных · сред. {average:+.1f}% · '\n            f'худшая просадка {worst:.1f}% · активных {active}')\n\n\nasync def collect_context(session, quotes, now):\n    drivers = {x['ticker']: x for q in quotes.values() for x in q.get('drivers', [])}\n    limiter = asyncio.Semaphore(4)\n    async def load(ticker):\n        async with limiter:\n            return analyze_year_history(await fetch_ticker_history(session, ticker), ticker)\n    histories = dict(zip(drivers, await asyncio.gather(*(load(t) for t in drivers))))\n    contexts = {}\n    for fid, quote in quotes.items():\n        basket = [(d, histories.get(d['ticker'], {})) for d in quote.get('drivers', [])]\n        basket = [(d, h) for d, h in basket if h.get('market_date') and\n                  0 <= (now.date() - date.fromisoformat(h['market_date'])).days\
        \ <= MAX_SIGNAL_AGE_DAYS]\n        if not basket:\n            contexts[fid] = {}\n            continue\n        day = max(h['market_date'] for _, h in basket)\n        basket = [(d, h) for d, h in basket if h['market_date'] == day]\n        positive = sum(h['change_1d'] > 0 and h['change_5d'] > 0 for _, h in basket)\n        contexts[fid] = {'confirmed': len(basket) >= 2 and positive * 2 >= len(basket),\n                         'line': f'Активы: рост дня и 5 сессий {positive}/{len(basket)} · {day[8:10]}.{day[5:7]}'}\n    return contexts\n\n\ndef risk_summary(current, snapshots, now):\n    if len(current) != 7:\n        return {'line': '\U0001F6E1 Риск: оценка неполная · порог 10%', 'breached': True}\n    quantities = {fid: r['quantity'] for fid, r in current.items()}\n    def total(rows):\n        return sum(float(r['quantity']) * float(r['price']) / 100 for r in rows.values())\n    value = total(current)\n    comparable = []\n    for day in sorted(snapshots, reverse=True):\n \
        \       if day >= str(now.date()):\n            continue\n        if date.fromisoformat(day) < now.date() - timedelta(days=183):\n            break\n        rows = snapshots[day]\n        if set(rows) != set(quantities):\n            continue  # A data outage must not reset the portfolio risk baseline.\n        if {fid: r.get('quantity') for fid, r in rows.items()} != quantities:\n            break  # A changed position starts a new comparable tracking segment.\n        comparable.append((day, total(rows)))\n    peak = max([value] + [v for _, v in comparable])\n    drawdown = (value / peak - 1) * 100\n    fid = max(current, key=lambda f: total({f: current[f]}))\n    weight = total({fid: current[fid]}) / value * 100\n    line = f'\U0001F6E1 {fid}: {weight:.1f}% портфеля'\n    if comparable:\n        line += f' · от пика снимков {drawdown:.1f}% / порог −10%'\n    else:\n        line += ' · контроль просадки начат (порог 10%)'\n    breached = drawdown <= -MAX_DRAWDOWN\n    if breached:\n\
        \        line += '\\n\U0001F53B Порог риска достигнут: пересмотреть позиции; докупки отложить.'\n    return {'line': line, 'breached': breached, 'largest': fid,\n            'largest_value': total({fid: current[fid]}),\n            'concentrated': weight > CONCENTRATION_LIMIT}\n\n\ndef comparison_lines(analyses, now):\n    try:\n        payload = json.loads(CANDIDATES_FILE.read_text())\n        age = now.timestamp() - datetime.fromisoformat(payload['generated_at']).timestamp()\n        if not 0 <= age <= 48 * 3600:\n            return []\n        rows = payload['rows']\n    except (OSError, ValueError, KeyError, TypeError):\n        return []\n    from modules.formatter import _radar_verdict\n    for fid, own in analyses.items():\n        if own['status'] != 'reduce':\n            continue\n        for row in rows:\n            if row.get('fund_id') not in RESEARCH_PAIRS.get(fid, set()):\n                continue\n            stats = row.get('il_fund_data', {}).get('price_stats',\
        \ {})\n            candidate = assess(stats.get('chart_history', []), now, stats.get('current_price'), stats.get('price_date'))\n            if (candidate['status'] == 'hold' and _radar_verdict(row)[0] == '✅▲'\n                    and candidate['date'] == own.get('date')\n                    and candidate['volatility'] < own['volatility'] * .9):\n                return [f'\U0001F504 Сравнить {fid} → {row[\"fund_id\"]}: восстановление, колебания ниже.',\n                        'Кандидат для замены; состав, налоги и результат после продажи требуют проверки.']\n    return []\nEOF\n\ncat << 'EOF' > modules/portfolio.py\nimport asyncio\nimport json\nimport os\nimport re\nfrom datetime import datetime, date\nfrom decimal import Decimal, ROUND_HALF_UP\nfrom pathlib import Path\nfrom zoneinfo import ZoneInfo\n\nimport aiohttp\n\nfrom modules.market import (\n    fetch_bizportal_price_history, IL_CONCURRENCY, IL_REQUEST_TIMEOUT,\n    _FundHTML, _clean_text, parse_bizportal_page, is_access_challenge,\n\
        )\nfrom modules.telegram_sender import send_to_telegram\nfrom modules.config import BOT_NAME, HEADERS\n\n# Quantities transcribed from the latest supplied portfolio screenshot; update after trades.\n# Israeli fund quotes are in agorot: quantity * quote / 100 = value in ILS.\nHOLDINGS = (\n    ('5103692', 'Meitav Sky', '733'),\n    ('5132014', 'Ayalon Green Israel', '754'),\n    ('5132220', 'More Cloud Cyber', '522'),\n    ('5132303', 'Eylim Banks', '193'),\n    ('5134135', 'MTF Metals & Minerals', '1322'),\n    ('5137534', 'Eylim AI', '442'),\n    ('5140983', 'Ayalon Insurance', '251'),\n)\n# Direct US stock positions from the latest bank screenshot.\n# Cost basis is in ILS: displayed market value minus displayed accumulated P/L.\nSTOCK_HOLDINGS = (\n    ('NVDA', 'NVDA', '10', 'USD', '4983.17'),\n    ('ANT', 'ANT', '10', 'USD', '3369.67'),\n)\n# Acquisition basis inferred from the latest supplied bank screenshot:\n# displayed market value minus displayed accumulated P/L (rounded bank amounts).\n# Update BOTH quantity and basis\
        \ after any trade; never infer trades from price changes.\nPURCHASE_BASIS = {\n    '5103692': ('733', '7353.24'),\n    '5132014': ('754', '1272.98'),\n    '5132220': ('522', '1100.86'),\n    '5132303': ('193', '796.99'),\n    '5134135': ('1322', '2296.98'),\n    '5137534': ('442', '824.64'),\n    '5140983': ('251', '405.29'),\n    'NVDA': ('10', '4983.17'),\n    'ANT': ('10', '3369.67'),\n}\nSTATE = Path('portfolio_snapshots.json')\nTZ = ZoneInfo('Asia/Jerusalem')\nLABELS = {'5103692': 'Meitav Sky', '5132014': 'Ayalon Green', '5132220': 'More Cloud Cyber',\n          '5132303': 'Eylim Banks', '5134135': 'MTF Metals',\n          '5137534': 'Eylim AI', '5140983': 'Ayalon Insurance',\n          'NVDA': 'NVDA', 'ANT': 'ANT'}\n\n\ndef parse_funder_portfolio(body, fund_id, today):\n    \"\"\"Read the dated redemption quote and its own series, never evaluate JS.\"\"\"\n    def payload(name):\n        match = re.search(r'\\bvar\\s+' + name + r'\\s*=\\s*', body)\n        if not match:\n            return {}\n        try:\n         \
        \   return json.JSONDecoder().raw_decode(body[match.end():])[0]\n        except (ValueError, TypeError):\n            return {}\n    try:\n        records = payload('fundData')['x']\n        if len(records) != 1 or str(records[0]['fundNum']) != str(fund_id):\n            return [], {}\n        record = records[0]\n        day = date.fromisoformat(str(record['lastUpdate'])[:10])\n        price = Decimal(str(record['sellPrice']))\n        if day > today or not price.is_finite() or price <= 0:\n            return [], {}\n        points = {}\n        for row in payload('fundGraphData').get('x', []):\n            d, p = date.fromisoformat(row['c']), Decimal(str(row['p']))\n            if d > today or not p.is_finite() or p <= 0:\n                continue\n            if d in points and points[d] != p:\n                return [], {}\n            points[d] = p\n        ordered = sorted(points.items())\n        # Quote and graph must refer to the same last publication.\n        if not ordered\
        \ or ordered[-1] != (day, price):\n            return [], {}\n        daily = Decimal(str(record['1day']))\n        if not daily.is_finite():\n            return [], {}\n        history = [{'date': d.isoformat(), 'price': str(p)} for d, p in ordered]\n        return history, {'price': str(price), 'date': day.isoformat(),\n                         'daily': str(daily), 'source': 'Funder'}\n    except (KeyError, TypeError, ValueError, ArithmeticError, AttributeError):\n        return [], {}\n\n\nasync def fetch_funder_portfolio(session, fund_id, limiter, today):\n    url = f'https://www.funder.co.il/fund/{fund_id}'\n    try:\n        async with limiter:\n            async with session.get(url, headers=HEADERS) as response:\n                if response.status != 200:\n                    return [], {}\n                body = await response.text()\n        return parse_funder_portfolio(body, fund_id, today)\n    except (aiohttp.ClientError, asyncio.TimeoutError):\n        return [], {}\n\
        \n\nasync def fetch_portfolio_position(session, fund_id, limiter, denied, today):\n    (history, quote), (verified_history, verified_quote) = await asyncio.gather(\n        fetch_portfolio_fund(session, fund_id, limiter, denied),\n        fetch_funder_portfolio(session, fund_id, limiter, today),\n    )\n    if not verified_quote:\n        return history, quote\n    # Funder supplies an explicit quote date and a longer, coherent price series.\n    # A newer dated Bizportal quote still takes priority.\n    dated = reconcile_quote_date(quote, valid_points(history + verified_history, today), today)\n    if dated.get('date') and dated['date'] > verified_quote['date']:\n        return history, dated\n    verified_quote['drivers'] = quote.get('drivers', [])\n    if quote:\n        same_price = Decimal(quote['price']) == Decimal(verified_quote['price'])\n        older = bool(dated.get('date') and dated['date'] < verified_quote['date'])\n        if not same_price and not older:\n        \
        \    verified_quote['source_conflict'] = True\n        elif same_price:\n            verified_quote['source'] = 'Bizportal + Funder'\n    return verified_history, verified_quote\n\n\ndef parse_portfolio_quote(html, fund_id):\n    # Reuse strict fund identity validation; never pick a fee or buy price.\n    general = parse_bizportal_page(html, fund_id)\n    if not general:\n        return {}\n    root = _FundHTML(html).root\n    for block in root.walk():\n        if block.attrs.get('id') != 'paper_change':\n            continue\n        for cube in block.walk():\n            if 'top-area-cube' not in cube.attrs.get('class', '').split():\n                continue\n            labels = [n for n in cube.walk() if 'label' in n.attrs.get('class', '').split()]\n            nums = [n for n in cube.walk() if 'num' in n.attrs.get('class', '').split()]\n            if not labels or not nums or _clean_text(labels[0].text()) != 'מחיר פדיון':\n                continue\n            try:\n      \
        \          price = Decimal(_clean_text(nums[0].text()).replace(',', '').replace(' ', ''))\n                if not price.is_finite() or price <= 0:\n                    return {}\n            except ArithmeticError:\n                return {}\n            day = None\n            if general.get('update_date'):\n                try:\n                    day = datetime.strptime(general['update_date'].replace('.', '/'), '%d/%m/%Y').date().isoformat()\n                except ValueError:\n                    pass\n            return {'price': str(price), 'date': day, 'daily': general.get('daily')}\n    return {}\n\n\nasync def fetch_portfolio_fund(session, fund_id, limiter, denied, *, history_pages=12):\n    quote = {}\n    # Visiting the page also initializes the ordinary site's session before AJAX.\n    for page in ('generalview', 'performance'):\n        url = f'https://www.bizportal.co.il/mutualfunds/quote/{page}/{fund_id}'\n        try:\n            async with limiter:\n          \
        \      if denied.is_set():\n                    return [], {}\n                async with session.get(url, headers=HEADERS) as response:\n                    body = await response.text(errors='ignore')\n                    status = response.status\n            print(f'Portfolio page {fund_id} {page}: HTTP {status}, bytes={len(body)}')\n            if status in {401, 403, 429} or is_access_challenge(body):\n                denied.set()\n                return [], {}\n            if status == 200:\n                quote = parse_portfolio_quote(body, fund_id)\n                if quote:\n                    from modules.portfolio_insights import holdings_from_page\n                    quote['drivers'] = holdings_from_page(body)\n                    break\n        except (aiohttp.ClientError, asyncio.TimeoutError) as error:\n            print(f'Portfolio page {fund_id}: {type(error).__name__}')\n    history = await fetch_bizportal_price_history(session, fund_id, limiter, denied, max_pages=history_pages)\n\
        \    return history, quote\n\n\ndef money(value, signed=False):\n    value = Decimal(value).quantize(Decimal('0.01'), rounding=ROUND_HALF_UP)\n    if value == 0:\n        value = abs(value)\n    return format(value, '+,.2f' if signed else ',.2f').replace(',', ' ')\n\n\ndef valid_points(history, today):\n    points = {}\n    for row in history:\n        try:\n            day = date.fromisoformat(row['date'])\n            price = Decimal(str(row['price']))\n            if day <= today and price.is_finite() and price > 0:\n                points[day.isoformat()] = str(price)\n        except (ValueError, KeyError, TypeError, ArithmeticError):\n            continue\n    return sorted(points.items())\n\n\ndef signed_result(delta, base):\n    marker = '\U0001F7E9▲' if delta > 0 else '\U0001F7E5▼' if delta < 0 else '⬜•'\n    return f'{marker} {money(delta, True)} ₪ ({money(delta / base * 100, True)}%)'\n\n\ndef reconcile_quote_date(quote, points, today):\n    \"\"\"Date an undated page only\
        \ by a unique recent price AND return match.\"\"\"\n    if not quote or quote.get('date') or len(points) < 2:\n        return quote\n    try:\n        price, daily = Decimal(str(quote['price'])), Decimal(str(quote['daily']))\n        if not price.is_finite() or not daily.is_finite():\n            return quote\n    except (KeyError, ValueError, ArithmeticError):\n        return quote\n    matches = []\n    for (prior_day, prior_price), (day, value) in zip(points, points[1:]):\n        age = (today - date.fromisoformat(day)).days\n        gap = (date.fromisoformat(day) - date.fromisoformat(prior_day)).days\n        if not (0 <= age <= 7 and 0 < gap <= 7) or Decimal(value) != price:\n            continue\n        change = (price / Decimal(prior_price) - 1) * 100\n        if abs(change - daily) <= Decimal('0.10'):\n            matches.append(day)\n    if len(matches) == 1:\n        return dict(quote, date=matches[0], date_source='history_match')\n    return quote\n\n\ndef daily_result(points,\
        \ price_day, price, quantity, quote):\n    \"\"\"Use two source observations, never the previous bot snapshot.\"\"\"\n    if not price_day or len(points) < 2:\n        return None\n    if points[-1][0] != price_day or Decimal(points[-1][1]) != price:\n        return None\n    old_day, old_price = points[-2]\n    # A long gap is not called a daily move; no extrapolation from missing NAVs.\n    if not 0 < (date.fromisoformat(price_day) - date.fromisoformat(old_day)).days <= 7:\n        return None\n    old_price = Decimal(old_price)\n    pct = (price / old_price - 1) * 100\n    # When supplied for the same date, the source's daily return must agree.\n    if quote.get('date') == price_day and quote.get('daily') is not None:\n        published_pct = Decimal(str(quote['daily']))\n        if not published_pct.is_finite() or abs(pct - published_pct) > Decimal('0.10'):\n            return None\n    base = quantity * old_price / 100\n    return {'delta': quantity * (price - old_price) / 100,\
        \ 'base': base,\n            'start': old_day, 'end': price_day}\n\n\ndef portfolio_briefing(rows, risk, total, total_day):\n    lines = ['<b>Коротко</b>']\n    if total_day:\n        lines.append('День портфеля: ' + signed_result(total_day['delta'], total_day['base']))\n    else:\n        valued = sum(row.get('value') is not None for row in rows)\n        lines.append(f'Обновлены цены {valued}/{len(HOLDINGS) + len(STOCK_HOLDINGS)} позиций')\n\n    if risk.get('concentrated'):\n        largest = LABELS.get(risk.get('largest'), risk.get('largest'))\n        share = risk.get('largest_value', 0) / float(total) * 100 if total else 0\n        lines.append(f'Главный риск: концентрация {largest} {share:.1f}% портфеля')\n    return lines\n\n\nasync def fetch_yahoo_chart(session, ticker, *, range_='10d', interval='1d'):\n    url = f'https://query1.finance.yahoo.com/v8/finance/chart/{ticker}?range={range_}&interval={interval}'\n    try:\n        async with session.get(url, headers=HEADERS)\
        \ as response:\n            if response.status != 200:\n                print(f'Yahoo {ticker}: HTTP {response.status}')\n                return []\n            data = await response.json()\n        results = data.get('chart', {}).get('result') or []\n        if not results:\n            return []\n        chart = results[0]\n        timestamps = chart.get('timestamp') or []\n        quotes = chart.get('indicators', {}).get('quote') or []\n        closes = quotes[0].get('close') or [] if quotes else []\n        rows = []\n        for timestamp, close in zip(timestamps, closes):\n            if timestamp is None or close is None:\n                continue\n            price = Decimal(str(close))\n            if price.is_finite() and price > 0:\n                rows.append({\n                    'date': datetime.fromtimestamp(int(timestamp), ZoneInfo('America/New_York')).date().isoformat(),\n                    'price': str(price),\n                })\n        return rows\n    except\
        \ (aiohttp.ClientError, asyncio.TimeoutError, ValueError, ArithmeticError, KeyError, TypeError) as error:\n        print(f'Yahoo {ticker}: {type(error).__name__}')\n        return []\n\n\nasync def fetch_stock_position(session, ticker, currency, today):\n    stock_history, fx_history = await asyncio.gather(\n        fetch_yahoo_chart(session, ticker),\n        fetch_yahoo_chart(session, f'{currency}ILS=X') if currency != 'ILS' else asyncio.sleep(0, result=[]),\n    )\n    if not stock_history:\n        return [], {}\n    fx_by_date = {row['date']: Decimal(row['price']) for row in fx_history}\n    if currency == 'ILS':\n        fx_by_date = {row['date']: Decimal('1') for row in stock_history}\n    converted = []\n    for row in stock_history:\n        day = row['date']\n        fx = fx_by_date.get(day)\n        if fx is None:\n            prior_fx = [(d, v) for d, v in fx_by_date.items() if d <= day]\n            if prior_fx:\n                fx = sorted(prior_fx)[-1][1]\n       \
        \ if fx is None:\n            continue\n        price_ils = Decimal(row['price']) * fx\n        converted.append({'date': day, 'price': str(price_ils)})\n    points = valid_points(converted, today)\n    if not points:\n        return [], {}\n    last_day, last_price = points[-1]\n    quote = {'price': last_price, 'date': last_day, 'source': f'Yahoo {ticker}/{currency}ILS'}\n    return converted, quote\n\n\ndef daily_result_stock(points, price_day, price, quantity):\n    if not price_day or len(points) < 2:\n        return None\n    if points[-1][0] != price_day or Decimal(points[-1][1]) != price:\n        return None\n    old_day, old_price = points[-2]\n    if not 0 < (date.fromisoformat(price_day) - date.fromisoformat(old_day)).days <= 7:\n        return None\n    old_price = Decimal(old_price)\n    return {'delta': quantity * (price - old_price), 'base': quantity * old_price,\n            'start': old_day, 'end': price_day}\n\n\n\ndef build_report(histories, snapshots, now, quotes=None,\
        \ contexts=None, journal=None, presentation=None):\n    from html import escape\n    from modules.portfolio_insights import (\n        ICONS, assess, risk_summary, comparison_lines, trade_plan,\n        update_journal, journal_summary, RISK_PER_IDEA,\n    )\n    quotes, contexts = quotes or {}, contexts or {}\n    journal = journal if journal is not None else {'signals': []}\n    today = now.date()\n    previous_days = sorted(d for d in snapshots if d < today.isoformat())\n    previous = snapshots[previous_days[-1]] if previous_days else {}\n    analyses, position_values, current_snapshot, rows, daily_moves = {}, {}, {}, [], []\n    total_positions = len(HOLDINGS) + len(STOCK_HOLDINGS)\n    total = cost_total = pnl_total = Decimal(0)\n    cost_count = 0\n    for fund_id, name, qty in HOLDINGS:\n        quantity = Decimal(qty)\n        points = valid_points(histories.get(fund_id, []), today)\n        quote = reconcile_quote_date(quotes.get(fund_id) or {}, points, today)\n        row\
        \ = {'id': fund_id, 'name': LABELS.get(fund_id, name), 'icon': ICONS.get(fund_id, '\U0001F4CA'),\n               'quantity': qty, 'value': None, 'decision': 'Цена пока недоступна'}\n        rows.append(row)\n        if not points and not quote:\n            continue\n        use_page = bool(quote) and (\n            not points or (quote.get('date') and quote['date'] >= points[-1][0])\n            or (not quote.get('date') and Decimal(quote['price']) != Decimal(points[-1][1]))\n        )\n        price_day, raw_price = (quote.get('date'), quote['price']) if use_page else points[-1]\n        old = previous.get(fund_id, {})\n        if price_day and (price_day > today.isoformat() or\n                          (old.get('date') and price_day < old['date'])):\n            row['decision'] = 'Источник вернул более старые данные'\n            continue\n        price = Decimal(raw_price)\n        value = quantity * price / 100\n        total += value\n        position_values[fund_id] = float(value)\n\
        \        current_snapshot[fund_id] = {'date': price_day, 'price': str(price), 'quantity': qty}\n        row.update(price=price, date=price_day, value=value, source=quote.get('source', 'Bizportal'),\n                   source_conflict=bool(quote.get('source_conflict')))\n        basis = PURCHASE_BASIS.get(fund_id)\n        if basis and Decimal(basis[0]) == quantity and Decimal(basis[1]) > 0:\n            cost = Decimal(basis[1])\n            pnl = value - cost\n            cost_total += cost\n            pnl_total += pnl\n            cost_count += 1\n            current_snapshot[fund_id]['purchase_cost'] = str(cost)\n            row.update(cost=cost, pnl=pnl, pnl_pct=pnl / cost * 100)\n        movement = daily_result(points, price_day, price, quantity, quote)\n        if quote.get('source_conflict'):\n            movement = None\n        row['movement'] = movement\n        if movement:\n            daily_moves.append(movement)\n        analysis = assess(histories.get(fund_id, []),\
        \ now, price, price_day, contexts.get(fund_id))\n        if quote.get('source_conflict'):\n            analysis = {'status': 'missing', 'line': 'Источники расходятся: сигнал отложен'}\n        elif not movement:\n            analysis = {'status': 'missing', 'line': 'Изменение цены пока не подтверждено'}\n        analyses[fund_id] = analysis\n        row['analysis'] = analysis\n\n    for ticker, name, qty, currency, basis_ils in STOCK_HOLDINGS:\n        quantity = Decimal(qty)\n        points = valid_points(histories.get(ticker, []), today)\n        quote = quotes.get(ticker) or {}\n        row = {'id': ticker, 'name': LABELS.get(ticker, name), 'icon': 'N',\n               'quantity': qty, 'value': None, 'decision': 'Цена акции пока недоступна'}\n        rows.append(row)\n        if not points and not quote:\n            continue\n        price_day, raw_price = (quote.get('date'), quote['price']) if quote else points[-1]\n        price = Decimal(raw_price)\n        value = quantity\
        \ * price\n        total += value\n        position_values[ticker] = float(value)\n        current_snapshot[ticker] = {\n            'date': price_day, 'price': str(price * 100), 'quantity': qty,\n            'purchase_cost': str(Decimal(basis_ils)),\n        }\n        row.update(price=price, date=price_day, value=value, source=quote.get('source', 'Yahoo'),\n                   asset_type='stock', cost=Decimal(basis_ils))\n        pnl = value - Decimal(basis_ils)\n        cost_total += Decimal(basis_ils)\n        pnl_total += pnl\n        cost_count += 1\n        row.update(pnl=pnl, pnl_pct=pnl / Decimal(basis_ils) * 100)\n        movement = daily_result_stock(points, price_day, price, quantity)\n        row['movement'] = movement\n        if movement:\n            daily_moves.append(movement)\n        analysis = {'status': 'hold', 'line': 'Прямая акция: следить за весом позиции'}\n        analyses[ticker] = analysis\n        row['analysis'] = analysis\n\n    lines = [now.strftime('\U0001F4BC\
        \ <b>МОЙ ПОРТФЕЛЬ</b>\\n%d.%m · %H:%M · Израиль')]\n    valued = len(current_snapshot)\n    if not valued:\n        return '\\n'.join(lines + ['⚠️ Цены фондов временно недоступны.',\n                                  'Стоимость не рассчитана. Предыдущий снимок сохранён.', BOT_NAME]), {}, journal\n    label = 'Стоимость' if valued == total_positions else f'Стоимость {valued}/{len(HOLDINGS)}'\n    lines.append(f'\\n<b>{label}: {money(total)} ₪</b>')\n    if cost_count:\n        label = 'С покупки' if cost_count == total_positions else f'С покупки {cost_count}/{len(HOLDINGS)}'\n        lines.append(f'{label}: {signed_result(pnl_total, cost_total)}')\n        lines.append(f'Вложено: {money(cost_total)} ₪' + ('' if cost_count == total_positions else ' · частично'))\n    periods = {(m['start'], m['end']) for m in daily_moves}\n    total_day = None\n    if len(daily_moves) == total_positions and len(periods) == 1:\n        first, last = next(iter(periods))\n        total_day = {'start':\
        \ first, 'end': last, 'delta': sum(m['delta'] for m in daily_moves),\n                     'base': sum(m['base'] for m in daily_moves)}\n        lines.append(f'День {date.fromisoformat(first):%d.%m}→{date.fromisoformat(last):%d.%m}: '\n                     + signed_result(total_day['delta'], total_day['base']))\n\n    risk = risk_summary(current_snapshot, snapshots, now)\n    active_risk = sum(float(s.get('risk_budget_pct', RISK_PER_IDEA * 100)) / 100\n                      for s in journal.get('signals', [])\n                      if s.get('kind') == 'entry' and s.get('state') == 'open')\n    plans = {}\n    for row in rows:\n        fid = row['id']\n        card = [f'{row[\"icon\"]} <b>{escape(row[\"name\"])}</b> · <code>{fid}</code>']\n        if row['value'] is None:\n            lines.extend(['', *card, row['decision'] + ' · в итог не включён'])\n            continue\n        day = date.fromisoformat(row['date']).strftime('%d.%m') if row.get('date') else 'дата не указана'\n\
        \        if row.get('asset_type') == 'stock':\n            card.append(f'<b>{money(row[\"value\"])} ₪</b> · {row[\"quantity\"]} акций × {money(row[\"price\"])} ₪')\n        else:\n            card.append(f'<b>{money(row[\"value\"])} ₪</b> · {row[\"quantity\"]} паёв × {money(row[\"price\"])} аг.')\n        if 'pnl' in row:\n            card.append('С покупки ' + signed_result(row['pnl'], row['cost']))\n        else:\n            card.append('С покупки: обнови базу покупки')\n        movement = row.get('movement')\n        if movement:\n            prior = date.fromisoformat(movement['start']).strftime('%d.%m')\n            card.append(f'День {prior}→{day}: ' + signed_result(movement['delta'], movement['base']))\n        else:\n            card.append(f'Цена {day} · дневное изменение не подтверждено')\n        analysis = analyses[fid]\n        status = analysis['status']\n        if row.get('asset_type') == 'stock':\n            plan = {'allowed': False}\n            plans[fid] = plan\n\
        \            decision = 'Прямая акция: следить за весом позиции и USD/ILS'\n        else:\n            risk['active_signal_risk'] = active_risk\n            plan = trade_plan(fid, analysis, float(total), position_values[fid], risk)\n            plans[fid] = plan\n            if status == 'add':\n                if plan.get('allowed'):\n                    active_risk += RISK_PER_IDEA\n                    decision = f'Докупка по модели: до {plan[\"amount\"]:.0f} ₪; отмена < {plan[\"cancel_price\"]:.2f}'\n                else:\n                    decision = (plan.get('line') or 'Докупка ограничена риском').removeprefix('⚠️ ')\n            elif status == 'reduce':\n                decision = 'Устойчивое снижение: рассмотреть сокращение'\n            elif status == 'hold':\n                decision = 'Тренд вверх; докупка не подтверждена'\n            elif status == 'wait':\n                decision = 'Падение не остановилось; не докупать'\n            elif status == 'watch':\n    \
        \            decision = 'Ждать устойчивого роста фонда'\n            else:\n                decision = 'Сигнал отложен: нужны свежие данные'\n                if row.get('source_conflict'):\n                    decision = 'Источники расходятся; сигнал отложен'\n        row['decision'], row['status'] = decision, status\n        lines.extend(['', *card])\n    journal = update_journal(journal, analyses, plans, current_snapshot, now)\n    notes = comparison_lines(analyses, now)\n    if risk.get('breached'):\n        notes.append('⚠️ Докупки заблокированы · данные неполные или просадка достигла 10%')\n    elif risk.get('concentrated'):\n        notes.append(f'⚠️ {LABELS.get(risk[\"largest\"], risk[\"largest\"])}: '\n                     f'{risk[\"largest_value\"] / float(total) * 100:.1f}% портфеля')\n    if any(s.get('kind') == 'entry' for s in journal.get('signals', [])):\n        notes.append(journal_summary(journal).replace('\U0001F4D2 Журнал:', '\U0001F4D2 Модель, не сделки:'))\n\
        \    if total_day is None and daily_moves:\n        notes.append('Даты цен различаются: общий дневной итог не складывается.'\n                     if len(periods) > 1 else 'Дневное изменение подтверждено не по всем фондам.')\n    lines.extend(['', *portfolio_briefing(rows, risk, total, total_day)])\n    lines.extend(['', *notes, '', BOT_NAME])\n    if presentation is not None:\n        presentation.update(now=now, total=total, cost=cost_total, pnl=pnl_total,\n                            pnl_pct=pnl_total / cost_total * 100 if cost_total else None,\n                            cost_count=cost_count, valued=valued, rows=rows, notes=notes,\n                            daily=total_day)\n    return '\\n'.join(lines), current_snapshot, journal\n\nasync def run_portfolio(caption_builder=None, on_delivered=None, extra_images=None):\n    destination = os.getenv('PORTFOLIO_CHAT_ID')\n    dry_run = os.getenv('DRY_RUN', '').lower() == 'true'\n    if not destination and not dry_run:\n       \
        \ raise RuntimeError('Set PORTFOLIO_CHAT_ID to your private Telegram chat ID')\n    now = datetime.now(TZ)\n    try:\n        snapshots = json.loads(STATE.read_text(encoding='utf-8'))\n        if not isinstance(snapshots, dict):\n            raise ValueError('invalid portfolio snapshots')\n        # Validate cached baselines before using them for monetary comparisons.\n        for day, holdings in snapshots.items():\n            date.fromisoformat(day)\n            for row in holdings.values():\n                if row.get('date'):\n                    date.fromisoformat(row['date'])\n                p = Decimal(row['price'])\n                if not p.is_finite() or p <= 0:\n                    raise ValueError('invalid baseline price')\n    except (OSError, ValueError, TypeError, KeyError, ArithmeticError, AttributeError):\n        snapshots = {}\n    from modules.portfolio_insights import load_journal, JOURNAL_FILE\n    journal = load_journal()\n    limiter, denied = asyncio.Semaphore(IL_CONCURRENCY),\
        \ asyncio.Event()\n    timeout = aiohttp.ClientTimeout(total=IL_REQUEST_TIMEOUT)\n    async with aiohttp.ClientSession(timeout=timeout, trust_env=True) as session:\n        values = await asyncio.gather(*[\n            fetch_portfolio_position(session, fid, limiter, denied, now.date())\n            for fid, _, _ in HOLDINGS\n        ])\n        stock_values = await asyncio.gather(*[\n            fetch_stock_position(session, ticker, currency, now.date())\n            for ticker, _, _, currency, _ in STOCK_HOLDINGS\n        ])\n    histories = {holding[0]: result[0] for holding, result in zip(HOLDINGS, values)}\n    quotes = {holding[0]: result[1] for holding, result in zip(HOLDINGS, values)}\n    histories.update({holding[0]: result[0] for holding, result in zip(STOCK_HOLDINGS, stock_values)})\n    quotes.update({holding[0]: result[1] for holding, result in zip(STOCK_HOLDINGS, stock_values)})\n    from modules.portfolio_insights import collect_context\n    async with aiohttp.ClientSession(timeout=timeout,\
        \ trust_env=True) as session:\n        try:\n            contexts = await collect_context(session, quotes, now)\n        except Exception as error:\n            print(f'Portfolio context unavailable: {type(error).__name__}')\n            contexts = {}\n    presentation = {}\n    message, current, journal = build_report(\n        histories, snapshots, now, quotes, contexts, journal, presentation\n    )\n    from modules.portfolio_card import render_portfolio_card, portfolio_caption\n    from modules.telegram_sender import send_chart_photos\n    caption = portfolio_caption(presentation) if current else ''\n    supplement = ''\n    if caption_builder:\n        caption, supplement = await caption_builder(caption)\n    if supplement:\n        message = message.removesuffix(BOT_NAME).rstrip() + '\\n\\n' + supplement + '\\n\\n' + BOT_NAME\n    if dry_run:\n        print(message)\n        return\n    png = None\n    if current:\n        try:\n            png = render_portfolio_card(presentation)\n\
        \        except Exception as error:\n            print(f'Portfolio image unavailable: {type(error).__name__}; using text')\n    if png is not None:\n        await send_chart_photos([(png, caption), *(extra_images or [])], title='\U0001F4BC МОЙ ПОРТФЕЛЬ',\n                                chat_id=destination, parse_mode='HTML')\n    else:\n        await send_to_telegram(message, chat_id=destination)\n    if on_delivered:\n        on_delivered()\n    if not current:\n        print('::warning::Portfolio prices unavailable; baseline was not updated')\n        return\n    # Repeated runs on the same date retain the previous morning as the baseline.\n    snapshots[now.date().isoformat()] = current\n    snapshots = {day: snapshots[day] for day in sorted(snapshots)[-200:]}\n    temporary = STATE.with_suffix('.tmp')\n    temporary.write_text(json.dumps(snapshots, ensure_ascii=False), encoding='utf-8')\n    temporary.replace(STATE)\n    journal_temporary = JOURNAL_FILE.with_suffix('.tmp')\n\
        \    journal_temporary.write_text(json.dumps(journal, ensure_ascii=False), encoding='utf-8')\n    journal_temporary.replace(JOURNAL_FILE)\nEOF\n\ncat << 'EOF' > modules/fund_news.py\n\"\"\"Direct, dated fund mentions. Editorial coverage is not a popularity ranking.\"\"\"\nimport asyncio\nimport re\nimport xml.etree.ElementTree as ET\nfrom datetime import datetime\nfrom email.utils import parsedate_to_datetime, format_datetime\nfrom html import escape, unescape\nfrom urllib.parse import urlparse, urljoin\n\nimport aiohttp\n\nfrom modules.market import _FundHTML, _clean_text, is_access_challenge\nfrom modules.news import shorten_title, translate_to_russian\n\nFEED = 'https://www.funder.co.il/rssNews.aspx'\nCATEGORY = 'https://funder.co.il/'\nBIZ_NEWS = 'https://www.bizportal.co.il/mutualfunds/news'\nMAX_CANDIDATES = 6\nREVIEW_DAYS = (7, 14, 21, 30)\n\n\ndef watch_jobs(state, now):\n    watches = state.get('news_watch', {})\n    if not isinstance(watches, dict):\n        return []\n\
        \    jobs = []\n    for fid, record in watches.items():\n        try:\n            elapsed = (now.date() - datetime.fromisoformat(record['registered']).date()).days\n            sent = record.get('sent_stages', [])\n            if 30 in sent or elapsed < 0:\n                continue\n            due = max((d for d in REVIEW_DAYS if d <= elapsed and d not in sent), default=0)\n            if due or not record.get('base_price'):\n                jobs.append({'fund_id':fid,'stage':due,'elapsed':elapsed, 'registered':record['registered']})\n        except (ValueError,TypeError,KeyError):\n            continue\n    return sorted(jobs,key=lambda j:(not bool(j['stage']),j['registered']))[:12]\n\n\ndef build_reviews(state, jobs, data, now, verify):\n    reviews = []\n    for job in jobs:\n        fid = job['fund_id']\n        record = state['news_watch'][fid]\n        history, quote = data.get(fid,([],{}))\n        try:\n            daily = float(quote['daily'])\n            points = verify(history,quote,daily,now.date())\n\
        \        except (KeyError,ValueError,TypeError):\n            points = None\n        if points:\n            day, price = points[-1]\n            if not record.get('base_price'):\n                record.update(base_price=price,base_date=day.isoformat(),last_report_nav=day.isoformat())\n            if day.isoformat() < record['base_date']:\n                points = None\n        if not job['stage']:\n            continue\n        item = {**job,'name':record['name'],'line':'Нет свежей подтверждённой цены.'}\n        if points:\n            item['nav_date'] = day.isoformat()\n            if day.isoformat() <= record.get('last_report_nav',record['base_date']):\n                item['line'] = f'Нового NAV нет · {day:%d.%m}'\n            else:\n                pct = (price / record['base_price'] - 1)*100\n                direction = '\U0001F7E9▲' if pct > 0 else '\U0001F7E5▼' if pct < 0 else '⬜•'\n                start = datetime.fromisoformat(record['base_date']).strftime('%d.%m')\n \
        \               item['line'] = f'{direction} {pct:+.1f}% · {start}→{day:%d.%m}'\n        reviews.append(item)\n    return reviews\n\n\ndef register_delivered(state, now):\n    if not isinstance(state.get('news_watch'),dict):\n        state['news_watch'] = {}\n    watches = state['news_watch']\n    for item in state.get('_delivered_focus',[]):\n        fid = item['fund_id']\n        if fid in watches and 30 not in watches[fid].get('sent_stages',[]):\n            continue  # A new headline must not reset an active observation period.\n        analysis = item.get('analysis') or item.get('baseline') or {}\n        watches[fid] = {'name':item['name'],'registered':now.isoformat(),'sent_stages':[],\n                        'base_price':analysis.get('price'),'base_date':analysis.get('date'),\n                        'last_report_nav':analysis.get('date'), 'source':item['news']['url']}\n    for item in state.get('_delivered_reviews',[]):\n        record = watches[item['fund_id']]\n      \
        \  record['sent_stages'] = sorted(set(record.get('sent_stages',[])) |\n                                      {d for d in REVIEW_DAYS if d <= item['stage']})\n        if item.get('nav_date'):\n            record['last_report_nav'] = item['nav_date']\n    closed = sorted((fid for fid,r in watches.items() if 30 in r.get('sent_stages',[])),\n                    key=lambda fid:watches[fid]['registered'])\n    for fid in closed[:-100]:\n        del watches[fid]\n\n\n\ndef canonical(text):\n    text = unescape(str(text or '')).replace('quot;', '\"')\n    text = _clean_text(_FundHTML(text).root.text())\n    text = re.sub(r'\\([0-6][0-6A-Fa-fא-ו]\\)', ' ', text)\n    text = text.translate(str.maketrans('', '', '\\\"\\'`׳״‘’“”'))\n    return re.sub(r'\\s+', ' ', text).strip().casefold()\n\n\ndef evidence_excerpt(text, start, end):\n    # Preserve a source sentence around the actual fund mention, not an unrelated headline.\n    boundaries = list(re.finditer(r'[.!?]\\s+', text))\n    left =\
        \ max((m.end() for m in boundaries if m.end() <= start), default=0)\n    right = min((m.start()+1 for m in boundaries if m.start() >= end), default=len(text))\n    if right-left > 350:\n        left = max(left,start-80)\n        left = text.find(' ',left)+1 if left else 0\n        right = min(right,end+220)\n    return shorten_title(text[left:right],300)\n\n\ndef parse_mentions(body, listing, now):\n    root = ET.fromstring(body)\n    if root.tag != 'rss' or root.find('channel') is None:\n        raise ValueError('not a news feed')\n    names = {}\n    for row in listing:\n        key = canonical(row['name'])\n        if len(key) >= 8:\n            names.setdefault(key, []).append(row)\n    names = {key: rows[0] for key, rows in names.items() if len(rows) == 1}\n    found, seen_urls = {}, set()\n    for item in root.findall('./channel/item'):\n        try:\n            published = parsedate_to_datetime(item.findtext('pubDate') or '')\n            if published.tzinfo is None or not\
        \ 0 <= (now - published).total_seconds() <= 86400:\n                continue\n        except (ValueError, TypeError, OverflowError):\n            continue\n        url = item.findtext('link') or ''\n        parsed = urlparse(url)\n        allowed = ((parsed.hostname in {'funder.co.il', 'www.funder.co.il'}\n                    and re.fullmatch(r'/article/\\d+/?', parsed.path))\n                   or (parsed.hostname == 'www.bizportal.co.il'\n                       and re.fullmatch(r'/mutualfunds/news/article/\\d+/?', parsed.path)))\n        if parsed.scheme != 'https' or not allowed:\n            continue\n        article_key = parsed.path.rstrip('/')\n        if article_key in seen_urls:\n            continue\n        seen_urls.add(article_key)\n        title = _clean_text(unescape(item.findtext('title') or '').replace('quot;', '\"'))\n        description = item.findtext('description') or ''\n        text = canonical(title + '\\n' + description)\n        if any(label in text for\
        \ label in ('תוכן שיווקי', 'תוכן ממומן', 'כתבה פרסומית')):\n            continue\n        # Use longest literal names first: a short name must not identify a longer fund.\n        matches = []\n        for name, row in names.items():\n            for match in re.finditer(r'(?<!\\w)' + re.escape(name) + r'(?!\\w)', text):\n                matches.append((match.start(), match.end(), row))\n        matches.sort(key=lambda m: (-(m[1] - m[0]), m[0]))\n        occupied, identified, evidence = [], {}, {}\n        for start, end, row in matches:\n            if any(start < b and end > a for a, b in occupied):\n                continue\n            occupied.append((start, end))\n            identified[row['fund_id']] = row\n            evidence.setdefault(row['fund_id'],evidence_excerpt(text,start,end))\n        # Explicit labelled security numbers are safe even when the name has changed.\n        id_matches = list(re.finditer(r'(?:מספר(?:\\s+(?:ה?קרן|נייר))?|מס[׳\\x27]?\\s*קרן)\\s*[:：]?\\\
        s*(\\d{6,8})\\b', text))\n        ids = {m.group(1) for m in id_matches}\n        for m in id_matches:\n            evidence.setdefault(m.group(1),evidence_excerpt(text,m.start(),m.end()))\n        identified.update((r['fund_id'], r) for r in listing if r['fund_id'] in ids)\n        for fid, row in identified.items():\n            headline_match = canonical(row['name']) in canonical(title)\n            excerpt = evidence.get(fid,title)\n            # RSS descriptions may include quote widgets. A price-table mention alone\n            # is not editorial discussion of a fund.\n            if not headline_match and fid not in ids:\n                prose = canonical(excerpt).replace(canonical(row['name']),'')\n                if ('לרשימה' in prose or 'לרשימת' in prose or not re.search(\n                        r'מחזיק|החזיק|משקיעה|השקיעה|מנוהלת|מנהל השקעות|מנהל ההשקעות|'\n                        r'דמי ניהול|הניבה|השיגה|רשמה|גייסה|פדיונות|חשיפה|מדיניות|תשואת הקרן', prose)):\n        \
        \            continue\n            mention = {'title': title, 'url': url, 'published': published.isoformat(),\n                       'news_date': published.astimezone(now.tzinfo).strftime('%d.%m'),\n                       'headline_match':headline_match, 'evidence':excerpt}\n            entry = found.setdefault(fid, {**row, 'mentions': []})\n            entry['mentions'].append(mention)\n    ranked = []\n    for entry in found.values():\n        entry['mentions'].sort(key=lambda m: (m['headline_match'], m['published']), reverse=True)\n        entry['news'] = entry['mentions'][0]\n        ranked.append(entry)\n    ranked.sort(key=lambda e: (e['news']['headline_match'], len(e['mentions']),\n                              e['news']['published']), reverse=True)\n    # One story must not occupy all three slots with the same headline.\n    unique, used_stories = [], set()\n    for entry in ranked:\n        path = urlparse(entry['news']['url']).path\n        if path not in used_stories:\n\
        \            unique.append(entry)\n            used_stories.add(path)\n    seen_evidence = {(e['news']['url'],e['news']['evidence']) for e in unique}\n    for entry in ranked:\n        key = (entry['news']['url'],entry['news']['evidence'])\n        if key not in seen_evidence:\n            unique.append(entry)\n            seen_evidence.add(key)\n    return unique[:MAX_CANDIDATES]\n\n\nasync def _fetch_funder_mentions(session, listing, now):\n    limiter, blocked = asyncio.Semaphore(3), asyncio.Event()\n    async def get(url):\n        async with limiter:\n            if blocked.is_set():\n                return ''\n            try:\n                async with session.get(url, timeout=aiohttp.ClientTimeout(total=15)) as response:\n                    if response.status in {401,403,429}:\n                        blocked.set()\n                        return ''\n                    if response.status != 200:\n                        return ''\n                    body = await response.text()\n\
        \                if is_access_challenge(body):\n                    blocked.set()\n                    return ''\n                return body\n            except (aiohttp.ClientError, asyncio.TimeoutError):\n                return ''\n    try:\n        body, category = await asyncio.gather(get(FEED),get(CATEGORY))\n        root = ET.fromstring(body) if body else ET.fromstring('<rss><channel/></rss>')\n        channel = root.find('channel')\n        if root.tag != 'rss' or channel is None:\n            return {'status':'unavailable','items':[]}\n        seen = {urlparse(item.findtext('link') or '').path for item in channel.findall('item')}\n        urls = []\n        category_root = _FundHTML(category).root\n        section = next((node for node in category_root.walk('div')\n                        if 'newarticleSec2' in node.attrs.get('class','').split()\n                        and any(urlparse(a.attrs.get('href','')).path.strip('/') == 'articleList/f'\n                        \
        \        for a in node.walk('a'))), None)\n        for link in (section.walk('a') if section else []):\n            url = urljoin(CATEGORY, link.attrs.get('href',''))\n            parsed = urlparse(url)\n            if (parsed.scheme == 'https' and parsed.hostname in {'funder.co.il','www.funder.co.il'}\n                    and re.fullmatch(r'/article/\\d+',parsed.path) and parsed.path not in seen):\n                urls.append(url)\n                seen.add(parsed.path)\n        pages = await asyncio.gather(*(get(url) for url in urls[:10]))\n        appended = 0\n        for url, page in zip(urls, pages):\n            item = article_item(page, url)\n            if item is not None:\n                channel.append(item)\n                appended += 1\n        status = 'ok' if body and section and appended == len(pages) else 'partial'\n        if not body and not appended:\n            status = 'unavailable'\n        return {'status':status,'items':parse_mentions(ET.tostring(root,encoding='unicode'),listing,now)}\n\
        \    except (aiohttp.ClientError, asyncio.TimeoutError, ET.ParseError, ValueError):\n        return {'status': 'unavailable', 'items': []}\n\n\nasync def fetch_mentions(session, listing, now, *, skip_funder=False):\n    result = ({'status':'unavailable','items':[]} if skip_funder else\n              await _fetch_funder_mentions(session, listing, now))\n    if result['status'] == 'ok' and len(result['items']) >= 3:\n        return result\n    limiter, blocked = asyncio.Semaphore(2), asyncio.Event()\n    async def get(url):\n        async with limiter:\n            if blocked.is_set():\n                return ''\n            try:\n                async with session.get(url, timeout=aiohttp.ClientTimeout(total=15)) as response:\n                    body = await response.text()\n                    if response.status in {401,403,429} or is_access_challenge(body):\n                        blocked.set()\n                        return ''\n                    return body if response.status\
        \ == 200 else ''\n            except (aiohttp.ClientError, asyncio.TimeoutError):\n                return ''\n    page = await get(BIZ_NEWS)\n    root = _FundHTML(page).root\n    section = next((n for n in root.walk('ul') if 'articles_rows' in n.attrs.get('class','').split()), None)\n    urls = []\n    for node in (section.walk('a') if section else []):\n        url = urljoin(BIZ_NEWS, node.attrs.get('href',''))\n        parsed = urlparse(url)\n        if (parsed.scheme == 'https' and parsed.hostname == 'www.bizportal.co.il'\n                and re.fullmatch(r'/mutualfunds/news/article/\\d+',parsed.path) and url not in urls):\n            urls.append(url)\n    pages = await asyncio.gather(*(get(url) for url in urls[:6]))\n    rss = ET.fromstring('<rss><channel/></rss>')\n    read = 0\n    for url, body in zip(urls, pages):\n        item = article_item(body, url)\n        if item is not None:\n            rss.find('channel').append(item)\n            read += 1\n    found = parse_mentions(ET.tostring(rss,\
        \ encoding='unicode'), listing, now)\n    by_id = {r['fund_id']:r for r in result['items']}\n    for row in found:\n        existing = by_id.get(row['fund_id'])\n        if not existing or row['news']['published'] > existing['news']['published']:\n            by_id[row['fund_id']] = row\n    status = 'partial' if read or result['status'] != 'unavailable' else 'unavailable'\n    return {'status':status, 'items':sorted(by_id.values(),\n            key=lambda r:(r['news']['headline_match'],r['news']['published']), reverse=True)[:MAX_CANDIDATES]}\n\n\ndef article_item(body, url):\n    \"\"\"Read only the article body, not sidebar fund links or recommendations.\"\"\"\n    root = _FundHTML(body).root\n    meta = {n.attrs.get('property'):n.attrs.get('content','') for n in root.walk('meta')}\n    content_id = 'div_article_body' if urlparse(url).hostname == 'www.bizportal.co.il' else 'articleDesc'\n    content = next((n for n in root.walk() if n.attrs.get('id') == content_id), None)\n   \
        \ try:\n        published = datetime.fromisoformat(meta.get('article:published_time','').replace('Z','+00:00'))\n    except ValueError:\n        return None\n    if not meta.get('og:title') or content is None or published.tzinfo is None:\n        return None\n    item = ET.Element('item')\n    for key, value in {'title':meta['og:title'], 'description':content.text(),\n                       'pubDate':format_datetime(published),'link':url}.items():\n        ET.SubElement(item,key).text = value\n    return item\n\n\nasync def prepare_focus(session, mentions, data, screened, now, validate, verify=None):\n    items = []\n    for row in mentions['items'][:3]:\n        history, quote = data.get(row['fund_id'], ([], {}))\n        screen = screened.get(row['fund_id'])\n        analysis = validate(screen, history, quote, now.date()) if screen else None\n        baseline = None\n        if verify:\n            try:\n                points = verify(history,quote,float(quote['daily']),now.date())\n\
        \                if points:\n                    baseline = {'price':points[-1][1],'date':points[-1][0].isoformat()}\n            except (ValueError,TypeError,KeyError):\n                pass\n        news = dict(row['news'])\n        reason = news['title'] if news['headline_match'] else news['evidence']\n        source_text = canonical(reason)\n        manager_change = ('מנהל' in source_text and re.search(r'יחליף|תחליף|מחליף|מחליפה',source_text))\n        if source_text.startswith('קרן נאמנות במוקד'):\n            translated = 'Обзор инвестиционной стратегии фонда.'\n        elif manager_change:\n            translated = 'Смена управляющего инвестициями фонда.'\n        else:\n            translated = await translate_to_russian(session, reason)\n        # Never replace source content with a translation failure placeholder.\n        news['display_title'] = translated if translated else reason\n        operational = any(word in source_text for word in ('מפרקת', 'פירוק', 'מיזוג', 'משבש',\
        \ 'פדיון', 'תשיק'))\n        watch = ('Следить за изменениями стратегии.' if manager_change else\n                 'Проверить условия и сроки у управляющего.' if operational else\n                 analysis['conclusion'] if analysis else 'Ждать сверки свежих цен фонда.')\n        items.append({'fund_id': row['fund_id'], 'name': row['name'], 'news': news,\n                      'analysis': analysis, 'baseline':baseline, 'watch': watch})\n    return {'status': mentions['status'], 'items': items}\n\n\ndef focus_card(item):\n    from modules.fund_profile import describe_fund\n    fid, news = item['fund_id'], item['news']\n    profile = describe_fund(item['name']) if item.get('show_monthly') else None\n    name = escape(profile['label'] if profile else shorten_title(item['name'], 22))\n    title = escape(shorten_title(news['display_title'], 55))\n    lines = [f'<a href=\"https://funder.co.il/fund/{fid}\">{name}</a> · {fid}',\n             f'\U0001F4F0 <a href=\"{escape(news[\"url\"], quote=True)}\"\
