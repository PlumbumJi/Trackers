        ok\"):\n                raise RuntimeError(f\"Telegram chart delivery failed: HTTP {response.status}\")\nEOF\n\ncat << 'EOF' > main.py\nimport asyncio\nimport json\nimport os\nfrom pathlib import Path\nfrom datetime import datetime, timezone\nfrom html import escape\nfrom io import BytesIO\n\nimport matplotlib\nmatplotlib.use('Agg')\nimport matplotlib.dates as mdates\nimport matplotlib.pyplot as plt\n\nimport aiohttp\n\nfrom modules.config import BOT_NAME, BOT_VERSION, SECTORS_CONFIG\nfrom modules.formatter import (\n    build_alert_message,\n    build_combined_radar_message,\n    build_telegram_message,\n)\nfrom modules.market import (\n    analyze_entry_zone,\n    analyze_year_history,\n    fetch_all_israeli_funds,\n    fetch_all_year_analytics,\n    fetch_all_yahoo_data,\n    fetch_ticker_history,\n)\nfrom modules.news import fetch_sector_news\nfrom modules.telegram_sender import send_to_telegram, send_chart_photos\nfrom modules.charts import build_radar_charts\n\ndef format_percent(value,\
