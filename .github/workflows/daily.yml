          def build_fund_signal(fund_data: dict, us_change: float) -> tuple[str, str]:
              day = float(fund_data.get("daily", 0.0) or 0.0)
              month = float(fund_data.get("mtd", 0.0) or 0.0)
              year = float(fund_data.get("ytd", 0.0) or 0.0)
              us = float(us_change or 0.0)

              positive_points = sum([
                  day > 0,
                  month > 0,
                  year > 0,
                  us > 0,
              ])
              caution_points = sum([
                  day < 0,
                  month < 0,
                  year < 0,
                  us < 0,
              ])

              if positive_points >= 3 and caution_points <= 1:
                  return "🟢", "Positive"

              if caution_points >= 3:
                  return "🔴", "Caution"

              return "🟡", "Neutral"

