        def ordered_prices(history, today):
            points = {}
            for point in history:
                try:
                    day = date.fromisoformat(point['date'])
                    price = float(point['price'])
                    if day > today or not math.isfinite(price) or price <= 0:
                        continue
                    if day in points and points[day] != price:
                        return []
                    points[day] = price
                except (ValueError, KeyError, TypeError):
                    continue
            return sorted(points.items())
        
        
        def month_window(ordered, today):
            """Last NAV versus the last publication on/before NAV minus 30 calendar days."""
            if len(ordered) < 15:
                return None
            last_day, current = ordered[-1]
            target = last_day - timedelta(days=WINDOW_DAYS)
            anchors = [(day, price) for day, price in ordered if day <= target]
            if not anchors or not 0 <= (today - last_day).days <= 7:
                return None
            start, base = anchors[-1]
            recent = [(day, price) for day, price in ordered if day >= start]
            if ((target - start).days > 7 or len(recent) < 12
                    or any((b[0] - a[0]).days > 7 for a, b in zip(recent, recent[1:]))
                    or (last_day - ordered[-6][0]).days > 14):
                return None
            return {'monthly': (current / base - 1) * 100,
                    'change_5': (current / ordered[-6][1] - 1) * 100,
                    'start_date': start.isoformat(), 'date': last_day.isoformat(),
                    'five_start': ordered[-6][0].isoformat(), 'base': base, 'price': current}
        
        
        def parse_graph_batch(body, rows, today):
            """Map by exact unique fund name, never column position; null dates stay missing.
        
            Public charts contain rounded cumulative percentages, not NAV prices.
            Their ratios only screen candidates; publication cards use actual prices.
            """
            match = re.fullmatch(r'\s*fundMonth\((.*)\);?\s*', body, re.S)
            try:
                payload = json.loads(match.group(1) if match else body)
                columns = payload['data']['columns']
                axes = [c[1:] for c in columns if c and c[0] == 'x']
                if len(axes) != 1:
                    return {}
                days = axes[0]
                if len(days) != len(set(days)):
                    return {}
                for day in days:
                    date.fromisoformat(day)
                names, duplicates = {}, set()
                for row in rows:
                    name = fund_name_key(row['name'])
                    if name in names:
                        duplicates.add(name)
                    names[name] = row
                result, seen = {}, set()
                for column in columns:
                    if not column or column[0] == 'x':
                        continue
                    name = fund_name_key(column[0])
                    if name not in names or name in duplicates or len(column) != len(days) + 1:
                        continue
                    row = names[name]
                    fid = row['fund_id']
                    if name in seen:
                        result.pop(fid, None)
                        duplicates.add(name)
                        continue
                    seen.add(name)
                    history = []
                    for day, change in zip(days, column[1:]):
                        value = number(change)
                        if value is not None and value > -100:
                            history.append({'date': day, 'price': 100 + value})
                    window = month_window(ordered_prices(history, today), today)
                    if not window:
                        continue
                    # Include uncertain threshold cases: each chart value is rounded to .01.
                    low = ((window['price'] - .005) / (window['base'] + .005) - 1) * 100
                    high = ((window['price'] + .005) / max(window['base'] - .005, 1e-9) - 1) * 100
                    result[fid] = {**row, **window, 'screen_low': low, 'screen_high': high}
                return result
            except (ValueError, KeyError, TypeError, AttributeError):
                return {}
        
        
        def parse_listing(body):
            root = _FundHTML(body).root
            found, conflicts = {}, set()
            for table in root.walk('table'):
                columns = None
                for tr in table.walk('tr'):
                    cells = [n for n in tr.children if getattr(n, 'tag', '') in {'td', 'th'}]
                    labels = [_clean_text(c.text()) for c in cells]
                    daily = next((i for i, s in enumerate(labels) if s == 'תשואה יומית'), None)
                    name = next((i for i, s in enumerate(labels) if s == 'שם קרן הנאמנות'), None)
                    if daily is not None and name is not None:
                        columns = (name, daily)
                        continue
                    if columns is None or len(cells) <= max(columns):
                        continue
                    name_index, daily_index = columns
                    links = list(cells[name_index].walk('a'))
                    ids = set()
                    for link in links:
                        href = link.attrs.get('href', '')
                        match = re.search(r'(?:^|/)fund/(\d{6,8})(?:[/?#]|$)', urlparse(href).path)
                        if match:
                            ids.add(match.group(1))
                    change = number(labels[daily_index])
                    if len(ids) != 1 or change is None or change <= -100:
                        continue
                    fid = ids.pop()
                    row = {'fund_id': fid, 'name': labels[name_index], 'daily': change}
                    if fid in found and found[fid]['daily'] != change:
                        conflicts.add(fid)
                    found[fid] = row
            return [row for fid, row in found.items() if fid not in conflicts]
        
        
        def verified_publication(history, quote, reported_change, today):
            """Require same last price/date plus agreement of both published daily returns."""
            ordered = ordered_prices(history, today)
            if len(ordered) < 2:
                return None
            (previous_day, previous), (last_day, current) = ordered[-2:]
            # Conservative bounds: do not disguise long publication gaps as one day.
            if (today - last_day).days > 7 or (last_day - previous_day).days > 4:
                return None
            # Some fund pages omit the date. In that case use the dated history ONLY
            # after matching its exact last price and both published daily changes.
            if quote.get('date') and quote['date'] != last_day.isoformat():
                return None
            quote_price, quote_change = number(quote.get('price')), number(quote.get('daily'))
            other_price = number((quote.get('other_quote') or {}).get('price'))
            change = (current / previous - 1) * 100
            if quote_price is None or quote_change is None:
                return None
            if other_price is not None and abs(other_price - quote_price) > max(.011, quote_price * .0001):
                return None
            if abs(quote_price - current) > max(0.011, current * 0.0001):
                return None
            if abs(change - quote_change) > 0.15 or abs(change - reported_change) > 0.15:
                return None
            return ordered
        
        
        def validated_event(row, history, quote, today):
            ordered = verified_publication(history, quote, row['daily'], today)
            window = month_window(ordered or [], today)
            if not window:
                return None
            (_, previous), (_, current) = ordered[-2:]
            change = (current / previous - 1) * 100
            if row.get('date') and row['date'] != window['date']:
                return None
            if row.get('start_date') and row['start_date'] != window['start_date']:
                return None
            if ('screen_low' in row and not
                    row['screen_low'] - .15 <= window['monthly'] <= row['screen_high'] + .15):
                return None
            # Corporate actions or inconsistent series need review, never a synthetic opportunity.
            recent = [p for p in ordered if p[0].isoformat() >= window['start_date']]
            if any(abs(b[1] / a[1] - 1) >= .6 for a, b in zip(recent, recent[1:])):
                return None
            regime, conclusion = analyst_view(window['monthly'], window['change_5'])
            name = row['name']
            leverage = re.search(r'(?<!\w)פי\s*(\d{1,2}(?:\.\d+)?)(?![\w.])', name)
            if leverage:
                risk = f'плечо ×{leverage.group(1)}'
            elif 'ממונפת' in name and 'לא ממונפת' not in name:
                risk = 'с плечом'
            else:
                risk = ''
            if 'שורט' in name:
