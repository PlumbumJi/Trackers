        \        elif not row.get('base_date') or base is None or not math.isfinite(base):\n            explanation = 'Индустриальный контекст — в новости ниже.'\n        else:\n            explanation = 'Индустриальный контекст — в новости ниже.'\n        # Prefer a sourced industry headline from the NAV interval; otherwise use\n        # the latest available sector headline so the caption stays user-facing.\n        context = ''\n        fallback_context = ''\n        now = datetime.now(ZoneInfo('Asia/Jerusalem'))\n        for item in row.get('news') or []:\n            if not isinstance(item, dict):\n                continue\n            try:\n                published = datetime.fromtimestamp(int(item['published']), ZoneInfo('Asia/Jerusalem'))\n                link = str(item['url'])\n                parsed = urlparse(link)\n                title = textwrap.shorten(str(item['title']), width=72, placeholder='…')\n                valid_link = parsed.scheme in {'http', 'https'} and bool(parsed.netloc)\n\
