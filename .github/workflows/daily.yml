        def assess(history, now, current_price=None, current_date=None, external=None):
            missing = {'status': 'missing', 'line': '⬜• Ждать данных · истории недостаточно'}
            points = {}
            for row in history:
                try:
                    day, price = date.fromisoformat(row['date']), float(row['price'])
                    if day <= now.date() and price > 0 and math.isfinite(price):
                        points[day] = price
                except (ValueError, TypeError, KeyError):
                    continue
            points = sorted(points.items())
            if len(points) < 15:
                return dict(missing, line=f'⬜• Без сигнала · цен {len(points)}/50')
            last_day, price = points[-1]
            if current_date is None or (current_price is not None and abs(price - float(current_price)) > .001):
                return dict(missing, line='⬜• Ждать данных · цена и история не согласованы')
            window = [(d, p) for d, p in points if d >= last_day - timedelta(days=89)]
            closes = [p for _, p in window]
            avg30 = statistics.mean(p for d, p in window if d >= last_day - timedelta(days=29))
            span = (window[-1][0] - window[0][0]).days + 1
            missing['stats'] = (f'От макс. {span}д {(price / max(closes) - 1) * 100:+.1f}% · '
                                f'к средней 30д {(price / avg30 - 1) * 100:+.1f}%')
            if str(last_day) != current_date or (now.date() - last_day).days > MAX_SIGNAL_AGE_DAYS:
                return dict(missing, line=f'⬜• Ждать обновления · история от {last_day:%d.%m}')
            if len(points) < 50:
                return dict(missing, line=f'⬜• Без сигнала · цен {len(points)}/50')
            if (points[-1][0] - points[0][0]).days < 59:
                return dict(missing, line='⬜• Без сигнала · история короче 60 дней')
            ema = points[0][1]
            emas = []
            for _, p in points:
                ema += (p - ema) * 2 / 51
                emas.append(ema)
            drawdown = (price / max(closes) - 1) * 100
            discount = (price / avg30 - 1) * 100
            returns = [closes[i] / closes[i - 1] - 1 for i in range(1, len(closes))]
            volatility = statistics.stdev(returns)
            change20 = (price / points[-21][1] - 1) * 100
            uptrend = price > ema and emas[-1] > emas[-6]
            downtrend = price < ema and emas[-1] < emas[-6] and change20 <= -5
            two_rises = price > points[-2][1] > points[-3][1]
            ema50 = emas[-1]
            cancel_price = min(p for _, p in points[-20:]) * .99
            risk_pct = max(0.0, (price - cancel_price) / price * 100)
            support = external or {}
            base_ok = support.get('confirmed', False)
            if downtrend and drawdown <= -10:
                status, line = 'reduce', '🔻▼ Рассмотреть сокращение · устойчивое снижение'
            elif not uptrend and price <= points[-2][1]:
                status, line = 'wait', '⚠️→ Не докупать · ждать разворота и роста активов'
            elif (uptrend and discount <= -3 and drawdown <= -3 and two_rises and base_ok
                  and 2 <= risk_pct <= 12):
                status, line = 'add', '✅▲ Рассмотреть докупку · откат и восстановление подтверждены'
            elif uptrend:
                status, line = 'hold', '🟩▲ Держать · восходящий тренд, докупка не подтверждена'
            else:
                status, line = 'watch', '⚠️→ Наблюдать · ждать устойчивого роста фонда'
            days = (window[-1][0] - window[0][0]).days + 1
            return {'status': status, 'line': line, 'drawdown': drawdown, 'discount': discount,
                    'volatility': volatility, 'date': str(last_day), 'price': price,
                    'ema50': ema50, 'cancel_price': cancel_price, 'risk_pct': risk_pct,
                    'stats': f'От макс. {days}д {drawdown:+.1f}% · к средней 30д {discount:+.1f}%'}
        
        
        def trade_plan(fund_id, analysis, portfolio_value, position_value, risk):
            if analysis.get('status') == 'add':
                if risk.get('breached'):
                    return {'allowed': False, 'line': '⚠️ Покупка заблокирована · просадка портфеля достигла 10%'}
                if risk.get('concentrated') and risk.get('largest') == fund_id:
                    return {'allowed': False, 'line': '⚠️ Покупка заблокирована · позиция уже чрезмерно велика'}
                if risk.get('active_signal_risk', 0) >= MAX_TOTAL_ACTIVE_RISK:
                    return {'allowed': False, 'line': '⚠️ Покупка заблокирована · общий бюджет риска исчерпан'}
                risk_pct = float(analysis.get('risk_pct') or 0)
                if not 2 <= risk_pct <= 12:
                    return {'allowed': False, 'line': '⚠️ Покупка заблокирована · риск входа вне модели'}
                risk_budget = portfolio_value * RISK_PER_IDEA
                by_risk = risk_budget / (risk_pct / 100)
                room = max(0.0, portfolio_value * MAX_NEW_POSITION_WEIGHT - position_value)
                amount = min(by_risk, room)
                if amount < 100:
                    return {'allowed': False, 'line': '⚠️ Покупка заблокирована · лимит позиции исчерпан'}
                return {'allowed': True, 'amount': amount,
