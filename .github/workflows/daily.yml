          from datetime import datetime, timezone, timedelta
          from modules.config import BOT_NAME

          def escape_html(text: str) -> str:
              return str(text).replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")

          def format_signed_percent(value: float, digits: int = 2) -> str:
              try:
                  number = float(value)
              except (TypeError, ValueError):
                  number = 0.0
              return f"+{number:.{digits}f}%" if number > 0 else f"{number:.{digits}f}%"

          def format_ticker_drivers(top_tickers: list, limit: int = 3) -> str:
              if not top_tickers:
                  return "ключевые тикеры сектора"

              tickers = []
              for item in top_tickers[:limit]:
                  if isinstance(item, (tuple, list)) and item:
                      tickers.append(str(item[0]))

              return ", ".join(tickers) if tickers else "ключевые тикеры сектора"

          def classify_fund_us_relation(us_change: float, il_change: float) -> str:
              us = float(us_change or 0.0)
              il = float(il_change or 0.0)

              if abs(us) < 0.15 and abs(il) < 0.15:
                  return "спокойное движение"

              if us > 0 and il > 0:
                  if abs(il) >= abs(us) * 1.4:
                      return "сильнее US-сектора"
                  if abs(il) <= abs(us) * 0.5:
                      return "отстаёт от US-сектора"
                  return "следует за US-сектором"

              if us < 0 and il < 0:
                  if abs(il) >= abs(us) * 1.4:
                      return "усиливает снижение"
                  if abs(il) <= abs(us) * 0.5:
                      return "снижается мягче US-сектора"
                  return "следует за US-сектором"

              if us > 0 and il < 0:
                  return "расходится с US-сектором"

              if us < 0 and il > 0:
                  return "сильнее US-сектора"

              if us > 0 and abs(il) < 0.15:
