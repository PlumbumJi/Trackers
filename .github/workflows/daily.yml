            if len(normalized) <= width:
                return normalized
            return textwrap.shorten(
                normalized,
                width=width,
                placeholder="...",
                break_long_words=False,
                break_on_hyphens=False,
            )


        def unique(values: list[str]) -> list[str]:
            return list(dict.fromkeys(value for value in values if value))


        async def translate_to_russian(session: aiohttp.ClientSession, text: str) -> str:
            if not text:
                return text
            # Keep company names/tickers intact instead of translating Snowflake as a noun.
            source = re.sub(r"\bSnowflake\b", "SNOW", text)
            async with TRANSLATION_LIMITER:
                try:
                    url = "https://translate.googleapis.com/translate_a/single"
                    params = {"client": "gtx", "sl": "auto", "tl": "ru", "dt": "t", "q": source}
                    async with session.get(url, params=params, timeout=8) as response:
                        if response.status == 200:
                            data = await response.json()
                            translated = " ".join(
                                str(segment[0]) for segment in data[0]
                                if isinstance(segment, list) and segment and segment[0]
                            ).strip()
                            if translated and re.search(r"[А-Яа-яЁё]", translated):
                                return html.unescape(translated)
                        else:
                            print(f"⚠️ Google Translate: HTTP {response.status}")
                except Exception as error:
                    print(f"⚠️ Google Translate: {type(error).__name__}")

                # Free, keyless fallback documented by MyMemory. It is used only when
                # the primary endpoint did not return a Russian translation.
                try:
                    url = "https://api.mymemory.translated.net/get"
                    params = {"q": source, "langpair": "en|ru", "mt": "1"}
                    async with session.get(url, params=params, timeout=10) as response:
                        if response.status == 200:
                            data = await response.json()
                            translated = str((data.get("responseData") or {}).get("translatedText") or "").strip()
                            if (
                                translated
                                and re.search(r"[А-Яа-яЁё]", translated)
                                and "MYMEMORY WARNING" not in translated.upper()
                            ):
                                return html.unescape(translated)
                        else:
                            print(f"⚠️ MyMemory Translate: HTTP {response.status}")
                except Exception as error:
                    print(f"⚠️ MyMemory Translate: {type(error).__name__}")

            return ""


        def news_score(item: dict, candidate_tickers: list[str], sector_name: str) -> int:
            title = normalize_title(item.get("title") or item.get("headline"))
            if len(title) < 20:
                return -100
            lower_title = title.lower()
            if any(phrase in lower_title for phrase in LOW_VALUE_PHRASES):
                return -50

            published = item.get("providerPublishTime") or item.get("datetime")
            if published:
                try:
                    age = datetime.now(timezone.utc) - datetime.fromtimestamp(int(published), tz=timezone.utc)
                    if age.total_seconds() < -300 or age.total_seconds() > news_age_limit() * 3600:
                        return -40
                except (TypeError, ValueError, OSError):
                    return -40

            related = item.get("relatedTickers") or item.get("related") or []
            if isinstance(related, str):
                related = re.split(r"[,\s]+", related.upper())
            related_set = {str(value).upper() for value in related}
            ticker_set = {ticker.upper() for ticker in candidate_tickers}
            keyword_hits = sum(
                headline_matches(keyword, lower_title) for keyword in SECTOR_KEYWORDS.get(sector_name, [])
            )
            company_hits = sum(
                headline_matches(company, lower_title)
                for company in SECTOR_COMPANY_ANCHORS.get(sector_name, [])
            )
            ticker_hits = sum(
                bool(re.search(rf"(?<![A-Z0-9]){re.escape(ticker)}(?![A-Z0-9])", title, re.IGNORECASE))
                for ticker in ticker_set
                if len(ticker) >= 2 and ticker.replace(".", "").isalnum()
            )
            # A ticker relation alone can attach a broad market roundup to the wrong
            # sector. The headline must name the industry, a tracked company or ticker.
            if keyword_hits + company_hits + ticker_hits == 0:
                return -50
            score = 35 if related_set & ticker_set else 0
            # Directly named companies/industries remain relevant without Yahoo tags.
            if company_hits or keyword_hits:
                score = max(score, 35)
            score += 12 * keyword_hits + 10 * company_hits + 8 * ticker_hits
            if any(word in lower_title for word in ("earnings", "guidance", "forecast", "contract", "approval", "tariff")):
                score += 8
            return score


        async def fetch_yahoo_news(session: aiohttp.ClientSession, ticker: str) -> list[dict]:
            url = f"https://query1.finance.yahoo.com/v1/finance/search?q={urllib.parse.quote(ticker)}&newsCount=20&quotesCount=0"
            try:
                async with session.get(url, headers=HEADERS, timeout=HTTP_TIMEOUT) as response:
                    if response.status == 200:
                        return (await response.json()).get("news") or []
                    print(f"⚠️ Yahoo News {ticker}: HTTP {response.status}")
            except Exception as error:
                print(f"⚠️ Yahoo News {ticker}: {error}")
            return []


        async def fetch_sector_news(
            session: aiohttp.ClientSession,
            query_ticker: str,
            top_tickers: list[tuple[str, float]] | None = None,
            sector_name: str = "",
        ) -> list[dict]:
            movers = [ticker for ticker, _ in (top_tickers or [])]
            candidates = unique(movers + [query_ticker])[:4]
            queries = unique(candidates + [SECTOR_QUERIES.get(sector_name, "")])
            batches = await asyncio.gather(*[
                fetch_yahoo_news(session, ticker) for ticker in queries
            ])
            scored = []
            seen_titles = set()
            for item in [entry for batch in batches for entry in batch]:
                title = normalize_title(item.get("title"))
                title_key = title.lower()
                if not title or title_key in seen_titles:
                    continue
                seen_titles.add(title_key)
                try:
                    published = int(item.get("providerPublishTime") or item.get("datetime") or 0)
                except (ValueError, TypeError):
                    continue
                if published <= 0:
                    continue
                score = news_score(item, candidates, sector_name)
                if score >= 35:
                    scored.append((score, published, title, item.get("link") or ""))
            print(f"News {sector_name}: received={sum(len(batch) for batch in batches)}, relevant={len(scored)}, window={news_age_limit()}h")
            if not scored:
                return []
            scored.sort(key=lambda value: (value[0], value[1]), reverse=True)
            for _, published, title, link in scored[:3]:
                translated = await translate_to_russian(session, title)
                if translated:
                    return [{"title": shorten_title(translated, 155), "published": published, "url": link}]
            # Preserve a sourced headline when both translation services fail.
            _, published, title, link = scored[0]
            print(f"News {sector_name}: translation unavailable; displaying original")
            return [{"title": shorten_title(title, 155), "published": published, "url": link, "original": True}]
