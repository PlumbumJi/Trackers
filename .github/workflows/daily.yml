        import json
        import re
        from html.parser import HTMLParser
        
        import aiohttp
        
        from modules.config import BOT_TOKEN, CHAT_ID, HTTP_TIMEOUT, BOT_NAME
        
        
        def message_length(text: str) -> int:
            class VisibleText(HTMLParser):
                def __init__(self):
                    super().__init__(convert_charrefs=True)
                    self.parts = []
        
                def handle_data(self, data):
                    self.parts.append(data)
        
            parser = VisibleText()
            parser.feed(text)
            parser.close()
            return len(''.join(parser.parts).encode('utf-16-le')) // 2
        
        
        def split_plain_text(text: str, max_length: int) -> list[str]:
            chunks, current = [], ""
            for line in text.splitlines(keepends=True):
                if message_length(current + line) > max_length and current.strip():
                    chunks.append(current.strip())
                    current = line
                else:
                    current += line
            if current.strip():
                chunks.append(current.strip())
            return chunks
        
        
        def split_blockquote(block: str, max_length: int) -> list[str]:
            match = re.search(r"<blockquote(?:\s+expandable)?>", block)
            close_tag = "</blockquote>"
            if not match or close_tag not in block:
                return split_plain_text(block, max_length)
            open_tag = match.group(0)
            prefix = block[:match.start()]
            body_end = block.rfind(close_tag)
            body = block[match.end():body_end]
            suffix = block[body_end + len(close_tag):]
            chunks, current, current_prefix = [], "", prefix
            # Keep each fund/sector paragraph together, including its news link.
            paragraphs = re.split(r'\n\s*\n', body.strip())
            for paragraph in paragraphs:
                line = paragraph + "\n\n"
                candidate = f"{current_prefix}{open_tag}{current}{line}{close_tag}{suffix}"
                if message_length(candidate) > max_length and current.strip():
                    chunks.append(f"{current_prefix}{open_tag}{current}{close_tag}".strip())
                    current_prefix, current = "", line
                else:
                    current += line
            final = f"{current_prefix}{open_tag}{current}{close_tag}{suffix}".strip()
            if final:
                chunks.append(final)
            return chunks
        
        
        def split_message(text: str, max_length: int = 3900) -> list[str]:
            # A footer is part of the final text message, never its own chunk.
            has_footer = any(line.strip() == BOT_NAME for line in text.splitlines())
            text = '\n'.join(line for line in text.splitlines() if line.strip() != BOT_NAME)
            text = re.sub(r'\n[ \t]*\n(?:[ \t]*\n)+', '\n\n', text).strip()
            footer = f"\n\n{BOT_NAME}" if has_footer else ""
            budget = max_length - message_length(footer)
            il_marker = (
                "<blockquote expandable>\n"
                "🇮🇱 <b>АНАЛИТИКА ИЗРАИЛЬСКИХ ФОНДОВ</b>"
            )
            il_position = text.find(il_marker)
            if il_position > 0:
                logical_parts = [text[:il_position].strip(), text[il_position:].strip()]
            else:
                logical_parts = [text]
            chunks = []
            for part in logical_parts:
                if not part:
                    continue
                if message_length(part) <= budget:
                    chunks.append(part)
                    continue
                for raw in part.split("</blockquote>"):
                    if not raw.strip():
                        continue
                    block = raw + "</blockquote>" if "<blockquote" in raw else raw
                    chunks.extend(split_blockquote(block, budget) if message_length(block) > budget else [block.strip()])
            chunks = [chunk for chunk in chunks if chunk]
            if chunks:
                chunks[-1] += footer
            if any(message_length(chunk) > max_length for chunk in chunks):
                raise ValueError("A single message paragraph exceeds Telegram limit")
            return chunks
        
        
        async def send_to_telegram(text: str, chat_id=None) -> None:
            destination = chat_id or CHAT_ID
            if not BOT_TOKEN or not destination:
                raise RuntimeError("BOT_TOKEN or CHAT_ID is missing")
            url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"
            chunks = split_message(text)
            print(f"ℹ️ Message length: {len(text)}; chunks: {len(chunks)}")
            timeout = aiohttp.ClientTimeout(total=HTTP_TIMEOUT)
            async with aiohttp.ClientSession(timeout=timeout) as session:
                for index, chunk in enumerate(chunks, start=1):
                    payload = {
                        "chat_id": destination,
                        "text": chunk,
                        "parse_mode": "HTML",
                        "disable_web_page_preview": True,
                    }
                    async with session.post(url, json=payload) as response:
                        response_text = await response.text()
                        if response.status != 200:
                            raise RuntimeError(
                                f"Telegram HTTP {response.status} on chunk {index}/{len(chunks)}: {response_text[:500]}"
                            )
                        print(f"🚀 Sent chunk {index}/{len(chunks)}")
        
        
        async def send_chart_photos(charts, may_send=lambda: True, *, chat_id=None,
                                    title="📊 Что видно на графиках", parse_mode=None) -> None:
            if not charts or not may_send():
                return
            destination = chat_id or CHAT_ID
            if not BOT_TOKEN or not destination:
                raise RuntimeError("BOT_TOKEN or CHAT_ID is missing")
            charts = charts[:3]
            captions = [caption for _, caption in charts if caption.strip()]
            album_caption = title + "\n\n" + "\n\n".join(captions)
            from html import unescape
            visible = unescape(re.sub(r'<[^>]*>', '', album_caption)) if parse_mode == 'HTML' else album_caption
            if len(visible.encode("utf-16-le")) // 2 > 1024:
                raise ValueError("Album caption exceeds Telegram limit")
            payload = aiohttp.FormData()
            payload.add_field("chat_id", destination)
            payload.add_field("disable_notification", "true")
            media = []
            for index, (png, _) in enumerate(charts):
                attachment = f"chart{index}"
                payload.add_field(attachment if len(charts) > 1 else "photo", png,
                                  filename=f"{attachment}.png", content_type="image/png")
                item = {"type": "photo", "media": f"attach://{attachment}"}
                if index == 0:
                    item["caption"] = album_caption
                    if parse_mode:
                        item['parse_mode'] = parse_mode
                media.append(item)
            if len(charts) > 1:
                payload.add_field("media", json.dumps(media, ensure_ascii=False))
                method = "sendMediaGroup"
            else:
                payload.add_field("caption", album_caption)
                if parse_mode:
                    payload.add_field('parse_mode', parse_mode)
                method = "sendPhoto"
            timeout = aiohttp.ClientTimeout(total=45)
            async with aiohttp.ClientSession(timeout=timeout) as session:
                async with session.post(f"https://api.telegram.org/bot{BOT_TOKEN}/{method}", data=payload) as response:
                    body = await response.json()
                    if response.status != 200 or not body.get("ok"):
                        raise RuntimeError(f"Telegram chart delivery failed: HTTP {response.status}")
