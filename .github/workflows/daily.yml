name: Automated Market Analytics & IPO Digest

on:
  schedule:
    # Daily market digest at 23:15 Israel time, with automatic DST handling.
    - cron: '15 23 * * *'
      timezone: 'Asia/Jerusalem'
    # Weekly IPO digest on Saturday at 22:00 Israel time.
    - cron: '0 22 * * 6'
      timezone: 'Asia/Jerusalem'
  workflow_dispatch:
    inputs:
      report_type:
        description: Report to send
        required: true
        default: market
        type: choice
        options:
          - market
          - ipo

permissions:
  contents: read

concurrency:
  group: market-analytics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Select Report Type
        id: report
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_REPORT_TYPE: ${{ inputs.report_type }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="${MANUAL_REPORT_TYPE:-market}"
          elif [[ "$EVENT_SCHEDULE" == "0 22 * * 6" ]]; then
            mode="ipo"
          else
            mode="market"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Selected report: $mode"

      - name: Restore IPO Radar Snapshot
        if: steps.report.outputs.mode == 'ipo'
        uses: actions/cache/restore@v5
        with:
          path: ipo_radar_snapshot.json
          key: ipo-radar-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ipo-radar-

      - name: Deploy Architecture Files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p modules
          touch modules/__init__.py

          cat << 'EOF' > requirements.txt
          aiohttp==3.11.11
          beautifulsoup4==4.12.3
          playwright==1.49.1
          EOF

