            async def test_browser_retries_http_access_denied_result(self):
                calls = []
                class Page:
                    async def goto(self, url, **kwargs):
                        calls.append(url)
                        return SimpleNamespace(status=200)
                    async def content(self): return page()
                    async def wait_for_selector(self, *args, **kwargs): pass
                context = SimpleNamespace(new_page=AsyncMock(return_value=Page()))
                browser = SimpleNamespace(new_context=AsyncMock(return_value=context), close=AsyncMock())
                engine = SimpleNamespace(chromium=SimpleNamespace(launch=AsyncMock(return_value=browser)))
                manager = AsyncMock()
                manager.__aenter__.return_value = engine
                existing = {'5139183': {**market.EMPTY_RETURNS, 'access_denied': True}}
                with patch.object(market, 'async_playwright', return_value=manager):
                    result = await market.fetch_bizportal_playwright({'5139183'}, existing)
                self.assertTrue(calls)
                self.assertEqual(result['5139183']['daily'], 2.2)

            async def test_translation_error_never_returns_english(self):
                translated = await news.translate_to_russian(Session(status=503), 'Snowflake jumps')
                self.assertEqual(translated, '')

            async def test_translation_uses_mymemory_fallback(self):
                class JsonResponse(Response):
                    def __init__(self, status, payload):
                        super().__init__('', status)
                        self.payload = payload
                    async def json(self):
                        return self.payload
                class TranslationSession:
                    def get(self, url, **kwargs):
                        if 'googleapis' in url:
                            return JsonResponse(503, {})
                        return JsonResponse(200, {'responseData': {'translatedText': 'Акции выросли'}})
                translated = await news.translate_to_russian(TranslationSession(), 'Stocks rose')
                self.assertEqual(translated, 'Акции выросли')

            async def test_open_daily_candle_is_excluded(self):
