        MAX_CANDIDATES = 6
        REVIEW_DAYS = (7, 14, 21, 30)
        
        
        def watch_jobs(state, now):
            watches = state.get('news_watch', {})
            if not isinstance(watches, dict):
                return []
            jobs = []
            for fid, record in watches.items():
                try:
                    elapsed = (now.date() - datetime.fromisoformat(record['registered']).date()).days
                    sent = record.get('sent_stages', [])
                    if 30 in sent or elapsed < 0:
                        continue
                    due = max((d for d in REVIEW_DAYS if d <= elapsed and d not in sent), default=0)
                    if due or not record.get('base_price'):
                        jobs.append({'fund_id':fid,'stage':due,'elapsed':elapsed, 'registered':record['registered']})
                except (ValueError,TypeError,KeyError):
                    continue
            return sorted(jobs,key=lambda j:(not bool(j['stage']),j['registered']))[:12]
        
        
        def build_reviews(state, jobs, data, now, verify):
            reviews = []
            for job in jobs:
                fid = job['fund_id']
                record = state['news_watch'][fid]
                history, quote = data.get(fid,([],{}))
                try:
                    daily = float(quote['daily'])
                    points = verify(history,quote,daily,now.date())
                except (KeyError,ValueError,TypeError):
                    points = None
                if points:
                    day, price = points[-1]
                    if not record.get('base_price'):
                        record.update(base_price=price,base_date=day.isoformat(),last_report_nav=day.isoformat())
                    if day.isoformat() < record['base_date']:
                        points = None
                if not job['stage']:
                    continue
                item = {**job,'name':record['name'],'line':'Нет свежей подтверждённой цены.'}
                if points:
                    item['nav_date'] = day.isoformat()
                    if day.isoformat() <= record.get('last_report_nav',record['base_date']):
                        item['line'] = f'Нового NAV нет · {day:%d.%m}'
                    else:
                        pct = (price / record['base_price'] - 1)*100
                        direction = '🟩▲' if pct > 0 else '🟥▼' if pct < 0 else '⬜•'
                        start = datetime.fromisoformat(record['base_date']).strftime('%d.%m')
                        item['line'] = f'{direction} {pct:+.1f}% · {start}→{day:%d.%m}'
                reviews.append(item)
            return reviews
        
        
        def register_delivered(state, now):
            if not isinstance(state.get('news_watch'),dict):
                state['news_watch'] = {}
            watches = state['news_watch']
            for item in state.get('_delivered_focus',[]):
                fid = item['fund_id']
                if fid in watches and 30 not in watches[fid].get('sent_stages',[]):
                    continue  # A new headline must not reset an active observation period.
                analysis = item.get('analysis') or item.get('baseline') or {}
                watches[fid] = {'name':item['name'],'registered':now.isoformat(),'sent_stages':[],
                                'base_price':analysis.get('price'),'base_date':analysis.get('date'),
                                'last_report_nav':analysis.get('date'), 'source':item['news']['url']}
            for item in state.get('_delivered_reviews',[]):
                record = watches[item['fund_id']]
                record['sent_stages'] = sorted(set(record.get('sent_stages',[])) |
                                              {d for d in REVIEW_DAYS if d <= item['stage']})
                if item.get('nav_date'):
                    record['last_report_nav'] = item['nav_date']
            closed = sorted((fid for fid,r in watches.items() if 30 in r.get('sent_stages',[])),
