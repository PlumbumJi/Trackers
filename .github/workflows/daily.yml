          cat << 'EOF' > modules/market.py
          import asyncio
          import re
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright
          import aiohttp
          from modules.config import HTTP_TIMEOUT, HEADERS

          def parse_float(val: str) -> float:
              if not val:
                  return 0.0
              try:
                  cleaned = str(val).replace(',', '.').replace('%', '').replace('+', '').strip()
                  match = re.search(r'([+-]?\d+(?:\.\d+)?)', cleaned)
                  if match:
                      return round(float(match.group(1)), 2)
              except Exception:
                  pass
              return 0.0

          async def fetch_single_ticker(session: aiohttp.ClientSession, ticker: str) -> tuple:
              api_ticker = f"^{ticker}" if ticker == "OVX" else ticker
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{api_ticker}?range=1d&interval=1m"
              try:
                  async with session.get(url, headers=HEADERS, timeout=HTTP_TIMEOUT) as response:
                      if response.status == 200:
                          data = await response.json()
                          result = data.get("chart", {}).get("result", [])
                          if result:
                              meta = result[0].get("meta", {})
                              price = meta.get("regularMarketPrice")
                              prev_close = meta.get("chartPreviousClose")
                              if price is not None and prev_close:
                                  change = ((price - prev_close) / prev_close) * 100
                                  return ticker, {"price": round(price, 2), "change": round(change, 2)}
              except Exception:
                  pass
              return ticker, {"price": 0.0, "change": 0.0}

          async def fetch_all_yahoo_data(tickers: list) -> dict:
              async with aiohttp.ClientSession() as session:
                  tasks = [fetch_single_ticker(session, t) for t in tickers]
                  results = await asyncio.gather(*tasks)
                  return dict(results)

          async def fetch_all_israeli_funds(sectors_config: dict) -> dict:
              """Быстрый парсинг общей таблицы fundList ТОЛЬКО по названию на иврите"""
              results = {k: {"daily": 0.0, "mtd": 0.0, "ytd": 0.0} for k in sectors_config}
              url = "https://www.funder.co.il/fundList"

              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox", "--disable-setuid-sandbox", "--disable-dev-shm-usage"]
                  )
                  
                  context = await browser.new_context(
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
                      viewport={"width": 1280, "height": 800},
                      locale="he-IL"
                  )
                  
                  page = await context.new_page()

                  try:
                      print(f"🌐 Загрузка общей таблицы fundList ({url})...")
                      await page.goto(url, wait_until="domcontentloaded", timeout=30000)
                      
                      await page.wait_for_selector("table", timeout=15000)
                      await asyncio.sleep(2)

                      html_content = await page.content()
                      soup = BeautifulSoup(html_content, 'html.parser')

                      rows = soup.find_all('tr')
                      
                      for row in rows:
                          row_text = row.get_text()
                          
                          for sector_key, cfg in sectors_config.items():
                              hebrew_name = cfg.get("il_name_hebrew", "").strip()
                              if not hebrew_name:
                                  continue

                              if hebrew_name in row_text:
                                  cols = [td.get_text(strip=True) for td in row.find_all(['td', 'th'])]
                                  pcts = [parse_float(c) for c in cols if '%' in c or re.search(r'[+-]?\d+\.\d+', c)]
                                  
                                  if len(pcts) >= 3:
                                      results[sector_key] = {
                                          "daily": pcts[0],
                                          "mtd": pcts[1],
                                          "ytd": pcts[2]
                                      }
                                  elif len(pcts) > 0:
                                      results[sector_key]["daily"] = pcts[0] if len(pcts) > 0 else 0.0
                                      results[sector_key]["mtd"] = pcts[1] if len(pcts) > 1 else 0.0
                                      results[sector_key]["ytd"] = pcts[2] if len(pcts) > 2 else 0.0

                                  print(f"✅ Найдено название '{hebrew_name}' ({sector_key}) -> {results[sector_key]}")

                  except Exception as e:
                      print(f"⚠️ Ошибка парсинга fundList: {e}")
                  finally:
                      await browser.close()

              return results
          EOF
          
          cat << 'EOF' > modules/news.py
          import aiohttp, urllib.parse, html
          import yfinance as yf
          from modules.config import HTTP_TIMEOUT, HEADERS

          async def translate_to_russian(session: aiohttp.ClientSession, text: str) -> str:
              if not text:
                  return text
              try:
                  url = f"https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ru&dt=t&q={urllib.parse.quote(text)}"
                  async with session.get(url, timeout=6) as resp:
                      if resp.status == 200:
                          data = await resp.json()
                          translated = "".join([segment[0] for segment in data[0] if segment[0]])
                          return html.unescape(translated)
              except Exception:
                  pass
              return text

          async def fetch_sector_news(session: aiohttp.ClientSession, query_ticker: str) -> list:
              url = f"https://query1.finance.yahoo.com/v1/finance/search?q={query_ticker}"
              try:
                  async with session.get(url, headers=HEADERS, timeout=HTTP_TIMEOUT) as response:
                      if response.status == 200:
                          items = (await response.json()).get("news", [])
                          for item in items:
                              title = item.get("title", "")
                              if title and len(title) > 15:
                                  translated_title = await translate_to_russian(session, title)
                                  return [f"• {translated_title}"]
              except Exception:
                  pass
              return ["• Торгуется в рамках текущей рыночной динамики."]

          def get_single_ipo_card(symbol: str, name: str, ipo_date: str, fallback_price: str) -> str:
              try:
                  t = yf.Ticker(symbol)
                  info = t.info
                  
                  current_price = info.get("currentPrice") or info.get("regularMarketPrice") or info.get("open")
                  price_str = f"${current_price:.2f}" if current_price else fallback_price
                  
                  rec = str(info.get("recommendationKey", "N/A")).replace("_", " ").upper()
                  target = info.get("targetMeanPrice")
                  target_str = f"${target:.2f}" if target else "Н/Д"
                  
                  rec_map = {
                      "STRONG BUY": "🔥 Strong Buy",
                      "BUY": "🟢 Buy (Покупать)",
                      "HOLD": "🟡 Hold (Удерживать)",
                      "UNDERPERFORM": "🟠 Underperform",
                      "SELL": "🔴 Sell (Продавать)",
                      "N/A": "⚪️ Ожидает оценки"
                  }
                  rec_formatted = rec_map.get(rec, rec)

                  return (
                      f"📌 <b>{name}</b> (<code>{symbol}</code>)\n"
                      f"🗓 <b>Дата IPO:</b> {ipo_date}\n"
                      f"💵 <b>Курс / Диапазон:</b> {price_str}\n"
                      f"🎯 <b>Цель Wall St:</b> {target_str}\n"
                      f"🧠 <b>Консенсус:</b> {rec_formatted}\n"
                  )
              except Exception:
                  return (
                      f"📌 <b>{name}</b> (<code>{symbol}</code>)\n"
                      f"🗓 <b>Дата IPO:</b> {ipo_date}\n"
                      f"💵 <b>Курс:</b> {fallback_price}\n"
                      f"🧠 <b>Консенсус:</b> ⚪️ В процессе оценки\n"
                  )

          def fetch_ipo_full_analytics() -> list:
              ipo_targets = [
                  {"symbol": "ARM", "name": "Arm Holdings", "date": "14.09.2023", "price": "$51.00"},
                  {"symbol": "RDDT", "name": "Reddit Inc.", "date": "21.03.2024", "price": "$34.00"},
                  {"symbol": "KVUE", "name": "Kenvue Inc.", "date": "04.05.2023", "price": "$22.00"},
                  {"symbol": "IPO", "name": "Renaissance IPO ETF", "date": "ETF Фонд", "price": "Рыночная"}
              ]
              cards = []
              for target in ipo_targets:
                  card = get_single_ipo_card(target["symbol"], target["name"], target["date"], target["price"])
                  cards.append(card)
              return cards
          EOF
          
          cat << 'EOF' > modules/formatter.py
          from datetime import datetime, timezone, timedelta
          from modules.config import BOT_NAME

          def escape_html(text: str) -> str:
              return text.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")

          def build_telegram_message(sectors_data: list) -> str:
              tz_il = timezone(timedelta(hours=3))
              now_str = datetime.now(tz_il).strftime("%d.%m.%Y | %H:%M")
              
              lines = [
                  "📈 <b>Рыночный Дайджест</b>",
                  f"📅 {now_str} (IDT) 🇮🇱\n",
                  "<b>📊 ОБЗОР СЕКТОРОВ (US) И ФОНДОВ (IL)</b>",
                  "<code>Сектор       US      IL   Рейтинг</code>",
                  "<code>"
              ]
              
              for s in sectors_data:
                  icon = s['icon']
                  name = s['short_eng'][:6]
                  us_ch = s['avg_change']
                  il_ch = s['il_fund_data']['daily']
                  
                  us_str = f"+{us_ch:.1f}%" if us_ch > 0 else f"{us_ch:.1f}%"
                  il_str = f"+{il_ch:.1f}%" if il_ch > 0 else f"{il_ch:.1f}%"
                  
                  score_emoji = "🟢" if s['score'] >= 65 else ("🟡" if s['score'] >= 40 else "🔴")
                  lines.append(f"{icon}{name:<6} {us_str:>6} {il_str:>6}  {score_emoji}{s['score']:>3}/100")
              lines.append("</code>\n")

              lines.append("<blockquote expandable>")
              lines.append("🔍 <b>ДРАЙВЕРЫ ДВИЖЕНИЯ И ПОКАЗАТЕЛИ СЕКТОРОВ</b>\n")
              for s in sectors_data:
                  ch_sign = f"+{s['avg_change']:.2f}%" if s['avg_change'] > 0 else f"{s['avg_change']:.2f}%"
                  lines.append(f"<b>{s['icon']} {escape_html(s['name'])}</b> ({ch_sign})")
                  
                  if s.get("top_3_tickers"):
                      details_str = ", ".join([f"{t}: {c:+.2f}%" for t, c in s["top_3_tickers"]])
                      lines.append(f"  📊 <i>Топ-3 драйвера: [{escape_html(details_str)}]</i>")
                      
                  for n in s['news']:
                      lines.append(f"  {escape_html(n)}")
                  lines.append("")
              lines.append("</blockquote>\n")

              ta_stocks_sorted = sorted(sectors_data, key=lambda x: x['il_fund_data']['daily'], reverse=True)

              lines.append("<blockquote expandable>")
              lines.append("🇮🇱 <b>ДОХОДНОСТЬ ИЗРАИЛЬСКИХ ФОНДОВ (תשואות)</b>\n")
              for s in ta_stocks_sorted:
                  f_data = s['il_fund_data']
                  d_ch = f_data['daily']
                  mtd_ch = f_data['mtd']
                  ytd_ch = f_data['ytd']
                  
                  ch_emoji = "🟢" if d_ch > 0 else ("🔴" if d_ch < 0 else "⚪")
                  
                  d_str = f"+{d_ch:.2f}%" if d_ch > 0 else f"{d_ch:.2f}%"
                  mtd_str = f"+{mtd_ch:.2f}%" if mtd_ch > 0 else f"{mtd_ch:.2f}%"
                  ytd_str = f"+{ytd_ch:.2f}%" if ytd_ch > 0 else f"{ytd_ch:.2f}%"
                  
                  lines.append(
                      f"{ch_emoji} <b>{escape_html(s['il_name_eng'])}</b> ({s['icon']})\n"
                      f"└ <code>{s['fund_id']}</code> · <b>День: {d_str}</b> | <b>Месяц: {mtd_str}</b> | <b>Год: {ytd_str}</b>"
                  )
              lines.append("</blockquote>")

              lines.append(f"\n{BOT_NAME}")
              return "\n".join(lines)

          def build_ipo_message(ipo_cards: list) -> str:
              tz_il = timezone(timedelta(hours=3))
              now_str = datetime.now(tz_il).strftime("%d.%m.%Y")
              
              lines = [
                  "🔔 <b>ЕЖЕНЕДЕЛЬНЫЙ IPO ДАЙДЖЕСТ</b>",
                  f"📅 {now_str} | Субботний обзор 🇮🇱\n",
                  "<blockquote expandable>"
              ]
              for card in ipo_cards:
                  lines.append(f"{card}")
              lines.append("</blockquote>")
              lines.append(f"\n{BOT_NAME}")
              return "\n".join(lines)
          EOF
          
          cat << 'EOF' > modules/telegram_sender.py
          import aiohttp
          from modules.config import BOT_TOKEN, CHAT_ID, HTTP_TIMEOUT

          def split_message(text: str, max_length: int = 4000) -> list[str]:
              if len(text) <= max_length:
                  return [text]
              
              chunks = []
              raw_blocks = text.split("\n\n")
              current_chunk = ""

              for block in raw_blocks:
                  if len(current_chunk) + len(block) + 2 > max_length:
                      if current_chunk:
                          chunks.append(current_chunk.strip())
                      current_chunk = block
                  else:
                      current_chunk = f"{current_chunk}\n\n{block}" if current_chunk else block

              if current_chunk:
                  chunks.append(current_chunk.strip())

              return chunks

          async def send_telegram_message(session: aiohttp.ClientSession, message_text: str) -> bool:
              if not BOT_TOKEN or not CHAT_ID:
                  print("⚠️ BOT_TOKEN или CHAT_ID не настроены.")
                  return False

              url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"
              chunks = split_message(message_text)

              for chunk in chunks:
                  payload = {
                      "chat_id": CHAT_ID,
                      "text": chunk,
                      "parse_mode": "HTML",
                      "disable_web_page_preview": True
                  }
                  try:
                      async with session.post(url, json=payload, timeout=HTTP_TIMEOUT) as response:
                          if response.status != 200:
                              error_body = await response.text()
                              print(f"⚠️ Ошибка отправки Telegram (Status {response.status}): {error_body}")
                              return False
                  except Exception as e:
                      print(f"⚠️ Исключение при отправке в Telegram: {e}")
                      return False

              print("✅ Telegram сообщение успешно отправлено.")
              return True
          EOF

          cat << 'EOF' > main.py
          import asyncio, sys
          from datetime import datetime, timezone, timedelta
          import aiohttp

          from modules.config import SECTORS_CONFIG
          from modules.market import fetch_all_yahoo_data, fetch_all_israeli_funds
          from modules.news import fetch_sector_news, fetch_ipo_full_analytics
          from modules.formatter import build_telegram_message, build_ipo_message
          from modules.telegram_sender import send_telegram_message

          async def run_market_analytics(session: aiohttp.ClientSession):
              print("📊 Запуск рыночной аналитики...")
              
              all_tickers = []
              for cfg in SECTORS_CONFIG.values():
                  all_tickers.extend(cfg["tickers"])
              all_tickers = list(set(all_tickers))

              yahoo_data, isr_data = await asyncio.gather(
                  fetch_all_yahoo_data(all_tickers),
                  fetch_all_israeli_funds(SECTORS_CONFIG)
              )

              sectors_processed = []

              for key, cfg in SECTORS_CONFIG.items():
                  ticker_changes = []
                  for t in cfg["tickers"]:
                      if t in yahoo_data:
                          ticker_changes.append((t, yahoo_data[t]["change"]))

                  ticker_changes.sort(key=lambda x: x[1], reverse=True)
                  top_3 = ticker_changes[:3]

                  avg_ch = sum([c for _, c in ticker_changes]) / len(ticker_changes) if ticker_changes else 0.0
                  il_fund = isr_data.get(key, {"daily": 0.0, "mtd": 0.0, "ytd": 0.0})

                  score = min(100, max(0, int(50 + (avg_ch * 10) + (il_fund['daily'] * 5))))
                  news = await fetch_sector_news(session, cfg["news_ticker"])

                  sectors_processed.append({
                      "name": cfg["name"],
                      "icon": cfg["icon"],
                      "short_eng": cfg["short_eng"],
                      "avg_change": round(avg_ch, 2),
                      "score": score,
                      "top_3_tickers": top_3,
                      "news": news,
                      "fund_id": cfg["fund_id"],
                      "il_name_eng": cfg["il_name_eng"],
                      "il_fund_data": il_fund
                  })

              sectors_processed.sort(key=lambda x: x["avg_change"], reverse=True)

              msg = build_telegram_message(sectors_processed)
              await send_telegram_message(session, msg)

          async def run_ipo_digest(session: aiohttp.ClientSession):
              print("🔔 Запуск еженедельного IPO дайджеста...")
              cards = fetch_ipo_full_analytics()
              msg = build_ipo_message(cards)
              await send_telegram_message(session, msg)

          async def main():
              tz_il = timezone(timedelta(hours=3))
              now = datetime.now(tz_il)
              weekday = now.weekday()  # 5 = Суббота
              
              is_ipo_time = weekday == 5 and now.hour >= 20

              async with aiohttp.ClientSession() as session:
                  if is_ipo_time:
                      await run_ipo_digest(session)
                  else:
                      await run_market_analytics(session)

          if __name__ == "__main__":
              asyncio.run(main())
          EOF

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run Analytics Pipeline
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py
