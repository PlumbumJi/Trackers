        def reconcile_quote_date(quote, points, today):
            """Date an undated page only by a unique recent price AND return match."""
            if not quote or quote.get('date') or len(points) < 2:
                return quote
            try:
                price, daily = Decimal(str(quote['price'])), Decimal(str(quote['daily']))
                if not price.is_finite() or not daily.is_finite():
                    return quote
            except (KeyError, ValueError, ArithmeticError):
                return quote
            matches = []
            for (prior_day, prior_price), (day, value) in zip(points, points[1:]):
                age = (today - date.fromisoformat(day)).days
                gap = (date.fromisoformat(day) - date.fromisoformat(prior_day)).days
                if not (0 <= age <= 7 and 0 < gap <= 7) or Decimal(value) != price:
                    continue
                change = (price / Decimal(prior_price) - 1) * 100
                if abs(change - daily) <= Decimal('0.10'):
                    matches.append(day)
            if len(matches) == 1:
                return dict(quote, date=matches[0], date_source='history_match')
            return quote
        
        
        def daily_result(points, price_day, price, quantity, quote):
            """Use two source observations, never the previous bot snapshot."""
            if not price_day or len(points) < 2:
                return None
            if points[-1][0] != price_day or Decimal(points[-1][1]) != price:
                return None
            old_day, old_price = points[-2]
            # A long gap is not called a daily move; no extrapolation from missing NAVs.
            if not 0 < (date.fromisoformat(price_day) - date.fromisoformat(old_day)).days <= 7:
                return None
            old_price = Decimal(old_price)
            pct = (price / old_price - 1) * 100
            # When supplied for the same date, the source's daily return must agree.
            if quote.get('date') == price_day and quote.get('daily') is not None:
                published_pct = Decimal(str(quote['daily']))
                if not published_pct.is_finite() or abs(pct - published_pct) > Decimal('0.10'):
                    return None
            base = quantity * old_price / 100
            return {'delta': quantity * (price - old_price) / 100, 'base': base,
                    'start': old_day, 'end': price_day}
        
        
