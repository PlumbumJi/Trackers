        \      status = 200\n            async def __aenter__(self): return self\n            async def __aexit__(self, *args): pass\n            async def json(self): return {'chart': {'result': [chart]}}\n        from unittest.mock import MagicMock\n        session = MagicMock()\n        session.get.return_value = Response()\n        history = await market.fetch_ticker_history(session, 'TEST')\n        self.assertEqual(len(history), 6)\n        self.assertEqual(history[-1]['close'], 105)\n        self.assertEqual(market.analyze_year_history(history, 'TEST')['change_5d'], 5)\n\n    def test_caption_explains_price_and_preserves_album_limit(self):\n        from datetime import date, timedelta\n        from modules.charts import chart_caption\n        row = MessageTests().rows()[0]\n        row['il_fund_data']['price_stats']['chart_history'] = [\n            {'date': (date(2025, 1, 1)+timedelta(days=i)).isoformat(), 'price': 200-i}\n            for i in range(100)]\n        row['entry_analysis'].update(status_key='blocked',\
