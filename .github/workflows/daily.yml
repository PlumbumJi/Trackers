        """Six-month charts of delivered monthly movers, independent of portfolio holdings."""
        import asyncio
        import calendar
        import csv
        import json
        import math
        from datetime import date
        from io import BytesIO
        
        import aiohttp
        
        from modules.config import HEADERS
        from modules.fund_profile import describe_fund
        from modules.fund_sources import PublicFundSources, MAYA, parse_maya_history
        
        
        def six_month_start(today):
            year, month = divmod(today.year * 12 + today.month - 1 - 6, 12)
            month += 1
            return date(year, month, min(today.day, calendar.monthrange(year, month)[1]))
        
        
        def verified_chart(history, detail, event, today):
            """Never attach a different NAV date/price to the monthly card."""
            try:
                if str(detail['fundId']) != event['fund_id']:
                    return []
                points = sorted((date.fromisoformat(p['date']), float(p['price'])) for p in history)
                if len(points) < 2 or len({d for d, _ in points}) != len(points):
                    return []
                if any(not math.isfinite(p) or p <= 0 or d > today for d, p in points):
                    return []
                last_day, last_price = points[-1]
                quote_price = float(detail['redemptionPrice'])
                event_price = float(event['price'])
                if not all(math.isfinite(p) and p > 0 for p in (quote_price, event_price)):
                    return []
                if (last_day.isoformat() != str(detail['ratesAsOf'])[:10]
                        or last_day.isoformat() != event['date']
                        or abs(last_price - quote_price) > .011
                        or abs(last_price - event_price) > .011):
                    return []
                return [(d, p) for d, p in points if d >= six_month_start(today)]
            except (KeyError, ValueError, TypeError):
                return []
        
        
        async def build_mover_charts(selected, today):
            if not selected:
                return None
            async with aiohttp.ClientSession(headers=HEADERS, trust_env=True,
                                            timeout=aiohttp.ClientTimeout(total=25)) as session:
                api = PublicFundSources(session, {}, today)
                async def fetch(item):
                    event = item[1]
                    fid = event['fund_id']
                    try:
                        body = await api.text('MAYA', f'{MAYA}/mutual/{fid}/history/file', {
                            'period': 4, 'fromDate': six_month_start(today).isoformat(),
                            'toDate': today.isoformat(), 'pageSize': 200, 'pageNumber': 1})
                        history = parse_maya_history(body, fid, today) if body else []
                        if not history:
                            return None
                        raw = await api.text('MAYA', f'{MAYA}/mutual/{fid}')
                        points = verified_chart(history, json.loads(raw), event, today)
                        if len(points) < 2:
                            print(f'::warning::Mover chart {fid}: history and published NAV not aligned')
                            return None
                        return event, points
                    except (ValueError, TypeError, KeyError, csv.Error):
                        return None
                rows = [r for r in await asyncio.gather(*(fetch(item) for item in selected[:3])) if r]
            if not rows:
                print('::warning::Monthly mover charts unavailable; retaining verified text report')
                return None
            return render_mover_charts(rows, today)
        
        
        def render_mover_charts(rows, today):
            import matplotlib
            matplotlib.use('Agg')
            import matplotlib.pyplot as plt
            from matplotlib.patches import FancyBboxPatch
        
            count = len(rows)
            start = six_month_start(today)
            # Fixed row height keeps one or two available charts readable as well.
            with plt.rc_context({'font.family': 'DejaVu Sans', 'font.size': 11,
                                 'text.color': '#e8edf5', 'xtick.color': '#8398b1',
                                 'ytick.color': '#8398b1'}):
                fig = plt.figure(figsize=(9, 1.9 + 3.35 * count), dpi=180, facecolor='#09121f')
                try:
                    fig.text(.055, .965, 'ФОНДЫ В ФОКУСЕ', fontsize=23, weight='bold')
                    fig.text(.055, .932, f'6 месяцев / {start:%d.%m.%Y} — {today:%d.%m.%Y}',
                             fontsize=11, color='#9fb1c8')
                    row_height = .82 / count
                    for i, (event, points) in enumerate(rows):
                        top = .90 - i * row_height
                        h = row_height
                        profile = describe_fund(event['name'])
                        name = profile['label'] if profile else event['fund_id']
                        if event.get('risk'):
                            name += ' · ' + event['risk']
                        first, last = points[0], points[-1]
                        low, high = min(points, key=lambda p: p[1]), max(points, key=lambda p: p[1])
                        change = (last[1] / first[1] - 1) * 100
                        color = '#42d4ad' if change >= 0 else '#ff798a'
                        fig.add_artist(FancyBboxPatch((.035, top - h + .013), .93, h - .018,
                            boxstyle='round,pad=0.006,rounding_size=0.012', transform=fig.transFigure,
                            facecolor='#111e2e', edgecolor='#24364b', linewidth=.7, zorder=0))
                        fig.text(.058, top - .10*h, name, fontsize=13, weight='bold')
                        fig.text(.058, top - .18*h, f"{event['fund_id']} · {len(points)} опубликованных цен",
                                 fontsize=9, color='#8fa3bc')
                        for x, label, (day, value) in zip([.06, .28, .50],
                                ['ПОСЛЕДНЯЯ ЦЕНА', 'МИНИМУМ', 'МАКСИМУМ'], [last, low, high]):
                            fig.text(x, top - .28*h, label, fontsize=7.5, color='#91a4bc')
                            fig.text(x, top - .36*h, f'{value:.2f}', fontsize=17, weight='bold')
                            fig.text(x, top - .42*h, f'{day:%d.%m}', fontsize=8, color='#91a4bc')
                        fig.text(.73, top - .28*h, 'ИЗМЕНЕНИЕ КУРСА', fontsize=7.5, color='#91a4bc')
                        fig.text(.73, top - .36*h, f'{change:+.1f}%', fontsize=17, color=color, weight='bold')
                        fig.text(.73, top - .42*h, f'{first[0]:%d.%m} → {last[0]:%d.%m}',
                                 fontsize=8, color='#91a4bc')
                        ax = fig.add_axes([.085, top - .85*h, .82, .36*h], facecolor='#111e2e')
                        ds, ys = zip(*points)
                        pad = max((high[1] - low[1]) * .15, last[1] * .01)
