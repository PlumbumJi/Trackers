          cat << 'EOF' > modules/market.py
          import time
          import logging
          import asyncio
          import re
          import aiohttp
          from dataclasses import dataclass
          from typing import Optional, List

          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.common.exceptions import (
              TimeoutException,
              NoSuchElementException,
              ElementNotInteractableException,
          )
          from webdriver_manager.chrome import ChromeDriverManager
          from modules.config import HTTP_TIMEOUT, HEADERS

          logger = logging.getLogger(__name__)

          @dataclass
          class FundReturns:
              nav_year: str = "N/A"
              nav_new: str = "N/A"
              daily: str = "N/A"
              days_90: str = "N/A"
              days_30: str = "N/A"
              days_14: str = "N/A"
              days_7: str = "N/A"
              fund_name: str = "N/A"

              def to_dict(self) -> dict:
                  return {
                      "nav_year": self.nav_year,
                      "nav_new": self.nav_new,
                      "daily": self.daily,
                      "days_90": self.days_90,
                      "days_30": self.days_30,
                      "days_14": self.days_14,
                      "days_7": self.days_7,
                      "fund_name": self.fund_name,
                  }

          class FunderParser:
              def __init__(self, headless: bool = True, timeout: int = 30):
                  self.headless = headless
                  self.timeout = timeout
                  self.driver: Optional[webdriver.Chrome] = None

              def _create_driver(self) -> webdriver.Chrome:
                  chrome_options = Options()
                  chrome_options.add_argument("--no-sandbox")
                  chrome_options.add_argument("--disable-dev-shm-usage")
                  chrome_options.add_argument("--disable-blink-features=AutomationControlled")
                  chrome_options.add_experimental_option("excludeSwitches", ["enable-automation"])
                  chrome_options.add_experimental_option("useAutomationExtension", False)

                  chrome_options.add_argument("--window-size=1920,1080")
                  chrome_options.add_argument("--lang=he-IL,en-US")
                  chrome_options.add_argument(
                      "--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
                  )

                  if self.headless:
                      chrome_options.add_argument("--headless=new")
                      chrome_options.add_argument("--disable-gpu")

                  service = Service(ChromeDriverManager().install())
                  driver = webdriver.Chrome(service=service, options=chrome_options)

                  driver.execute_cdp_cmd(
                      "Page.addScriptToEvaluateOnNewDocument",
                      {
                          "source": """
                              Object.defineProperty(navigator, 'webdriver', {
                                  get: () => undefined
                              });
                              window.chrome = { runtime: {} };
                          """
                      },
                  )
                  return driver

              def _close_banner(self) -> None:
                  banner_selectors: List[tuple] = [
                      (By.XPATH, "//button[contains(@style, 'left') and contains(@style, 'top')]"),
                      (By.XPATH, "//div[contains(@class, 'close') or contains(@class, 'dismiss') or contains(@class, 'exit')]"),
                      (By.XPATH, "//button[contains(@class, 'close') or contains(@class, 'dismiss')]"),
                      (By.XPATH, "//*[@aria-label='close' or @aria-label='סגור' or @aria-label='Close']"),
                      (By.XPATH, "//svg[contains(@d, 'M') and contains(@viewBox, '0 0')]/ancestor::button[1]"),
                      (By.XPATH, "//*[name()='path' and contains(@d,'M')]/ancestor::button[1]"),
                      (By.CSS_SELECTOR, "[data-testid='close-button']"),
                      (By.CSS_SELECTOR, ".modal-close, .popup-close, .banner-close"),
                  ]

                  for by, selector in banner_selectors:
                      try:
                          btn = self.driver.find_element(by, selector)
                          if btn.is_displayed() and btn.is_enabled():
                              btn.click()
                              logger.info("Баннер закрыт селектором: %s", selector)
                              time.sleep(0.8)
                              return
                      except (NoSuchElementException, ElementNotInteractableException):
                          continue

                  logger.debug("Баннер не обнаружен")

              def _get_all_percentages(self) -> List[str]:
                  try:
                      elements = self.driver.find_elements(By.XPATH, "//*[contains(text(), '%')]")
                      values = []
                      for el in elements:
                          text = el.text.strip()
                          if text and ('%' in text) and any(c.isdigit() for c in text):
                              values.append(text)
                      seen = set()
                      unique = []
                      for v in values:
                          if v not in seen:
                              seen.add(v)
                              unique.append(v)
                      return unique
                  except Exception as e:
                      logger.error("Ошибка извлечения процентов: %s", e)
                      return []

              def _get_by_label(self, label_text: str) -> str:
                  xpaths = [
                      f"//td[contains(text(), '{label_text}')]/following-sibling::td[1]",
                      f"//th[contains(text(), '{label_text}')]/following-sibling::th[1]",
                      f"//div[contains(text(), '{label_text}')]/following-sibling::div[1]",
                      f"//span[contains(text(), '{label_text}')]/following-sibling::span[1]",
                      f"//p[contains(text(), '{label_text}')]/following-sibling::p[1]",
                      f"//*[contains(text(), '{label_text}')]/parent::*//span[contains(@class, 'value')]",
                      f"//*[contains(text(), '{label_text}')]/parent::*//div[contains(@class, 'value')]",
                      f"//*[@data-label='{label_text}']",
                  ]
                  for xpath in xpaths:
                      try:
                          el = self.driver.find_element(By.XPATH, xpath)
                          val = el.text.strip()
                          if val:
                              return val
                      except NoSuchElementException:
                          continue
                  return "N/A"

              def _extract_fund_name(self) -> str:
                  selectors = [
                      (By.TAG_NAME, "h1"),
                      (By.CSS_SELECTOR, "[data-testid='fund-name']"),
                      (By.CSS_SELECTOR, ".fund-name, .fund-title"),
                      (By.XPATH, "//div[contains(@class, 'title')]//h1"),
                  ]
                  for by, sel in selectors:
                      try:
                          el = self.driver.find_element(by, sel)
                          name = el.text.strip()
                          if name:
                              return name
                      except NoSuchElementException:
                          continue
                  return "N/A"

              def parse(self, url: str) -> FundReturns:
                  data = FundReturns()
                  try:
                      self.driver = self._create_driver()
                      logger.info("Загрузка: %s", url)
                      self.driver.get(url)

                      WebDriverWait(self.driver, self.timeout).until(
                          EC.presence_of_element_located((By.TAG_NAME, "body"))
                      )

                      time.sleep(4)
                      self._close_banner()
                      time.sleep(1)

                      percents = self._get_all_percentages()
                      logger.info("Найдено процентов: %s", percents)

                      if len(percents) >= 7:
                          data.nav_year = percents[0]
                          data.nav_new = percents[1]
                          data.daily = percents[2]
                          data.days_90 = percents[3]
                          data.days_30 = percents[4]
                          data.days_14 = percents[5]
                          data.days_7 = percents[6]
                      else:
                          logger.warning("Мало процентов, переключаюсь на fallback")
                          data.nav_year = self._get_by_label("מחיר הנכס")
                          data.nav_new = self._get_by_label("NAV") or self._get_by_label("נכס")
                          data.daily = self._get_by_label("יומית")
                          data.days_90 = self._get_by_label("90 ימים")
                          data.days_30 = self._get_by_label("30 ימים")
                          data.days_14 = self._get_by_label("14 ימים")
                          data.days_7 = self._get_by_label("7 ימים")

                      data.fund_name = self._extract_fund_name()

                  except TimeoutException:
                      logger.error("Таймаут загрузки страницы")
                  except Exception as e:
                      logger.error("Критическая ошибка парсинга: %s", e)
                  finally:
                      if self.driver:
                          self.driver.quit()
                          self.driver = None

                  return data

          def get_fund_data(url: str, headless: bool = True) -> FundReturns:
              parser = FunderParser(headless=headless)
              return parser.parse(url)

          async def fetch_single_ticker(session: aiohttp.ClientSession, ticker: str) -> tuple:
              api_ticker = f"^{ticker}" if ticker == "OVX" else ticker
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{api_ticker}?range=1d&interval=1m"
              try:
                  async with session.get(url, headers=HEADERS, timeout=HTTP_TIMEOUT) as response:
                      if response.status == 200:
                          data = await response.json()
                          result = data.get("chart", {}).get("result", [])
                          if result:
                              meta = result[0].get("meta", {})
                              price = meta.get("regularMarketPrice")
                              prev_close = meta.get("chartPreviousClose")
                              if price is not None and prev_close:
                                  change = ((price - prev_close) / prev_close) * 100
                                  return ticker, {"price": round(price, 2), "change": round(change, 2)}
              except Exception:
                  pass
              return ticker, {"price": 0.0, "change": 0.0}

          async def fetch_all_yahoo_data(tickers: list) -> dict:
              async with aiohttp.ClientSession() as session:
                  tasks = [fetch_single_ticker(session, t) for t in tickers]
                  results = await asyncio.gather(*tasks)
                  return dict(results)

          async def fetch_all_israeli_funds(sectors_config: dict) -> dict:
              results = {}
              parser = FunderParser(headless=True)
              
              for key, cfg in sectors_config.items():
                  fund_id = cfg.get("fund_id", "")
                  if fund_id:
                      url = f"https://www.funder.co.il/fund/{fund_id}"
                      print(f"🔍 Парсинг Selenium для {key} (ID: {fund_id})...")
                      fund_returns: FundReturns = await asyncio.to_thread(parser.parse, url)
                      results[key] = fund_returns.to_dict()
                  else:
                      results[key] = FundReturns().to_dict()
                      
              return results
          EOF
          
          cat << 'EOF' > modules/news.py
          import aiohttp, urllib.parse, html
          import yfinance as yf
          from modules.config import HTTP_TIMEOUT, HEADERS

          async def translate_to_russian(session: aiohttp.ClientSession, text: str) -> str:
              if not text:
                  return text
              try:
                  url = f"https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ru&dt=t&q={urllib.parse.quote(text)}"
                  async with session.get(url, timeout=6) as resp:
                      if resp.status == 200:
                          data = await resp.json()
                          translated = "".join([segment[0] for segment in data[0] if segment[0]])
                          return html.unescape(translated)
              except Exception:
                  pass
              return text

          async def fetch_sector_news(session: aiohttp.ClientSession, query_ticker: str) -> list:
              url = f"https://query1.finance.yahoo.com/v1/finance/search?q={query_ticker}"
              try:
                  async with session.get(url, headers=HEADERS, timeout=HTTP_TIMEOUT) as response:
                      if response.status == 200:
                          items = (await response.json()).get("news", [])
                          for item in items:
                              title = item.get("title", "")
                              if title and len(title) > 15:
                                  translated_title = await translate_to_russian(session, title)
                                  return [f"• {translated_title}"]
              except Exception:
                  pass
              return ["• Торгуется в рамках текущей рыночной динамики."]

          def get_single_ipo_card(symbol: str, name: str, ipo_date: str, fallback_price: str) -> str:
              try:
                  t = yf.Ticker(symbol)
                  info = t.info
                  
                  current_price = info.get("currentPrice") or info.get("regularMarketPrice") or info.get("open")
                  price_str = f"${current_price:.2f}" if current_price else fallback_price
                  
                  rec = str(info.get("recommendationKey", "N/A")).replace("_", " ").upper()
                  target = info.get("targetMeanPrice")
                  target_str = f"${target:.2f}" if target else "Н/Д"
                  
                  rec_map = {
                      "STRONG BUY": "🔥 Strong Buy",
                      "BUY": "🟢 Buy (Покупать)",
                      "HOLD": "🟡 Hold (Удерживать)",
                      "UNDERPERFORM": "🟠 Underperform",
                      "SELL": "🔴 Sell (Продавать)",
                      "N/A": "⚪️ Ожидает оценки"
                  }
                  rec_formatted = rec_map.get(rec, rec)

                  return (
                      f"📌 <b>{name}</b> (<code>{symbol}</code>)\n"
                      f"🗓 <b>Дата IPO:</b> {ipo_date}\n"
                      f"💵 <b>Курс / Диапазон:</b> {price_str}\n"
                      f"🎯 <b>Цель Wall St:</b> {target_str}\n"
                      f"🧠 <b>Консенсус:</b> {rec_formatted}\n"
                  )
              except Exception:
                  return (
                      f"📌 <b>{name}</b> (<code>{symbol}</code>)\n"
                      f"🗓 <b>Дата IPO:</b> {ipo_date}\n"
                      f"💵 <b>Курс:</b> {fallback_price}\n"
                      f"🧠 <b>Консенсус:</b> ⚪️ В процессе оценки\n"
                  )

          def fetch_ipo_full_analytics() -> list:
              ipo_targets = [
                  {"symbol": "ARM", "name": "Arm Holdings", "date": "14.09.2023", "price": "$51.00"},
                  {"symbol": "RDDT", "name": "Reddit Inc.", "date": "21.03.2024", "price": "$34.00"},
                  {"symbol": "KVUE", "name": "Kenvue Inc.", "date": "04.05.2023", "price": "$22.00"},
                  {"symbol": "IPO", "name": "Renaissance IPO ETF", "date": "ETF Фонд", "price": "Рыночная"}
              ]
              cards = []
              for target in ipo_targets:
                  card = get_single_ipo_card(target["symbol"], target["name"], target["date"], target["price"])
                  cards.append(card)
              return cards
          EOF
          
          cat << 'EOF' > modules/formatter.py
          import re
          from datetime import datetime, timezone, timedelta
          from modules.config import BOT_NAME

          def parse_float_val(val_str: str) -> float:
              if not val_str or val_str == "N/A":
                  return 0.0
              try:
                  cleaned = val_str.replace(',', '.').replace('%', '').replace('+', '').strip()
                  match = re.search(r'([+-]?\d+(?:\.\d+)?)', cleaned)
                  if match:
                      return float(match.group(1))
              except Exception:
                  pass
              return 0.0

          def escape_html(text: str) -> str:
              return text.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")

          def build_telegram_message(sectors_data: list) -> str:
              tz_il = timezone(timedelta(hours=3))
              now_str = datetime.now(tz_il).strftime("%d.%m.%Y | %H:%M")
              
              lines = [
                  "📈 <b>Рыночный Дайджест</b>",
                  f"📅 {now_str} (IDT) 🇮🇱\n",
                  "<b>📊 ОБЗОР СЕКТОРОВ (US) И ФОНДОВ (IL)</b>",
                  "<code>Сектор       US      IL   Рейтинг</code>",
                  "<code>"
              ]
              
              for s in sectors_data:
                  icon = s['icon']
                  name = s['short_eng'][:6]
                  us_ch = s['avg_change']
                  il_daily_str = s['il_fund_data'].get('daily', 'N/A')
                  
                  us_str = f"+{us_ch:.1f}%" if us_ch > 0 else f"{us_ch:.1f}%"
                  il_str = f"{il_daily_str}" if il_daily_str != "N/A" else "0.0%"
                  
                  score_emoji = "🟢" if s['score'] >= 65 else ("🟡" if s['score'] >= 40 else "🔴")
                  lines.append(f"{icon}{name:<6} {us_str:>6} {il_str:>6}  {score_emoji}{s['score']:>3}/100")
              lines.append("</code>\n")

              lines.append("<blockquote expandable>")
              lines.append("🔍 <b>ДРАЙВЕРЫ ДВИЖЕНИЯ И ПОКАЗАТЕЛИ СЕКТОРОВ</b>\n")
              for s in sectors_data:
                  ch_sign = f"+{s['avg_change']:.2f}%" if s['avg_change'] > 0 else f"{s['avg_change']:.2f}%"
                  lines.append(f"<b>{s['icon']} {escape_html(s['name'])}</b> ({ch_sign})")
                  
                  if s.get("top_3_tickers"):
                      details_str = ", ".join([f"{t}: {c:+.2f}%" for t, c in s["top_3_tickers"]])
                      lines.append(f"  📊 <i>Топ-3 драйвера: [{escape_html(details_str)}]</i>")
                      
                  for n in s['news']:
                      lines.append(f"  {escape_html(n)}")
                  lines.append("")
              lines.append("</blockquote>\n")

              ta_stocks_sorted = sorted(
                  sectors_data, 
                  key=lambda x: parse_float_val(x['il_fund_data'].get('daily', 'N/A')), 
                  reverse=True
              )

              lines.append("<blockquote expandable>")
              lines.append("🇮🇱 <b>ПОЛНАЯ ДОХОДНОСТЬ ФОНДОВ (תשואות)</b>\n")
              for s in ta_stocks_sorted:
                  f_data = s['il_fund_data']
                  daily = f_data.get('daily', 'N/A')
                  d_val = parse_float_val(daily)
                  ch_emoji = "🟢" if d_val > 0 else ("🔴" if d_val < 0 else "⚪")
                  
                  lines.append(
                      f"{ch_emoji} <b>{escape_html(s['il_name_eng'])}</b> ({s['icon']})\n"
                      f"└ <code>{s['fund_id']}</code> | <b>День:</b> {daily} | <b>7 дней:</b> {f_data.get('days_7', 'N/A')}\n"
                      f"  <b>30 дней:</b> {f_data.get('days_30', 'N/A')} | <b>90 дней:</b> {f_data.get('days_90', 'N/A')}\n"
                      f"  <b>Месяц (NAV):</b> {f_data.get('nav_new', 'N/A')} | <b>Год:</b> {f_data.get('nav_year', 'N/A')}\n"
                  )
              lines.append("</blockquote>")

              lines.append(f"\n{BOT_NAME}")
              return "\n".join(lines)

          def build_ipo_message(ipo_cards: list) -> str:
              tz_il = timezone(timedelta(hours=3))
              now_str = datetime.now(tz_il).strftime("%d.%m.%Y")
              
              lines = [
                  "🔔 <b>ЕЖЕНЕДЕЛЬНЫЙ IPO ДАЙДЖЕСТ</b>",
                  f"📅 {now_str} | Субботний обзор 🇮🇱\n",
                  "<blockquote expandable>"
              ]
              for card in ipo_cards:
                  lines.append(f"{card}")
              lines.append("</blockquote>")
              lines.append(f"\n{BOT_NAME}")
              return "\n".join(lines)
          EOF
          
          cat << 'EOF' > modules/telegram_sender.py
          import aiohttp
          from modules.config import BOT_TOKEN, CHAT_ID, HTTP_TIMEOUT

          def split_message(text: str, max_length: int = 4000) -> list[str]:
              if len(text) <= max_length:
                  return [text]
              
              chunks = []
              raw_blocks = text.split("</blockquote>")
              current_chunk = ""

              for raw_block in raw_blocks:
                  if not raw_block:
                      continue
                  
                  block = raw_block + "</blockquote>" if "blockquote" in raw_block else raw_block

                  if len(current_chunk) + len(block) > max_length:
                      if current_chunk:
                          chunks.append(current_chunk.strip())
                          current_chunk = ""
                      
                      if len(block) > max_length:
                          lines = block.split("\n")
                          for line in lines:
                              if len(current_chunk) + len(line) + 1 > max_length:
                                  chunks.append(current_chunk.strip())
                                  current_chunk = line + "\n"
                              else:
                                  current_chunk += line + "\n"
                      else:
                          current_chunk = block
                  else:
                      current_chunk += block

              if current_chunk.strip():
                  chunks.append(current_chunk.strip())

              return chunks

          async def send_to_telegram(text: str):
              if not BOT_TOKEN or not CHAT_ID:
                  print("❌ BOT_TOKEN или CHAT_ID не найдены")
                  return

              url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"
              chunks = split_message(text, max_length=3900)
              
              print(f"ℹ️ Сообщение длинной {len(text)} символов. Отправка {len(chunks)} частей...")
              
              async with aiohttp.ClientSession() as session:
                  for idx, chunk in enumerate(chunks, start=1):
                      payload = {
                          "chat_id": CHAT_ID, 
                          "text": chunk, 
                          "parse_mode": "HTML", 
                          "disable_web_page_preview": True
                      }
                      try:
                          async with session.post(url, json=payload, timeout=HTTP_TIMEOUT) as resp:
                              if resp.status == 200:
                                  print(f"🚀 Часть [{idx}/{len(chunks)}] успешно отправлена!")
                              else:
                                  print(f"❌ Ошибка Telegram ({resp.status}): {await resp.text()}")
                      except Exception as e:
                          print(f"💥 Ошибка отправки: {e}")
          EOF
          
          cat << 'EOF' > main.py
          import asyncio, aiohttp
          from datetime import datetime, timezone, timedelta
          from modules.config import SECTORS_CONFIG
          from modules.market import fetch_all_yahoo_data, fetch_all_israeli_funds
          from modules.news import fetch_sector_news, fetch_ipo_full_analytics
          from modules.formatter import build_telegram_message, build_ipo_message
          from modules.telegram_sender import send_to_telegram

          def parse_float_val(val_str: str) -> float:
              import re
              if not val_str or val_str == "N/A":
                  return 0.0
              try:
                  cleaned = val_str.replace(',', '.').replace('%', '').replace('+', '').strip()
                  match = re.search(r'([+-]?\d+(?:\.\d+)?)', cleaned)
                  if match:
                      return float(match.group(1))
              except Exception:
                  pass
              return 0.0

          def calculate_sector_score(avg_change: float) -> int:
              return max(0, min(100, int(50 + (avg_change * 15.0))))

          async def run_market_analytics():
              all_tickers = set()
              for cfg in SECTORS_CONFIG.values():
                  all_tickers.update(cfg["tickers"])
              
              print(f"📦 Сбор данных Yahoo Finance...")
              global_market_data = await fetch_all_yahoo_data(list(all_tickers))

              print(f"🌐 Опрос Funder через Selenium...")
              il_results = await fetch_all_israeli_funds(SECTORS_CONFIG)

              async with aiohttp.ClientSession() as session:
                  sectors_results = []
                  
                  for key, cfg in SECTORS_CONFIG.items():
                      ticker_details = [(t, global_market_data[t]["change"]) for t in cfg["tickers"] if t in global_market_data and global_market_data[t]["price"] > 0]
                      
                      sorted_tickers = sorted(ticker_details, key=lambda x: abs(x[1]), reverse=True)
                      top_3_tickers = sorted_tickers[:3]
                      
                      valid_changes = [c for _, c in ticker_details]
                      avg_change = sum(valid_changes) / len(valid_changes) if valid_changes else 0.0
                      
                      score = calculate_sector_score(avg_change)
                      news = await fetch_sector_news(session, cfg["news_ticker"])
                      
                      sectors_results.append({
                          "short_eng": cfg["short_eng"],
                          "name": cfg["name"],
                          "icon": cfg["icon"],
                          "fund_id": cfg.get("fund_id", ""),
                          "avg_change": round(avg_change, 2),
                          "top_3_tickers": top_3_tickers,
                          "score": score,
                          "news": news,
                          "il_name_eng": cfg["il_name_eng"],
                          "il_fund_data": il_results.get(key, {})
                      })
                  
                  sectors_results.sort(key=lambda x: x["avg_change"], reverse=True)
                      
                  message = build_telegram_message(sectors_results)
                  await send_to_telegram(message)

          async def run_ipo_digest():
              print("📊 Формирование IPO отчета...")
              ipo_cards = fetch_ipo_full_analytics()
              message = build_ipo_message(ipo_cards)
              await send_to_telegram(message)

          async def main():
              tz_il = timezone(timedelta(hours=3))
              now = datetime.now(tz_il)
              
              if now.weekday() == 5 and now.hour == 22:
                  await run_ipo_digest()
              else:
                  await run_market_analytics()

          if __name__ == "__main__":
              asyncio.run(main())
          EOF

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Analytics Engine
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
