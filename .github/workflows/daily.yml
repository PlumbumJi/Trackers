          }

          LOW_VALUE_PHRASES = (
              "stocks to watch", "should you buy", "could dominate", "here's what",
              "biggest risk", "street calls", "top stocks", "best stocks", "stock picks",
          )


          def normalize_title(title: str) -> str:
              return re.sub(r"\s+", " ", html.unescape(str(title or ""))).strip()


          def unique(values: list[str]) -> list[str]:
              return list(dict.fromkeys(value for value in values if value))


          async def translate_to_russian(session: aiohttp.ClientSession, text: str) -> str:
              if not text:
                  return text
              url = (
                  "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ru&dt=t&q="
                  + urllib.parse.quote(text)
              )
              try:
                  async with session.get(url, timeout=6) as response:
                      if response.status != 200:
                          print(f"⚠️ Google Translate: HTTP {response.status}")
                          return text
                      data = await response.json()
                  translated = "".join(
                      str(segment[0]) for segment in data[0]
                      if isinstance(segment, list) and segment and segment[0]
                  ).strip()
                  return html.unescape(translated) if translated else text
              except Exception as error:
                  print(f"⚠️ Translation: {error}")
                  return text


          def news_score(item: dict, candidate_tickers: list[str], sector_name: str) -> int:
              title = normalize_title(item.get("title") or item.get("headline"))
              if len(title) < 20:
                  return -100
              lower_title = title.lower()
              if any(phrase in lower_title for phrase in LOW_VALUE_PHRASES):
                  return -50

              published = item.get("providerPublishTime") or item.get("datetime")
              if published:
                  try:
                      age = datetime.now(timezone.utc) - datetime.fromtimestamp(int(published), tz=timezone.utc)
                      if age.total_seconds() > MAX_NEWS_AGE_HOURS * 3600:
                          return -40
                  except (TypeError, ValueError, OSError):
                      pass

              related = item.get("relatedTickers") or item.get("related") or []
              if isinstance(related, str):
                  related = re.split(r"[,\s]+", related.upper())
              related_set = {str(value).upper() for value in related}
              ticker_set = {ticker.upper() for ticker in candidate_tickers}
              score = 35 if related_set & ticker_set else 0
              score += 12 * sum(keyword in lower_title for keyword in SECTOR_KEYWORDS.get(sector_name, []))
              if any(word in lower_title for word in ("earnings", "guidance", "forecast", "contract", "approval", "tariff")):
                  score += 8
              return score


          async def fetch_yahoo_news(session: aiohttp.ClientSession, ticker: str) -> list[dict]:
              url = f"https://query1.finance.yahoo.com/v1/finance/search?q={urllib.parse.quote(ticker)}"
              try:
                  async with session.get(url, headers=HEADERS, timeout=HTTP_TIMEOUT) as response:
                      if response.status == 200:
                          return (await response.json()).get("news") or []
                      print(f"⚠️ Yahoo News {ticker}: HTTP {response.status}")
              except Exception as error:
                  print(f"⚠️ Yahoo News {ticker}: {error}")
              return []


          async def fetch_sector_news(
              session: aiohttp.ClientSession,
              query_ticker: str,
              top_tickers: list[tuple[str, float]] | None = None,
              sector_name: str = "",
          ) -> list[str]:
              movers = [ticker for ticker, _ in (top_tickers or [])]
              candidates = unique(movers + [query_ticker])[:4]
              batches = await asyncio.gather(*[
                  fetch_yahoo_news(session, ticker) for ticker in candidates
              ])
              scored = []
              seen_titles = set()
              for item in [entry for batch in batches for entry in batch]:
                  title = normalize_title(item.get("title"))
                  title_key = title.lower()
                  if not title or title_key in seen_titles:
                      continue
                  seen_titles.add(title_key)
                  score = news_score(item, candidates, sector_name)
                  if score >= 35:
                      scored.append((score, int(item.get("providerPublishTime") or 0), title))
              if not scored:
                  return ["• 📰 Явной релевантной новости за последние 96 часов не найдено."]
              scored.sort(key=lambda value: (value[0], value[1]), reverse=True)
              translated = await translate_to_russian(session, scored[0][2])
              if len(translated) > 150:
                  translated = translated[:147].rstrip() + "..."
              return [f"• 📰 {translated}"]


          def historical_news_score(item: dict, ticker: str, sector_name: str) -> int:
              headline = normalize_title(item.get("headline"))
              summary = normalize_title(item.get("summary"))
              if not headline:
                  return -100
              combined = f"{headline} {summary}".lower()
              related = str(item.get("related", "")).upper()
              score = 25 if ticker.upper() in related else 0
              score += 12 * sum(keyword in combined for keyword in SECTOR_KEYWORDS.get(sector_name, []))
              return score


          async def fetch_historical_trigger(
              session: aiohttp.ClientSession, ticker: str, event_date: str, sector_name: str
          ) -> str:
              if not FINNHUB_API_KEY or not ticker or not event_date:
                  return ""
              try:
                  center = datetime.strptime(event_date, "%Y-%m-%d").date()
              except ValueError:
                  return ""
              params = {
                  "symbol": ticker,
                  "from": (center - timedelta(days=3)).isoformat(),
                  "to": (center + timedelta(days=3)).isoformat(),
              }
              try:
                  async with session.get(
                      FINNHUB_COMPANY_NEWS_URL,
                      params=params,
                      headers={"X-Finnhub-Token": FINNHUB_API_KEY},
                      timeout=HTTP_TIMEOUT,
                  ) as response:
                      if response.status != 200:
                          print(f"⚠️ Finnhub History {ticker}: HTTP {response.status}")
                          return ""
                      payload = await response.json()
                  scored = [
                      (historical_news_score(item, ticker, sector_name), item)
                      for item in payload if isinstance(item, dict)
                  ]
                  scored = [item for item in scored if item[0] > 0]
                  if not scored:
                      return ""
                  scored.sort(key=lambda item: item[0], reverse=True)
                  translated = await translate_to_russian(
                      session, normalize_title(scored[0][1].get("headline"))
                  )
                  return translated[:92].rstrip() + "..." if len(translated) > 95 else translated
              except Exception as error:
                  print(f"⚠️ Finnhub History {ticker}: {error}")
                  return ""
