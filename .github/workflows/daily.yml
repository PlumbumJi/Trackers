          cat << 'EOF' > modules/market.py
          import asyncio,json,re,unicodedata
          from datetime import datetime,timezone
          from pathlib import Path
          from typing import Any
          import aiohttp
          from bs4 import BeautifulSoup
          from playwright.async_api import Page,Response,TimeoutError as PlaywrightTimeoutError,async_playwright
          from modules.config import HEADERS,HTTP_TIMEOUT
          CACHE_FILE=Path(".cache/israeli_funds.json")
          EMPTY_RETURNS={"daily":None,"mtd":None,"ytd":None}
          FIELD_ALIASES={
              "daily":("daily","day","daychange","dailychange","dailyreturn","dailyyield","dailychangepercent","תשואהיומית","יומית"),
              "mtd":("mtd","month","monthly","monthchange","monthlyreturn","frommonthstart","מתחילתהחודש","מתחילת החודש"),
              "ytd":("ytd","year","yearly","yearchange","yearlyreturn","fromyearstart","מתחילתהשנה","מתחילת השנה")
          }
          LABEL_PATTERNS={
              "daily":(r"יומית",r"תשואה\s*יומית"),
              "mtd":(r"מתחילת\s*החודש",r"תשואה\s*חודשית"),
              "ytd":(r"מתחילת\s*השנה",r"תשואה\s*שנתית")
          }
          def normalize_text(value:Any)->str:
              text=unicodedata.normalize("NFKC",str(value or ""))
              for char in ("\u200e","\u200f","\u202a","\u202b","\u202c","\u2066","\u2067","\u2069","\xa0"):
                  text=text.replace(char," ")
              return re.sub(r"\s+"," ",text).strip()
          def normalize_key(value:Any)->str:
              return re.sub(r"[^a-z0-9\u0590-\u05ff]","",normalize_text(value).lower())
          def parse_float(value:Any,*,limit:float=500.0)->float|None:
              text=normalize_text(value)
              if not text:
                  return None
              text=text.replace("%","").replace(",",".")
              match=re.search(r"[-+]?\d+(?:\.\d+)?",text)
              if not match:
                  return None
              try:
                  number=round(float(match.group(0)),2)
              except (TypeError,ValueError):
                  return None
              return number if abs(number)<=limit else None
          def is_complete(data:dict)->bool:
              return all(data.get(key) is not None for key in ("daily","mtd","ytd"))
          def sanitize_returns(data:dict)->dict:
              return {
                  "daily":parse_float(data.get("daily"),limit=50.0),
                  "mtd":parse_float(data.get("mtd"),limit=500.0),
                  "ytd":parse_float(data.get("ytd"),limit=500.0)
              }
          def merge_returns(target:dict,candidate:dict)->dict:
              candidate=sanitize_returns(candidate)
              for key in ("daily","mtd","ytd"):
                  if target.get(key) is None and candidate.get(key) is not None:
                      target[key]=candidate[key]
              return target
          async def fetch_single_ticker(session:aiohttp.ClientSession,ticker:str)->tuple:
              api_ticker=f"^{ticker}" if ticker=="OVX" else ticker
              url=f"https://query1.finance.yahoo.com/v8/finance/chart/{api_ticker}?range=1d&interval=1m"
              try:
                  async with session.get(url,headers=HEADERS,timeout=HTTP_TIMEOUT) as response:
                      if response.status==200:
                          data=await response.json(content_type=None)
                          result=data.get("chart",{}).get("result",[])
                          if result:
                              meta=result[0].get("meta",{})
                              price=meta.get("regularMarketPrice")
                              prev_close=meta.get("chartPreviousClose")
                              if price is not None and prev_close:
                                  change=((price-prev_close)/prev_close)*100
                                  return ticker,{"price":round(price,2),"change":round(change,2)}
              except Exception as exc:
                  print(f"⚠️ Yahoo {ticker}: {exc}")
              return ticker,{"price":0.0,"change":0.0}
          async def fetch_all_yahoo_data(tickers:list)->dict:
              timeout=aiohttp.ClientTimeout(total=HTTP_TIMEOUT)
              async with aiohttp.ClientSession(timeout=timeout) as session:
                  results=await asyncio.gather(*[fetch_single_ticker(session,ticker) for ticker in tickers])
                  return dict(results)
          def walk_json(node:Any,found:dict|None=None)->dict:
              if found is None:
                  found=dict(EMPTY_RETURNS)
              if isinstance(node,dict):
                  normalized={normalize_key(k):v for k,v in node.items()}
                  for field,aliases in FIELD_ALIASES.items():
                      if found[field] is not None:
                          continue
                      for alias in aliases:
                          alias_key=normalize_key(alias)
                          for key,value in normalized.items():
                              if key==alias_key or key.endswith(alias_key) or alias_key.endswith(key):
                                  parsed=parse_float(value,limit=50.0 if field=="daily" else 500.0)
                                  if parsed is not None:
                                      found[field]=parsed
                                      break
                          if found[field] is not None:
                              break
                  for value in node.values():
                      walk_json(value,found)
                      if is_complete(found):
                          return found
              elif isinstance(node,list):
                  for item in node:
                      walk_json(item,found)
                      if is_complete(found):
                          return found
              return found
          async def extract_from_json_response(response:Response,fund_id:str)->dict:
              result=dict(EMPTY_RETURNS)
              try:
                  content_type=(await response.header_value("content-type") or "").lower()
                  url=response.url.lower()
                  if response.status!=200:
                      return result
                  if not ("json" in content_type or "api" in url or "fund" in url or "yield" in url or "return" in url):
                      return result
                  body=await response.text()
                  if fund_id not in body and not any(token in body.lower() for token in ("daily","ytd","mtd","יומית","מתחילת")):
                      return result
                  return sanitize_returns(walk_json(json.loads(body)))
              except Exception:
                  return result
          def extract_from_script_text(script_text:str)->dict:
              result=dict(EMPTY_RETURNS)
              text=normalize_text(script_text)
              patterns={
                  "daily":(
                      r'(?i)["\']?(?:dailyChangePercent|dailyChange|dailyReturn|dayChange|daily)["\']?\s*[:=]\s*["\']?([-+]?\d+(?:[.,]\d+)?)',
                      r'יומית.{0,120}?([-+]?\d+(?:[.,]\d+)?)\s*%'
                  ),
                  "mtd":(
                      r'(?i)["\']?(?:mtd|monthlyReturn|monthChange|fromMonthStart)["\']?\s*[:=]\s*["\']?([-+]?\d+(?:[.,]\d+)?)',
                      r'מתחילת\s*החודש.{0,120}?([-+]?\d+(?:[.,]\d+)?)\s*%'
                  ),
                  "ytd":(
                      r'(?i)["\']?(?:ytd|yearlyReturn|yearChange|fromYearStart)["\']?\s*[:=]\s*["\']?([-+]?\d+(?:[.,]\d+)?)',
                      r'מתחילת\s*השנה.{0,120}?([-+]?\d+(?:[.,]\d+)?)\s*%'
                  )
              }
              for field,field_patterns in patterns.items():
                  for pattern in field_patterns:
                      match=re.search(pattern,text,flags=re.DOTALL)
                      if match:
                          result[field]=parse_float(match.group(1),limit=50.0 if field=="daily" else 500.0)
                          if result[field] is not None:
                              break
              return result
          def extract_from_dom(html_text:str)->dict:
              result=dict(EMPTY_RETURNS)
              soup=BeautifulSoup(html_text,"html.parser")
              for tag in soup(["script","style","noscript"]):
                  tag.extract()
              heading=soup.find(lambda tag:tag.name in ("h1","h2","h3","h4","div","span") and "תשואות" in normalize_text(tag.get_text(" ",strip=True)))
              blocks=[]
              if heading:
                  blocks.append(heading.parent)
                  parent=heading.parent
                  for _ in range(4):
                      if parent and parent.parent:
                          parent=parent.parent
                          blocks.append(parent)
              blocks.append(soup)
              for block in blocks:
                  block_text=normalize_text(block.get_text(" ",strip=True))
                  if "יומית" not in block_text:
                      continue
                  for field,labels in LABEL_PATTERNS.items():
                      if result[field] is not None:
                          continue
                      for label_pattern in labels:
                          for pattern in (
                              rf"{label_pattern}\s*[:\-]?\s*([-+]?\d+(?:[.,]\d+)?)\s*%",
                              rf"{label_pattern}.{{0,80}}?([-+]?\d+(?:[.,]\d+)?)\s*%"
                          ):
                              match=re.search(pattern,block_text,flags=re.DOTALL)
                              if match:
                                  result[field]=parse_float(match.group(1),limit=50.0 if field=="daily" else 500.0)
                                  if result[field] is not None:
                                      break
                          if result[field] is not None:
                              break
                  if is_complete(result):
                      return result
              for field,labels in LABEL_PATTERNS.items():
                  if result[field] is not None:
                      continue
                  label_regex=re.compile("|".join(labels))
                  label_node=soup.find(string=lambda text:bool(text and label_regex.search(normalize_text(text))))
                  if not label_node:
                      continue
                  current=label_node.parent
                  candidates=[]
                  for _ in range(5):
                      if current is None:
                          break
                      candidates.append(normalize_text(current.get_text(" ",strip=True)))
                      sibling=current.find_next_sibling()
                      if sibling:
                          candidates.append(normalize_text(sibling.get_text(" ",strip=True)))
                      current=current.parent
                  for candidate in candidates:
                      values=re.findall(r"[-+]?\d+(?:[.,]\d+)?\s*%",candidate)
                      if values:
                          result[field]=parse_float(values[0],limit=50.0 if field=="daily" else 500.0)
                          if result[field] is not None:
                              break
              return result
          def load_cache()->dict:
              try:
                  if CACHE_FILE.exists():
                      payload=json.loads(CACHE_FILE.read_text(encoding="utf-8"))
                      funds=payload.get("funds",{})
                      return funds if isinstance(funds,dict) else {}
              except Exception as exc:
                  print(f"⚠️ Не удалось прочитать кэш фондов: {exc}")
              return {}
          def save_cache(results:dict)->None:
              try:
                  CACHE_FILE.parent.mkdir(parents=True,exist_ok=True)
                  payload={"updated_at_utc":datetime.now(timezone.utc).isoformat(),"funds":results}
                  CACHE_FILE.write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding="utf-8")
              except Exception as exc:
                  print(f"⚠️ Не удалось сохранить кэш фондов: {exc}")
          async def scrape_funder_fund_returns(page:Page,fund_id:str)->dict:
              url=f"https://www.funder.co.il/fund/{fund_id}"
              result=dict(EMPTY_RETURNS)
              tasks:set[asyncio.Task]=set()
              async def process_response(response:Response)->None:
                  nonlocal result
                  merge_returns(result,await extract_from_json_response(response,fund_id))
              def response_listener(response:Response)->None:
                  task=asyncio.create_task(process_response(response))
                  tasks.add(task)
                  task.add_done_callback(tasks.discard)
              page.on("response",response_listener)
              for attempt in range(1,3):
                  try:
                      response=await page.goto(url,wait_until="domcontentloaded",timeout=30000)
                      if response is None:
                          raise RuntimeError("No response")
                      if response.status>=400:
                          raise RuntimeError(f"HTTP {response.status}")
                      if fund_id not in page.url:
                          raise RuntimeError(page.url)
                      try:
                          await page.wait_for_function(
                              """() => {
                                  const t=document.body?.innerText||"";
                                  return t.includes("תשואות")&&t.includes("יומית")&&t.includes("מתחילת החודש")&&t.includes("מתחילת השנה");
                              }""",
                              timeout=12000
                          )
                      except PlaywrightTimeoutError:
                          pass
                      await page.wait_for_timeout(1800)
                      if tasks:
                          await asyncio.gather(*list(tasks),return_exceptions=True)
                      if is_complete(result):
                          return result
                      for script in await page.locator("script").all_text_contents():
                          merge_returns(result,extract_from_script_text(script))
                          if is_complete(result):
                              return result
                      merge_returns(result,extract_from_dom(await page.content()))
                      if is_complete(result):
                          return result
                  except Exception as exc:
                      print(f"⚠️ Funder {fund_id}, попытка {attempt}: {exc}")
                  if attempt<2:
                      await page.wait_for_timeout(1800)
                      try:
                          await page.reload(wait_until="domcontentloaded",timeout=30000)
                      except Exception:
                          pass
              return result
          async def fetch_all_israeli_funds(sectors_config:dict)->dict:
              cached=load_cache()
              results={}
              async with async_playwright() as playwright:
                  browser=await playwright.chromium.launch(
                      headless=True,
                      args=[
                          "--no-sandbox",
                          "--disable-setuid-sandbox",
                          "--disable-dev-shm-usage",
                          "--disable-blink-features=AutomationControlled"
                      ]
                  )
                  context=await browser.new_context(
                      user_agent=HEADERS["User-Agent"],
                      viewport={"width":1365,"height":900},
                      locale="he-IL",
                      timezone_id="Asia/Jerusalem",
                      extra_http_headers={
                          "Accept-Language":HEADERS["Accept-Language"],
                          "Cache-Control":"no-cache",
                          "Pragma":"no-cache"
                      }
                  )
                  await context.add_init_script(
                      """Object.defineProperty(navigator,'webdriver',{get:()=>undefined});"""
                  )
                  for key,config in sectors_config.items():
                      fund_id=config.get("fund_id","")
                      fallback=cached.get(key,{"daily":0.0,"mtd":0.0,"ytd":0.0})
                      if not fund_id:
                          results[key]=fallback
                          continue
                      page=await context.new_page()
                      try:
                          scraped=await scrape_funder_fund_returns(page,fund_id)
                          merged={
                              field:(
                                  scraped.get(field)
                                  if scraped.get(field) is not None
                                  else parse_float(
                                      fallback.get(field),
                                      limit=50.0 if field=="daily" else 500.0
                                  )
                              )
                              for field in ("daily","mtd","ytd")
                          }
                          results[key]={
                              "daily":merged["daily"] if merged["daily"] is not None else 0.0,
                              "mtd":merged["mtd"] if merged["mtd"] is not None else 0.0,
                              "ytd":merged["ytd"] if merged["ytd"] is not None else 0.0
                          }
                      finally:
                          await page.close()
                  await context.close()
                  await browser.close()
              save_cache(results)
              return results
          EOF
          cat << 'EOF' > modules/news.py
          import aiohttp,urllib.parse,html
          import yfinance as yf
          from modules.config import HTTP_TIMEOUT,HEADERS
          async def translate_to_russian(session:aiohttp.ClientSession,text:str)->str:
              if not text:
                  return text
              try:
                  url=f"https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ru&dt=t&q={urllib.parse.quote(text)}"
                  async with session.get(url,timeout=6) as resp:
                      if resp.status==200:
                          data=await resp.json()
                          translated="".join(segment[0] for segment in data[0] if segment[0])
                          return html.unescape(translated)
              except Exception:
                  pass
              return text
          async def fetch_sector_news(session:aiohttp.ClientSession,query_ticker:str)->list:
              url=f"https://query1.finance.yahoo.com/v1/finance/search?q={query_ticker}"
              try:
                  async with session.get(url,headers=HEADERS,timeout=HTTP_TIMEOUT) as response:
                      if response.status==200:
                          items=(await response.json()).get("news",[])
                          for item in items:
                              title=item.get("title","")
                              if title and len(title)>15:
                                  return [f"• {await translate_to_russian(session,title)}"]
              except Exception:
                  pass
              return ["• Торгуется в рамках текущей рыночной динамики."]
          def get_single_ipo_card(symbol:str,name:str,ipo_date:str,fallback_price:str)->str:
              try:
                  info=yf.Ticker(symbol).info
                  price=info.get("currentPrice") or info.get("regularMarketPrice") or info.get("open")
                  price_str=f"${price:.2f}" if price else fallback_price
                  recommendation=str(info.get("recommendationKey","N/A")).replace("_"," ").upper()
                  target=info.get("targetMeanPrice")
                  target_str=f"${target:.2f}" if target else "Н/Д"
                  rec_map={
                      "STRONG BUY":"🔥 Strong Buy",
                      "BUY":"🟢 Buy (Покупать)",
                      "HOLD":"🟡 Hold (Удерживать)",
                      "UNDERPERFORM":"🟠 Underperform",
                      "SELL":"🔴 Sell (Продавать)",
                      "N/A":"⚪️ Ожидает оценки"
                  }
                  rec=rec_map.get(recommendation,recommendation)
                  return (
                      f"📌 <b>{name}</b> (<code>{symbol}</code>)\n"
                      f"🗓 <b>Дата IPO:</b> {ipo_date}\n"
                      f"💵 <b>Курс / Диапазон:</b> {price_str}\n"
                      f"🎯 <b>Цель Wall St:</b> {target_str}\n"
                      f"🧠 <b>Консенсус:</b> {rec}\n"
                  )
              except Exception:
                  return (
                      f"📌 <b>{name}</b> (<code>{symbol}</code>)\n"
                      f"🗓 <b>Дата IPO:</b> {ipo_date}\n"
                      f"💵 <b>Курс:</b> {fallback_price}\n"
                      f"🧠 <b>Консенсус:</b> ⚪️ В процессе оценки\n"
                  )
          def fetch_ipo_full_analytics()->list:
