                'up_down': 'Месячный рост сменился откатом; ждать стабилизации.',
                'up_flat': 'После роста — пауза; нового импульса пока нет.',
                'down_up': 'Есть отскок; разворот требует устойчивого роста фонда.',
                'down_down': 'Снижение продолжается; усреднять пока рискованно.',
                'down_flat': 'Падение замедлилось; подтверждения разворота нет.',
            }[regime]
        
        
        def fresh_event(event, state):
            previous = [e for e in state['events'].values() if e.get('kind') == 'monthly'
                        and e.get('fund_id') == event['fund_id'] and e.get('sent_at')]
            if not previous:
                return True
            last = max(previous, key=lambda e: e['date'])
            if event['date'] <= last['date']:
                return False
            reset = state.get('monthly_resets', {}).get(event['fund_id'], '')
            return (reset > last['date'] or event['regime'] != last.get('regime')
                    or abs(event['monthly'] - last['monthly']) >= REPEAT_CHANGE_PP)
        
        
        async def fund_context(session, event, now):
