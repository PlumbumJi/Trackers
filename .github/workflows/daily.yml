        def normalize_title(title: str) -> str:
            value = re.sub(r"\s+", " ", html.unescape(str(title or ""))).strip()
            value = re.sub(r"\)(?=[A-Za-zА-Яа-яЁё])", ") ", value)
            return re.sub(r"\$\s+(?=\d)", "$", value)
        
        
        def news_age_limit() -> int:
            # Weekend editions may include Friday morning headlines; dates are shown.
            return 96 if datetime.now(ZoneInfo("America/New_York")).weekday() >= 5 else MAX_NEWS_AGE_HOURS
        
        
        def headline_matches(term: str, title: str) -> bool:
