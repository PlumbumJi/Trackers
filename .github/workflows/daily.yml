        \        result, _, sent = movers.combined_caption((with_news, described),\n            '27.10 · 08:20 · Израиль\\nСтоимость: 12 061.67 ₪\\nС покупки: -601.20 ₪\\n'\n            '⚠️ Meitav Sky: 58.3% портфеля\\n'+movers.BOT_NAME)\n        self.assertEqual(len(sent), 3)\n        self.assertEqual(result.count('Факторы:'), 3)\n        self.assertIn('компании блокчейна', result)\n        self.assertLessEqual(telegram_sender.message_length('\U0001F4BC МОЙ ПОРТФЕЛЬ\\n\\n'+result), 1024)\n        class Response:\n            status=200\n            async def __aenter__(self): return self\n            async def __aexit__(self,*args): pass\n            async def json(self): return {'ok':True}\n        session = MagicMock()\n        session.post.return_value = Response()\n        manager = AsyncMock()\n        manager.__aenter__.return_value = session\n        with patch.object(telegram_sender,'BOT_TOKEN','fake'), \\\n             patch.object(telegram_sender,'CHAT_ID','public'), \\\n    \
        \         patch.object(telegram_sender.aiohttp,'ClientSession',return_value=manager):\n            await telegram_sender.send_chart_photos([(b'png',caption), (b'chart','')],\n                chat_id='private', title='\U0001F4BC МОЙ ПОРТФЕЛЬ', parse_mode='HTML')\n        session.post.assert_called_once()\n        self.assertTrue(session.post.call_args.args[0].endswith('/sendMediaGroup'))\n        fields = session.post.call_args.kwargs['data']._fields\n        self.assertEqual(next(v for f,_,v in fields if f['name']=='chat_id'), 'private')\n        media = json.loads(next(v for f,_,v in fields if f['name']=='media'))\n        self.assertEqual(media[0]['caption'], '\U0001F4BC МОЙ ПОРТФЕЛЬ\\n\\n'+caption)\n        self.assertNotIn('caption',media[1])\n\n    async def test_listing_recovers_from_timeout_and_server_error(self):\n        import asyncio\n        body = ''.join(listing('0.1', str(5200000+i)) for i in range(101))\n        class Response:\n            def __init__(self, status):\
        \ self.status = status\n            async def __aenter__(self): return self\n            async def __aexit__(self, *args): pass\n            async def text(self, **kwargs): return body\n        session = MagicMock()\n        session.get.side_effect = [asyncio.TimeoutError(), Response(503), Response(200)]\n        with patch.object(movers.asyncio, 'sleep', new=AsyncMock()):\n            rows = await movers.fetch_listing(session, 100)\n        self.assertEqual(len(rows), 101)\n        self.assertEqual(session.get.call_count, 3)\n        session.get.side_effect = asyncio.TimeoutError()\n        session.get.reset_mock()\n        with patch.object(movers.asyncio, 'sleep', new=AsyncMock()):\n            with self.assertRaises(movers.DiscoveryUnavailable) as failure:\n                await movers.fetch_listing(session, 100)\n        self.assertEqual(failure.exception.code, 'list_timeout')\n        self.assertEqual(session.get.call_count, 3)\n\n    async def test_listing_denial_and_incomplete_results_never_count_as_zero(self):\n\
