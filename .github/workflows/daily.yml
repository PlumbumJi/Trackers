        class TechnicalTests(unittest.TestCase):
            @staticmethod
            def history(count=260):
                from datetime import datetime, timezone
                start = int(datetime(2025, 1, 1, tzinfo=timezone.utc).timestamp())
                rows = []
                for index in range(count):
                    close = 100.0 + index * 0.08 + 2.0 * __import__('math').sin(index / 7)
                    rows.append({
                        'timestamp': start + index * 86400,
                        'open': close - 0.3,
                        'high': close + 1.0,
                        'low': close - 1.0,
                        'close': close,
                        'volume': 1_000_000 + index * 100,
                    })
                return rows

            def test_hybrid_indicators_are_calculated(self):
                result = market.analyze_year_history(self.history(), 'TEST')
                for key in ('ema20', 'ema50', 'ema200', 'rsi14', 'atr14', 'bb_lower', 'bb_upper'):
                    self.assertIsNotNone(result[key])
                self.assertEqual(result['backtest_scope'], 'proxy_only')

            def test_backtest_outcomes_are_complete(self):
                history = self.history(400)
                result = market.backtest_hybrid_model(history, market.calculate_technical_series(history))
                self.assertEqual(
                    result['backtest_total'],
                    result['backtest_wins'] + result['backtest_losses'] + result['backtest_timeouts'],
                )

            def test_session_window_uses_new_york_time(self):
                from datetime import datetime, timezone
                inside = market.us_session_state(datetime(2026, 9, 14, 13, 15, tzinfo=timezone.utc))
                outside = market.us_session_state(datetime(2026, 9, 14, 14, 0, tzinfo=timezone.utc))
                self.assertTrue(inside['radar_window'])
                self.assertFalse(outside['radar_window'])
                self.assertEqual(outside['state'], 'regular')


        class RadarTests(unittest.TestCase):
            @staticmethod
            def fund(daily=1.0, below=-10.0):
                current = 90.0 if below < 0 else 104.0
                average = current / (1.0 + below / 100.0)
                return {
                    "daily": daily,
                    "price_stats": {
                        "current_price": current, "average_30": average, "average_60": 102.0,
                        "minimum_60": 88.0, "below_average_30": below,
                        "to_average_30": (average / current - 1.0) * 100.0,
                        "at_minimum_60": False, "price_date": "2026-09-05",
                        "backtest_wins": 2, "backtest_total": 3,
                    },
                }

            @staticmethod
            def technical(trend='up', setup='pullback', change5=1.0, rr=2.0, total=12):
                return {
                    'proxy_ticker': 'TEST', 'proxy_price': 100.0,
                    'trend_key': trend, 'setup_type': setup,
                    'rsi14': 39.0, 'atr14': 2.0, 'atr_percent': 2.0,
                    'risk_reward': rr, 'target': 106.0, 'stop': 97.0,
                    'change_5d': change5, 'change_20d': 3.0, 'volume_ratio': 1.1,
                    'backtest_wins': 7, 'backtest_losses': 3,
                    'backtest_timeouts': 2, 'backtest_total': total,
                    'backtest_horizon': 10,
                }

            def test_missing_data_not_wait_signal(self):
