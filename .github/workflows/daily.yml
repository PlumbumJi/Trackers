name: Automated Market Analytics & IPO Digest
on:
  schedule:
    - cron: '15 20 * * *'
    - cron: '0 19 * * 6'
  workflow_dispatch:
jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: .cache/israeli_funds.json
          key: israeli-funds-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            israeli-funds-${{ runner.os }}-
      - name: Deploy
        run: |
          mkdir -p modules .cache
          touch modules/__init__.py
          cat << 'EOF' > requirements.txt
          aiohttp==3.11.11
          beautifulsoup4==4.12.3
          yfinance==0.2.40
          EOF
          cat << 'EOF' > modules/config.py
