        """Direct, dated fund mentions. Editorial coverage is not a popularity ranking."""
        import asyncio
        import re
        import xml.etree.ElementTree as ET
        from datetime import datetime
        from email.utils import parsedate_to_datetime, format_datetime
        from html import escape, unescape
        from urllib.parse import urlparse, urljoin
        
        import aiohttp
        
        from modules.market import _FundHTML, _clean_text, is_access_challenge
        from modules.news import shorten_title, translate_to_russian
        
        FEED = 'https://www.funder.co.il/rssNews.aspx'
        CATEGORY = 'https://funder.co.il/'
