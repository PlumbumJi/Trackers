                          translated = "".join(
                              str(segment[0]) for segment in data[0]
                              if isinstance(segment, list) and segment and segment[0]
                          ).strip()
                          translated = html.unescape(translated)
                          if translated and has_cyrillic(translated):
                              return translated
                      else:
                          print(f"⚠️ Google Translate: HTTP {response.status}")
              except Exception as error:
                  print(f"⚠️ Google translation: {error}")

