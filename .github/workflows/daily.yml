        \"\"\nfrom datetime import date\nfrom html import escape\nfrom io import BytesIO\nimport textwrap\n\nimport matplotlib\nmatplotlib.use('Agg')\nimport matplotlib.pyplot as plt\nfrom matplotlib.patches import FancyBboxPatch\n\nfrom modules.config import BOT_NAME\nfrom modules.portfolio import money\n\nBG, PANEL, INK, MUTED = '#0B1220', '#152135', '#F0F5FC', '#A7B6CC'\nUP, DOWN, AMBER = '#53D9AC', '#FF8A98', '#F2C879'\n\n\ndef result_color(number):\n    return UP if number > 0 else DOWN if number < 0 else MUTED\n\n\ndef render_portfolio_card(data):\n    width = 1200\n    rows_count = (len(data.get('rows', [])) + 1) // 2\n    card_top, card_h, card_gap = 340, 326, 20\n    footer_top = card_top + rows_count * (card_h + card_gap) + 36\n    height = max(1640, footer_top + 235)\n    fig = plt.figure(figsize=(12, height / 100), dpi=130, facecolor=BG)\n    ax = fig.add_axes([0, 0, 1, 1])\n    ax.set(xlim=(0, width), ylim=(height, 0))\n    ax.axis('off')\n    def text(x, y, value, size=18,\
        \ color=INK, weight='normal', ha='left'):\n        ax.text(x, y, value, fontsize=size, color=color, weight=weight,\n                ha=ha, va='top', family='DejaVu Sans', linespacing=1.45)\n    def panel(x, y, w, h, color=PANEL):\n        ax.add_patch(FancyBboxPatch((x, y), w, h, boxstyle='round,pad=0,rounding_size=18',\n                                   linewidth=0, facecolor=color))\n    try:\n        text(52, 34, 'МОЙ ПОРТФЕЛЬ', 20, MUTED, 'bold')\n        text(1148, 35, data['now'].strftime('%d.%m.%Y · %H:%M Израиль'), 15, MUTED, ha='right')\n        text(52, 88, f'{money(data[\"total\"])} ₪', 49, INK, 'bold')\n        total_items = len(data.get('rows', [])) or 1\n        portfolio_label = '7 фондов + 2 акции' if total_items == 9 else f'{total_items} позиций'\n        if data['valued'] < total_items:\n            text(54, 164, f'Частичная стоимость · {data[\"valued\"]}/{total_items} позиций', 16, AMBER)\n        else:\n            text(54, 164, f'Текущая стоимость · {portfolio_label}',\
        \ 16, MUTED)\n        panel(52, 209, 1096, 107)\n        text(76, 227, 'С ПОКУПКИ' + ('' if data['cost_count'] == total_items else f' · {data[\"cost_count\"]}/{total_items}'), 13, MUTED)\n        if data['pnl_pct'] is not None:\n            text(76, 256, f'{money(data[\"pnl\"], True)} ₪  /  {money(data[\"pnl_pct\"], True)}%',\n                 23, result_color(data['pnl']), 'bold')\n        text(1122, 227, 'ВЛОЖЕНО' + ('' if data['cost_count'] == 6 else ' · ЧАСТИЧНО'), 13, MUTED, ha='right')\n        text(1122, 256, f'{money(data[\"cost\"])} ₪', 23, INK, ha='right')\n\n        for i, row in enumerate(data['rows']):\n            x, y = 52 + (i % 2) * 560, card_top + (i // 2) * (card_h + card_gap)\n            panel(x, y, 536, 326)\n            text(x + 22, y + 20, row['name'], 21, INK, 'bold')\n            text(x + 22, y + 54, row['id'], 13, MUTED)\n            if row['value'] is None:\n                text(x + 22, y + 105, 'Цена недоступна', 24, AMBER)\n                text(x + 22,\
        \ y + 150, 'В итог не включён', 16, MUTED)\n                continue\n            text(x + 22, y + 91, f'{money(row[\"value\"])} ₪', 28, INK, 'bold')\n            unit = 'акций' if row.get('asset_type') == 'stock' else 'паёв'\n            price_unit = '₪' if row.get('asset_type') == 'stock' else 'аг.'\n            text(x + 22, y + 135, f'{row[\"quantity\"]} {unit} × {money(row[\"price\"])} {price_unit}', 15, MUTED)\n            if 'pnl' in row:\n                text(x + 22, y + 169, 'С покупки', 14, MUTED)\n                text(x + 510, y + 167, f'{money(row[\"pnl\"], True)} ₪  ({money(row[\"pnl_pct\"], True)}%)',\n                     17, result_color(row['pnl']), ha='right')\n            else:\n                text(x + 22, y + 169, 'С покупки: нужна база приобретения', 15, AMBER)\n            movement = row.get('movement')\n            if movement:\n                start, end = (date.fromisoformat(movement[k]).strftime('%d.%m') for k in ('start', 'end'))\n                text(x\
        \ + 22, y + 202, f'{start} → {end}', 13, MUTED)\n                text(x + 510, y + 201,\n                     f'{money(movement[\"delta\"], True)} ₪  ({money(movement[\"delta\"] / movement[\"base\"] * 100, True)}%)',\n                     17, result_color(movement['delta']), ha='right')\n            else:\n                label = date.fromisoformat(row['date']).strftime('%d.%m') if row.get('date') else 'дата не указана'\n                text(x + 22, y + 201, f'Цена: {label} · день не подтверждён', 14, AMBER)\n        # Dates stay visible per publication; stale returns are never today's returns.\n        y = footer_top\n        notes = [note.removeprefix('⚠️ ') for note in data['notes'] if note.startswith('⚠️')]\n        if notes:\n            panel(52, y, 1096, 62, '#263047')\n            text(76, y + 18, notes[0], 17, AMBER)\n            y += 88\n        text(52, height - 52, 'BIZPORTAL / FUNDER / YAHOO', 12, MUTED, 'bold')\n        text(1148, height - 52, BOT_NAME, 13, MUTED, ha='right')\n\
        \        stream = BytesIO()\n        fig.savefig(stream, format='png', facecolor=BG, dpi=130)\n        return stream.getvalue()\n    finally:\n        plt.close(fig)\n\n\ndef portfolio_caption(data):\n    from modules.portfolio import signed_result\n    total_items = len(data.get('rows', [])) or 1\n    lines = [data['now'].strftime('%d.%m · %H:%M · Израиль'),\n             f'<b>{money(data[\"total\"])} ₪</b>' + ('' if data['valued'] == total_items else f' · {data[\"valued\"]}/{total_items} позиций')]\n    if data['pnl_pct'] is not None:\n        lines.append('С покупки: ' + signed_result(data['pnl'], data['cost'])\n                     + ('' if data['cost_count'] == total_items else f' · {data[\"cost_count\"]}/{total_items}'))\n    if data['daily']:\n        day = data['daily']\n        lines.append(f'День {date.fromisoformat(day[\"start\"]):%d.%m}→{date.fromisoformat(day[\"end\"]):%d.%m}: '\n                     + signed_result(day['delta'], day['base']))\n    lines.extend(note\
