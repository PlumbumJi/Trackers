                    + item['line'])
        
        
        def canonical(text):
            text = unescape(str(text or '')).replace('quot;', '"')
            text = _clean_text(_FundHTML(text).root.text())
            text = re.sub(r'\([0-6][0-6A-Fa-fא-ו]\)', ' ', text)
            text = text.translate(str.maketrans('', '', '\"\'`׳״‘’“”'))
            return re.sub(r'\s+', ' ', text).strip().casefold()
        
        
        def evidence_excerpt(text, start, end):
            # Preserve a source sentence around the actual fund mention, not an unrelated headline.
            boundaries = list(re.finditer(r'[.!?]\s+', text))
            left = max((m.end() for m in boundaries if m.end() <= start), default=0)
            right = min((m.start()+1 for m in boundaries if m.start() >= end), default=len(text))
            if right-left > 350:
                left = max(left,start-80)
                left = text.find(' ',left)+1 if left else 0
                right = min(right,end+220)
            return shorten_title(text[left:right],300)
        
        
        def parse_mentions(body, listing, now):
            root = ET.fromstring(body)
            if root.tag != 'rss' or root.find('channel') is None:
                raise ValueError('not a news feed')
            names = {}
            for row in listing:
                key = canonical(row['name'])
                if len(key) >= 8:
                    names.setdefault(key, []).append(row)
            names = {key: rows[0] for key, rows in names.items() if len(rows) == 1}
            found, seen_urls = {}, set()
            for item in root.findall('./channel/item'):
                try:
                    published = parsedate_to_datetime(item.findtext('pubDate') or '')
                    if published.tzinfo is None or not 0 <= (now - published).total_seconds() <= 86400:
                        continue
                except (ValueError, TypeError, OverflowError):
                    continue
                url = item.findtext('link') or ''
                parsed = urlparse(url)
                allowed = ((parsed.hostname in {'funder.co.il', 'www.funder.co.il'}
                            and re.fullmatch(r'/article/\d+/?', parsed.path))
                           or (parsed.hostname == 'www.bizportal.co.il'
                               and re.fullmatch(r'/mutualfunds/news/article/\d+/?', parsed.path)))
                if parsed.scheme != 'https' or not allowed:
                    continue
                article_key = parsed.path.rstrip('/')
                if article_key in seen_urls:
                    continue
                seen_urls.add(article_key)
                title = _clean_text(unescape(item.findtext('title') or '').replace('quot;', '"'))
                description = item.findtext('description') or ''
                text = canonical(title + '\n' + description)
                if any(label in text for label in ('תוכן שיווקי', 'תוכן ממומן', 'כתבה פרסומית')):
                    continue
                # Use longest literal names first: a short name must not identify a longer fund.
                matches = []
                for name, row in names.items():
                    for match in re.finditer(r'(?<!\w)' + re.escape(name) + r'(?!\w)', text):
                        matches.append((match.start(), match.end(), row))
                matches.sort(key=lambda m: (-(m[1] - m[0]), m[0]))
                occupied, identified, evidence = [], {}, {}
                for start, end, row in matches:
                    if any(start < b and end > a for a, b in occupied):
                        continue
                    occupied.append((start, end))
                    identified[row['fund_id']] = row
                    evidence.setdefault(row['fund_id'],evidence_excerpt(text,start,end))
                # Explicit labelled security numbers are safe even when the name has changed.
                id_matches = list(re.finditer(r'(?:מספר(?:\s+(?:ה?קרן|נייר))?|מס[׳\x27]?\s*קרן)\s*[:：]?\s*(\d{6,8})\b', text))
                ids = {m.group(1) for m in id_matches}
                for m in id_matches:
                    evidence.setdefault(m.group(1),evidence_excerpt(text,m.start(),m.end()))
                identified.update((r['fund_id'], r) for r in listing if r['fund_id'] in ids)
                for fid, row in identified.items():
                    headline_match = canonical(row['name']) in canonical(title)
                    excerpt = evidence.get(fid,title)
                    # RSS descriptions may include quote widgets. A price-table mention alone
                    # is not editorial discussion of a fund.
                    if not headline_match and fid not in ids:
                        prose = canonical(excerpt).replace(canonical(row['name']),'')
                        if ('לרשימה' in prose or 'לרשימת' in prose or not re.search(
                                r'מחזיק|החזיק|משקיעה|השקיעה|מנוהלת|מנהל השקעות|מנהל ההשקעות|'
                                r'דמי ניהול|הניבה|השיגה|רשמה|גייסה|פדיונות|חשיפה|מדיניות|תשואת הקרן', prose)):
                            continue
                    mention = {'title': title, 'url': url, 'published': published.isoformat(),
                               'news_date': published.astimezone(now.tzinfo).strftime('%d.%m'),
                               'headline_match':headline_match, 'evidence':excerpt}
                    entry = found.setdefault(fid, {**row, 'mentions': []})
                    entry['mentions'].append(mention)
            ranked = []
            for entry in found.values():
                entry['mentions'].sort(key=lambda m: (m['headline_match'], m['published']), reverse=True)
                entry['news'] = entry['mentions'][0]
                ranked.append(entry)
            ranked.sort(key=lambda e: (e['news']['headline_match'], len(e['mentions']),
                                      e['news']['published']), reverse=True)
            # One story must not occupy all three slots with the same headline.
            unique, used_stories = [], set()
            for entry in ranked:
                path = urlparse(entry['news']['url']).path
                if path not in used_stories:
                    unique.append(entry)
                    used_stories.add(path)
            seen_evidence = {(e['news']['url'],e['news']['evidence']) for e in unique}
            for entry in ranked:
                key = (entry['news']['url'],entry['news']['evidence'])
                if key not in seen_evidence:
                    unique.append(entry)
                    seen_evidence.add(key)
            return unique[:MAX_CANDIDATES]
        
        
        async def _fetch_funder_mentions(session, listing, now):
            limiter, blocked = asyncio.Semaphore(3), asyncio.Event()
            async def get(url):
                async with limiter:
                    if blocked.is_set():
                        return ''
                    try:
                        async with session.get(url, timeout=aiohttp.ClientTimeout(total=15)) as response:
                            if response.status in {401,403,429}:
                                blocked.set()
                                return ''
                            if response.status != 200:
                                return ''
                            body = await response.text()
                        if is_access_challenge(body):
                            blocked.set()
                            return ''
                        return body
                    except (aiohttp.ClientError, asyncio.TimeoutError):
                        return ''
            try:
                body, category = await asyncio.gather(get(FEED),get(CATEGORY))
                root = ET.fromstring(body) if body else ET.fromstring('<rss><channel/></rss>')
                channel = root.find('channel')
                if root.tag != 'rss' or channel is None:
                    return {'status':'unavailable','items':[]}
                seen = {urlparse(item.findtext('link') or '').path for item in channel.findall('item')}
                urls = []
                category_root = _FundHTML(category).root
                section = next((node for node in category_root.walk('div')
                                if 'newarticleSec2' in node.attrs.get('class','').split()
                                and any(urlparse(a.attrs.get('href','')).path.strip('/') == 'articleList/f'
                                        for a in node.walk('a'))), None)
                for link in (section.walk('a') if section else []):
                    url = urljoin(CATEGORY, link.attrs.get('href',''))
                    parsed = urlparse(url)
                    if (parsed.scheme == 'https' and parsed.hostname in {'funder.co.il','www.funder.co.il'}
                            and re.fullmatch(r'/article/\d+',parsed.path) and parsed.path not in seen):
                        urls.append(url)
                        seen.add(parsed.path)
                pages = await asyncio.gather(*(get(url) for url in urls[:10]))
                appended = 0
                for url, page in zip(urls, pages):
                    item = article_item(page, url)
                    if item is not None:
                        channel.append(item)
                        appended += 1
                status = 'ok' if body and section and appended == len(pages) else 'partial'
                if not body and not appended:
                    status = 'unavailable'
                return {'status':status,'items':parse_mentions(ET.tostring(root,encoding='unicode'),listing,now)}
            except (aiohttp.ClientError, asyncio.TimeoutError, ET.ParseError, ValueError):
                return {'status': 'unavailable', 'items': []}
        
        
        async def fetch_mentions(session, listing, now, *, skip_funder=False):
            result = ({'status':'unavailable','items':[]} if skip_funder else
                      await _fetch_funder_mentions(session, listing, now))
            if result['status'] == 'ok' and len(result['items']) >= 3:
                return result
            limiter, blocked = asyncio.Semaphore(2), asyncio.Event()
            async def get(url):
