    - name: Install Python Dependencies
      run: |-
        set -euo pipefail
        pip install -r requirements.txt
    - name: Install Chromium Fallback
      if: steps.report.outputs.mode == 'market'
      run: playwright install --with-deps chromium
    - name: Validate Generated Python
      run: python -m compileall -q modules main.py
    - name: Run Regression Tests
      run: python -m unittest discover -s tests -v
    - name: Run Analytics Engine
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        PORTFOLIO_CHAT_ID: ${{ secrets.PORTFOLIO_CHAT_ID }}
        RUN_MODE: ${{ steps.report.outputs.mode }}
        PYTHONUNBUFFERED: '1'
      run: python main.py
    - name: Save Portfolio History
      if: always() && steps.report.outputs.mode == 'portfolio' && hashFiles('portfolio_snapshots.json') != ''
      uses: actions/cache/save@v5
      with:
        path: |
          portfolio_snapshots.json
          portfolio_signal_journal.json
        key: portfolio-v3-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Save Sector Analysis
      if: success() && steps.report.outputs.mode == 'market' && hashFiles('portfolio_candidates.json') != ''
      uses: actions/cache/save@v5
      with:
        path: portfolio_candidates.json
        key: sector-analysis-v3-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Save Fund Discovery Journal
      if: always() && steps.report.outputs.mode == 'portfolio' && hashFiles('fund_movers_state.json') != ''
      uses: actions/cache/save@v5
      with:
        path: fund_movers_state.json
        key: fund-discovery-v1-${{ github.run_id }}-${{ github.run_attempt }}
