        \n    async def test_photo_payload_and_window_guard(self):\n        class PhotoResponse:\n            status = 200\n            async def __aenter__(self): return self\n            async def __aexit__(self, *args): return False\n            async def json(self): return {'ok': True}\n        from unittest.mock import MagicMock\n        session = MagicMock()\n        session.post.return_value = PhotoResponse()\n        manager = AsyncMock()\n        manager.__aenter__.return_value = session\n        with patch.object(telegram_sender, 'BOT_TOKEN', 'test-token'), \\\n             patch.object(telegram_sender, 'CHAT_ID', '123'), \\\n             patch.object(telegram_sender.aiohttp, 'ClientSession', return_value=manager):\n            await telegram_sender.send_chart_photos([(b'png', 'Фонд')], lambda: False)\n            session.post.assert_not_called()\n            await telegram_sender.send_chart_photos([(b'png', 'Фонд')], lambda: True)\n            session.post.assert_called_once()\n\
        \            self.assertTrue(session.post.call_args.args[0].endswith('/sendPhoto'))\n            self.assertTrue(session.post.call_args.kwargs['data'].is_multipart)\n            session.post.reset_mock()\n            await telegram_sender.send_chart_photos([(b'png', f'Фонд {i}') for i in range(3)])\n            session.post.assert_called_once()\n            self.assertTrue(session.post.call_args.args[0].endswith('/sendMediaGroup'))\n            fields = session.post.call_args.kwargs['data']._fields\n            media = telegram_sender.json.loads(next(value for field, _, value in fields if field['name'] == 'media'))\n            self.assertEqual(len(media), 3)\n            self.assertEqual([item['media'] for item in media], ['attach://chart0', 'attach://chart1', 'attach://chart2'])\n            self.assertEqual(sum('caption' in item for item in media), 1)\n            for i in range(3):\n                self.assertIn(f'Фонд {i}', media[0]['caption'])\n\n\nclass NewsSelectionTests(unittest.IsolatedAsyncioTestCase):\n\
        \    async def test_sector_search_date_filter_and_translation_failure(self):\n        from datetime import datetime, timezone\n        now = int(datetime.now(timezone.utc).timestamp())\n        relevant = {'title': 'Solar manufacturers expand renewable power capacity',\n                    'providerPublishTime': now - 3600, 'link': 'https://example.com/solar'}\n        stale = dict(relevant, title='Solar manufacturers announced a new factory last year',\n                     providerPublishTime=now - 10 * 86400)\n        async def search(session, query):\n            return [relevant, stale] if query == news.SECTOR_QUERIES['Clean'] else []\n        with patch.object(news, 'fetch_yahoo_news', side_effect=search), \\\n             patch.object(news, 'translate_to_russian', new=AsyncMock(return_value='')):\n            result = await news.fetch_sector_news(None, 'FSLR', [], 'Clean')\n        self.assertEqual(len(result), 1)\n        self.assertEqual(result[0]['published'], relevant['providerPublishTime'])\n\
        \        self.assertTrue(result[0]['original'])\n        self.assertEqual(result[0]['url'], relevant['link'])\n        self.assertFalse(news.headline_matches('ai', 'retail sales rise'))\n        self.assertEqual(news.normalize_title('(TSLA)находится'), '(TSLA) находится')\n\n\nclass NewsFormattingTests(unittest.TestCase):\n    def test_shortening_keeps_whole_words(self):\n        result = news.shorten_title('Очень длинный заголовок новости про рынок и компании', 32)\n        self.assertTrue(result.endswith('...'))\n        self.assertNotIn('комп...', result)\n\n    def test_currency_spacing_is_cleaned(self):\n        self.assertEqual(news.normalize_title('Contract worth $ 729 million'), 'Contract worth $729 million')\n\n    def test_clean_energy_rejects_macro_roundup(self):\n        item = {\n            'title': \"Kevin Warsh hawkishness distracts markets as inflation rises\",\n            'relatedTickers': ['CEG'],\n        }\n        self.assertLess(news.news_score(item, ['CEG'],\
        \ 'Clean'), 35)\n\n    def test_clean_energy_accepts_sector_company(self):\n        item = {\n            'title': \"Constellation Energy expands clean power capacity\",\n            'relatedTickers': ['CEG'],\n        }\n        self.assertGreaterEqual(news.news_score(item, ['CEG'], 'Clean'), 35)\n\n    def test_related_ticker_without_sector_context_is_rejected(self):\n        item = {\n            'title': 'Markets rise as investors assess the economic outlook',\n            'relatedTickers': ['TSLA'],\n        }\n        self.assertLess(news.news_score(item, ['TSLA'], 'EV'), 35)\n\n    def test_industry_company_headline_is_accepted(self):\n        item = {\n            'title': 'CrowdStrike expands cloud security platform',\n            'relatedTickers': ['CRWD'],\n        }\n        self.assertGreaterEqual(news.news_score(item, ['CRWD'], 'Cyber'), 35)\n\n\nclass PortfolioInsightsTests(unittest.TestCase):\n    def test_falling_and_stale_funds_cannot_trigger_buy(self):\n      \
        \  from modules.portfolio_insights import assess\n        from datetime import datetime, timedelta\n        now = datetime(2026, 9, 29)\n        history = [{'date': str((now - timedelta(days=89-i)).date()), 'price': 200-i}\n                   for i in range(90)]\n        result = assess(history, now, 111, '2026-09-29', {'confirmed': True})\n        self.assertEqual(result['status'], 'reduce')\n        self.assertEqual(assess(history, now + timedelta(days=5), 111, '2026-09-29')['status'], 'missing')\n        self.assertEqual(assess(history, now, 115, '2026-09-29')['status'], 'missing')\n\n    def test_drawdown_is_portfolio_peak_and_resets_after_quantity_change(self):\n        from modules.portfolio_insights import risk_summary\n        from datetime import datetime\n        old = {str(i): {'quantity': '10', 'price': '100'} for i in range(7)}\n        current = {str(i): {'quantity': '10', 'price': '89'} for i in range(7)}\n        result = risk_summary(current, {'2026-09-28': old},\
