                plan = trade_plan('fund', analysis, 12_000, 500, risk)
                self.assertTrue(plan['allowed'])
                self.assertAlmostEqual(plan['amount'], 1200)
                self.assertIn('отмена ниже 95.00', plan['line'])
                risk['breached'] = True
                self.assertFalse(trade_plan('fund', analysis, 12_000, 500, risk)['allowed'])
                risk.update(breached=False, active_signal_risk=.02)
                self.assertIn('общий бюджет риска', trade_plan('fund', analysis, 12_000, 500, risk)['line'])

            def test_signal_journal_is_forward_only_and_not_duplicated(self):
                from modules.portfolio_insights import update_journal, journal_summary
                from datetime import datetime
                analysis = {'status': 'add', 'price': 100}
                plan = {'allowed': True, 'amount': 1000, 'cancel_price': 95}
                current = {'fund': {'price': '100', 'date': '2026-09-29'}}
                journal = update_journal({'signals': []}, {'fund': analysis}, {'fund': plan}, current,
                                         datetime(2026, 9, 29))
                journal = update_journal(journal, {'fund': analysis}, {'fund': plan}, current,
                                         datetime(2026, 9, 29))
                self.assertEqual(len(journal['signals']), 1)
                current['fund']['price'] = '94'
                journal = update_journal(journal, {'fund': {'status': 'wait'}}, {'fund': {}}, current,
                                         datetime(2026, 10, 1))
                self.assertEqual(journal['signals'][0]['state'], 'closed')
                self.assertEqual(journal['signals'][0]['close_reason'], 'отмена сценария')
                self.assertIn('0/1 прибыльных', journal_summary(journal))


        class PortfolioRegressionTests(unittest.IsolatedAsyncioTestCase):
            def test_redemption_price_identity_and_missing_date(self):
                from modules.portfolio import parse_portfolio_quote
                html = page('5103692').replace(
                    '<div id="paper_change">',
                    '<div id="paper_change"><div class="top-area-cube">'
                    '<div class="label">מחיר פדיון</div><div class="num">1,017.6</div></div>'
                    '<div class="top-area-cube"><div class="label">מחיר קנייה</div>'
                    '<div class="num">9999</div></div>')
                quote = parse_portfolio_quote(html, '5103692')
                self.assertEqual(quote['price'], '1017.6')
                self.assertIsNone(quote['date'])
                self.assertEqual(parse_portfolio_quote(html, '5132014'), {})

            def test_missing_history_uses_quote_and_next_morning_comparison(self):
                from modules.portfolio import build_report, HOLDINGS, TZ
                from datetime import datetime
                now = datetime(2026, 9, 28, 8, 20, tzinfo=TZ)
                quotes = {h[0]: {'price': p, 'date': None} for h, p in zip(
                    HOLDINGS, ['1017.6', '120.86', '383.27', '171.75', '207.5', '192.45'])}
                text, saved, _ = build_report({}, {}, now, quotes)
                self.assertIn('12 180.35', text)
                self.assertIn('дата цены не указана', text)
                quotes['5103692']['price'] = '1018.6'
                text, _, _ = build_report({}, {'2026-09-27': saved}, now, quotes)
                self.assertIn('+6.74 ₪', text)
                self.assertNotIn('Новой даты цены нет', text)
                text, saved, _ = build_report({}, {}, now)
                self.assertEqual(saved, {})
                self.assertNotIn('0.00', text)
                self.assertNotIn('5103692', text)

            async def test_outage_keeps_snapshot_without_raising(self):
                from modules import portfolio
                from pathlib import Path
                import tempfile
                with tempfile.TemporaryDirectory() as directory:
                    state = Path(directory) / 'state.json'
                    state.write_text('{}')
                    with patch.object(portfolio, 'STATE', state), \
                         patch.dict(portfolio.os.environ, {'PORTFOLIO_CHAT_ID': 'private', 'DRY_RUN': 'false'}), \
                         patch.object(portfolio, 'fetch_portfolio_fund', new=AsyncMock(return_value=([], {}))), \
                         patch.object(portfolio, 'send_to_telegram', new=AsyncMock()) as sender:
                        await portfolio.run_portfolio()
                        sender.assert_awaited_once()
                        self.assertEqual(sender.call_args.kwargs['chat_id'], 'private')
                        self.assertEqual(state.read_text(), '{}')


