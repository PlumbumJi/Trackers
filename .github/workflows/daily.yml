          def _format_ipo_item(event: dict, date_label: str) -> list[str]:
              company = escape_html(event.get("company_name", "Unknown company"))
              ticker = escape_html(event.get("ticker") or "N/A")
              exchange = escape_html(event.get("exchange") or "N/A")
              status = escape_html(event.get("status") or "N/A")
              source = escape_html(event.get("source") or "N/A")
          
              lines = [
                  f"• <b>{company}</b> (<code>{ticker}</code>)",
                  f"  🏛 {exchange} · {date_label}: <b>{escape_html(event.get('planned_ipo_date') or event.get('first_trading_date') or 'N/A')}</b>",
              ]
          
              if event.get("previous_ipo_date"):
                  lines.append(f"  ↳ previous date: {escape_html(event['previous_ipo_date'])}")
          
              price_bits = []
              if event.get("price_range"):
                  price_bits.append(f"range {escape_html(event['price_range'])}")
              if event.get("offer_price"):
                  price_bits.append(f"offer {escape_html(event['offer_price'])}")
              if price_bits:
                  lines.append(f"  💵 Price: {', '.join(price_bits)}")
          
              shares = _format_int(event.get("shares_offered"))
              if shares:
                  lines.append(f"  📦 Shares offered: {shares}")
          
              if event.get("change_type"):
                  changed_fields = ", ".join(event.get("changed_fields", []))
                  changed_suffix = f" ({escape_html(changed_fields)})" if changed_fields else ""
                  lines.append(f"  🔄 {escape_html(event['change_type'])}{changed_suffix}")
          
              lines.append(f"  📌 Status: {status}")
              lines.append(f"  🔗 Source: {source}")
              return lines
          
          def build_ipo_radar_message(radar: dict) -> str:
              tz_il = timezone(timedelta(hours=3))
              now_str = datetime.now(tz_il).strftime("%d.%m.%Y")
          
              date_updates = radar.get("date_updates", [])
              new_listings = radar.get("new_listings", [])
          
              lines = [
                  "🔔 <b>Weekly IPO Radar</b>",
                  f"📅 {now_str} 🇮🇱",
                  f"🗓 Window: {escape_html(radar.get('window_start', 'N/A'))} → {escape_html(radar.get('window_end', 'N/A'))}\n",
              ]
          
              if not date_updates and not new_listings:
                  lines.append("No notable IPO updates this week")
                  if not radar.get("previous_snapshot_found"):
                      lines.append("Baseline snapshot created; date-change detection starts from the next weekly run.")
                  lines.append("\n<i>Dates may change. Not financial advice.</i>")
                  lines.append(f"\n{BOT_NAME}")
                  return "\n".join(lines)
          
              lines.append("<b>1. IPO dates announced/updated this week</b>")
              if date_updates:
                  lines.append("<blockquote expandable>")
                  for event in date_updates:
                      lines.extend(_format_ipo_item(event, "planned IPO date"))
                      lines.append("")
                  lines.append("</blockquote>")
              else:
                  lines.append("No notable IPO date updates found.\n")
          
              lines.append("<b>2. New public listings this week</b>")
              if new_listings:
                  lines.append("<blockquote expandable>")
                  for event in new_listings:
                      lines.extend(_format_ipo_item(event, "first trading date"))
                      lines.append("")
                  lines.append("</blockquote>")
              else:
                  lines.append("No notable new listings found.")
          
              lines.append("\n<i>Dates may change. Not financial advice.</i>")
              lines.append(f"\n{BOT_NAME}")
              return "\n".join(lines)

          EOF

          cat << 'EOF' > modules/telegram_sender.py
          import aiohttp
          from modules.config import BOT_TOKEN, CHAT_ID, HTTP_TIMEOUT

          def split_message(text: str, max_length: int = 4000) -> list[str]:
              if len(text) <= max_length:
                  return [text]

              chunks = []
              raw_blocks = text.split("</blockquote>")
              current_chunk = ""

              for raw_block in raw_blocks:
                  if not raw_block:
                      continue

                  block = raw_block + "</blockquote>" if "blockquote" in raw_block else raw_block

                  if len(current_chunk) + len(block) > max_length:
                      if current_chunk:
                          chunks.append(current_chunk.strip())
                          current_chunk = ""

                      if len(block) > max_length:
                          lines = block.split("\n")
                          for line in lines:
                              if len(current_chunk) + len(line) + 1 > max_length:
                                  chunks.append(current_chunk.strip())
                                  current_chunk = line + "\n"
                              else:
                                  current_chunk += line + "\n"
                      else:
                          current_chunk = block
                  else:
                      current_chunk += block

              if current_chunk.strip():
                  chunks.append(current_chunk.strip())

              return chunks

          async def send_to_telegram(text: str):
              if not BOT_TOKEN or not CHAT_ID:
                  print("❌ BOT_TOKEN или CHAT_ID не найдены")
                  return

              url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"
              chunks = split_message(text, max_length=3900)

              print(f"ℹ️ Сообщение длинной {len(text)} символов. Отправка {len(chunks)} частей...")

              async with aiohttp.ClientSession() as session:
                  for idx, chunk in enumerate(chunks, start=1):
                      payload = {
                          "chat_id": CHAT_ID, 
                          "text": chunk, 
                          "parse_mode": "HTML", 
                          "disable_web_page_preview": True
                      }
                      try:
                          async with session.post(url, json=payload, timeout=HTTP_TIMEOUT) as resp:
                              if resp.status == 200:
                                  print(f"🚀 Часть [{idx}/{len(chunks)}] успешно отправлена!")
                              else:
                                  print(f"❌ Ошибка Telegram ({resp.status}): {await resp.text()}")
                      except Exception as e:
                          print(f"💥 Ошибка отправки: {e}")
          EOF

          cat << 'EOF' > main.py
          import asyncio, aiohttp
          from datetime import datetime, timezone, timedelta
          from modules.config import SECTORS_CONFIG
          from modules.market import fetch_all_yahoo_data, fetch_all_israeli_funds
          from modules.news import fetch_sector_news
          from modules.ipo import fetch_weekly_ipo_radar
          from modules.formatter import build_telegram_message, build_ipo_radar_message
          from modules.telegram_sender import send_to_telegram
          
          def calculate_sector_score(avg_change: float) -> int:
              return max(0, min(100, int(50 + (avg_change * 15.0))))
          
          async def run_market_analytics():
              all_tickers = set()
              for cfg in SECTORS_CONFIG.values():
                  all_tickers.update(cfg["tickers"])
          
              print(f"📦 Сбор данных Yahoo Finance...")
              global_market_data = await fetch_all_yahoo_data(list(all_tickers))
          
              print(f"🌐 Сбор доходности израильских фондов...")
              il_results = await fetch_all_israeli_funds(SECTORS_CONFIG)
          
              async with aiohttp.ClientSession() as session:
                  sectors_results = []
          
                  for key, cfg in SECTORS_CONFIG.items():
                      ticker_details = [(t, global_market_data[t]["change"]) for t in cfg["tickers"] if t in global_market_data and global_market_data[t]["price"] > 0]
          
                      sorted_tickers = sorted(ticker_details, key=lambda x: abs(x[1]), reverse=True)
                      top_3_tickers = sorted_tickers[:3]
          
                      valid_changes = [c for _, c in ticker_details]
                      avg_change = sum(valid_changes) / len(valid_changes) if valid_changes else 0.0
          
                      score = calculate_sector_score(avg_change)
                      news = await fetch_sector_news(session, cfg["news_ticker"])
          
                      sectors_results.append({
                          "short_eng": cfg["short_eng"],
                          "name": cfg["name"],
                          "icon": cfg["icon"],
                          "fund_id": cfg.get("fund_id", ""),
                          "avg_change": round(avg_change, 2),
                          "top_3_tickers": top_3_tickers,
                          "score": score,
                          "news": news,
                          "il_name_eng": cfg["il_name_eng"],
                          "il_fund_data": il_results.get(key, {"daily": 0.0, "mtd": 0.0, "ytd": 0.0})
                      })
          
                  sectors_results.sort(key=lambda x: x["avg_change"], reverse=True)
          
                  message = build_telegram_message(sectors_results)
                  await send_to_telegram(message)
          
          async def run_ipo_digest():
              print("📊 Формирование Weekly IPO Radar...")
              radar = await fetch_weekly_ipo_radar()
              message = build_ipo_radar_message(radar)
              await send_to_telegram(message)
          
          async def main():
              tz_il = timezone(timedelta(hours=3))
              now = datetime.now(tz_il)
          
              if now.weekday() == 5 and now.hour == 22:
                  await run_ipo_digest()
              else:
                  await run_market_analytics()
          
          if __name__ == "__main__":
              asyncio.run(main())
          EOF

      - name: Install Dependencies & Playwright Browsers
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Analytics Engine
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          IPO_STATE_FILE: ipo_radar_snapshot.json
        run: python main.py

      - name: Save IPO Radar Snapshot
        if: always() && hashFiles('ipo_radar_snapshot.json') != ''
        uses: actions/cache/save@v4
        with:
          path: ipo_radar_snapshot.json
          key: ipo-radar-${{ github.run_id }}-${{ github.run_attempt }}
