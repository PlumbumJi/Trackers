        cat << 'EOF' > modules/fund_sources.py
        """Public alternatives for fund discovery; cached identities never become live quotes."""
        import asyncio
        import csv
        import io
        import json
        import re
        from datetime import date, datetime, timedelta

        import aiohttp

        from modules.market import _clean_text, is_access_challenge, parse_optional_float
        from modules.portfolio import fetch_portfolio_fund

        BIZ_LIST = 'https://www.bizportal.co.il/mutualfunds'
        MAYA = 'https://maya.tase.co.il/api/v1/funds'
        HISTORY_LIMIT = 120


        def fund_id(value):
            value = str(value or '').lstrip('0')
            return value if re.fullmatch(r'5\d{6}', value) else None


        def source_date(value):
            for fmt in ('%Y-%m-%d', '%d.%m.%Y', '%d/%m/%Y'):
                try:
                    return datetime.strptime(str(value)[:10], fmt).date().isoformat()
                except ValueError:
                    pass
            return None


        def parse_biz_catalog(body):
            rows = json.loads(body)
            if not isinstance(rows, list):
                return []
            result = {}
            for row in rows:
                if not isinstance(row, dict):
                    continue
                fid = fund_id(row.get('a'))
                # ETF exchange quotes and redemption NAV are different instruments.
                if not fid or row.get('n') != '@^~' + fid:
                    continue
                price = parse_optional_float(row.get('d'))
                daily = parse_optional_float(row.get('f'))
                if not row.get('b') or price is None or price <= 0:
                    continue
                item = {'fund_id': fid, 'name': _clean_text(row['b']), 'daily': daily,
                        'price': price, 'date': None, 'mtd': parse_optional_float(row.get('g')),
                        'source': 'Bizportal'}
                if fid in result and result[fid] != item:
                    raise ValueError('conflicting Bizportal identities')
                result[fid] = item
            return list(result.values())


        def parse_maya_catalog(body, today):
            reader = csv.DictReader(io.StringIO(body.lstrip('\ufeff')))
            required = {"מס' קרן", 'שם הקרן', 'מחיר פדיון', 'תאריך נכונות', 'שינוי יומי %'}
            if not required <= set(reader.fieldnames or []):
                return []
            result = {}
            for row in reader:
                fid, day = fund_id(row.get("מס' קרן")), source_date(row.get('תאריך נכונות'))
                price = parse_optional_float(row.get('מחיר פדיון'))
                if not fid or not row['שם הקרן'] or not day or day > today.isoformat() or price is None or price <= 0:
                    continue
                item = {'fund_id': fid, 'name': _clean_text(row['שם הקרן']), 'price': price,
                        'date': day, 'daily': parse_optional_float(row.get('שינוי יומי %')),
                        'mtd': parse_optional_float(row.get('תשואות מתחילת החודש')), 'source': 'MAYA'}
                if fid in result and result[fid] != item:
                    raise ValueError('conflicting MAYA identities')
                result[fid] = item
            return list(result.values())


        def parse_maya_history(body, fid, today):
            reader = csv.DictReader(io.StringIO(body.lstrip('\ufeff')))
            if not {"מס' קרן", 'תאריך', 'מחיר פדיון'} <= set(reader.fieldnames or []):
                return []
            points = {}
            for row in reader:
                if fund_id(row.get("מס' קרן")) != fid:
                    return []
                day, price = source_date(row.get('תאריך')), parse_optional_float(row.get('מחיר פדיון'))
                if not day or day > today.isoformat() or price is None or price <= 0:
                    continue
                if day in points and points[day] != price:
                    return []
                points[day] = price
            return [{'date': d, 'price': p} for d, p in sorted(points.items())]


        class PublicFundSources:
            def __init__(self, session, state, today):
                self.session, self.state, self.today = session, state, today
                self.blocked, self.catalog, self.data = set(), {}, {}
                self.limiters = {s: asyncio.Semaphore(2) for s in ('Bizportal', 'MAYA')}
                self.biz_denied = asyncio.Event()
                self.source_names = []

            async def text(self, source, url, payload=None):
                async with self.limiters[source]:
                    if source in self.blocked:
                        return ''
                    try:
                        options = {'timeout': aiohttp.ClientTimeout(total=20)}
                        if source == 'MAYA':
                            options['headers'] = {'Accept-Language': 'he-IL'}
                        request = (self.session.post(url, json=payload, **options) if payload is not None
                                   else self.session.get(url, **options))
                        async with request as response:
                            body = await response.text(errors='ignore')
                            if response.status in {401, 403, 429} or is_access_challenge(body):
                                self.blocked.add(source)
                                if source == 'Bizportal':
                                    self.biz_denied.set()
                                print(f'::warning::{source}: access restricted; no further requests this run')
                                return ''
                            if response.status != 200:
                                return ''
                        return body
                    except (aiohttp.ClientError, asyncio.TimeoutError):
                        return ''

            async def biz_catalog(self):
                body = await self.text('Bizportal', BIZ_LIST)
                # Discover the live JSON filename from the page; it changes over time.
                match = re.search(r'https://www\.bizportal\.co\.il/json/mutualfunds/[\w-]+\.json', body)
                if not match:
                    return []
                data = await self.text('Bizportal', match[0])
                try:
                    return parse_biz_catalog(data)
                except (ValueError, TypeError):
                    return []

            async def maya_catalog(self):
                body = await self.text('MAYA', MAYA + '/mutual/file', {})
                try:
                    return parse_maya_catalog(body, self.today)
                except (ValueError, TypeError, csv.Error):
                    return []

            async def listing(self):
                biz, maya = await asyncio.gather(self.biz_catalog(), self.maya_catalog())
                found = {}
                for source, rows in (('Bizportal', biz), ('MAYA', maya)):
                    if len(rows) < 100:
                        continue
                    self.source_names.append(source)
                    for row in rows:
                        previous = found.get(row['fund_id'])
                        # Prefer the official dated NAV. Disagreement is kept and checked later.
                        if previous:
                            row = dict(row, other_quote=previous)
                        found[row['fund_id']] = row
                self.catalog = found
                if found:
                    self.state['source_catalog'] = {'at': self.today.isoformat(),
                        'rows': [{'fund_id': r['fund_id'], 'name': r['name']} for r in found.values()]}
                    return list(found.values())
                cached = self.state.get('source_catalog') or {}
                try:
                    age = (self.today - date.fromisoformat(cached['at'])).days
                    if 0 <= age <= 7:
                        self.catalog = {r['fund_id']: dict(r, daily=None, source='cache') for r in cached['rows']
                                        if fund_id(r.get('fund_id')) and r.get('name')}
                except (KeyError, ValueError, TypeError):
                    pass
                return list(self.catalog.values())

            def cached(self, row):
                cached = self.state.get('source_history') or {}
                record = cached.get(row['fund_id']) or {}
                history = record.get('points', []) if record.get('source') == row.get('source') else []
                cutoff = (self.today - timedelta(days=90)).isoformat()
                history = [p for p in history if isinstance(p, dict) and cutoff <= str(p.get('date', '')) <= self.today.isoformat()]
                if row.get('date') and row.get('price') and row.get('daily') is not None:
                    price = parse_optional_float(row['price'])
                    # A revised publication invalidates the old series until it is refetched.
                    if any(p['date'] == row['date'] and parse_optional_float(p.get('price')) != price for p in history):
                        history = []
                    history = [p for p in history if p['date'] != row['date']]
                    if price is not None and price > 0:
                        history.append({'date': row['date'], 'price': price})
                return sorted(history, key=lambda p: p['date'])

            def remember(self, fid, history, source):
                if history:
                    cutoff = (self.today - timedelta(days=90)).isoformat()
                    self.state.setdefault('source_history', {})[fid] = {'source': source,
                        'points': [p for p in history if p['date'] >= cutoff][-100:]}

            async def series(self, fid):
                if fid in self.data:
                    return self.data[fid]
                row = self.catalog.get(fid, {})
                body = await self.text('MAYA', f'{MAYA}/mutual/{fid}/history/file', {
                    'period': 4, 'fromDate': (self.today - timedelta(days=70)).isoformat(),
                    'toDate': self.today.isoformat(), 'pageSize': 30, 'pageNumber': 1})
                try:
                    history = parse_maya_history(body, fid, self.today) if body else []
                except (csv.Error, ValueError, TypeError):
                    history = []
                quote = row if row.get('source') == 'MAYA' else {}
                if history and not quote:
                    # Detail endpoint supplies an independent dated quote; daily return is
                    # still required from the fresh listing or a second source.
                    raw = await self.text('MAYA', f'{MAYA}/mutual/{fid}')
                    try:
                        detail = json.loads(raw)
                        if fund_id(detail['fundId']) == fid and row.get('daily') is not None:
                            quote = {'price': detail['redemptionPrice'], 'date': source_date(detail['ratesAsOf']),
                                     'daily': row['daily'], 'source': 'MAYA'}
                    except (KeyError, TypeError, ValueError):
                        pass
                if not history or not quote:
                    async with self.limiters['Bizportal']:
                        history, quote = await fetch_portfolio_fund(self.session, fid, asyncio.Semaphore(1),
                                                                    self.biz_denied, history_pages=5)
                    quote = dict(quote, source='Bizportal') if quote else {}
                if history and quote:
                    self.remember(fid, history, quote.get('source'))
                self.data[fid] = history, quote
                return history, quote

            async def screen(self, listing, window_fn, verify_fn):
                screened, pending = {}, []

                def evaluate(row, history, quote):
                    daily = row.get('daily')
                    if daily is None:
                        daily = quote.get('daily')
                    if daily is None:
                        return
                    points = verify_fn(history, quote, float(daily), self.today)
                    window = window_fn(points or [], self.today)
                    if window:
                        screened[row['fund_id']] = {**row, **window, 'daily': daily,
                            'screen_low': window['monthly'], 'screen_high': window['monthly'],
                            'source': quote.get('source', row.get('source'))}
                        self.data[row['fund_id']] = history, quote

                for row in listing:
                    history = self.cached(row)
                    self.remember(row['fund_id'], history, row.get('source'))
                    evaluate(row, history, row)
                    if (row['fund_id'] not in screened and
                            (not row.get('date') or (self.today - date.fromisoformat(row['date'])).days <= 7)):
                        pending.append(row)
                # MTD only orders backfill work. It never substitutes for a rolling 30d return.
                leaders = sorted(pending, key=lambda r: abs(r.get('mtd') or 0), reverse=True)[:HISTORY_LIMIT // 2]
                leaders_ids = {r['fund_id'] for r in leaders}
                remaining = sorted((r for r in pending if r['fund_id'] not in leaders_ids), key=lambda r: r['fund_id'])
                cursor = int(self.state.get('history_cursor') or 0) % max(1, len(remaining))
                rotated = remaining[cursor:] + remaining[:cursor]
                jobs = leaders + rotated[:HISTORY_LIMIT - len(leaders)]
                self.state['history_cursor'] = (cursor + HISTORY_LIMIT - len(leaders)) % max(1, len(remaining))
                queue = asyncio.Queue()
                for row in jobs:
                    queue.put_nowait(row)
                async def worker():
                    while not queue.empty():
                        row = queue.get_nowait()
                        try:
                            history, quote = await self.series(row['fund_id'])
                            evaluate(row, history, quote)
                        except (ValueError, TypeError, KeyError, aiohttp.ClientError, asyncio.TimeoutError) as error:
                            print(f'::warning::History {row["fund_id"]}: {type(error).__name__}; skipped')
                try:
                    async with asyncio.timeout(220):
                        await asyncio.gather(worker(), worker())
                except asyncio.TimeoutError:
                    print('::warning::History backfill budget reached; keeping verified partial results')
                # Drop histories for funds removed from the current readable universe.
                cache = self.state.get('source_history', {})
                self.state['source_history'] = {fid: record for fid, record in cache.items() if fid in self.catalog}
                print(f'Fallback monthly history: {len(screened)}/{len(listing)}; sources={self.source_names}')
                return screened
