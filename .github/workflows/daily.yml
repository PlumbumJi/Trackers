            async def test_photo_payload_and_window_guard(self):
                class PhotoResponse:
                    status = 200
                    async def __aenter__(self): return self
                    async def __aexit__(self, *args): return False
                    async def json(self): return {'ok': True}
                from unittest.mock import MagicMock
                session = MagicMock()
                session.post.return_value = PhotoResponse()
                manager = AsyncMock()
                manager.__aenter__.return_value = session
                with patch.object(telegram_sender, 'BOT_TOKEN', 'test-token'), \
                     patch.object(telegram_sender, 'CHAT_ID', '123'), \
                     patch.object(telegram_sender.aiohttp, 'ClientSession', return_value=manager):
                    await telegram_sender.send_chart_photos([(b'png', 'Фонд')], lambda: False)
                    session.post.assert_not_called()
                    await telegram_sender.send_chart_photos([(b'png', 'Фонд')], lambda: True)
                    session.post.assert_called_once()
                    self.assertTrue(session.post.call_args.args[0].endswith('/sendPhoto'))
