        def timestamp_to_date(timestamp: int) -> str:
            return datetime.fromtimestamp(timestamp, tz=timezone.utc).date().isoformat()


        def _ema_series(values: list[float], period: int) -> list[Optional[float]]:
            result: list[Optional[float]] = [None] * len(values)
            if len(values) < period:
                return result
            seed = sum(values[:period]) / period
            result[period - 1] = seed
            multiplier = 2.0 / (period + 1.0)
            for index in range(period, len(values)):
                seed = values[index] * multiplier + seed * (1.0 - multiplier)
                result[index] = seed
            return result


        def _rsi_series(values: list[float], period: int = 14) -> list[Optional[float]]:
            result: list[Optional[float]] = [None] * len(values)
            if len(values) <= period:
                return result
            gains = [max(0.0, values[i] - values[i - 1]) for i in range(1, len(values))]
            losses = [max(0.0, values[i - 1] - values[i]) for i in range(1, len(values))]
            average_gain = sum(gains[:period]) / period
            average_loss = sum(losses[:period]) / period

            def value() -> float:
                if average_loss == 0:
                    return 100.0 if average_gain > 0 else 50.0
                relative_strength = average_gain / average_loss
                return 100.0 - 100.0 / (1.0 + relative_strength)

            result[period] = value()
            for index in range(period + 1, len(values)):
                average_gain = (average_gain * (period - 1) + gains[index - 1]) / period
                average_loss = (average_loss * (period - 1) + losses[index - 1]) / period
                result[index] = value()
            return result


        def _atr_series(history: list[dict], period: int = 14) -> list[Optional[float]]:
            result: list[Optional[float]] = [None] * len(history)
            if len(history) <= period:
                return result
            ranges = []
            for index, point in enumerate(history):
                if index == 0:
                    ranges.append(point["high"] - point["low"])
                else:
                    previous = history[index - 1]["close"]
                    ranges.append(max(
                        point["high"] - point["low"],
                        abs(point["high"] - previous),
                        abs(point["low"] - previous),
                    ))
            average = sum(ranges[1:period + 1]) / period
            result[period] = average
            for index in range(period + 1, len(history)):
                average = (average * (period - 1) + ranges[index]) / period
                result[index] = average
            return result


        def _rolling_mean(values: list[float], period: int) -> list[Optional[float]]:
            result: list[Optional[float]] = [None] * len(values)
            running = 0.0
            for index, value in enumerate(values):
                running += value
                if index >= period:
                    running -= values[index - period]
                if index >= period - 1:
                    result[index] = running / period
            return result


        def _rolling_std(values: list[float], means: list[Optional[float]], period: int) -> list[Optional[float]]:
            result: list[Optional[float]] = [None] * len(values)
            for index in range(period - 1, len(values)):
                mean = means[index]
                window = values[index - period + 1:index + 1]
                result[index] = math.sqrt(sum((value - mean) ** 2 for value in window) / period)
            return result


        def calculate_technical_series(history: list[dict]) -> dict:
            closes = [float(point["close"]) for point in history]
            volumes = [max(0.0, float(point.get("volume") or 0.0)) for point in history]
            ema20 = _ema_series(closes, 20)
            ema50 = _ema_series(closes, 50)
            ema200 = _ema_series(closes, 200)
            rsi14 = _rsi_series(closes, 14)
            atr14 = _atr_series(history, 14)
            sma20 = _rolling_mean(closes, 20)
            std20 = _rolling_std(closes, sma20, 20)
            volume20 = _rolling_mean(volumes, 20)
            return {
                "closes": closes,
                "ema20": ema20,
                "ema50": ema50,
                "ema200": ema200,
                "rsi14": rsi14,
                "atr14": atr14,
                "sma20": sma20,
                "std20": std20,
                "volume20": volume20,
                "volumes": volumes,
            }


        def _technical_snapshot(history: list[dict], series: dict, index: int) -> dict:
            required = ("ema20", "ema50", "rsi14", "atr14", "sma20", "std20")
            if index < 55 or any(series[key][index] is None for key in required):
                return {}
            close = series["closes"][index]
            atr = series["atr14"][index]
            ema20 = series["ema20"][index]
            ema50 = series["ema50"][index]
            ema200 = series["ema200"][index]
            rsi = series["rsi14"][index]
            middle = series["sma20"][index]
            deviation = series["std20"][index]
            lower = middle - 2.0 * deviation
            upper = middle + 2.0 * deviation
            ema50_prior = series["ema50"][index - 5]
            change5 = (
                (close / series["closes"][index - 5] - 1.0) * 100.0
                if index >= 5 and series["closes"][index - 5] > 0 else None
            )
            long_term_ok = ema200 is None or ema50 >= ema200
            trend_up = (
                close > ema50 and ema20 >= ema50 and long_term_ok
                and ema50_prior is not None and ema50 > ema50_prior
            )
            trend_down = (
                close < ema50 and ema20 < ema50
            ) or (
                ema200 is not None and close < ema200 and ema50 < ema200
            )
            trend_key = "up" if trend_up else "down" if trend_down else "sideways"
            reversal_candle = close > float(history[index]["open"]) and close >= series["closes"][index - 1]
            pullback = trend_up and reversal_candle and 28.0 <= rsi <= 45.0 and (
                close <= ema20 or close <= lower + 0.5 * atr
            )
            continuation = trend_up and 45.0 < rsi <= 62.0 and change5 is not None and change5 > 0 and (
                abs(close - ema20) <= 0.75 * atr
            )
            setup_type = "pullback" if pullback else "continuation" if continuation else "none"
            stop = close - 1.5 * atr
            target = upper
            risk = close - stop
            reward = target - close
            risk_reward = reward / risk if risk > 0 and reward > 0 else 0.0
            volume_average = series["volume20"][index]
            volume = series["volumes"][index]
            volume_ratio = volume / volume_average if volume_average and volume_average > 0 else None
            volume_ok = volume_ratio is None or 0.4 <= volume_ratio <= 2.5
            if setup_type != "none" and not volume_ok:
                setup_type = "none"
            return {
                "proxy_price": round(close, 2),
                "ema20": round(ema20, 2),
                "ema50": round(ema50, 2),
                "ema200": round(ema200, 2) if ema200 is not None else None,
                "rsi14": round(rsi, 1),
                "atr14": round(atr, 2),
                "atr_percent": round(atr / close * 100.0, 2),
                "bb_lower": round(lower, 2),
                "bb_upper": round(upper, 2),
                "volume_ratio": round(volume_ratio, 2) if volume_ratio is not None else None,
                "volume_ok": volume_ok,
                "change_5d": round(change5, 2) if change5 is not None else None,
                "trend_key": trend_key,
                "setup_type": setup_type,
                "target": round(target, 2),
                "stop": round(stop, 2),
                "risk_reward": round(risk_reward, 2),
            }


        def backtest_hybrid_model(history: list[dict], series: dict, horizon: int = 10) -> dict:
            """Conservative proxy-only backtest; same-day target+stop counts as a loss."""
            wins = losses = timeouts = 0
            for index in range(55, len(history) - horizon):
                snapshot = _technical_snapshot(history, series, index)
                if (
                    not snapshot
                    or snapshot["trend_key"] != "up"
                    or snapshot["setup_type"] == "none"
                    or snapshot["risk_reward"] < 1.5
                    or snapshot.get("change_5d") is None
                    or snapshot["change_5d"] <= 0
                ):
                    continue
                target, stop = snapshot["target"], snapshot["stop"]
                outcome = "timeout"
                for point in history[index + 1:index + horizon + 1]:
                    hit_target = point["high"] >= target
                    hit_stop = point["low"] <= stop
                    if hit_stop:
                        outcome = "loss"
                        break
                    if hit_target:
                        outcome = "win"
                        break
                if outcome == "win":
                    wins += 1
                elif outcome == "loss":
                    losses += 1
                else:
                    timeouts += 1
            return {
                "backtest_wins": wins,
                "backtest_losses": losses,
                "backtest_timeouts": timeouts,
                "backtest_total": wins + losses + timeouts,
                "backtest_horizon": horizon,
                "backtest_scope": "proxy_only",
            }


        def analyze_year_history(history: list[dict], ticker: str) -> dict:
            if len(history) < 60:
                return {}
            series = calculate_technical_series(history)
            technical = _technical_snapshot(history, series, len(history) - 1)
            if not technical:
                return {}

            latest_timestamp = history[-1]["timestamp"]
            year_start = latest_timestamp - 365 * 24 * 3600
            year_points = [point for point in history if point["timestamp"] >= year_start]
            if len(year_points) < 20:
                year_points = history[-252:]
            first_close = year_points[0]["close"]
            current_close = year_points[-1]["close"]

            peak_close = trough_close = year_points[0]["close"]
            peak_time = trough_time = year_points[0]["timestamp"]
            max_drawdown = max_rally = 0.0
            drawdown_start = rally_start = year_points[0]["timestamp"]
            for point in year_points:
                close, timestamp = point["close"], point["timestamp"]
                if close > peak_close:
                    peak_close, peak_time = close, timestamp
                else:
                    change = (close / peak_close - 1.0) * 100.0
                    if change < max_drawdown:
                        max_drawdown, drawdown_start = change, peak_time
                if close < trough_close:
                    trough_close, trough_time = close, timestamp
                else:
                    change = (close / trough_close - 1.0) * 100.0
                    if change > max_rally:
                        max_rally, rally_start = change, trough_time

            if abs(max_drawdown) >= abs(max_rally):
                event_direction, event_change, event_start = "down", max_drawdown, drawdown_start
            else:
                event_direction, event_change, event_start = "up", max_rally, rally_start

            closes = [point["close"] for point in year_points]
            year_high, year_low = max(closes), min(closes)
            change60 = (
                (current_close / year_points[-61]["close"] - 1.0) * 100.0
                if len(year_points) > 60 else 0.0
            )
            if current_close >= year_high * 0.95:
                trend_text = "около годовых максимумов"
            elif current_close <= year_low * 1.05:
                trend_text = "около годовых минимумов"
            elif technical["trend_key"] == "up":
                trend_text = "восходящий тренд"
            elif technical["trend_key"] == "down":
                trend_text = "нисходящий тренд"
            elif change60 > 5:
                trend_text = "восстановление"
            else:
                trend_text = "боковая динамика"

            result = {
                "proxy_ticker": ticker,
                "market_date": timestamp_to_date(latest_timestamp),
                "year_change": round((current_close / first_close - 1.0) * 100.0, 2),
                "event_direction": event_direction,
                "event_change": round(event_change, 2),
                "event_date": timestamp_to_date(event_start),
                "trend": trend_text,
                "change_20d": round(
                    (current_close / history[-21]["close"] - 1.0) * 100.0, 2
                ) if len(history) > 20 else None,
                **technical,
                **backtest_hybrid_model(history, series),
            }
            return result


        def analyze_entry_zone(fund_data: dict, market_data: dict) -> dict:
            daily = parse_optional_float(fund_data.get("daily"))
            stats = fund_data.get("price_stats") or {}
            current = parse_optional_float(stats.get("current_price"))
            average30 = parse_optional_float(stats.get("average_30"))
            below_average = parse_optional_float(stats.get("below_average_30"))
            required_market = (
                market_data.get("trend_key"), market_data.get("setup_type"),
                market_data.get("rsi14"), market_data.get("atr14"),
                market_data.get("risk_reward"), market_data.get("proxy_price"),
            )
            if daily is None or current is None or average30 is None or below_average is None or any(
                value is None for value in required_market
            ):
                return {
                    "status_key": "unavailable",
                    "label": "Недостаточно данных",
                    "score": 0,
                    "daily": daily,
                    "reasons": ["не получена история фонда или технические данные базового рынка"],
                }

            trend_key = market_data["trend_key"]
            setup_type = market_data["setup_type"]
            base5 = parse_optional_float(market_data.get("change_5d"))
            risk_reward = float(market_data["risk_reward"])
            fund_turn = daily > 0
            base_turn = base5 is not None and base5 > 0
            valid_setup = setup_type != "none" and risk_reward >= 1.5
            deep_discount = below_average <= -3.0
            if trend_key == "down":
                status_key, label = "blocked", "Вход запрещён трендом"
                reasons = ["базовый рынок ниже EMA50", "нисходящий тренд ещё не завершён"]
            elif trend_key == "up" and valid_setup and fund_turn and base_turn:
                status_key, label = "ready", "Базовый сигнал готов"
                reasons = ["глобальный тренд восходящий", "откат или продолжение тренда подтверждены", "фонд и база растут"]
            elif trend_key == "up" and valid_setup:
                status_key, label = "forming", "Сигнал формируется"
                reasons = ["глобальный тренд восходящий", "найдена допустимая зона по волатильности"]
                if not fund_turn:
                    reasons.append("фонд ещё не подтвердил рост")
                if not base_turn:
                    reasons.append("пятидневный импульс базы ещё слабый")
            else:
                status_key, label = "watch", "Условий для входа нет"
                reasons = ["нет сочетания тренда, импульса и достаточного отношения доходности к риску"]

            score = sum((
                25 if trend_key == "up" else 0,
                20 if setup_type != "none" else 0,
                15 if 30 <= float(market_data["rsi14"]) <= 62 else 0,
                15 if risk_reward >= 1.5 else 0,
                10 if base_turn else 0,
                10 if fund_turn else 0,
                5 if (market_data.get("volume_ratio") or 0) >= 0.8 else 0,
            ))
            return {
                "status_key": status_key,
                "label": label,
                "score": score,
                "candidate": status_key in {"ready", "forming"} or (status_key == "blocked" and deep_discount),
                "daily": daily,
                "current_price": current,
                "average_30": average30,
                "below_average_30": below_average,
                "to_average_30": parse_optional_float(stats.get("to_average_30")),
                "price_date": stats.get("price_date", ""),
                "trend_key": trend_key,
                "setup_type": setup_type,
                "proxy_ticker": market_data.get("proxy_ticker", ""),
                "proxy_price": market_data.get("proxy_price"),
                "rsi14": market_data.get("rsi14"),
                "atr_percent": market_data.get("atr_percent"),
                "volume_ratio": market_data.get("volume_ratio"),
                "risk_reward": market_data.get("risk_reward"),
                "target": market_data.get("target"),
                "stop": market_data.get("stop"),
                "base5": base5,
                "backtest_wins": int(market_data.get("backtest_wins") or 0),
                "backtest_losses": int(market_data.get("backtest_losses") or 0),
                "backtest_timeouts": int(market_data.get("backtest_timeouts") or 0),
                "backtest_total": int(market_data.get("backtest_total") or 0),
                "reasons": reasons,
            }


        def us_session_state(now: Optional[datetime] = None) -> dict:
            now_ny = (now or datetime.now(timezone.utc)).astimezone(ZoneInfo("America/New_York"))
            minutes = now_ny.hour * 60 + now_ny.minute
            if now_ny.weekday() >= 5:
                state = "closed"
            elif 4 * 60 <= minutes < 9 * 60 + 30:
                state = "premarket"
            elif 9 * 60 + 30 <= minutes < 16 * 60:
                state = "regular"
            elif 16 * 60 <= minutes < 20 * 60:
                state = "afterhours"
            else:
                state = "closed"
            return {
                "state": state,
                "time_ny": now_ny.strftime("%d.%m.%Y %H:%M"),
                "weekday": now_ny.weekday(),
                "radar_window": now_ny.weekday() < 5 and 9 * 60 + 5 <= minutes < 9 * 60 + 30,
            }


        async def fetch_all_year_analytics(sectors_config: dict) -> dict:
            timeout = aiohttp.ClientTimeout(total=HTTP_TIMEOUT + 20)
            connector = aiohttp.TCPConnector(limit=8, limit_per_host=6, ttl_dns_cache=300)
            async with aiohttp.ClientSession(timeout=timeout, connector=connector) as session:
                tasks = {
                    sector: asyncio.create_task(fetch_ticker_year_history(session, config["proxy_ticker"]))
                    for sector, config in sectors_config.items()
                    if config.get("proxy_ticker")
                }
                results = {}
                for sector, task in tasks.items():
