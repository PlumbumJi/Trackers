        \        result=await movers.screen_monthly(session,[row],today)\n        self.assertEqual(result,{})\n        session.get.assert_called_once()\n\n    def test_followup_starts_after_discovery_not_old_nav(self):\n        event = {'price': 100, 'date': '2026-10-01', 'detected_on': '2026-10-05'}\n        points = [{'date': f'2026-10-{i:02d}', 'price': 100+i} for i in range(1, 12)]\n        movers.track(event, points, date(2026,10,11))\n        self.assertEqual(event['after_5_publications_pct'], 10)\n        self.assertNotIn('after_20_publications_pct', event)\n\n    async def test_sequence_portfolio_before_discovery(self):\n        order = []\n        async def portfolio_delivery(caption_builder, on_delivered, extra_images=None):\n            caption, extra = await caption_builder('portfolio')\n            order.append('sent')\n            on_delivered()\n        with patch.object(portfolio, 'run_portfolio', new=portfolio_delivery), \\\n             patch.object(movers, 'prepare_safely',\
        \ new=AsyncMock(return_value=({}, []))), \\\n             patch.object(movers, 'commit_movers', side_effect=lambda *a: order.append('saved')):\n            await movers.run_morning_reports()\n        self.assertEqual(order, ['sent', 'saved'])\n        async def failed(caption_builder, on_delivered, extra_images=None):\n            await caption_builder('portfolio')\n            raise RuntimeError('Telegram failed')\n        with patch.object(portfolio, 'run_portfolio', new=failed), \\\n             patch.object(movers, 'prepare_safely', new=AsyncMock(return_value=({}, []))), \\\n             patch.object(movers, 'commit_movers') as commit:\n            with self.assertRaises(RuntimeError):\n                await movers.run_morning_reports()\n            commit.assert_not_called()\n\n    async def test_denial_stops_new_fund_requests(self):\n        import asyncio\n        class Response:\n            status = 403\n            async def __aenter__(self): return self\n            async\
        \ def __aexit__(self,*args): pass\n            async def text(self,**kwargs): return 'Forbidden'\n        session = MagicMock()\n        session.get.return_value = Response()\n        denied = asyncio.Event()\n        with patch.object(portfolio,'fetch_bizportal_price_history',new=AsyncMock()) as history:\n            await portfolio.fetch_portfolio_fund(session,'5101183',asyncio.Semaphore(1),denied)\n            await portfolio.fetch_portfolio_fund(session,'5101184',asyncio.Semaphore(1),denied)\n            self.assertTrue(denied.is_set())\n            session.get.assert_called_once()\n            history.assert_not_awaited()\n\n    async def test_scan_validates_candidates_and_suppresses_sent_event(self):\n        row, points, quote, today = fixture()\n        body = listing('1.82') + ''.join(listing('0.1', str(5200000+i)) for i in range(100))\n        class Clock(datetime):\n            @classmethod\n            def now(cls, tz=None): return cls(2026,10,17,8,20,tzinfo=movers.TZ)\n\
