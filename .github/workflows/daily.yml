        \ > modules/fund_profile.py\n\"\"\"Brief explanations of a fund's declared focus, not attributed causes of a move.\"\"\"\nimport re\n\n\n# Recognise explicit subjects in the published name; never infer current holdings\n# or currency exposure from a return, manager, ticker of another fund, or headline.\nPROFILES = (\n    (r'\\bwti\\b', 'нефть WTI', 'спрос на нефть, добыча и запасы'),\n    (r'\\bsemicon\\w*|מוליכים למחצה|שבבים', 'полупроводники',\n     'спрос на чипы, результаты производителей'),\n    (r'\\bindxx\\s+blockchain\\s+ecosystem\\b', 'компании блокчейна',\n     'акции отрасли, активность крипторынка'),\n    (r'\\bbitcoin\\b|ביטקוין', 'биткоин', 'цена биткоина и условия стратегии'),\n    (r'\\b(?:clean|renewable|green)\\s+energy\\b|אנרגיה (?:ירוקה|מתחדשת)',\n     'зелёная энергетика', 'спрос на энергию, ставки и субсидии'),\n    (r'\\bcyber\\w*|סייבר', 'кибербезопасность', 'расходы на защиту, результаты компаний'),\n    (r'\\bbiotech\\w*|ביוטכנולוגיה', 'биотехнологии', 'испытания\
        \ лекарств, решения регуляторов'),\n    (r'\\bartificial intelligence\\b|\\bAI\\b|בינה מלאכותית', 'ИИ',\n     'расходы на ИИ, результаты компаний'),\n    (r'\\bbanks?\\b|בנקים', 'банки', 'ставки, кредитование и просрочки'),\n    (r'\\binsurance\\b|ביטוח', 'страхование', 'убытки по страхованию, доходность инвестиций'),\n    (r'\\bS\\s*&\\s*P\\s*500\\b', 'акции S&P 500', 'прибыль компаний США и процентные ставки'),\n    (r'\\bNasdaq[\\s-]*100\\b', 'акции Nasdaq-100', 'результаты компаний индекса и ставки'),\n)\nMANAGERS = (\n    ('ברק', 'Barak'), ('תכלית', 'Tachlit'), ('מיטב', 'Meitav'),\n    ('איילון', 'Ayalon'), ('אילים', 'Eylim'), ('מגדל', 'Migdal'),\n    ('מור', 'More'), ('קסם', 'KSM'), ('הראל', 'Harel'), ('אלטשולר', 'Altshuler'),\n    ('MTF', 'MTF'), ('IBI', 'IBI'),\n)\n\n\ndef describe_fund(name):\n    name = re.sub(r'\\s+', ' ', str(name or '')).strip()\n    matches = [(label, factors) for pattern, label, factors in PROFILES\n               if re.search(pattern, name, re.I)]\n\
        \    # Mixed mandates cannot be presented as a pure exposure to either subject.\n    if len(matches) != 1:\n        return None\n    label, factors = matches[0]\n    manager = next((english for hebrew, english in MANAGERS\n                    if re.match(r'(?:' + re.escape(hebrew) + '|' + re.escape(english)\n                                + r')(?!\\w)', name, re.I)), '')\n    return {'label': f'{manager} · {label}' if manager else label, 'factors': factors}\n\n\ndef short_conclusion(event):\n    return {\n        'up_up': 'Рост сохраняется; не догонять цену.',\n        'up_down': 'Идёт откат; ждать стабилизации.',\n        'up_flat': 'После роста пауза; нового импульса нет.',\n        'down_up': 'Есть отскок; разворот ещё не подтверждён.',\n        'down_down': 'Снижение продолжается; усреднение рискованно.',\n        'down_flat': 'Падение замедлилось; разворот не подтверждён.',\n    }.get(event.get('regime'), event.get('conclusion', ''))\nEOF\n\ncat << 'EOF' > modules/mover_charts.py\n\
        \"\"\"Six-month charts of delivered monthly movers, independent of portfolio holdings.\"\"\"\nimport asyncio\nimport calendar\nimport csv\nimport json\nimport math\nfrom datetime import date\nfrom io import BytesIO\n\nimport aiohttp\n\nfrom modules.config import HEADERS\nfrom modules.fund_profile import describe_fund\nfrom modules.fund_sources import PublicFundSources, MAYA, parse_maya_history\n\n\ndef six_month_start(today):\n    year, month = divmod(today.year * 12 + today.month - 1 - 6, 12)\n    month += 1\n    return date(year, month, min(today.day, calendar.monthrange(year, month)[1]))\n\n\ndef verified_chart(history, detail, event, today):\n    \"\"\"Never attach a different NAV date/price to the monthly card.\"\"\"\n    try:\n        if str(detail['fundId']) != event['fund_id']:\n            return []\n        points = sorted((date.fromisoformat(p['date']), float(p['price'])) for p in history)\n        if len(points) < 2 or len({d for d, _ in points}) != len(points):\n   \
        \         return []\n        if any(not math.isfinite(p) or p <= 0 or d > today for d, p in points):\n            return []\n        last_day, last_price = points[-1]\n        quote_price = float(detail['redemptionPrice'])\n        event_price = float(event['price'])\n        if not all(math.isfinite(p) and p > 0 for p in (quote_price, event_price)):\n            return []\n        if (last_day.isoformat() != str(detail['ratesAsOf'])[:10]\n                or last_day.isoformat() != event['date']\n                or abs(last_price - quote_price) > .011\n                or abs(last_price - event_price) > .011):\n            return []\n        return [(d, p) for d, p in points if d >= six_month_start(today)]\n    except (KeyError, ValueError, TypeError):\n        return []\n\n\nasync def build_mover_charts(selected, today):\n    if not selected:\n        return None\n    async with aiohttp.ClientSession(headers=HEADERS, trust_env=True,\n                                    timeout=aiohttp.ClientTimeout(total=25))\
        \ as session:\n        api = PublicFundSources(session, {}, today)\n        async def fetch(item):\n            event = item[1]\n            fid = event['fund_id']\n            try:\n                body = await api.text('MAYA', f'{MAYA}/mutual/{fid}/history/file', {\n                    'period': 4, 'fromDate': six_month_start(today).isoformat(),\n                    'toDate': today.isoformat(), 'pageSize': 200, 'pageNumber': 1})\n                history = parse_maya_history(body, fid, today) if body else []\n                if not history:\n                    return None\n                raw = await api.text('MAYA', f'{MAYA}/mutual/{fid}')\n                points = verified_chart(history, json.loads(raw), event, today)\n                if len(points) < 2:\n                    print(f'::warning::Mover chart {fid}: history and published NAV not aligned')\n                    return None\n                return event, points\n            except (ValueError, TypeError, KeyError, csv.Error):\n\
        \                return None\n        rows = [r for r in await asyncio.gather(*(fetch(item) for item in selected[:3])) if r]\n    if not rows:\n        print('::warning::Monthly mover charts unavailable; retaining verified text report')\n        return None\n    return render_mover_charts(rows, today)\n\n\ndef render_mover_charts(rows, today):\n    import matplotlib\n    matplotlib.use('Agg')\n    import matplotlib.pyplot as plt\n    from matplotlib.patches import FancyBboxPatch\n\n    count = len(rows)\n    start = six_month_start(today)\n    # Fixed row height keeps one or two available charts readable as well.\n    with plt.rc_context({'font.family': 'DejaVu Sans', 'font.size': 11,\n                         'text.color': '#e8edf5', 'xtick.color': '#8398b1',\n                         'ytick.color': '#8398b1'}):\n        fig = plt.figure(figsize=(9, 1.9 + 3.35 * count), dpi=180, facecolor='#09121f')\n        try:\n            fig.text(.055, .965, 'MARKET RADAR AI · ФОНДЫ В ФОКУСЕ',\
        \ fontsize=21, weight='bold')\n            fig.text(.055, .932, f'6 месяцев / {start:%d.%m.%Y} — {today:%d.%m.%Y}',\n                     fontsize=11, color='#9fb1c8')\n            row_height = .82 / count\n            for i, (event, points) in enumerate(rows):\n                top = .90 - i * row_height\n                h = row_height\n                profile = describe_fund(event['name'])\n                name = profile['label'] if profile else event['fund_id']\n                if event.get('risk'):\n                    name += ' · ' + event['risk']\n                first, last = points[0], points[-1]\n                low, high = min(points, key=lambda p: p[1]), max(points, key=lambda p: p[1])\n                change = (last[1] / first[1] - 1) * 100\n                color = '#42d4ad' if change >= 0 else '#ff798a'\n                fig.add_artist(FancyBboxPatch((.035, top - h + .013), .93, h - .018,\n                    boxstyle='round,pad=0.006,rounding_size=0.012', transform=fig.transFigure,\n\
        \                    facecolor='#111e2e', edgecolor='#24364b', linewidth=.7, zorder=0))\n                fig.text(.058, top - .10*h, name, fontsize=13, weight='bold')\n                fig.text(.058, top - .18*h, f\"{event['fund_id']} · {len(points)} опубликованных цен\",\n                         fontsize=9, color='#8fa3bc')\n                for x, label, (day, value) in zip([.06, .28, .50],\n                        ['ПОСЛЕДНЯЯ ЦЕНА', 'МИНИМУМ', 'МАКСИМУМ'], [last, low, high]):\n                    fig.text(x, top - .28*h, label, fontsize=7.5, color='#91a4bc')\n                    fig.text(x, top - .36*h, f'{value:.2f}', fontsize=17, weight='bold')\n                    fig.text(x, top - .42*h, f'{day:%d.%m}', fontsize=8, color='#91a4bc')\n                fig.text(.73, top - .28*h, 'ИЗМЕНЕНИЕ КУРСА', fontsize=7.5, color='#91a4bc')\n                fig.text(.73, top - .36*h, f'{change:+.1f}%', fontsize=17, color=color, weight='bold')\n                fig.text(.73, top - .42*h, f'{first[0]:%d.%m}\
        \ → {last[0]:%d.%m}',\n                         fontsize=8, color='#91a4bc')\n                ax = fig.add_axes([.085, top - .85*h, .82, .36*h], facecolor='#111e2e')\n                ds, ys = zip(*points)\n                pad = max((high[1] - low[1]) * .15, last[1] * .01)\n                ax.set_ylim(low[1] - pad, high[1] + pad)\n                ax.set_xlim(start, today)\n                ax.plot(ds, ys, color=color, lw=1.7)\n                ax.fill_between(ds, ys, low[1] - pad, color=color, alpha=.07)\n                ax.scatter([last[0]], [last[1]], color=color, s=17, zorder=3)\n                ax.grid(axis='y', color='#2a3c52', alpha=.6, lw=.5)\n                ax.yaxis.set_major_locator(plt.MaxNLocator(3))\n                import matplotlib.dates as md\n                ax.xaxis.set_major_locator(md.MonthLocator())\n                ax.xaxis.set_major_formatter(md.DateFormatter('%m.%y'))\n                ax.tick_params(labelsize=7, length=0, pad=5)\n                for spine in\
        \ ax.spines.values():\n                    spine.set_visible(False)\n                if (first[0] - start).days > 7:\n                    ax.axvspan(start, first[0], color='#829bb9', alpha=.035)\n                    ax.text(.02, .55, f'История доступна\\nс {first[0]:%d.%m}',\n                            transform=ax.transAxes, color='#8195ac', fontsize=8, va='center')\n                fig.text(.058, top - .94*h, 'Цена погашения · МАЙЯ / Тель-Авивская биржа',\n                         fontsize=8, color='#738ba7')\n            fig.text(.055, .035, 'Проценты — изменение курса за доступный период на графике.',\n                     fontsize=8, color='#9fb1c8')\n            output = BytesIO()\n            fig.savefig(output, format='png', dpi=180, facecolor=fig.get_facecolor())\n            return output.getvalue()\n        finally:\n            plt.close(fig)\nEOF\n\ncat << 'EOF' > tests/test_mover_charts.py\nimport unittest\nfrom datetime import date\nfrom unittest.mock import AsyncMock,\
