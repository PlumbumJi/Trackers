        \        self.assertEqual(mover_charts.verified_chart(history,detail,dict(event,price=530),today),[])\n        self.assertEqual(mover_charts.verified_chart(history+history[-1:],detail,event,today),[])\n\n    async def test_graph_attaches_to_portfolio_and_failure_keeps_text(self):\n        selected = [('key',{'fund_id':'5141841'},None)]\n        async def deliver(caption_builder,on_delivered,extra_images):\n            caption,_ = await caption_builder('portfolio')\n            self.assertEqual(caption,'combined')\n            self.assertEqual(extra_images, expected)\n            on_delivered()\n        for result in (b'chart', RuntimeError('unavailable')):\n            expected = [(b'chart','')] if isinstance(result,bytes) else []\n            builder = AsyncMock(return_value=result) if expected else AsyncMock(side_effect=result)\n            with patch.object(portfolio,'run_portfolio',new=deliver), \\\n                 patch.object(movers,'prepare_safely',new=AsyncMock(return_value=({},selected))),\
        \ \\\n                 patch.object(movers,'combined_caption',return_value=('combined','supplement',selected)), \\\n                 patch.object(mover_charts,'build_mover_charts',new=builder), \\\n                 patch.object(movers,'commit_movers') as commit:\n                await movers.run_morning_reports()\n                commit.assert_called_once_with(({},selected),selected)\nEOF\n\ncat << 'EOF' > modules/movers.py\n\"\"\"Rolling-month discovery: bulk screening, independent NAV checks, concise view.\"\"\"\nimport asyncio\nimport copy\nimport json\nimport math\nimport os\nimport re\nimport traceback\nimport xml.etree.ElementTree as ET\nfrom datetime import date, datetime, timedelta\nfrom email.utils import parsedate_to_datetime\nfrom html import escape\nfrom pathlib import Path\nfrom urllib.parse import urlparse\nfrom zoneinfo import ZoneInfo\n\nimport aiohttp\n\nfrom modules.config import BOT_NAME, HEADERS\nfrom modules.market import _FundHTML, _clean_text, parse_optional_float,\
        \ is_access_challenge\nfrom modules.portfolio import fetch_portfolio_fund\nfrom modules.news import translate_to_russian, shorten_title\nfrom modules.telegram_sender import message_length\nfrom modules.fund_news import (fetch_mentions, prepare_focus, watch_jobs,\n                               build_reviews, register_delivered)\nfrom modules.fund_sources import PublicFundSources\nfrom modules.fund_profile import describe_fund, short_conclusion\n\nLIST_URL = 'https://funder.co.il/allInOne.aspx'\nGRAPH_URL = 'https://www.funder.co.il/wsUnified.asmx/GetFundFewTickersPeriod'\nSTATE = Path('fund_movers_state.json')\nTZ = ZoneInfo('Asia/Jerusalem')\nTHRESHOLD = 10.0\nMAX_CHECKS = 30\nMAX_TRACKED = 30\nMIN_LIST_ROWS = 100  # A broken or tiny table must not count as a market scan.\nGRAPH_BATCH = 40\nWINDOW_DAYS = 30\nREPEAT_CHANGE_PP = 5.0\n\n\ndef number(value):\n    return parse_optional_float(value)\n\n\ndef fund_name_key(value):\n    # Funder's chart endpoint replaces Hebrew abbreviation\
        \ quotes with apostrophes.\n    return _clean_text(value).translate(str.maketrans('', '', '\\\"\\'`׳״‘’“”'))\n\n\ndef ordered_prices(history, today):\n    points = {}\n    for point in history:\n        try:\n            day = date.fromisoformat(point['date'])\n            price = float(point['price'])\n            if day > today or not math.isfinite(price) or price <= 0:\n                continue\n            if day in points and points[day] != price:\n                return []\n            points[day] = price\n        except (ValueError, KeyError, TypeError):\n            continue\n    return sorted(points.items())\n\n\ndef month_window(ordered, today):\n    \"\"\"Last NAV versus the last publication on/before NAV minus 30 calendar days.\"\"\"\n    if len(ordered) < 15:\n        return None\n    last_day, current = ordered[-1]\n    target = last_day - timedelta(days=WINDOW_DAYS)\n    anchors = [(day, price) for day, price in ordered if day <= target]\n    if not anchors or not\
        \ 0 <= (today - last_day).days <= 7:\n        return None\n    start, base = anchors[-1]\n    recent = [(day, price) for day, price in ordered if day >= start]\n    if ((target - start).days > 7 or len(recent) < 12\n            or any((b[0] - a[0]).days > 7 for a, b in zip(recent, recent[1:]))\n            or (last_day - ordered[-6][0]).days > 14):\n        return None\n    return {'monthly': (current / base - 1) * 100,\n            'change_5': (current / ordered[-6][1] - 1) * 100,\n            'start_date': start.isoformat(), 'date': last_day.isoformat(),\n            'five_start': ordered[-6][0].isoformat(), 'base': base, 'price': current}\n\n\ndef parse_graph_batch(body, rows, today):\n    \"\"\"Map by exact unique fund name, never column position; null dates stay missing.\n\n    Public charts contain rounded cumulative percentages, not NAV prices.\n    Their ratios only screen candidates; publication cards use actual prices.\n    \"\"\"\n    match = re.fullmatch(r'\\s*fundMonth\\\
        ((.*)\\);?\\s*', body, re.S)\n    try:\n        payload = json.loads(match.group(1) if match else body)\n        columns = payload['data']['columns']\n        axes = [c[1:] for c in columns if c and c[0] == 'x']\n        if len(axes) != 1:\n            return {}\n        days = axes[0]\n        if len(days) != len(set(days)):\n            return {}\n        for day in days:\n            date.fromisoformat(day)\n        names, duplicates = {}, set()\n        for row in rows:\n            name = fund_name_key(row['name'])\n            if name in names:\n                duplicates.add(name)\n            names[name] = row\n        result, seen = {}, set()\n        for column in columns:\n            if not column or column[0] == 'x':\n                continue\n            name = fund_name_key(column[0])\n            if name not in names or name in duplicates or len(column) != len(days) + 1:\n                continue\n            row = names[name]\n            fid = row['fund_id']\n \
        \           if name in seen:\n                result.pop(fid, None)\n                duplicates.add(name)\n                continue\n            seen.add(name)\n            history = []\n            for day, change in zip(days, column[1:]):\n                value = number(change)\n                if value is not None and value > -100:\n                    history.append({'date': day, 'price': 100 + value})\n            window = month_window(ordered_prices(history, today), today)\n            if not window:\n                continue\n            # Include uncertain threshold cases: each chart value is rounded to .01.\n            low = ((window['price'] - .005) / (window['base'] + .005) - 1) * 100\n            high = ((window['price'] + .005) / max(window['base'] - .005, 1e-9) - 1) * 100\n            result[fid] = {**row, **window, 'screen_low': low, 'screen_high': high}\n        return result\n    except (ValueError, KeyError, TypeError, AttributeError):\n        return {}\n\n\n\
        def parse_listing(body):\n    root = _FundHTML(body).root\n    found, conflicts = {}, set()\n    for table in root.walk('table'):\n        columns = None\n        for tr in table.walk('tr'):\n            cells = [n for n in tr.children if getattr(n, 'tag', '') in {'td', 'th'}]\n            labels = [_clean_text(c.text()) for c in cells]\n            daily = next((i for i, s in enumerate(labels) if s == 'תשואה יומית'), None)\n            name = next((i for i, s in enumerate(labels) if s == 'שם קרן הנאמנות'), None)\n            if daily is not None and name is not None:\n                columns = (name, daily)\n                continue\n            if columns is None or len(cells) <= max(columns):\n                continue\n            name_index, daily_index = columns\n            links = list(cells[name_index].walk('a'))\n            ids = set()\n            for link in links:\n                href = link.attrs.get('href', '')\n                match = re.search(r'(?:^|/)fund/(\\\
        d{6,8})(?:[/?#]|$)', urlparse(href).path)\n                if match:\n                    ids.add(match.group(1))\n            change = number(labels[daily_index])\n            if len(ids) != 1 or change is None or change <= -100:\n                continue\n            fid = ids.pop()\n            row = {'fund_id': fid, 'name': labels[name_index], 'daily': change}\n            if fid in found and found[fid]['daily'] != change:\n                conflicts.add(fid)\n            found[fid] = row\n    return [row for fid, row in found.items() if fid not in conflicts]\n\n\ndef verified_publication(history, quote, reported_change, today):\n    \"\"\"Require same last price/date plus agreement of both published daily returns.\"\"\"\n    ordered = ordered_prices(history, today)\n    if len(ordered) < 2:\n        return None\n    (previous_day, previous), (last_day, current) = ordered[-2:]\n    # Conservative bounds: do not disguise long publication gaps as one day.\n    if (today - last_day).days\
        \ > 7 or (last_day - previous_day).days > 4:\n        return None\n    # Some fund pages omit the date. In that case use the dated history ONLY\n    # after matching its exact last price and both published daily changes.\n    if quote.get('date') and quote['date'] != last_day.isoformat():\n        return None\n    quote_price, quote_change = number(quote.get('price')), number(quote.get('daily'))\n    other_price = number((quote.get('other_quote') or {}).get('price'))\n    change = (current / previous - 1) * 100\n    if quote_price is None or quote_change is None:\n        return None\n    if other_price is not None and abs(other_price - quote_price) > max(.011, quote_price * .0001):\n        return None\n    if abs(quote_price - current) > max(0.011, current * 0.0001):\n        return None\n    if abs(change - quote_change) > 0.15 or abs(change - reported_change) > 0.15:\n        return None\n    return ordered\n\n\ndef validated_event(row, history, quote, today):\n    ordered =\
        \ verified_publication(history, quote, row['daily'], today)\n    window = month_window(ordered or [], today)\n    if not window:\n        return None\n    (_, previous), (_, current) = ordered[-2:]\n    change = (current / previous - 1) * 100\n    if row.get('date') and row['date'] != window['date']:\n        return None\n    if row.get('start_date') and row['start_date'] != window['start_date']:\n        return None\n    if ('screen_low' in row and not\n            row['screen_low'] - .15 <= window['monthly'] <= row['screen_high'] + .15):\n        return None\n    # Corporate actions or inconsistent series need review, never a synthetic opportunity.\n    recent = [p for p in ordered if p[0].isoformat() >= window['start_date']]\n    if any(abs(b[1] / a[1] - 1) >= .6 for a, b in zip(recent, recent[1:])):\n        return None\n    regime, conclusion = analyst_view(window['monthly'], window['change_5'])\n    name = row['name']\n    leverage = re.search(r'(?<!\\w)פי\\s*(\\d{1,2}(?:\\\
        .\\d+)?)(?![\\w.])', name)\n    if leverage:\n        risk = f'плечо ×{leverage.group(1)}'\n    elif 'ממונפת' in name and 'לא ממונפת' not in name:\n        risk = 'с плечом'\n    else:\n        risk = ''\n    if 'שורט' in name:\n        risk = (risk + ' · шорт') if risk else 'стратегия шорт'\n    return {**row, **window, 'daily': round(change, 2), 'kind': 'monthly',\n            'monthly': round(window['monthly'], 6), 'change_5': round(window['change_5'], 4),\n            'history': [{'date': d.isoformat(), 'price': p} for d, p in ordered],\n            'regime': regime, 'risk': risk, 'conclusion': conclusion}\n\n\ndef analyst_view(monthly, five):\n    direction = 'up' if monthly >= 0 else 'down'\n    impulse = 'up' if five > .5 else 'down' if five < -.5 else 'flat'\n    regime = direction + '_' + impulse\n    return regime, {\n        'up_up': 'Рост продолжается; ждать отката, не догонять цену.',\n        'up_down': 'Месячный рост сменился откатом; ждать стабилизации.',\n      \
        \  'up_flat': 'После роста — пауза; нового импульса пока нет.',\n        'down_up': 'Есть отскок; разворот требует устойчивого роста фонда.',\n        'down_down': 'Снижение продолжается; усреднять пока рискованно.',\n        'down_flat': 'Падение замедлилось; подтверждения разворота нет.',\n    }[regime]\n\n\ndef fresh_event(event, state):\n    previous = [e for e in state['events'].values() if e.get('kind') == 'monthly'\n                and e.get('fund_id') == event['fund_id'] and e.get('sent_at')]\n    if not previous:\n        return True\n    last = max(previous, key=lambda e: e['date'])\n    if event['date'] <= last['date']:\n        return False\n    reset = state.get('monthly_resets', {}).get(event['fund_id'], '')\n    return (reset > last['date'] or event['regime'] != last.get('regime')\n            or abs(event['monthly'] - last['monthly']) >= REPEAT_CHANGE_PP)\n\n\nasync def fund_context(session, event, now):\n    \"\"\"Only exact fund mentions; a headline is context,\
        \ never proof of causality.\"\"\"\n    try:\n        params = {'q': f'\"{event[\"name\"]}\" when:37d', 'hl': 'he', 'gl': 'IL', 'ceid': 'IL:he'}\n        async with session.get('https://news.google.com/rss/search', params=params) as response:\n            if response.status != 200:\n                return None\n            root = ET.fromstring(await response.text())\n        for item in root.findall('./channel/item'):\n            title = _clean_text(item.findtext('title') or '')\n            if event['name'] not in title and not re.search(rf'\\b{event[\"fund_id\"]}\\b', title):\n                continue\n            published = parsedate_to_datetime(item.findtext('pubDate') or '')\n            if (published.tzinfo is None or published > now\n                    or not event['start_date'] <= published.astimezone(TZ).date().isoformat() <= event['date']):\n                continue\n            link = item.findtext('link') or ''\n            if urlparse(link).scheme != 'https':\n   \
        \             continue\n            translated = await translate_to_russian(session, title)\n            if not translated or not re.search('[А-Яа-я]', translated):\n                continue\n            return {'title': shorten_title(translated, 65), 'url': link,\n                    'date': published.astimezone(TZ).strftime('%d.%m')}\n    except (aiohttp.ClientError, asyncio.TimeoutError, ET.ParseError, ValueError, TypeError):\n        pass\n    return None\n\n\ndef load_state():\n    try:\n        state = json.loads(STATE.read_text())\n        if state.get('schema') == 1 and isinstance(state.get('events'), dict):\n            if not isinstance(state.get('last_scan'), dict):\n                state['last_scan'] = {}\n            count = state['last_scan'].get('readable_funds', 0)\n            if not isinstance(count, int) or count < 0:\n                state['last_scan']['readable_funds'] = 0\n            # Corrupt records cannot influence delivery or follow-up arithmetic.\n   \
        \         for event in state['events'].values():\n                date.fromisoformat(event['date'])\n                date.fromisoformat(event['detected_on'])\n                price = float(event['price'])\n                if not math.isfinite(price) or price <= 0:\n                    raise ValueError('invalid discovery price')\n                event['price'] = price\n                if not isinstance(event.get('checked_at'), str):\n                    event['checked_at'] = ''\n                if event.get('kind') == 'monthly' and not math.isfinite(float(event['monthly'])):\n                    raise ValueError('invalid monthly return')\n            if not isinstance(state.get('monthly_resets'), dict):\n                state['monthly_resets'] = {}\n            state['monthly_resets'] = {k: v for k, v in state['monthly_resets'].items()\n                                       if isinstance(v, str) and re.fullmatch(r'\\d{4}-\\d{2}-\\d{2}', v)}\n            return state\n    except (OSError,\
        \ ValueError, TypeError, KeyError, AttributeError):\n        pass\n    return {'schema': 1, 'events': {}}\n\n\ndef save_state(state):\n    temporary = STATE.with_suffix('.tmp')\n    temporary.write_text(json.dumps(state, ensure_ascii=False), encoding='utf-8')\n    temporary.replace(STATE)\n\n\ndef track(event, history, today):\n    # Observations must be AFTER discovery, not merely after an old NAV date.\n    observed = {}\n    for point in history:\n        try:\n            d = date.fromisoformat(point['date'])\n            p = float(point['price'])\n            if event['detected_on'] < d.isoformat() <= today.isoformat() and math.isfinite(p) and p > 0:\n                observed[d] = p\n        except (KeyError, ValueError, TypeError):\n            continue\n    prices = [p for _, p in sorted(observed.items())]\n    for n in (5, 20):\n        if len(prices) >= n:\n            event[f'after_{n}_publications_pct'] = round((prices[n-1] / event['price'] - 1) * 100, 2)\n    if prices:\n\
        \        event['worst_since_detection_pct'] = round((min(prices) / event['price'] - 1) * 100, 2)\n    if len(prices) >= 20:\n        event['tracking'] = 'completed'\n    elif (today - date.fromisoformat(event['detected_on'])).days > 120:\n        event['tracking'] = 'expired'\n\n\ndef event_caption(event, compact=False, shared_period=False):\n    fid = event['fund_id']\n    profile = describe_fund(event['name'])\n    name = profile['label'] if profile else shorten_title(event['name'], 32)\n    marker = '\U0001F7E9▲' if event['monthly'] > 0 else '\U0001F7E5▼'\n    start = date.fromisoformat(event['start_date']).strftime('%d.%m')\n    end = date.fromisoformat(event['date']).strftime('%d.%m')\n    risk = ' · ' + event['risk'] if event.get('risk') else ''\n    period = '' if shared_period else f' · {start}→{end}'\n    sessions = '5с' if compact else '5 сессий'\n    lines = [f'{marker} <b>{escape(name)}</b> · {fid}',\n             f'{event[\"monthly\"]:+.1f}%{period} · {sessions} {event[\"\
        change_5\"]:+.1f}%{escape(risk)}']\n    if profile:\n        lines.append('Факторы: ' + escape(profile['factors']) + '.')\n    context = event.get('context')\n    if context and not compact:\n        lines.append(f'\U0001F4F0 <a href=\"{escape(context[\"url\"], quote=True)}\">{escape(shorten_title(context[\"title\"], 45))}</a> · {context.get(\"date\", \"\")}')\n    conclusion = short_conclusion(event) if compact else event['conclusion']\n    lines.append('Вывод: ' + escape(conclusion))\n    return '\\n'.join(lines)\n\n\ndef salary_pick_score(event):\n    \"\"\"Rank verified monthly events for the 1st/10th contribution report.\"\"\"\n    monthly = float(event.get('monthly') or 0)\n    five = float(event.get('change_5') or 0)\n    daily = float(event.get('daily') or 0)\n    regime = event.get('regime', '')\n    score = 50.0\n    if monthly > 0:\n        score += min(monthly, 30) * 0.8\n    else:\n        score += max(monthly, -30) * 0.35\n    score += max(-12, min(12, five * 2.0))\n\
        \    score += max(-6, min(6, daily * 1.5))\n    score += {'up_up': 18, 'down_up': 14, 'up_flat': 6, 'down_flat': 2,\n              'up_down': -4, 'down_down': -12}.get(regime, 0)\n    risk = str(event.get('risk') or '')\n    if 'шорт' in risk:\n        score -= 18\n    if 'плеч' in risk or '×' in risk:\n        score -= 8\n    if monthly > 35:\n        score -= min(12, (monthly - 35) * 0.4)\n    return round(score, 2)\n\n\ndef lean_salary_event(event):\n    keep = (\n        'fund_id', 'name', 'monthly', 'change_5', 'daily', 'date', 'start_date',\n        'price', 'risk', 'regime', 'conclusion', 'salary_score',\n    )\n    return {key: event[key] for key in keep if key in event}\n\n\ndef salary_candidate_card(event, rank):\n    fid = str(event['fund_id'])\n    profile = describe_fund(event.get('name', ''))\n    name = profile['label'] if profile else shorten_title(event.get('name', 'Фонд'), 42)\n    url = f'https://www.bizportal.co.il/mutualfunds/quote/generalview/{escape(fid)}'\n\
        \    linked = f'<a href=\"{escape(url, quote=True)}\"><b>{escape(name)}</b></a> · <a href=\"{escape(url, quote=True)}\">{escape(fid)}</a>'\n    risk = f\" · {escape(event['risk'])}\" if event.get('risk') else ''\n    score = event.get('salary_score')\n    score_text = f\"\U0001F3AF {score:.0f}/100 · \" if isinstance(score, (int, float)) else \"\"\n    lines = [\n        f'{rank}. {linked}',\n        f'{score_text}30д {event.get(\"monthly\", 0):+.1f}% · 5с {event.get(\"change_5\", 0):+.1f}% · день {event.get(\"daily\", 0):+.1f}%{risk}',\n    ]\n    if profile:\n        lines.append('Факторы: ' + escape(profile['factors']) + '.')\n    return '\\n'.join(lines)\n\n\ndef salary_top_events(prepared, limit=3):\n    state, selected = prepared if prepared else ({}, [])\n    pool = list((state or {}).get('salary_candidates') or [])\n    if not pool and selected:\n        pool = [lean_salary_event(item[1]) for item in selected]\n    return sorted(pool, key=salary_pick_score, reverse=True)[:limit]\n\
        \n\n\ndef build_salary_candidates_message(prepared):\n    now = datetime.now(TZ)\n    state, _ = prepared if prepared else ({}, [])\n    scan = state.get('last_scan') or {}\n    top = salary_top_events(prepared, limit=3)\n    heading = (\n        '\U0001F4B0 <b>Market Radar AI · День пополнения</b>\\n'\n        f'\U0001F4C5 {now:%d.%m.%Y} · 10% от зарплаты\\n'\n        'Задача: выбрать 1 фонд для входа из 2–3 кандидатов.\\n'\n    )\n    if not top:\n        summary = unavailable_summary(scan) if scan.get('status') not in {None, 'ok', 'partial'} else 'проверенных кандидатов сегодня нет.'\n        return '\\n'.join([\n            heading,\n            'Сегодня модель не нашла проверенных кандидатов.',\n            escape(str(summary)),\n            '',\n            BOT_NAME,\n        ])\n    coverage = ''\n    if scan.get('readable_funds'):\n        coverage = f\"Проверено: {scan.get('monthly_coverage', 0)}/{scan.get('readable_funds', 0)} фондов.\"\n    lines = [\n        heading,\n\
        \        f'\U0001F9ED <b>{len(top)} кандидата на выбор</b>',\n        coverage,\n        '',\n    ]\n    lines.extend(salary_candidate_card(event, index + 1) for index, event in enumerate(top))\n    lines.extend([\n        '',\n        BOT_NAME,\n    ])\n    return '\\n\\n'.join(part for part in lines if part)\n\n\nasync def run_salary_report():\n    from modules.telegram_sender import send_to_telegram, send_chart_photos\n    from modules.mover_charts import build_mover_charts\n\n    prepared = await prepare_safely()\n    message = build_salary_candidates_message(prepared)\n    top_events = salary_top_events(prepared, limit=3)\n    destination = os.getenv('PORTFOLIO_CHAT_ID') or os.getenv('CHAT_ID')\n    if os.getenv('DRY_RUN', '').lower() == 'true':\n        print(message)\n        if top_events:\n            print('\\n[DRY_RUN] Salary charts: 6-month chart requested for ' + ', '.join(str(e['fund_id']) for e in top_events))\n        return\n    chart = None\n    if top_events:\n\
        \        try:\n            chart = await build_mover_charts(\n                [(str(event['fund_id']), event, None) for event in top_events],\n                datetime.now(TZ).date(),\n            )\n        except Exception as error:\n            print(f'::warning::Salary chart unavailable: {type(error).__name__}; keeping text report')\n    if chart:\n        await send_chart_photos(\n            [(chart, message)],\n            chat_id=destination,\n            title='',\n            parse_mode='HTML',\n        )\n    else:\n        await send_to_telegram(message, chat_id=destination)\n    state, _ = prepared\n    if state and (state.get('last_scan') or {}).get('status') != 'unavailable':\n        register_delivered(state, datetime.now(TZ))\n        saved = dict(state)\n        for key in ('news_focus','news_reviews','_delivered_focus','_delivered_reviews'):\n            saved.pop(key,None)\n        save_state(saved)\n\n\nclass DiscoveryUnavailable(RuntimeError):\n    def __init__(self,\
        \ code, detail):\n        super().__init__(detail)\n        self.code = code\n\n\nasync def fetch_listing(session, previous_count):\n    \"\"\"Retry transient failures only; retain coverage and access checks.\"\"\"\n    required = max(MIN_LIST_ROWS, previous_count * 0.7)\n    error = None\n    for attempt in range(1, 4):\n        try:\n            timeout = aiohttp.ClientTimeout(total=45, sock_connect=10, sock_read=30)\n            async with session.get(LIST_URL, timeout=timeout) as response:\n                status = response.status\n                if status in {401, 403, 429}:\n                    code = 'list_rate_limit' if status == 429 else 'list_access'\n                    raise DiscoveryUnavailable(code, f'Funder list HTTP {status}')\n                if status != 200:\n                    raise DiscoveryUnavailable('list_http', f'Funder list HTTP {status}')\n                body = await response.text(errors='ignore')\n            if is_access_challenge(body):\n        \
        \        raise DiscoveryUnavailable('list_access', 'Funder access challenge')\n            listing = parse_listing(body)\n            print(f'Fund list: HTTP 200; attempt={attempt}/3; bytes={len(body)}; '\n                  f'rows={len(listing)}; required={required:g}')\n            if len(listing) < required:\n                raise DiscoveryUnavailable('list_incomplete',\n                    f'Funder list incomplete: rows={len(listing)}, required={required:g}, previous={previous_count}')\n            return listing\n        except asyncio.TimeoutError:\n            error = DiscoveryUnavailable('list_timeout', 'Funder list request timed out')\n        except aiohttp.ClientError as exc:\n            error = DiscoveryUnavailable('list_network', f'Funder list {type(exc).__name__}: {exc}')\n        except DiscoveryUnavailable as exc:\n            error = exc\n            if exc.code in {'list_access', 'list_rate_limit'}:\n                raise\n            # A missing page or other client\
        \ error needs a configuration fix, not retries.\n            if exc.code == 'list_http' and 400 <= status < 500:\n                raise\n        print(f'::warning::Discovery {error.code}; attempt={attempt}/3; {error}')\n        if attempt < 3:\n            await asyncio.sleep(attempt * 2)\n    raise error\n\n\nasync def screen_monthly(session, listing, today, blocked=None):\n    limiter, denied = asyncio.Semaphore(3), asyncio.Event()\n    async def fetch(rows):\n        for attempt in range(2):\n            if denied.is_set():\n                return {}\n            try:\n                async with limiter:\n                    if denied.is_set():\n                        return {}\n                    params = {'ids': ','.join(r['fund_id'] for r in rows),\n                              'period': '3m', 'callback': 'fundMonth'}\n                    async with session.get(GRAPH_URL, params=params,\n                            timeout=aiohttp.ClientTimeout(total=35)) as response:\n\
