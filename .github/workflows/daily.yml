name: Market Analytics & IPO Digest

on:
  schedule:
    - cron: '15 20 * * *'  # Ежедневно в 23:15 (Израиль)
    - cron: '0 19 * * 6'   # Суббота в 22:00 (Израиль)
  workflow_dispatch:

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Project Structure
        run: |
          mkdir -p modules
          
          cat << 'EOF' > requirements.txt
          aiohttp==3.11.11
          beautifulsoup4==4.12.3
          yfinance==0.2.40
          playwright==1.49.1
          EOF
          
          cat << 'EOF' > modules/config.py
          import os

          BOT_TOKEN = os.getenv("BOT_TOKEN")
          CHAT_ID = os.getenv("CHAT_ID")
          HTTP_TIMEOUT = 15
          BOT_NAME = "@oil_tracker_pavel_bot"

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept-Language": "he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7"
          }

          SECTORS_CONFIG = {
              "Oil": {"name": "Нефть и Энергетика", "icon": "🛢️", "short_eng": "Oil", "news_ticker": "USO", "fund_id": "5141841", "il_name_eng": "Barak Ultra WTI x3", "tickers": ["BZ=F", "CL=F", "USO", "OVX", "XLE", "VLO"]},
              "AI": {"name": "Искусственный Интеллект", "icon": "🤖", "short_eng": "AI", "news_ticker": "NVDA", "fund_id": "5140744", "il_name_eng": "Migdal AI", "tickers": ["NVDA", "MSFT", "AMD", "AVGO", "PLTR", "GOOGL", "AMZN", "BOTZ"]},
              "Cybersecurity": {"name": "Кибербезопасность", "icon": "🛡️", "short_eng": "Cyber", "news_ticker": "CIBR", "fund_id": "5135025", "il_name_eng": "IBI Global Cyber", "tickers": ["CIBR", "HACK", "CRWD", "PANW", "FTNT", "ZS", "NET"]},
              "Gaming": {"name": "Игровая Индустрия", "icon": "🎮", "short_eng": "Game", "news_ticker": "SONY", "fund_id": "5128624", "il_name_eng": "MTF Bluestar E-Games", "tickers": ["NVDA", "MSFT", "TTWO", "EA", "RBLX", "SONY", "NTDOY", "HERO"]},
              "Gold": {"name": "Золото и Металлы", "icon": "🥇", "short_eng": "Gold", "news_ticker": "GLD", "fund_id": "5100961", "il_name_eng": "Meitav Gold", "tickers": ["GLD", "GDX", "SLV", "NEM", "GOLD"]},
              "Clean Energy": {"name": "Зеленая энергетика", "icon": "☀️", "short_eng": "Clean", "news_ticker": "FSLR", "fund_id": "5136148", "il_name_eng": "Yelin Green Energy", "tickers": ["ICLN", "TAN", "FAN", "FSLR", "ENPH", "SEDG"]},
              "Aerospace": {"name": "Авиация и Космос", "icon": "✈️", "short_eng": "Aero", "news_ticker": "ITA", "fund_id": "5125752", "il_name_eng": "MTF Aerospace & Def", "tickers": ["BA", "EADSY", "LMT", "RTX", "ITA", "NOC"]},
              "Biotech": {"name": "Биотех и Медицина", "icon": "🧬", "short_eng": "Bio", "news_ticker": "LLY", "fund_id": "5131206", "il_name_eng": "KSM Nasdaq Biotech", "tickers": ["LLY", "NVO", "PFE", "MRNA", "AMGN", "XBI", "IBB"]},
              "Banking": {"name": "Банковский сектор", "icon": "🏦", "short_eng": "Bank", "news_ticker": "JPM", "fund_id": "5133236", "il_name_eng": "ATF Israel Banks", "tickers": ["JPM", "BAC", "GS", "MS", "WFC", "XLF", "KBE"]},
              "Cloud": {"name": "Облачные технологии", "icon": "☁️", "short_eng": "Cloud", "news_ticker": "WCLD", "fund_id": "5132220", "il_name_eng": "More Cloud Cyber", "tickers": ["MSFT", "AMZN", "GOOGL", "ORCL", "SNOW", "WCLD", "CLOU"]},
              "EV": {"name": "Электромобили", "icon": "🚗", "short_eng": "EV", "news_ticker": "TSLA", "fund_id": "5132709", "il_name_eng": "Migdal EV & Auto", "tickers": ["TSLA", "BYDDY", "RIVN", "LI", "DRIV", "LCID"]}
          }
          EOF
          
          cat << 'EOF' > modules/market.py
          import asyncio, re
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright
          import aiohttp
          from modules.config import HTTP_TIMEOUT, HEADERS

          def parse_float(val: str) -> float:
              if not val: return 0.0
              try:
                  match = re.search(r'([+-]?\d+(?:\.\d+)?)', str(val).replace(',', '.').replace('%', '').replace('+', '').strip())
                  return round(float(match.group(1)), 2) if match else 0.0
              except Exception:
                  return 0.0

          async def fetch_single_ticker(session: aiohttp.ClientSession, ticker: str) -> tuple:
              api_ticker = f"^{ticker}" if ticker == "OVX" else ticker
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{api_ticker}?range=1d&interval=1m"
              try:
                  async with session.get(url, headers=HEADERS, timeout=HTTP_TIMEOUT) as response:
                      if response.status == 200:
                          meta = (await response.json())["chart"]["result"][0]["meta"]
                          price, prev_close = meta.get("regularMarketPrice"), meta.get("chartPreviousClose")
                          if price and prev_close:
                              return ticker, {"price": round(price, 2), "change": round(((price - prev_close) / prev_close) * 100, 2)}
              except Exception: pass
              return ticker, {"price": 0.0, "change": 0.0}

          async def fetch_all_yahoo_data(tickers: list) -> dict:
              async with aiohttp.ClientSession() as session:
                  return dict(await asyncio.gather(*[fetch_single_ticker(session, t) for t in tickers]))

          async def scrape_funder_fund_returns(context, fund_id: str) -> dict:
              url = f"https://www.funder.co.il/fund/{fund_id}"
              data = {"daily": 0.0, "mtd": 0.0, "ytd": 0.0}
              page = await context.new_page()
              
              try:
                  response = await page.goto(url, wait_until="domcontentloaded", timeout=20000)
                  if not response or response.status != 200:
                      await page.close()
                      return data

                  await asyncio.sleep(2)
                  soup = BeautifulSoup(await page.content(), 'html.parser')

                  for td in soup.find_all(['td', 'th', 'div']):
                      text = td.get_text(strip=True)
                      next_sibling = td.find_next_sibling(['td', 'div'])
                      if next_sibling:
                          if 'יומית' in text and not data["daily"]: data["daily"] = parse_float(next_sibling.get_text())
                          elif 'מתחילת החודש' in text and not data["mtd"]: data["mtd"] = parse_float(next_sibling.get_text())
                          elif 'מתחילת השנה' in text and not data["ytd"]: data["ytd"] = parse_float(next_sibling.get_text())

                  if any(data.values()):
                      await page.close()
                      return data

                  all_pcts = re.findall(r'([+-]?\d+\.\d+\s*%)', soup.get_text())
                  if len(all_pcts) >= 3:
                      data["daily"], data["mtd"], data["ytd"] = parse_float(all_pcts[0]), parse_float(all_pcts[1]), parse_float(all_pcts[2])

              except Exception as e:
                  print(f"💥 Ошибка Funder ID {fund_id}: {e}")
              finally:
                  if not page.is_closed(): await page.close()

              return data

          async def fetch_all_israeli_funds(sectors_config: dict) -> dict:
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, args=["--no-sandbox", "--disable-dev-shm-usage"])
                  context = await browser.new_context(user_agent=HEADERS["User-Agent"], locale="he-IL")
                  semaphore = asyncio.Semaphore(3)

                  async def worker(key, cfg):
                      async with semaphore:
                          return key, await scrape_funder_fund_returns(context, cfg.get("fund_id", "")) if cfg.get("fund_id") else (key, {"daily": 0.0, "mtd": 0.0, "ytd": 0.0})

                  results = dict(await asyncio.gather(*[worker(k, c) for k, c in sectors_config.items()]))
                  await browser.close()
                  return results
          EOF
          
          cat << 'EOF' > modules/news.py
          import aiohttp, urllib.parse, html
          import yfinance as yf
          from modules.config import HTTP_TIMEOUT, HEADERS

          async def translate_to_russian(session: aiohttp.ClientSession, text: str) -> str:
              try:
                  url = f"https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ru&dt=t&q={urllib.parse.quote(text)}"
                  async with session.get(url, timeout=5) as resp:
                      if resp.status == 200:
                          return html.unescape("".join([s[0] for s in (await resp.json())[0] if s[0]]))
              except Exception: pass
              return text

          async def fetch_sector_news(session: aiohttp.ClientSession, query_ticker: str) -> list:
              try:
                  url = f"https://query1.finance.yahoo.com/v1/finance/search?q={query_ticker}"
                  async with session.get(url, headers=HEADERS, timeout=HTTP_TIMEOUT) as response:
                      if response.status == 200:
                          for item in (await response.json()).get("news", []):
                              title = item.get("title", "")
                              if len(title) > 15:
                                  return [f"• {await translate_to_russian(session, title)}"]
              except Exception: pass
              return ["• Торгуется в рамках текущей рыночной динамики."]

          def get_single_ipo_card(symbol: str, name: str, ipo_date: str, fallback_price: str) -> str:
              try:
                  info = yf.Ticker(symbol).info
                  price = info.get("currentPrice") or info.get("regularMarketPrice") or fallback_price
                  price_str = f"${price:.2f}" if isinstance(price, (int, float)) else price
                  rec = str(info.get("recommendationKey", "N/A")).replace("_", " ").upper()
                  target = f"${info['targetMeanPrice']:.2f}" if info.get("targetMeanPrice") else "Н/Д"
                  
                  rec_map = {"STRONG BUY": "🔥 Strong Buy", "BUY": "🟢 Buy", "HOLD": "🟡 Hold", "SELL": "🔴 Sell"}
                  return f"📌 <b>{name}</b> (<code>{symbol}</code>)\n🗓 <b>IPO:</b> {ipo_date}\n💵 <b>Курс:</b> {price_str}\n🎯 <b>Цель:</b> {target}\n🧠 <b>Консенсус:</b> {rec_map.get(rec, rec)}\n"
              except Exception:
                  return f"📌 <b>{name}</b> (<code>{symbol}</code>)\n🗓 <b>IPO:</b> {ipo_date}\n💵 <b>Курс:</b> {fallback_price}\n🧠 <b>Консенсус:</b> ⚪️ Ожидает оценки\n"

          def fetch_ipo_full_analytics() -> list:
              ipo_targets = [
                  {"symbol": "ARM", "name": "Arm Holdings", "date": "14.09.2023", "price": "$51.00"},
                  {"symbol": "RDDT", "name": "Reddit Inc.", "date": "21.03.2024", "price": "$34.00"},
                  {"symbol": "KVUE", "name": "Kenvue Inc.", "date": "04.05.2023", "price": "$22.00"},
                  {"symbol": "IPO", "name": "Renaissance IPO ETF", "date": "ETF Фонд", "price": "Рыночная"}
              ]
              return [get_single_ipo_card(t["symbol"], t["name"], t["date"], t["price"]) for t in ipo_targets]
          EOF
          
          cat << 'EOF' > modules/formatter.py
          from datetime import datetime, timezone, timedelta
          from modules.config import BOT_NAME

          def escape_html(text: str) -> str:
              return text.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")

          def build_telegram_message(sectors_data: list) -> str:
              now_str = datetime.now(timezone(timedelta(hours=3))).strftime("%d.%m.%Y | %H:%M")
              lines = ["📈 <b>Рыночный Дайджест</b>", f"📅 {now_str} (IDT) 🇮🇱\n", "<b>📊 ОБЗОР СЕКТОРОВ (US) И ФОНДОВ (IL)</b>", "<code>Сектор       US      IL   Рейтинг</code>", "<code>"]
              
              for s in sectors_data:
                  us_str = f"{s['avg_change']:+.1f}%"
                  il_str = f"{s['il_fund_data']['daily']:+.1f}%"
                  score_emoji = "🟢" if s['score'] >= 65 else ("🟡" if s['score'] >= 40 else "🔴")
                  lines.append(f"{s['icon']}{s['short_eng'][:6]:<6} {us_str:>6} {il_str:>6}  {score_emoji}{s['score']:>3}/100")
              lines.append("</code>\n<blockquote expandable>🔍 <b>ДРАЙВЕРЫ ДВИЖЕНИЯ И ПОКАЗАТЕЛИ СЕКТОРОВ</b>\n")

              for s in sectors_data:
                  lines.append(f"<b>{s['icon']} {escape_html(s['name'])}</b> ({s['avg_change']:+.2f}%)")
                  if s.get("top_3_tickers"):
                      lines.append(f"  📊 <i>Топ-3: [{escape_html(', '.join([f'{t}: {c:+.2f}%' for t, c in s['top_3_tickers']]))}]</i>")
                  for n in s['news']: lines.append(f"  {escape_html(n)}")
                  lines.append("")
              lines.append("</blockquote>\n<blockquote expandable>🇮🇱 <b>ДОХОДНОСТЬ ИЗРАИЛЬСКИХ ФОНДОВ (תשואות)</b>\n")

              for s in sorted(sectors_data, key=lambda x: x['il_fund_data']['daily'], reverse=True):
                  f = s['il_fund_data']
                  lines.append(
                      f"{'🟢' if f['daily'] > 0 else '🔴'} <b>{escape_html(s['il_name_eng'])}</b> ({s['icon']})\n"
                      f"└ <code>{s['fund_id']}</code> · <b>День: {f['daily']:+.2f}%</b> | <b>Месяц: {f['mtd']:+.2f}%</b> | <b>Год: {f['ytd']:+.2f}%</b>"
                  )
              lines.append(f"</blockquote>\n\n{BOT_NAME}")
              return "\n".join(lines)

          def build_ipo_message(ipo_cards: list) -> str:
              now_str = datetime.now(timezone(timedelta(hours=3))).strftime("%d.%m.%Y")
              return f"🔔 <b>ЕЖЕНЕДЕЛЬНЫЙ IPO ДАЙДЖЕСТ</b>\n📅 {now_str} | Обзор 🇮🇱\n\n<blockquote expandable>\n" + "\n".join(ipo_cards) + f"</blockquote>\n\n{BOT_NAME}"
          EOF
          
          cat << 'EOF' > modules/telegram_sender.py
          import aiohttp
          from modules.config import BOT_TOKEN, CHAT_ID, HTTP_TIMEOUT

          async def send_to_telegram(text: str):
              if not BOT_TOKEN or not CHAT_ID: return
              url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"
              
              chunks = [text[i:i+3900] for i in range(0, len(text), 3900)]
              async with aiohttp.ClientSession() as session:
                  for chunk in chunks:
                      try:
                          await session.post(url, json={"chat_id": CHAT_ID, "text": chunk, "parse_mode": "HTML", "disable_web_page_preview": True}, timeout=HTTP_TIMEOUT)
                      except Exception as e:
                          print(f"💥 Ошибка отправки: {e}")
          EOF
          
          cat << 'EOF' > main.py
          import asyncio, aiohttp
          from datetime import datetime, timezone, timedelta
          from modules.config import SECTORS_CONFIG
          from modules.market import fetch_all_yahoo_data, fetch_all_israeli_funds
          from modules.news import fetch_sector_news, fetch_ipo_full_analytics
          from modules.formatter import build_telegram_message, build_ipo_message
          from modules.telegram_sender import send_to_telegram

          async def run_market_analytics():
              all_tickers = {t for cfg in SECTORS_CONFIG.values() for t in cfg["tickers"]}
              global_market_data = await fetch_all_yahoo_data(list(all_tickers))
              il_results = await fetch_all_israeli_funds(SECTORS_CONFIG)

              async with aiohttp.ClientSession() as session:
                  sectors_results = []
                  for key, cfg in SECTORS_CONFIG.items():
                      ticker_details = [(t, global_market_data[t]["change"]) for t in cfg["tickers"] if t in global_market_data and global_market_data[t]["price"] > 0]
                      avg_change = sum(c for _, c in ticker_details) / len(ticker_details) if ticker_details else 0.0
                      
                      sectors_results.append({
                          "short_eng": cfg["short_eng"], "name": cfg["name"], "icon": cfg["icon"],
                          "fund_id": cfg.get("fund_id", ""), "avg_change": round(avg_change, 2),
                          "top_3_tickers": sorted(ticker_details, key=lambda x: abs(x[1]), reverse=True)[:3],
                          "score": max(0, min(100, int(50 + (avg_change * 15.0)))),
                          "news": await fetch_sector_news(session, cfg["news_ticker"]),
                          "il_name_eng": cfg["il_name_eng"],
                          "il_fund_data": il_results.get(key, {"daily": 0.0, "mtd": 0.0, "ytd": 0.0})
                      })
                  
                  sectors_results.sort(key=lambda x: x["avg_change"], reverse=True)
                  await send_to_telegram(build_telegram_message(sectors_results))

          async def main():
              now = datetime.now(timezone(timedelta(hours=3)))
              if now.weekday() == 5 and now.hour == 22:
                  await send_to_telegram(build_ipo_message(fetch_ipo_full_analytics()))
              else:
                  await run_market_analytics()

          if __name__ == "__main__":
              asyncio.run(main())
          EOF

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Engine
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
