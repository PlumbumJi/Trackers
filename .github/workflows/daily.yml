              if event.get("previous_ipo_date"):
                  lines.append(f"  ↳ previous date: {escape_html(event['previous_ipo_date'])}")
              prices = []
              if event.get("price_range"):
                  prices.append(f"range {escape_html(event['price_range'])}")
              if event.get("offer_price"):
                  prices.append(f"offer {escape_html(event['offer_price'])}")
              if prices:
                  lines.append(f"  💵 Price: {', '.join(prices)}")
              shares = format_int(event.get("shares_offered"))
              if shares:
                  lines.append(f"  📦 Shares offered: {shares}")
              if event.get("change_type"):
                  lines.append(f"  🔄 {escape_html(event['change_type'])}")
              lines.append(f"  📌 Status: {escape_html(event.get('status') or 'N/A')}")
              lines.append(f"  🔗 Source: {escape_html(event.get('source') or 'N/A')}")
              return lines


          def build_ipo_radar_message(radar: dict) -> str:
              lines = [
                  "🔔 <b>Weekly IPO Radar</b>",
                  f"📅 {datetime.now(ISRAEL_TZ).strftime('%d.%m.%Y')} 🇮🇱",
                  f"🗓 Window: {escape_html(radar.get('window_start', 'N/A'))} → {escape_html(radar.get('window_end', 'N/A'))}",
                  "",
              ]
              updates = radar.get("date_updates", [])
              listings = radar.get("new_listings", [])
              if not updates and not listings:
                  lines.append("No notable IPO updates this week")
                  if not radar.get("source_ok", True):
                      lines.append("IPO data sources unavailable; snapshot was not updated.")
              else:
                  heading = "IPO dates announced/updated this week" if radar.get("previous_snapshot_found") else "Current notable IPO dates"
                  lines.append(f"<b>1. {heading}</b>")
                  if updates:
                      lines.append("<blockquote expandable>")
                      for event in updates:
                          lines.extend(format_ipo_item(event, "planned IPO date"))
                          lines.append("")
                      lines.append("</blockquote>")
                  else:
                      lines.append("No notable IPO date updates found.")
                  lines.append("<b>2. New public listings this week</b>")
                  if listings:
                      lines.append("<blockquote expandable>")
                      for event in listings:
                          lines.extend(format_ipo_item(event, "first trading date"))
                          lines.append("")
                      lines.append("</blockquote>")
                  else:
                      lines.append("No notable new listings found.")
              lines.extend(["", "<i>Dates may change. Not financial advice.</i>", "", BOT_NAME])
              return "\n".join(lines)
          EOF

          cat << 'EOF' > modules/telegram_sender.py
          import re

          import aiohttp

          from modules.config import BOT_TOKEN, CHAT_ID, HTTP_TIMEOUT


          def split_plain_text(text: str, max_length: int) -> list[str]:
              chunks, current = [], ""
              for line in text.splitlines(keepends=True):
                  if len(current) + len(line) > max_length and current.strip():
                      chunks.append(current.strip())
                      current = line
                  else:
                      current += line
              if current.strip():
                  chunks.append(current.strip())
              return chunks


          def split_blockquote(block: str, max_length: int) -> list[str]:
              match = re.search(r"<blockquote(?:\s+expandable)?>", block)
              close_tag = "</blockquote>"
              if not match or close_tag not in block:
                  return split_plain_text(block, max_length)
              open_tag = match.group(0)
              prefix = block[:match.start()]
              body_end = block.rfind(close_tag)
              body = block[match.end():body_end]
              suffix = block[body_end + len(close_tag):]
              chunks, current, current_prefix = [], "", prefix
              for line in body.splitlines(keepends=True):
                  candidate = f"{current_prefix}{open_tag}{current}{line}{close_tag}{suffix}"
                  if len(candidate) > max_length and current.strip():
                      chunks.append(f"{current_prefix}{open_tag}{current}{close_tag}".strip())
                      current_prefix, current, suffix = "", line, ""
                  else:
                      current += line
              final = f"{current_prefix}{open_tag}{current}{close_tag}{suffix}".strip()
              if final:
                  chunks.append(final)
              return chunks


          def split_message(text: str, max_length: int = 3900) -> list[str]:
              if len(text) <= max_length:
                  return [text]
              marker = "<blockquote expandable>\n🇮🇱 <b>ДОХОДНОСТЬ И АНАЛИТИКА ИЗРАИЛЬСКИХ ФОНДОВ</b>"
              position = text.find(marker)
              if position != -1:
                  first, second = text[:position].strip(), text[position:].strip()
                  if len(first) <= max_length and len(second) <= max_length:
                      return [first, second]
              chunks = []
              for raw in text.split("</blockquote>"):
                  if not raw.strip():
                      continue
                  block = raw + "</blockquote>" if "<blockquote" in raw else raw
                  chunks.extend(split_blockquote(block, max_length) if len(block) > max_length else [block.strip()])
              return [chunk for chunk in chunks if chunk]


          async def send_to_telegram(text: str) -> None:
              if not BOT_TOKEN or not CHAT_ID:
                  raise RuntimeError("BOT_TOKEN or CHAT_ID is missing")
              url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"
              chunks = split_message(text)
              print(f"ℹ️ Message length: {len(text)}; chunks: {len(chunks)}")
              timeout = aiohttp.ClientTimeout(total=HTTP_TIMEOUT)
              async with aiohttp.ClientSession(timeout=timeout) as session:
                  for index, chunk in enumerate(chunks, start=1):
                      payload = {
                          "chat_id": CHAT_ID,
                          "text": chunk,
                          "parse_mode": "HTML",
                          "disable_web_page_preview": True,
                      }
                      async with session.post(url, json=payload) as response:
                          response_text = await response.text()
                          if response.status != 200:
                              raise RuntimeError(
                                  f"Telegram HTTP {response.status} on chunk {index}/{len(chunks)}: {response_text[:500]}"
                              )
                          print(f"🚀 Sent chunk {index}/{len(chunks)}")
          EOF

          cat << 'EOF' > main.py
          import asyncio
          import os

          import aiohttp

          from modules.config import SECTORS_CONFIG
          from modules.formatter import build_ipo_radar_message, build_telegram_message
          from modules.ipo import fetch_weekly_ipo_radar
          from modules.market import fetch_all_israeli_funds, fetch_all_year_analytics, fetch_all_yahoo_data
          from modules.news import fetch_historical_trigger, fetch_sector_news
          from modules.telegram_sender import send_to_telegram


          def calculate_sector_score(avg_change):
              if avg_change is None:
                  return None
              return max(0, min(100, int(50 + float(avg_change) * 15.0)))


          async def run_market_analytics() -> None:
              all_tickers = sorted({
                  ticker for config in SECTORS_CONFIG.values() for ticker in config["tickers"]
              })
              print("📦 Collecting Yahoo market data...")
              market_data = await fetch_all_yahoo_data(all_tickers)
              print("🌐 Collecting Israeli fund returns...")
              il_results = await fetch_all_israeli_funds(SECTORS_CONFIG)
              print("📈 Analyzing 1Y US proxy history...")
              year_results = await fetch_all_year_analytics(SECTORS_CONFIG)

              async with aiohttp.ClientSession() as session:
                  history_tasks = {}
                  for sector, config in SECTORS_CONFIG.items():
                      year = year_results.get(sector, {})
                      if year.get("event_date") and config.get("history_news_ticker"):
                          history_tasks[sector] = asyncio.create_task(fetch_historical_trigger(
                              session,
                              config["history_news_ticker"],
                              year["event_date"],
                              config["short_eng"],
                          ))
                  for sector, task in history_tasks.items():
                      try:
                          trigger = await task
                          if trigger:
                              year_results[sector]["trigger"] = trigger
                      except Exception as error:
                          print(f"⚠️ Historical context {sector}: {error}")

                  sector_tasks = []
                  sector_rows = []
                  for sector, config in SECTORS_CONFIG.items():
                      ticker_details = [
                          (ticker, market_data[ticker]["change"])
                          for ticker in config["tickers"]
                          if ticker in market_data and market_data[ticker].get("change") is not None
                      ]
                      top_movements = sorted(ticker_details, key=lambda item: abs(item[1]), reverse=True)[:3]
                      changes = [change for _, change in ticker_details]
                      average = sum(changes) / len(changes) if changes else None
                      sector_rows.append((sector, config, top_movements, average))
                      sector_tasks.append(asyncio.create_task(fetch_sector_news(
                          session, config["news_ticker"], top_movements, config["short_eng"]
                      )))

                  results = []
                  for row, news_task in zip(sector_rows, sector_tasks):
                      sector, config, top_movements, average = row
                      results.append({
                          "short_eng": config["short_eng"],
                          "name": config["name"],
                          "icon": config["icon"],
                          "fund_id": config["fund_id"],
                          "il_name_eng": config["il_name_eng"],
                          "avg_change": round(average, 2) if average is not None else None,
                          "top_3_tickers": top_movements,
                          "score": calculate_sector_score(average),
                          "news": await news_task,
                          "il_fund_data": il_results.get(sector, {"daily": None, "mtd": None, "ytd": None}),
                          "year_analysis": year_results.get(sector, {}),
                      })

              results.sort(
                  key=lambda item: (
                      item["avg_change"] is not None,
                      item["avg_change"] if item["avg_change"] is not None else float("-inf"),
                  ),
                  reverse=True,
              )
              await send_to_telegram(build_telegram_message(results))


          async def run_ipo_digest() -> None:
              print("📊 Building Weekly IPO Radar...")
              await send_to_telegram(build_ipo_radar_message(await fetch_weekly_ipo_radar()))


          async def main() -> None:
              mode = os.getenv("RUN_MODE", "market").strip().lower()
              if mode == "ipo":
                  await run_ipo_digest()
              elif mode == "market":
                  await run_market_analytics()
              else:
                  raise ValueError(f"Unsupported RUN_MODE: {mode}")


          if __name__ == "__main__":
              asyncio.run(main())
          EOF

      - name: Install Dependencies and Chromium
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Validate Generated Python
        run: python -m compileall -q modules main.py

      - name: Run Analytics Engine
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          IPO_STATE_FILE: ipo_radar_snapshot.json
          RUN_MODE: ${{ steps.report.outputs.mode }}
        run: python main.py

      - name: Save IPO Radar Snapshot
        if: success() && steps.report.outputs.mode == 'ipo' && hashFiles('ipo_radar_snapshot.json') != ''
        uses: actions/cache/save@v5
        with:
          path: ipo_radar_snapshot.json
          key: ipo-radar-${{ github.run_id }}-${{ github.run_attempt }}
