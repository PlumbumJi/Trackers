        def escape_html(value: object) -> str:
            return str(value).replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")


        def format_percent(value: Optional[float], digits: int = 2) -> str:
            if value is None:
                return "—"
            number = float(value)
            return f"+{number:.{digits}f}%" if number > 0 else f"{number:.{digits}f}%"


        def _date_range(values: list[str]) -> str:
            dates = sorted({value for value in values if value})
            if not dates:
                return "нет данных"
            return dates[0] if len(dates) == 1 else f"{dates[0]}…{dates[-1]}"


        def _fund_date(row: dict) -> str:
            return str((row.get("il_fund_data", {}).get("price_stats") or {}).get("price_date") or "")


        def _market_status(rows: list[dict]) -> str:
            statuses = {row.get("market_status") for row in rows if not row.get("local_market")}
            if "open" in statuses:
                return "торги идут"
            if statuses == {"closed"}:
                return "торги закрыты"
            return "статус не определён"


